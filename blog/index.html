<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <title>Blog | Alex Li (李翔緯)</title>
  <meta name="description" content="Blog by Alex Li (李翔緯): notes on taking AI in finance from governance to production. 李翔緯的部落格：金融業 AI 從治理到上線的筆記。">
  <link rel="canonical" href="https://xiang-wei-li.com/blog/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/post.css?v=20261120e">
  <style>
    .post-nav { display: flex; justify-content: space-between; align-items: center; }
    .lang-toggle { font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; color: var(--text);
      background: rgba(30,41,59,0.6); border: 1px solid var(--line); border-radius: 20px; padding: 0.35rem 0.9rem; cursor: pointer; }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 3rem 2rem 5rem; }
    .eyebrow { font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.12em; color: var(--accent-2); text-transform: uppercase; }
    h1 { font-family: var(--display); font-size: clamp(2.6rem, 6vw, 4rem); font-weight: 800; letter-spacing: -0.03em; margin: 0.4rem 0 0.5rem; }
    .sub { color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 2rem 0 1.5rem; align-items: center; }
    .filters .count { font-size: 0.85rem; color: var(--dim); margin-right: 0.6rem; }
    .chip { font-size: 0.8rem; padding: 0.3rem 0.8rem; border-radius: 999px; border: 1px solid var(--line); background: rgba(30,41,59,0.5); color: var(--muted); cursor: pointer; }
    .chip:hover { color: var(--text); border-color: rgba(167,139,250,0.5); }
    .chip[aria-pressed="true"] { background: rgba(139,92,246,0.2); border-color: rgba(167,139,250,0.6); color: #ddd6fe; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; }
    a.blog-card { color: inherit; text-decoration: none; }
    .blog-card {
      position: relative; background: linear-gradient(180deg, rgba(30,41,59,0.62), rgba(30,41,59,0.38)); border: 1px solid var(--line);
      border-radius: 20px; padding: 2rem;
      transition: border-color 0.4s, transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
      display: flex; flex-direction: column; cursor: pointer;
    }
    .blog-card:hover {
      transform: translateY(-4px); border-color: rgba(167,139,250,0.4);
      box-shadow: 0 30px 60px -30px rgba(76,29,149,0.45);
    }
    .blog-cover {
      position: relative; height: 132px; margin: -2rem -2rem 1.5rem; border-radius: 19px 19px 0 0; overflow: hidden;
      border-bottom: 1px solid var(--line); background: #0d1527;
    }
    .blog-cover svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform 1.2s var(--ease); }
    .blog-card:hover .blog-cover svg { transform: scale(1.06); }
    .blog-cover .tag {
      position: absolute; left: 1rem; bottom: 0.75rem; font-family: var(--display); font-size: 0.7rem; letter-spacing: 0.08em;
      color: rgba(230,237,246,0.9); padding: 0.15rem 0.55rem; border-radius: 999px; background: rgba(11,17,32,0.55); backdrop-filter: blur(6px);
    }
    .blog-date {
      font-size: 0.8rem; color: var(--dim); margin-bottom: 0.75rem; font-family: var(--display); letter-spacing: 0.04em;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .blog-date::before {
      content: ''; width: 20px; height: 1px; background: #64748b;
    }
    .blog-card h3 {
      font-size: 1.2rem; font-weight: 700; color: #e2e8f0;
      margin-bottom: 0.75rem; line-height: 1.4;
      transition: color 0.3s;
    }
    .blog-card:hover h3 { color: #a78bfa; }
    .blog-card .summary {
      color: #94a3b8; font-size: 0.92rem; line-height: 1.7;
      flex-grow: 1; margin-bottom: 1.25rem;
    }
    .blog-card .blog-footer {
      display: flex; justify-content: space-between; align-items: center;
    }
    .blog-card .blog-tags { display: flex; gap: 0.5rem; }
    .blog-card .blog-tags span {
      font-size: 0.7rem; padding: 0.2rem 0.55rem; border-radius: 20px;
      background: rgba(139,92,246,0.1); color: #a78bfa;
      border: 1px solid rgba(139,92,246,0.15);
    }
    .blog-card .read-more {
      font-size: 0.85rem; color: #a78bfa; font-weight: 500;
      display: inline-flex; align-items: center; gap: 0.4rem;
      transition: gap 0.3s;
    }
    .blog-card:hover .read-more { gap: 0.7rem; }
    .blog-cover { height: auto; aspect-ratio: 16 / 10; margin-bottom: 1.3rem; }
    .blog-cover .tag { font-size: 0.75rem; }
    .blog-card .summary { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 0; }
    .blog-card .blog-footer { margin-top: auto; }
    .blog-card .blog-footer { align-items: flex-end; gap: 0.75rem; }
    .blog-card .blog-tags { flex-wrap: wrap; flex: 1; min-width: 0; gap: 0.4rem; }
    .blog-card .read-more { flex-shrink: 0; white-space: nowrap; padding-bottom: 0.2rem; }
    .empty { color: var(--dim); padding: 2rem 0; }
    .layout { display: block; }
    .side, .side-r { display: none; }
    @media (min-width: 1180px) {
      .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr) 210px; gap: 2.2rem; align-items: start; margin-top: 2rem; }
      .layout .filters { margin-top: 0; }
      .side ol.tags { display: flex; flex-wrap: wrap; gap: 0.35rem; border-left: 0; }
      .side ol.tags li button { width: auto; display: inline-flex; gap: 0.35rem; padding: 0.2rem 0.6rem; margin: 0; border: 1px solid var(--line); border-radius: 999px; font-size: 0.76rem; background: rgba(30,41,59,0.5); }
      .side ol.tags li button[aria-pressed="true"] { background: rgba(139,92,246,0.2); border-color: rgba(167,139,250,0.6); }
      .side, .side-r { display: block; position: sticky; top: 90px; max-height: calc(100vh - 110px); overflow-y: auto; }
      .filters .chip { display: none; }
      .side h2, .side-r h2 { font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 0 0 0.6rem; }
      .side ol, .side-r ol { list-style: none; padding: 0; margin: 0 0 1.8rem; border-left: 1px solid var(--line); }
      .side li button, .side-r li a { display: flex; justify-content: space-between; gap: 0.5rem; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; margin-left: -1px;
        padding: 0.32rem 0 0.32rem 0.85rem; font: inherit; font-size: 0.84rem; line-height: 1.4; color: var(--muted); cursor: pointer; text-decoration: none; }
      .side li button:hover, .side-r li a:hover { color: var(--text); }
      .side li button[aria-pressed="true"] { color: #ddd6fe; border-left-color: #a78bfa; }
      .side li button span { font-family: var(--display); font-size: 0.72rem; color: var(--dim); }
      .side-r li a { display: block; font-size: 0.8rem; }
      .side-r li a small { display: block; font-family: var(--display); font-size: 0.68rem; color: var(--dim); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1440px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; } }
    @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 620px) { .grid { grid-template-columns: minmax(0, 1fr); } .wrap { padding: 2rem 1.25rem 4rem; } }
  </style>
</head>
<body>
  <nav class="post-nav">
    <a href="/" class="back-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span id="backText">回到首頁</span>
    </a>
    <button class="lang-toggle" id="langToggle" aria-label="Switch language">EN</button>
  </nav>
  <main class="wrap">
    <p class="eyebrow">Blog</p>
    <h1>Blog</h1>
    <p class="sub" id="sub"></p>
    <div class="layout">
      <aside class="side" id="side" aria-label="Topics and posts"></aside>
      <div><div class="filters" id="filters"></div>
      <div class="grid" id="grid"><p class="empty">Loading...</p></div></div>
      <aside class="side-r" id="sideR" aria-label="All posts"></aside>
    </div>
  </main>
  <script src="/assets/js/common.js?v=20261120e"></script>
  <script>
    const { esc, getJSON, blogCover, arrowSvg } = Site;
    const I18N = {
      en: { topics: 'Topics', posts: 'All posts', back: 'Back to the homepage', toggle: '中文', sub: 'Notes on taking AI in finance from governance to production.', all: 'All', count: '{n} posts', read: 'Read', none: 'No posts with this tag.', err: 'Content failed to load.' },
      zh: { topics: '主題', posts: '全部文章', back: '回到首頁', toggle: 'EN', sub: '金融業 AI 從治理到上線的筆記、學習心得與有趣的事。', all: '全部', count: '共 {n} 篇', read: '閱讀', none: '沒有這個標籤的文章。', err: '內容載入失敗。' },
    };
    const T = k => I18N[Site.getLang()][k];
    let posts = [], tag = new URLSearchParams(location.search).get('tag') || '';
    function draw() {
      const en = Site.getLang() === 'en';
      const tags = [...new Set(posts.flatMap(p => p.tags))];
      const shown = tag ? posts.filter(p => p.tags.includes(tag)) : posts;
      document.getElementById('filters').innerHTML = `<span class="count">${esc(T('count').replace('{n}', shown.length))}</span>` +
        [['', T('all')], ...tags.map(t => [t, t])].map(([v, l]) => `<button class="chip" data-tag="${esc(v)}" aria-pressed="${v === tag}">${esc(l)}</button>`).join('');
      document.getElementById('grid').innerHTML = shown.length ? shown.map(p => `
        <a href="/${esc(p.file)}" class="blog-card">
          <div class="blog-cover">${blogCover(p.id || p.file)}<span class="tag">${esc(p.tags[0] || '')}</span></div>
          <div class="blog-date">${esc(p.date)}</div>
          <h3>${esc(en && p.title_en ? p.title_en : p.title)}</h3>
          <div class="summary">${esc(en && p.summary_en ? p.summary_en : p.summary)}</div>
          <div class="blog-footer"><div class="blog-tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
            <span class="read-more">${esc(T('read'))} ${arrowSvg}</span></div>
        </a>`).join('') : `<p class="empty">${esc(T('none'))}</p>`;
      const n = t => posts.filter(p => p.tags.includes(t)).length;
      document.getElementById('side').innerHTML = `<h2>${esc(T('topics'))}</h2><ol class="tags">${[['', T('all'), posts.length], ...tags.map(t => [t, t, n(t)])]
          .map(([v, l, c]) => `<li><button class="chip-s" data-tag="${esc(v)}" aria-pressed="${v === tag}">${esc(l)}<span>${c}</span></button></li>`).join('')}</ol>`;
      document.getElementById('sideR').innerHTML = `<h2>${esc(T('posts'))}</h2><ol>${posts.map(p => `<li><a href="/${esc(p.file)}">${esc(en && p.title_en ? p.title_en : p.title)}<small>${esc(p.date)}</small></a></li>`).join('')}</ol>`;
      document.querySelectorAll('.chip, .chip-s').forEach(b => b.onclick = () => {
        tag = b.dataset.tag;
        history.replaceState(null, '', tag ? `?tag=${encodeURIComponent(tag)}` : location.pathname);
        draw();
      });
    }
    function render() {
      document.documentElement.lang = Site.getLang() === 'en' ? 'en' : 'zh-Hant';
      document.getElementById('backText').textContent = T('back');
      document.getElementById('langToggle').textContent = T('toggle');
      document.getElementById('sub').textContent = T('sub');
      getJSON('/posts/posts.json').then(list => { posts = list.sort((a, b) => new Date(b.date) - new Date(a.date)); draw(); })
        .catch(() => { document.getElementById('grid').innerHTML = `<p class="empty">${esc(T('err'))}</p>`; });
    }
    document.getElementById('langToggle').addEventListener('click', () => { Site.toggleLang(); render(); });
    render();
  </script>
</body>
</html>
