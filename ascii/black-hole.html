<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASCII Black Hole | Alex Li (李翔緯)</title>
  <meta name="description" content="A black hole drawn entirely with ASCII characters: a photon ring ignites, a hot accretion disk spreads out edge-on, gravitational lensing wraps its far side over the event horizon, and the disk swirls with differential rotation. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #0b1120;
      --sky: #000000;
      --text: #e6edf6;
      --muted: #a3b1c6;
      --accent: #3b82f6;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: none; /* dragging tilts the view; also no scrolling or double-tap zoom */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    canvas.dragging { cursor: grabbing; }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.12);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(59, 130, 246, 0.28);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.75;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
      .hint { bottom: 30px; } /* stack above the HUD on narrow screens */
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ASCII Black Hole</h1>
  <a class="back" href="./">← ASCII</a>
  <canvas id="c" role="img" aria-label="Animated black hole drawn with ASCII characters: a glowing photon ring, a swirling amber accretion disk seen nearly edge-on, and its lensed far side arching over the black event horizon"></canvas>
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>

<script src="ascii-audio.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Timeline (seconds of scene time) ----------
  const T = {
    RING: 0.2, RING_DUR: 2.6,          // thin photon ring ignites
    THICK: 3.0, THICK_DUR: 3.0,        // ring thickens into a hot torus, view starts to tip
    SPREAD: 6.0, SPREAD_DUR: 3.0,      // disk spreads wide and flattens edge-on
    HOLD: 9.0,                         // swirl
    FADE: 19.0, FADE_DUR: 3.0,
    END: 22.0
  };

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_START = reduced ? 13.0 : 0;   // reduced motion: open on the finished disk
  const SWIRL = reduced ? 0.3 : 1;      // speed of the disk's rotation clock

  // ---------- World (units of the event-horizon radius) ----------
  const RIN = 1.5, ROUT = 4.5;         // accretion disk radii
  const W0 = 1.25;                      // rad/s at the inner edge; omega ~ r^-1.5
  const ROLL = -0.33;                    // in-screen roll: left end of the disk sits higher
  let roll = ROLL, cR = Math.cos(ROLL), sR = Math.sin(ROLL); // dragging sideways adds to the roll
  const INC0 = 62 * Math.PI / 180, INC1 = 36 * Math.PI / 180, INC2 = 17 * Math.PI / 180;
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(20140101);

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };

  // ---------- Characters & colours ----------
  const CH = [];
  const ci = s => { let i = CH.indexOf(s); if (i < 0) { CH.push(s); i = CH.length - 1; } return i; };
  const C_RAMP = [...'.:-=+*#%@'].map(ci);
  const C_SPACE = ci(' ');
  const C_RING = [ci('o'), ci('O'), ci('0'), ci('@')];

  const LEVELS = 16;
  const PAL = [];
  const pal = (r, g, b) => { PAL.push([r, g, b]); return PAL.length - 1; };
  // Inner (hot, cream-white) -> outer (cool, orange-brown).
  const P_DISK = [pal(255, 240, 214), pal(250, 222, 172), pal(238, 190, 124), pal(218, 148, 84), pal(170, 104, 58)];
  const NDP = P_DISK.length;
  const P_RING = pal(255, 196, 110);
  const P_STAR = pal(84, 145, 255);    // a dropped star burns blue-white against the amber disk

  const NCOLOR = PAL.length * LEVELS;
  const COLSTR = new Array(NCOLOR);
  PAL.forEach(([r, g, b], p) => {
    for (let l = 0; l < LEVELS; l++) {
      // Top levels overshoot 1 and wash toward white, so the hot inner disk reads as glowing.
      const m = 0.3 + 1.05 * l / (LEVELS - 1), w = Math.max(0, m - 1) * 160;
      const lift = v => Math.min(255, v * m + w) | 0;
      COLSTR[p * LEVELS + l] = `rgb(${lift(r)},${lift(g)},${lift(b)})`;
    }
  });
  const STAR_COLS = [];
  for (let l = 0; l < 8; l++) STAR_COLS.push(`rgba(200,205,225,${(0.08 + 0.4 * l / 7).toFixed(3)})`);

  // ---------- Particles ----------
  // Accretion disk: denser toward the hot inner edge.
  const ND = 34000;
  const DR = new Float32Array(ND), DPH = new Float32Array(ND), DOM = new Float32Array(ND),
        DH = new Float32Array(ND), DS = new Float32Array(ND), DU = new Float32Array(ND);
  const DP = new Uint16Array(ND);
  for (let i = 0; i < ND; i++) {
    const u = Math.pow(rng(), 1.15);
    const r = RIN + (ROUT - RIN) * u;
    DR[i] = r; DU[i] = u;
    DPH[i] = rng() * Math.PI * 2;
    DOM[i] = W0 * Math.pow(r / RIN, -1.5);
    DH[i] = (rng() + rng() + rng() - 1.5) * 0.035 * r;      // slight thickness
    DS[i] = rng() * 6.283;
    DP[i] = P_DISK[clamp((u * NDP + (rng() - 0.5) * 0.9) | 0, 0, NDP - 1)];
  }
  // Photon ring: a thin circle hugging the horizon in screen space.
  const NR = 1400;
  const RA = new Float32Array(NR), RRR = new Float32Array(NR), RS = new Float32Array(NR);
  for (let i = 0; i < NR; i++) { RA[i] = rng() * 6.283; RRR[i] = 1.0 + 0.05 * rng(); RS[i] = rng() * 6.283; }
  // Dropped star: a blob of gas whose particles sit along a future stream. FS = place along the
  // stream (0 = head), FA/FB/FC = gaussian offsets that make the round blob before tides take over.
  const NF = 260;
  const FS = new Float32Array(NF), FA = new Float32Array(NF), FB = new Float32Array(NF), FC = new Float32Array(NF);
  for (let i = 0; i < NF; i++) {
    FS[i] = Math.pow(rng(), 1.4);
    FA[i] = rng() + rng() + rng() - 1.5; FB[i] = rng() + rng() + rng() - 1.5; FC[i] = rng() + rng() + rng() - 1.5;
  }
  const C_HEAD = [ci('*'), ci('#'), ci('@')];

  // ---------- Canvas, grid, layout ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, fs = 10, cw = 6, ch = 11, cols = 0, rows = 0;
  let S = 100, ox = 0, oy = 0;
  let cellFont = '', bgGrad = null, ringGlow = null, coreGlow = null;
  let zbuf, stampA, cchar, ccol, touched, order, nT = 0, stamp = 0;
  const counts = new Uint32Array(NCOLOR);
  let starX, starY, starC, starPh, starSp, nStars = 0;
  let needResize = true, dirty = true;

  function resize() {
    needResize = false;
    W = canvas.clientWidth || innerWidth;
    H = canvas.clientHeight || innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fs = clamp(Math.round(Math.min(W, H * 0.8) / 80), 7, 14);
    cellFont = `${fs}px ${MONO}`;
    ctx.font = cellFont;
    cw = ctx.measureText('M').width || fs * 0.6;
    ch = fs * 1.1;
    cols = Math.ceil(W / cw);
    rows = Math.ceil(H / ch);
    const n = cols * rows;
    zbuf = new Float32Array(n); stampA = new Uint32Array(n);
    cchar = new Uint8Array(n); ccol = new Uint16Array(n);
    touched = new Int32Array(n); order = new Int32Array(n); stamp = 0;

    // Horizon radius in px; the disk is allowed to run off the sides like a wide-angle shot.
    S = Math.max(30, Math.min(W * 0.17, H * 0.18));
    ox = W / 2;
    oy = H * 0.47;

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#000000');
    bgGrad.addColorStop(1, '#030305');
    makeHalos();

    // Sparse faint background stars (seeded per resize so the layout is stable).
    const r2 = mulberry32(7);
    nStars = Math.round(cols * rows * 0.0035);
    starX = new Float32Array(nStars); starY = new Float32Array(nStars);
    starC = new Uint8Array(nStars); starPh = new Float32Array(nStars); starSp = new Float32Array(nStars);
    const SCH = [ci('.'), ci('.'), ci('·'), ci('+')];
    for (let i = 0; i < nStars; i++) {
      starX[i] = ((r2() * cols) | 0) * cw; starY[i] = ((r2() * rows) | 0) * ch;
      starC[i] = SCH[(r2() * SCH.length) | 0]; starPh[i] = r2() * 6.283; starSp[i] = 0.4 + r2() * 1.6;
    }
    dirty = true;
  }

  // Halo sprites: a warm ring of light around the horizon and a soft core glow behind the disk.
  function makeHalos() {
    const mk = (R, stops) => {
      const c = document.createElement('canvas');
      c.width = c.height = Math.ceil(R * 2);
      const x = c.getContext('2d'), g = x.createRadialGradient(R, R, 0, R, R, R);
      stops.forEach(([o, col]) => g.addColorStop(o, col));
      x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
      return c;
    };
    const R1 = S * 2.2;
    ringGlow = mk(R1, [[0, 'rgba(0,0,0,0)'], [0.96 / 2.2, 'rgba(255,190,110,0)'],
      [1.03 / 2.2, 'rgba(255,200,120,0.5)'], [1.3 / 2.2, 'rgba(255,150,70,0.1)'], [1, 'rgba(255,120,50,0)']]);
    const R2 = S * 4.5;
    coreGlow = mk(R2, [[0, 'rgba(255,170,90,0.22)'], [0.35, 'rgba(255,140,60,0.10)'], [1, 'rgba(255,120,50,0)']]);
  }

  // ---------- Scene state ----------
  let t = T_START, rt = T_START, skyT = 0;   // rt = disk rotation clock
  let ringAmt = 0, rmax = 0, inc = INC0, ci_ = 1, si_ = 0, lens = 0, heat = 0, heatB = 0;
  let letters = 0;
  // Interaction: drag offsets of the view (ease back after release), infalling stars, flare.
  let tiltInc = 0, tiltRoll = 0, flare = 0, flareIn = 0;
  const INC_MIN = 3 * Math.PI / 180, INC_MAX = 84 * Math.PI / 180;
  const stars = [];
  const MAX_STARS = 5;
  let starK = 0;

  function sceneParams() {
    ringAmt = smooth((t - T.RING) / T.RING_DUR);
    const a = smooth((t - T.THICK) / T.THICK_DUR), b = smooth((t - T.SPREAD) / T.SPREAD_DUR);
    // Outer edge of the visible disk grows: torus first, then the wide disk.
    rmax = t < T.THICK ? 0 : RIN + 0.15 + 1.05 * a + (ROUT - RIN - 1.0) * b;
    inc = INC0 + (INC1 - INC0) * a + (INC2 - INC1) * b + 0.012 * Math.sin(skyT * 0.4) * b;
    inc = clamp(inc + tiltInc, INC_MIN, INC_MAX);
    ci_ = Math.cos(inc); si_ = Math.sin(inc);
    roll = ROLL + tiltRoll; cR = Math.cos(roll); sR = Math.sin(roll);
    lens = smooth((48 * Math.PI / 180 - inc) / (30 * Math.PI / 180));
    heat = 2.3 * smooth((t - T.THICK) / (T.HOLD - T.THICK));
    heatB = 0.8 + 0.2 * heat / 2.3 + 0.3 * flare;   // a swallowed star lights up the whole disk
  }

  // ---------- Infalling stars ----------
  // A star dropped at screen point (px, py) is placed in the disk frame so it shows exactly there:
  // its in-plane position comes from the click, and whatever does not fit the plane becomes height.
  function dropStar(px, py) {
    if (stars.length >= MAX_STARS) stars.shift();
    sceneParams();
    const qx = (px - ox) / S, qy = (oy - py) / S;              // rolled screen frame, Y up
    const X = qx * cR + qy * sR, Y = -qx * sR + qy * cR;        // undo the roll
    const lim = Math.sqrt(Math.max(0, 6.5 * 6.5 - X * X));
    let x = clamp(X, -6.5, 6.5), zd = clamp(-Y / Math.max(si_, 0.05), -lim, lim);
    const r = Math.hypot(x, zd), R0 = 1.9;
    if (r < R0) { const k = R0 / Math.max(r, 1e-3); x = r < 1e-3 ? R0 : x * k; zd *= k; }
    const h = clamp((Y + zd * si_) / ci_, -4, 4);
    const s = { r: Math.hypot(x, zd), phi: Math.atan2(zd, x), h, age: 0, L: 0.05, k: starK++,
                stretched: false, flared: false, pan: clamp((px / W) * 2 - 1, -1, 1) };
    s.r0 = s.r;
    stars.push(s);
    dirty = true;
    music('event', 'drop', { pan: s.pan });
    return s;
  }

  const IN_SPEED = reduced ? 0.6 : 1;
  function updateStars(dt) {
    for (let j = stars.length - 1; j >= 0; j--) {
      const s = stars[j];
      s.age += dt;
      // Sinks quickly from afar, lingers as it winds through the disk, then plunges at the end.
      // It orbits faster than the disk does.
      const rr = Math.max(s.r, 0.3);
      s.r -= dt * IN_SPEED * (0.1 + 0.25 * rr + 0.9 * smooth((1.4 - rr) / 0.4));
      s.phi += dt * IN_SPEED * 2.2 * W0 * Math.pow(Math.max(rr, 0.8) / RIN, -1.5);
      s.h *= Math.exp(-dt * 0.9 * IN_SPEED);                    // settles into the disk plane
      // Tides: the closer it gets, the longer the stream it is pulled into.
      const tide = clamp((s.r0 - Math.max(s.r, 1)) / Math.max(0.5, s.r0 - 1), 0, 1);
      s.L = 0.05 + 3.2 * Math.pow(tide, 1.2);
      if (!s.stretched && tide > 0.3) { s.stretched = true; music('event', 'stretch', { pan: s.pan }); }
      if (!s.flared && s.r < 1.12) {
        s.flared = true;
        flareIn += reduced ? 0.25 : 0.8;
        music('event', 'swallow', { pan: s.pan });
      }
      if (s.r + s.L * 0.3 < 0.9) stars.splice(j, 1);           // the whole stream is gone
    }
    // The flare jumps up at once; with reduced motion it swells gently instead (no flash).
    const add = reduced ? Math.min(flareIn, dt * 0.4) : flareIn;
    flareIn -= add;
    flare = Math.min(reduced ? 0.35 : 1, flare * Math.exp(-dt * (reduced ? 0.6 : 1.4)) + add);
    if (flare < 0.002) flare = 0;
  }

  // ---------- Projection + z-buffered splat ----------
  // (X, Y) in the un-rolled screen frame (world units, Y up), Z = depth toward the viewer.
  function splat(X, Y, Z, b, p, cc) {
    const sx = X * cR - Y * sR, sy = X * sR + Y * cR;
    const px = ox + sx * S, py = oy - sy * S;
    if (px < 0 || py < 0) return;
    const col = (px / cw) | 0, row = (py / ch) | 0;
    if (col >= cols || row >= rows) return;
    const c = row * cols + col;
    const fresh = stampA[c] !== stamp;
    if (!fresh && zbuf[c] >= Z) return; // keep nearest (larger Z = closer)
    if (fresh) { stampA[c] = stamp; touched[nT++] = c; }
    if (b > 1) b = 1;
    zbuf[c] = Z;
    cchar[c] = cc >= 0 ? cc : C_RAMP[(b * 8.99) | 0];
    ccol[c] = p * LEVELS + ((b * 15.99) | 0);
  }

  // The event horizon: a black sphere written into the z-buffer so it hides everything behind it.
  function stampHole() {
    const R = 0.985;
    const r0 = Math.max(0, ((oy - R * S) / ch) | 0), r1 = Math.min(rows - 1, ((oy + R * S) / ch) | 0);
    const c0 = Math.max(0, ((ox - R * S) / cw) | 0), c1 = Math.min(cols - 1, ((ox + R * S) / cw) | 0);
    for (let row = r0; row <= r1; row++) {
      const dy = ((row + 0.5) * ch - oy) / S;
      for (let col = c0; col <= c1; col++) {
        const dx = ((col + 0.5) * cw - ox) / S, d2 = dx * dx + dy * dy;
        if (d2 > R * R) continue;
        const c = row * cols + col;
        stampA[c] = stamp; touched[nT++] = c;
        zbuf[c] = Math.sqrt(1 - d2); cchar[c] = C_SPACE; ccol[c] = 0;
      }
    }
  }

  const TAU = Math.PI * 2;
  const HOT = new Float32Array(MAX_STARS * 4);

  // A star's particles: a round blob at first, then a thin trailing spiral stream as tides
  // stretch it; anything inside the horizon is gone. The far side is lensed like the disk.
  function drawStars() {
    for (const st of stars) {
      const pop = reduced ? smooth(st.age / 0.6) : smooth(st.age / 0.25) * (1 + 0.5 * Math.exp(-st.age * 4));
      const blob = 0.03 + 0.1 * (1 - smooth((st.L - 0.05) / 1.2));
      const off = (st.k * 97) % NF;
      for (let n = 0; n < NF; n++) {
        const i = (n + off) % NF, f = FS[n];
        const r = st.r + f * st.L * 0.3 + FA[i] * blob;
        if (r < 1.0) continue;                                  // swallowed
        const ph = st.phi - f * st.L + FB[i] * blob / Math.max(r, 1);
        const c = Math.cos(ph), sn = Math.sin(ph);
        const x = r * c, zd = r * sn, h = st.h * (1 - 0.3 * f) + FC[i] * blob * 1.6;
        const Y = -zd * si_ + h * ci_, Z = zd * ci_ + h * si_;
        // Bright at the head, hotter as it nears the horizon.
        // Capped below the white wash of the palette so the stream stays blue against the disk.
        const b = Math.min(f < 0.05 ? 0.88 : 0.78,
          pop * (1 - 0.45 * f) * (0.85 + 0.35 * smooth((2.2 - r) / 1.2)) * (1 - 0.5 * Math.abs(FA[i])));
        splat(x, Y, Z + 0.45, b, P_STAR, f < 0.05 && b > 0.6 ? C_HEAD[((b - 0.6) / 0.29 * 2.99) | 0] : -1);
        if (zd < 0 && lens > 0 && (n & 1) === 0) {
          const rho = 1.06 + 0.5 * Math.pow(clamp((r - RIN) / (ROUT - RIN), 0, 1.3), 0.8);
          splat(rho * c, -rho * sn, 0.41, b * 0.75 * lens, P_STAR, -1);
        }
      }
    }
  }

  function buildScene() {
    stamp++; nT = 0;
    stampHole();

    // Photon ring: thin bright circle right at the horizon edge.
    if (ringAmt > 0) {
      for (let i = 0; i < NR; i++) {
        const a = RA[i] + rt * 0.9, r = RRR[i];
        const fl = 0.8 + 0.2 * Math.sin(skyT * 3 + RS[i]);
        const b = ringAmt * fl * (0.75 + 0.25 * heatB);
        splat(Math.cos(a) * r, Math.sin(a) * r, 0.45, b * (1 + 0.6 * flare), P_RING, C_RING[(Math.min(1, b * (1 + 0.6 * flare)) * 3.99) | 0]);
      }
    }
    drawStars();
    if (rmax <= 0) return;

    // Stars whose stream has reached the disk heat it along the stream.
    let nh = 0;
    for (const st of stars) {
      const w = smooth((rmax + 0.4 - st.r) / 0.6) * smooth(1 - Math.abs(st.h) / 0.6);
      if (w > 0.01) { HOT[nh++] = st.r; HOT[nh++] = st.phi; HOT[nh++] = st.L; HOT[nh++] = w; }
    }

    for (let i = 0; i < ND; i++) {
      const r = DR[i];
      const reveal = (rmax - r) / 0.35;
      if (reveal <= 0) continue;
      const ph = DPH[i] + DOM[i] * rt;
      const c = Math.cos(ph), s = Math.sin(ph);
      const x = r * c, zd = r * s, h = DH[i];       // zd > 0: near side
      const Y = -zd * si_ + h * ci_, Z = zd * ci_ + h * si_;
      // Concentric banding that wobbles and co-rotates, so differential rotation shears it.
      const bandA = 0.5 + 0.5 * Math.sin(r * 10.5 + 0.7 * Math.sin(ph * 2 + r * 1.3) + DS[i] * 0.08);
      const tex = 0.82 + 0.18 * Math.sin(ph * 3 + r * 6 + DS[i] * 0.3);
      const radial = 1.3 - 0.6 * DU[i];
      const dop = 1 + 0.22 * c;                      // approaching (right) side brighter
      let b = heatB * radial * (0.3 + 0.7 * bandA * bandA) * tex * dop;
      if (reveal < 1) b *= reveal;
      let p = DP[i];
      for (let k = 0; k < nh; k += 4) {
        let dp = (HOT[k + 1] - ph) % TAU; if (dp < 0) dp += TAU;   // how far behind the head
        if (dp > TAU - 0.3) dp -= TAU;
        if (dp > HOT[k + 2] + 0.5) continue;
        const dr = (r - HOT[k] - 0.3 * Math.max(0, dp)) / 0.45;
        const hot = HOT[k + 3] * Math.exp(-dr * dr) * (dp < 0 ? 1 + dp / 0.3 : smooth((HOT[k + 2] + 0.5 - dp) / 0.5));
        if (hot > 0.02) { b *= 1 + 0.6 * hot; if (hot > 0.35 && p > P_DISK[0]) p--; }
      }
      splat(x, Y, Z, b, p, -1);

      // Gravitational lensing: the far side's image wraps over the top of the horizon,
      // and a thin secondary image hugs the bottom.
      if (zd < 0 && lens > 0) {
        const u = DU[i];
        const rho = 1.06 + 0.5 * Math.pow(u, 0.8);
        const pi = p > P_DISK[0] ? p - 1 : p;        // lensed light reads a bit hotter
        const ba = heatB * (1.3 - 0.6 * u) * (0.55 + 0.45 * bandA) * lens;
        splat(rho * c, -rho * s, 0.4, ba, pi, -1);
        if ((i & 3) === 0) {
          const rho2 = 1.035 + 0.17 * u;
          splat(rho2 * c, rho2 * s, 0.3, ba * 0.7, pi, -1);
        }
      }
    }
  }

  // Bucket by colour so fillStyle changes once per colour, not once per cell.
  function drawCells() {
    counts.fill(0);
    for (let i = 0; i < nT; i++) counts[ccol[touched[i]]]++;
    let acc = 0;
    for (let c = 0; c < NCOLOR; c++) { const n = counts[c]; counts[c] = acc; acc += n; }
    for (let i = 0; i < nT; i++) { const c = touched[i]; order[counts[ccol[c]]++] = c; }
    let cur = -1, n = 0;
    for (let i = 0; i < nT; i++) {
      const c = order[i];
      if (cchar[c] === C_SPACE) continue;
      const cc = ccol[c];
      if (cc !== cur) { cur = cc; ctx.fillStyle = COLSTR[cc]; }
      const row = (c / cols) | 0;
      ctx.fillText(CH[cchar[c]], (c - row * cols) * cw, row * ch);
      n++;
    }
    letters = n;
  }

  function drawSky() {
    const R2 = S * S * 1.1;
    for (let i = 0; i < nStars; i++) {
      const dx = starX[i] - ox, dy = starY[i] - oy;
      if (dx * dx + dy * dy < R2) continue;          // nothing shines through the horizon
      ctx.fillStyle = STAR_COLS[((0.5 + 0.5 * Math.sin(skyT * starSp[i] + starPh[i])) * 7.99) | 0];
      ctx.fillText(CH[starC[i]], starX[i], starY[i]);
    }
  }

  function drawHalos(fade) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cg = fade * heat / 2.3 + 0.5 * flare;
    if (cg > 0.01) {
      ctx.save();
      ctx.globalAlpha = cg;
      ctx.translate(ox, oy); ctx.rotate(-roll); ctx.scale(1, 0.32); // flattened along the disk
      ctx.drawImage(coreGlow, -coreGlow.width / 2, -coreGlow.height / 2);
      ctx.restore();
    }
    ctx.globalAlpha = Math.min(1, fade * ringAmt * (0.7 + 0.1 * Math.sin(skyT * 2.1)) + 0.7 * flare);
    ctx.drawImage(ringGlow, ox - ringGlow.width / 2, oy - ringGlow.height / 2);
    ctx.restore();
    // Keep the event horizon pure black under the glow.
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(ox, oy, S * 0.985, 0, Math.PI * 2);
    ctx.fill();
  }

  // Bloom: shrink the frame, remove the background with 'difference', blur, and add it back on top.
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  const GLOW_DIV = 5, GLOW_A = 0.9;
  function drawGlow() {
    const gw = Math.ceil(W / GLOW_DIV), gh = Math.ceil(H / GLOW_DIV);
    if (glow.width !== gw || glow.height !== gh) { glow.width = gw; glow.height = gh; }
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'copy';
    gctx.filter = 'blur(2px)';
    gctx.drawImage(canvas, 0, 0, gw, gh);
    gctx.filter = 'none';
    gctx.globalCompositeOperation = 'difference';
    gctx.setTransform(gw / W, 0, 0, gh / H, 0, 0);
    gctx.fillStyle = bgGrad;
    gctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = GLOW_A;
    ctx.drawImage(glow, 0, 0, W, H);
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.font = cellFont;
    drawSky();
    sceneParams();
    buildScene();
    // Everything fades back to the starry sky before the loop restarts.
    const fade = reduced ? 1 : 1 - smooth((t - T.FADE) / T.FADE_DUR);
    drawHalos(fade);
    ctx.globalAlpha = fade;
    drawCells();
    ctx.globalAlpha = 1;
    drawGlow();
  }

  // ---------- Loop, HUD, controls ----------
  let paused = false, last = performance.now();
  let frames = 0, fpsT = last, fps = 0, hudT = 0;

  function updateHud(now) {
    const spin = W0 * rt / (Math.PI * 2);   // turns of the inner edge
    const tail = paused ? 'paused' : `${fps} fps`;
    const head = `spin ${spin.toFixed(2)}  heat ${heat.toFixed(2)}  `;
    // Narrow screens drop the letter count so nothing is clipped.
    hudEl.textContent = W < 640 ? head + tail : head + `letters ${letters.toLocaleString('en-US')}  ` + tail;
    hudT = now;
  }

  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) resize();
    if (!paused) {
      const t1 = t;
      t += dt; skyT += dt; rt += dt * SWIRL;
      if (reduced) { if (t > T.FADE) t = T.FADE; }   // reduced motion: hold the disk, no loop
      else if (t >= T.END) { t = 0; rt = 0; }        // stars keep twinkling across the loop
      soundCues(t1, t);
      updateStars(dt);
    }
    // After a drag the view eases back to the scripted angle (also while paused).
    if (!drag && (tiltInc || tiltRoll)) {
      const k = Math.exp(-dt * (reduced ? 1.2 : 1.8));
      tiltInc *= k; tiltRoll *= k;
      if (Math.abs(tiltInc) + Math.abs(tiltRoll) < 1e-4) tiltInc = tiltRoll = 0;
      dirty = true;
    }
    if (!paused || dirty) { render(); dirty = false; frames++; }
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  // ---------- Music (ascii-audio.js) ----------
  const music = (fn, ...a) => window.AsciiAudio && AsciiAudio[fn](...a);
  // Fire a sound cue on the frame where the scene clock crosses an animation event.
  const crossed = (a, b, x) => a < x && x <= b;
  function soundCues(a, b) {
    if (!window.AsciiAudio) return;
    if (crossed(a, b, T.RING)) music('event', 'ring');
    if (crossed(a, b, T.THICK)) music('event', 'form');
    if (crossed(a, b, T.SPREAD)) music('event', 'spread');
    if (crossed(a, b, T.FADE)) music('event', 'fade');
  }

  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); music(paused ? 'pause' : 'resume'); }
  function replay() {
    t = T_START; rt = T_START; stars.length = 0; flare = flareIn = 0; tiltInc = tiltRoll = 0;
    paused = false; dirty = true; music('resume'); music('restart');
  }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
    else if (e.key === 's' || e.key === 'S') {              // drop a star somewhere off the disk
      const a = rng() * TAU;
      dropStar(ox + Math.cos(a) * S * 3.2, oy + Math.sin(a) * S * 1.6);
    }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault(); tiltInc = clamp(tiltInc + (e.key === 'ArrowDown' ? 0.12 : -0.12), -1.2, 1.2); dirty = true;
    }
  });
  // Pointer: drag (past 8 px) tilts the view, a tap drops a star, a double tap pauses/resumes.
  // The second tap of a double tap takes back the star the first one dropped.
  let drag = null, lastTap = null;
  const DRAG_PX = 8, DBL_MS = 320;
  canvas.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < DRAG_PX) return;
    if (!drag.moved) { drag.moved = true; canvas.classList.add('dragging'); music('event', 'tilt'); }
    // Down tips the disk toward face-on, up toward edge-on; sideways rolls it a little.
    tiltInc = clamp(tiltInc + (e.clientY - drag.ly) / Math.max(H, 1) * 2.2, -1.2, 1.2);
    tiltRoll = clamp(tiltRoll - (e.clientX - drag.lx) / Math.max(W, 1) * 1.2, -0.7, 0.7);
    drag.lx = e.clientX; drag.ly = e.clientY;
    dirty = true;
  });
  const endPointer = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const tap = !drag.moved && e.type === 'pointerup';
    drag = null;
    canvas.classList.remove('dragging');
    if (!tap) return;
    const b = canvas.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    const now = performance.now();
    if (lastTap && now - lastTap.t < DBL_MS && Math.hypot(x - lastTap.x, y - lastTap.y) < 40) {
      const i = stars.indexOf(lastTap.star);
      if (i >= 0) stars.splice(i, 1);
      lastTap = null;
      togglePause();
      return;
    }
    lastTap = { t: now, x, y, star: dropStar(x, y) };
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // Hint language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';
  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '點一下丟入恆星 · 拖曳傾斜視角 · 雙擊暫停' : 'tap to drop a star · drag to tilt · double-tap to pause')
                             : (zh ? '點擊丟入恆星 · 拖曳傾斜視角 · 雙擊/空白鍵 暫停 · R 重播 · M 音樂'
                                   : 'click to drop a star · drag to tilt · double-click/Space pause · R replay · M music');

  // Score: original deep-space ambient in E minor at 60 bpm (one beat = one second of scene
  // time). A slowly beating sub drone, organ-like chords whose filter opens as the disk heats up,
  // a slow swell while the disk is full, a faint high shimmer and a quiet clock tick on each beat.
  if (window.AsciiAudio) AsciiAudio.init({
    bpm: 60, master: 0.8, reverb: 0.4, reverbTime: 5,
    build(a) {
      const c = a.ctx, F = AsciiAudio.freq;
      // Scene state `n` beats ahead of now (the score schedules a little early and plays long notes).
      const sceneAt = n => reduced ? Math.min(t + n, T.FADE) : (t + n) % T.END;
      const formAt = s => smooth((s - T.THICK) / (T.HOLD - T.THICK));
      const fadeAt = s => reduced ? 0 : smooth((s - T.FADE) / T.FADE_DUR);

      // Organ-like voice: sine, detuned triangle, soft 2nd and 3rd partials per note, through a
      // lowpass that glides from cut0 to cut1 across the note. Slow linear attack and release.
      function organ(t, ns, dur, o) {
        const out = a._out(o, o.wet), lp = c.createBiquadFilter(), g = c.createGain();
        lp.type = 'lowpass'; lp.Q.value = 0.7;
        lp.frequency.setValueAtTime(o.cut0, t);
        lp.frequency.linearRampToValueAtTime(o.cut1, t + dur);
        lp.connect(g); g.connect(out);
        const peak = o.vel * 0.1 / Math.sqrt(ns.length), end = t + dur + o.release;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + o.attack);
        g.gain.setValueAtTime(peak, t + dur);
        g.gain.linearRampToValueAtTime(0, end);
        for (const n of ns) {
          const f = F(n);
          [['sine', 1, 1, 0], ['triangle', 1, 0.45, 6], ['sine', 2, 0.22, -5], ['sine', 3, 0.08, 4]].forEach(([type, r, amp, det]) => {
            const og = c.createGain(), osc = c.createOscillator();
            og.gain.value = amp; og.connect(lp);
            osc.type = type; osc.frequency.value = f * r; osc.detune.value = det;
            osc.connect(og); osc.start(t); osc.stop(end + 0.05);
          });
        }
      }

      // Sub drone on E1 with a second sine 0.18 Hz sharp (a slow beat), a fifth and a faint
      // triangle octave so small speakers hear it. It runs for good on the sfx bus, so a replay
      // does not cut it; its level follows the heat.
      const drone = c.createGain(), dlp = c.createBiquadFilter();
      dlp.type = 'lowpass'; dlp.frequency.value = 220;
      dlp.connect(drone); drone.connect(a._out({ bus: 'sfx' }, 0.15));
      drone.gain.value = 0;
      const E1 = F('E1');
      [['sine', E1, 1], ['sine', E1 + 0.18, 0.8], ['sine', F('B1'), 0.25], ['triangle', E1 * 2, 0.12]].forEach(([type, f, amp]) => {
        const og = c.createGain(), osc = c.createOscillator();
        og.gain.value = amp; og.connect(dlp);
        osc.type = type; osc.frequency.value = f; osc.connect(og); osc.start(a.time(0));
      });
      a.every(1, tt => {
        const s = sceneAt(0.5), k = formAt(s) * (1 - 0.5 * fadeAt(s));
        drone.gain.setTargetAtTime(0.1 + 0.06 * k, tt, 1.2);
      });

      // Chords, one per 8 beats, overlapping: Em(add9), Cmaj7, Am(add9), Bsus4.
      const PROG = [['E3', 'B3', 'F#4', 'G4'], ['C3', 'G3', 'B3', 'E4'], ['A2', 'E3', 'B3', 'C4'], ['B2', 'F#3', 'B3', 'E4']];
      a.every(8, (tt, k) => {
        const s0 = sceneAt(0), s1 = sceneAt(8), fd = fadeAt(s0);
        organ(tt, PROG[k % 4], 8, {
          vel: 0.55 * (1 - 0.6 * fd), attack: 3, release: 4, wet: 0.55 + 0.4 * fd,
          cut0: 280 + 1900 * formAt(s0) * (1 - fd), cut1: 280 + 1900 * formAt(s1 < s0 ? 0 : s1) * (1 - fadeAt(s1))
        });
      });
      // Full disk: a slow swell every 4 beats on the top of the chord, an octave up.
      a.every(4, (tt, k) => {
        const s = sceneAt(0);
        if (s < T.HOLD - 0.5 || s >= T.FADE) return;
        const ch = PROG[Math.floor(k / 2) % 4];
        organ(tt, [AsciiAudio.transpose(ch[2], 12), AsciiAudio.transpose(ch[3], 12)], 1.8,
          { vel: 0.3, attack: 1.8, release: 2.4, wet: 0.75, cut0: 1200, cut1: 1800, pan: k % 2 ? 0.25 : -0.25 });
      });
      // Faint high shimmer, a little busier while the disk is hot.
      const SH = ['E6', 'F#6', 'G6', 'B6', 'D7', 'E7'];
      a.every(0.5, tt => {
        const s = sceneAt(0), p = 0.05 + 0.2 * formAt(s) * (1 - fadeAt(s));
        if (Math.random() < p) a.bell(tt, SH[(Math.random() * SH.length) | 0], 3,
          { vel: 0.07 + 0.05 * Math.random(), wet: 0.9, pan: Math.random() * 1.2 - 0.6 });
      });
      // Clock: a filtered click on every beat, tick and tock.
      a.every(1, (tt, k) => a.noise(tt, { dur: 0.03, filter: 'bandpass', freq: k % 2 ? 2500 : 3300, q: 6,
        attack: 0.001, vel: 0.3, wet: 0.3, pan: k % 2 ? 0.12 : -0.12 }));

      // Sound effects in sync with the animation.
      a.on('ring', (a, d, t) => { a.chime(t, 'E6', 4.5, { vel: 0.26 }); a.bell(t + 0.45, 'B5', 5, { vel: 0.14, wet: 0.8, bus: 'sfx' }); });
      a.on('form', (a, d, t) => a.sweep(t, T.HOLD - T.THICK, { from: 120, to: 2600, q: 2.5, vel: 0.22, wet: 0.6, bus: 'sfx' }));
      a.on('spread', (a, d, t) => {
        a.boom(t, { vel: 0.5 });
        a.noise(t, { dur: 3, filter: 'lowpass', freq: 900, freqEnd: 60, attack: 0.04, vel: 0.22, wet: 0.7, bus: 'sfx' });
      });
      a.on('fade', (a, d, t) => { a.bell(t, 'E5', 7, { vel: 0.14, wet: 1, bus: 'sfx' }); a.bell(t + 0.7, 'B4', 7, { vel: 0.1, wet: 1, bus: 'sfx' }); });
      // Interaction: a dropped star pings, its tidal stream rises as a filtered sweep, and the
      // swallow is a low boom with a bright chime. Tilting the view is a soft breath of air.
      a.on('drop', (a, d, t) => { a.bell(t, 'B5', 2.5, { vel: 0.16, wet: 0.7, pan: d.pan, bus: 'sfx' }); a.bell(t + 0.12, 'E6', 2, { vel: 0.08, wet: 0.8, pan: d.pan, bus: 'sfx' }); }, { gap: 0.08 });
      a.on('stretch', (a, d, t) => a.sweep(t, 2.2, { from: 300, to: 3800, q: 4, vel: 0.12, wet: 0.6, pan: d.pan, bus: 'sfx' }), { gap: 0.3 });
      a.on('swallow', (a, d, t) => {
        a.boom(t, { vel: reduced ? 0.22 : 0.38 });
        a.chime(t + 0.05, 'E6', 3, { vel: reduced ? 0.1 : 0.18 });
      }, { gap: 0.25 });
      a.on('tilt', (a, d, t) => a.whoosh(t, { dur: 0.7, vel: 0.12, freq: 200, freqEnd: 900, wet: 0.4 }), { gap: 0.6 });
    }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
