<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASCII Running Shiba | Alex Li (李翔緯)</title>
  <meta name="description" content="A cute Shiba Inu gallops through a sunset meadow, drawn entirely with ASCII characters: a big low sun, parallax hills, trees and swaying grass, drifting clouds, dust puffs and a butterfly to chase. Tap to jump. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#1a0f2e">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #1a0f2e;
      --sky: #140b26;
      --text: #f3eaf6;
      --muted: #d9c6d8;
      --accent: #3b82f6;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: manipulation; /* no double-tap zoom: double-tap means restart */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.12);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(59, 130, 246, 0.28);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.8;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
      .hint { bottom: 30px; } /* stack above the HUD on narrow screens */
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ASCII Running Shiba</h1>
  <a class="back" href="./">← ASCII</a>
  <canvas id="c" role="img" aria-label="Animated cute Shiba Inu drawn with ASCII characters, galloping through a sunset meadow with parallax hills, trees, swaying grass and drifting clouds, and jumping after a butterfly"></canvas>
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>

<script src="ascii-audio.js"></script>
<script>
(() => {
  'use strict';

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';

  // ---------- Gait (stride phase in cycles; leg order: front near, front far, hind near, hind far) ----------
  // Full motion: rotary gallop, ~2.2 strides/s. Reduced motion: a slow diagonal trot.
  const GAIT = reduced
    ? { f: 1.2, ds: 0.52, af: 0.32, ah: 0.3, fx: 0.55, pitch: 0.012, bob: 0.008, off: [0, 0.5, 0.5, 0], speed: 0.5, mps: 1.8 }
    : { f: 2.2, ds: 0.4, af: 0.62, ah: 0.55, fx: 1, pitch: 0.075, bob: 0.03, off: [0.58, 0.5, 0.06, 0.0], speed: 1.45, mps: 5.4 };
  const JUMP_DUR = 0.8, JUMP_H = 0.3;          // seconds, body units
  const BF_FIRST = 4.0, BF_MIN = 8, BF_MAX = 12; // butterfly schedule (s)

  // ---------- Camera (side view, turned a little toward the viewer, looking slightly down) ----------
  const CAM_D = 4.5, PIVOT = 0.45, TILT = 0.08, YAW = -0.3;
  const ct = Math.cos(TILT), st = Math.sin(TILT), cyw = Math.cos(YAW), syw = Math.sin(YAW);
  // Warm light from the low sun ahead (upper right, in front), in view space.
  const LX0 = 0.32, LY0 = 0.55, LZ0 = 0.78;
  const LN = Math.hypot(LX0, LY0, LZ0);
  const LX = LX0 / LN, LY = LY0 / LN, LZ = LZ0 / LN;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Stateless integer hash -> uint32, for per-cell scenery without storing state.
  function hash2(a, b) {
    let h = Math.imul(a ^ Math.imul(b, 0x9E3779B1), 0x85EBCA6B);
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    return h >>> 0;
  }
  const U32 = 1 / 4294967296;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- Characters & colours ----------
  const CH = [];
  const ci = s => { let i = CH.indexOf(s); if (i < 0) { CH.push(s); i = CH.length - 1; } return i; };
  const C_SP = ci(' '); // occluder: hides what is behind, never drawn
  const C_FUR = [...'.:;~=+*%#@'].map(ci);       // soft coat ramp, dim -> dense (as in shiba-sit)
  const NFUR = C_FUR.length;
  const C_SL = ci('/'), C_BS = ci('\\'), C_BAR = ci('|'), C_COMMA = ci(','), C_APOS = ci("'"), C_DOT = ci('.'),
        C_COLON = ci(':'), C_DASH = ci('-'), C_TILDE = ci('~'), C_EQ = ci('='), C_STAR = ci('*'), C_PLUS = ci('+'),
        C_LP = ci('('), C_RP = ci(')'), C_AT = ci('@'), C_O = ci('O'), C_o = ci('o'), C_US = ci('_'),
        C_PCT = ci('%'), C_AMP = ci('&'), C_HASH = ci('#'), C_CARET = ci('^'), C_BTICK = ci('`');
  const TREE_TEX = [C_PCT, C_AMP, C_STAR, C_HASH];

  const LEVELS = 16;
  const PAL = [];
  const pal = (r, g, b) => { PAL.push([r, g, b]); return PAL.length - 1; };
  // Shiba
  const P_OR_D = pal(160, 80, 35), P_OR = pal(220, 120, 50), P_OR_L = pal(240, 150, 70);
  const P_CR = pal(250, 232, 204), P_CR_D = pal(214, 176, 142);
  const P_EARIN = pal(242, 160, 150);
  const P_EYE = pal(34, 20, 16), P_CATCH = pal(255, 255, 255);
  const P_NOSE = pal(44, 30, 28), P_MOUTH = pal(120, 58, 38), P_MIN = pal(150, 40, 55);
  const P_TONGUE = pal(250, 120, 140), P_TONGUE_D = pal(214, 80, 106);
  // Scenery
  const P_HILL = pal(146, 98, 178), P_HILLRIM = pal(230, 140, 172);
  const P_TREE = pal(58, 112, 72), P_TREERIM = pal(240, 158, 84);
  const P_GRASS = [pal(112, 192, 70), pal(78, 166, 62), pal(168, 208, 84), pal(140, 200, 76)];
  const P_FLOWER = [pal(255, 216, 80), pal(255, 136, 190), pal(255, 246, 230)];
  const P_CLOUD = pal(255, 170, 190), P_CLOUDTOP = pal(206, 140, 212);
  const P_DUST = pal(230, 206, 166), P_STAR = pal(232, 222, 255);
  const P_SUN = [pal(255, 244, 200), pal(255, 216, 128), pal(255, 184, 100), pal(255, 150, 104)];
  const SKY_STOPS = [[0, 118, 86, 200], [0.42, 196, 98, 196], [0.72, 255, 128, 156], [1, 255, 178, 98]];
  const SKY_N = 14, SKY_P = [];
  for (let k = 0; k < SKY_N; k++) {
    const f = k / (SKY_N - 1);
    let j = 0;
    while (j < SKY_STOPS.length - 2 && f > SKY_STOPS[j + 1][0]) j++;
    const a = SKY_STOPS[j], b = SKY_STOPS[j + 1], m = (f - a[0]) / (b[0] - a[0]);
    SKY_P.push(pal(a[1] + (b[1] - a[1]) * m, a[2] + (b[2] - a[2]) * m, a[3] + (b[3] - a[3]) * m));
  }

  // Colour strings cached per (palette entry, brightness level).
  const NCOLOR = PAL.length * LEVELS;
  const COLSTR = new Array(NCOLOR);
  PAL.forEach(([r, g, b], p) => {
    for (let l = 0; l < LEVELS; l++) {
      // Top levels overshoot 1 and wash toward white, so lit characters read as glowing.
      const m = 0.3 + 1.05 * l / (LEVELS - 1), w = Math.max(0, m - 1) * 160;
      const lift = v => Math.min(255, v * m + w) | 0;
      COLSTR[p * LEVELS + l] = `rgb(${lift(r)},${lift(g)},${lift(b)})`;
    }
  });
  const lvl = b => { const l = (b * 15.99) | 0; return l < 0 ? 0 : l > 15 ? 15 : l; };

  // ---------- The Shiba: smooth parts sampled as surface point clouds with normals ----------
  // Side view, x forward (right), y up, z toward the viewer; ground at y = 0. Bones are rotations
  // about z (the sagittal plane) plus a translation; points live in bone space. Proportions follow
  // the breed: body length ~1.1x the withers height, chest depth ~half of it, short sturdy legs,
  // short thick neck, wedge-shaped fox head. Face, palette, ramp and shading match shiba-sit.
  const NB = 22, B_BODY = 0, B_HEAD = 1, B_EAR = 2, B_TONGUE = 4, B_TAIL = 5, B_LEG = 6;
  const BODY_Y = 0.46, LEG_Z = 0.082, PAW_DROP = 0.03;
  const FRONT_L = [0.16, 0.19, 0.05], FRONT_R0 = [0.07, 0.046, 0.036], FRONT_R1 = [0.05, 0.038, 0.034];
  const HIND_L = [0.18, 0.18, 0.12], HIND_R0 = [0.088, 0.048, 0.035], HIND_R1 = [0.056, 0.036, 0.031];
  const FRONT_ROOT = [0.16, -0.05], HIND_ROOT = [-0.2, -0.01];
  const HEAD_AT = [0.37, 0.25], TAIL_AT = [-0.31, 0.11];   // body-local bone origins
  const SPACING = 0.006, DENS = 1.25 / (SPACING * SPACING);
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  // Kinds of dog points (how the splat shades them).
  const K_COAT = 0, K_EARIN = 1, K_EYE = 2, K_MOUTH = 3, K_NOSE = 4, K_TONGUE = 5;
  const jr = mulberry32(20260801);
  const jit = () => (jr() - 0.5) * 0.08;   // ragged cream/ginger borders

  const MB = { x: [], y: [], z: [], nx: [], ny: [], nz: [], b: [], p: [], f: [], k: [], a1: [], a2: [] };
  function addPt(b, x, y, z, nx, ny, nz, p, f, k, a1, a2) {
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    if (nz < -0.42) return; // faces away from the camera in every pose: never visible
    MB.x.push(x); MB.y.push(y); MB.z.push(z); MB.nx.push(nx); MB.ny.push(ny); MB.nz.push(nz);
    MB.b.push(b); MB.p.push(p); MB.f.push(f); MB.k.push(k); MB.a1.push(a1); MB.a2.push(a2);
  }
  // Ellipsoid with optional rotation about z and a taper toward its local +x end.
  function shape(cx, cy, cz, rx, ry, rz, rot, tp) {
    return { cx, cy, cz, rx, ry, rz, tp, c: Math.cos(rot), s: Math.sin(rot) };
  }
  function inside(E, x, y, z) {
    const dx = x - E.cx, dy = y - E.cy;
    const lx = dx * E.c + dy * E.s, ly = -dx * E.s + dy * E.c, lz = z - E.cz;
    const s = 1 - E.tp * Math.max(0, lx / E.rx);
    const a = lx / E.rx, b = ly / (E.ry * s), c = lz / (E.rz * s);
    return a * a + b * b + c * c < 0.96;
  }
  function ellArea(a, b, c) {
    const p = 1.6;
    return 4 * Math.PI * Math.pow((Math.pow(a * b, p) + Math.pow(a * c, p) + Math.pow(b * c, p)) / 3, 1 / p);
  }
  // Fibonacci-sample the surface; skip points buried inside sibling parts (clean union).
  function sampleEllE(E, others, emit) {
    const n = Math.ceil(ellArea(E.rx, E.ry, E.rz) * DENS);
    for (let j = 0; j < n; j++) {
      const ux = 1 - 2 * (j + 0.5) / n, rr = Math.sqrt(1 - ux * ux), ph = j * GOLDEN;
      const uy = rr * Math.cos(ph), uz = rr * Math.sin(ph);
      const s = 1 - E.tp * Math.max(0, ux);
      const lx = ux * E.rx, ly = uy * E.ry * s, lz = uz * E.rz * s;
      const nlx = ux / E.rx + (ux > 0 ? E.tp * rr * 0.6 / E.rx : 0), nly = uy / (E.ry * s), nlz = uz / (E.rz * s);
      const x = E.cx + lx * E.c - ly * E.s, y = E.cy + lx * E.s + ly * E.c, z = E.cz + lz;
      if (others) {
        let hid = false;
        for (let k = 0; k < others.length; k++) if (others[k] !== E && inside(others[k], x, y, z)) { hid = true; break; }
        if (hid) continue;
      }
      const nx = nlx * E.c - nly * E.s, ny = nlx * E.s + nly * E.c;
      emit(x, y, z, nx, ny, nlz);
    }
  }

  const sampleEll = (bone, E, region, f, others) =>
    sampleEllE(E, others, (x, y, z, nx, ny, nz) => addPt(bone, x, y, z, nx, ny, nz, region(x, y, z, nx, ny, nz), f, K_COAT, 0, 0));

  // Torso (body bone, origin at the body centre): deep chest, level back, slight tuck, round rump,
  // and a short thick neck flowing up from the chest and shoulders.
  const CHEST = shape(0.12, 0, 0, 0.21, 0.16, 0.14, 0, 0);
  const BELLY = shape(-0.04, 0.045, 0, 0.2, 0.11, 0.128, 0, 0);
  const RUMP = shape(-0.19, 0.03, 0, 0.16, 0.14, 0.135, 0, 0);
  const NECK = shape(0.27, 0.15, 0, 0.15, 0.125, 0.118, 0.95, 0);
  const TORSO = [CHEST, BELLY, RUMP, NECK];
  // Cream "urajiro" on the belly, chest and throat.
  const bodyRegion = (x, y, z, nx, ny) => (ny < -0.62 + jit() || (x > 0.2 + jit() && nx > 0.25 && y < 0.06 + jit())) ? P_CR : P_OR;
  const neckRegion = (x, y, z, nx, ny) => (nx - 0.75 * ny > 0.38 + jit() * 2) ? P_CR : P_OR;
  sampleEll(B_BODY, CHEST, bodyRegion, 1, TORSO);
  sampleEll(B_BODY, BELLY, bodyRegion, 1, TORSO);
  sampleEll(B_BODY, RUMP, bodyRegion, 1, TORSO);
  sampleEll(B_BODY, NECK, neckRegion, 1, TORSO);

  // Head (head bone, origin at the skull centre): rounded skull, fluffy cheeks, a defined stop and a
  // tapering muzzle with the black nose at its tip, pointing forward and a little down.
  const SKULL = shape(0, 0, 0, 0.105, 0.098, 0.098, 0, 0);
  const CHEEK = shape(0.03, -0.045, 0, 0.1, 0.072, 0.112, 0, 0);
  const MUZ = shape(0.13, -0.045, 0, 0.098, 0.05, 0.058, -0.08, 0.42);
  const NOSE = shape(0.222, -0.03, 0, 0.022, 0.019, 0.022, 0, 0);
  const HEADP = [SKULL, CHEEK, MUZ];
  const EXC = 0.052, EYC = 0.022, EW = 0.024, EH = 0.015;   // eye (head-local, on the side of the skull)
  // Mouth line: the smile rises toward the cheek; the gap under it opens toward the front.
  const lipY = x => -0.062 + (x < 0.17 ? 1.15 * (0.17 - x) * (0.17 - x) : 0);
  function headPoint(E, x, y, z, nx, ny, nz) {
    const zs = z < 0 ? -z : z, f = z < 0 ? 0.85 : 1;
    if (E === SKULL && zs > 0.04) {
      const cu = (x - EXC) / EW, cv = (y - EYC) / EH;
      if (Math.abs(cu) < 1.45 && Math.abs(cv + 0.3 * cu) < 1.9) { addPt(B_HEAD, x, y, z, nx, ny, nz, 1, f, K_EYE, cu, cv); return; }
    }
    if (E !== SKULL && zs > 0.02 && x > 0.035 && x < 0.225 && y > -0.11 && y < -0.02 && Math.abs(y - lipY(x)) < 0.04) {
      addPt(B_HEAD, x, y, z, nx, ny, nz, P_CR, f, K_MOUTH, x, y); return;
    }
    let cream;
    if (E === SKULL) {
      const bu = (x - 0.03) / 0.02, bv = (y - 0.056) / 0.012;          // cream "eyebrow" dot
      cream = (zs > 0.04 && bu * bu + bv * bv < 1) || y < -0.06 + jit() * 0.5;
    } else if (E === CHEEK) cream = y < -0.022 + jit() * 0.4 || x > 0.1;
    else cream = y < -0.03 + jit() * 0.25 || x > 0.2;                    // ginger bridge on the muzzle
    addPt(B_HEAD, x, y, z, nx, ny, nz, cream ? P_CR : P_OR_L, f, K_COAT, 0, 0);
  }
  sampleEllE(SKULL, HEADP, (x, y, z, nx, ny, nz) => headPoint(SKULL, x, y, z, nx, ny, nz));
  sampleEllE(CHEEK, HEADP, (x, y, z, nx, ny, nz) => headPoint(CHEEK, x, y, z, nx, ny, nz));
  sampleEllE(MUZ, HEADP, (x, y, z, nx, ny, nz) => headPoint(MUZ, x, y, z, nx, ny, nz));
  sampleEllE(NOSE, null, (x, y, z, nx, ny, nz) => addPt(B_HEAD, x, y, z, nx, ny, nz, P_NOSE, 1, K_NOSE, 0, 0));
  // Catchlight: upper front of each eye, just above the skull surface (head-local).
  const CATCH = new Float32Array(6);
  for (let e = 0; e < 2; e++) {
    const cx = EXC + 0.3 * EW, cy = EYC + 0.4 * EH;
    CATCH[e * 3] = cx; CATCH[e * 3 + 1] = cy;
    CATCH[e * 3 + 2] = (e ? -1 : 1) * (SKULL.rz * Math.sqrt(1 - (cx / SKULL.rx) ** 2 - (cy / SKULL.ry) ** 2) + 0.004);
  }

  // Ears: small erect triangles tilted a little back, cupped in front (pink inside, cream fluff).
  const EAR_O = new Float32Array(6);
  [1, -1].forEach((sd, e) => {
    const bx = -0.025 + (sd < 0 ? 0.02 : 0), by = 0.07, bz = sd * 0.06;
    const tx = -0.05 + (sd < 0 ? 0.02 : 0), ty = 0.18, tz = sd * 0.095;
    EAR_O[e * 3] = bx; EAR_O[e * 3 + 1] = by; EAR_O[e * 3 + 2] = bz;
    let dx = tx - bx, dy = ty - by, dz = tz - bz;
    const h = Math.hypot(dx, dy, dz); dx /= h; dy /= h; dz /= h;
    let n0x = 1, n0z = sd * 0.45;
    const n0l = Math.hypot(n0x, n0z); n0x /= n0l; n0z /= n0l;
    let axx = dy * n0z, axy = -dx * n0z, axz = -dy * n0x;   // A = D x N0 (N0 has no y)
    axy = dz * n0x - dx * n0z;
    const al = Math.hypot(axx, axy, axz); axx /= al; axy /= al; axz /= al;
    const fx = axy * dz - axz * dy, fy = axz * dx - axx * dz, fz = axx * dy - axy * dx; // Nf = A x D
    const f = sd > 0 ? 1 : 0.8, bone = B_EAR + e, hw = 0.05;
    const n = Math.round(h * hw * DENS * 1.4);
    for (let i = 0; i < n * 2 + 200; i++) {
      const u = 1 - Math.sqrt(jr()), v = jr() * 2 - 1, w = Math.pow(1 - u, 0.85) * (1 + 0.12 * Math.sin(Math.PI * u));
      const off = v * hw * w;
      let x = bx + dx * h * u + axx * off, y = by + dy * h * u + axy * off, z = bz + dz * h * u + axz * off;
      const bulge = (1 - v * v) * (1 - u);
      let k = K_COAT, a1 = 0, nx, ny, nz;
      if (i >= n * 2) {               // rim along both edges
        const sv = v < 0 ? -1 : 1;
        x = bx + dx * h * u + axx * sv * hw * w; y = by + dy * h * u + axy * sv * hw * w; z = bz + dz * h * u + axz * sv * hw * w;
        x -= fx * 0.006; y -= fy * 0.006; z -= fz * 0.006;
        nx = axx * sv + fx * 0.2; ny = axy * sv + fy * 0.2; nz = axz * sv + fz * 0.2;
      } else if (i & 1) {             // front: cupped
        const d = 0.005 - 0.014 * bulge;
        x += fx * d; y += fy * d; z += fz * d;
        nx = fx + axx * v * 0.5; ny = fy + axy * v * 0.5; nz = fz + axz * v * 0.5;
        if (Math.abs(v) < 0.8 && u < 0.84) { k = K_EARIN; a1 = Math.abs(v) / 0.8 + jit(); }
      } else {                        // back: convex
        const d = -0.01 - 0.01 * bulge;
        x += fx * d; y += fy * d; z += fz * d;
        nx = -fx + axx * v * 0.5; ny = -fy + axy * v * 0.5; nz = -fz + axz * v * 0.5;
      }
      if (inside(SKULL, x, y, z)) continue;
      addPt(bone, x - bx, y - by, z - bz, nx, ny, nz, P_OR, f, k, a1, 0);
    }
  });

  // Tongue: pink, hanging out of the open mouth on the near side (flaps with the stride).
  const TONGUE_O = [0.13, -0.07, 0.03];
  sampleEllE(shape(0.0, -0.03, 0.01, 0.022, 0.034, 0.012, -0.35, 0), null,
    (x, y, z, nx, ny, nz) => addPt(B_TONGUE, x, y, z, nx, ny, nz, P_TONGUE, 1, K_TONGUE, z / 0.012, 0));

  // Tail: thick and fluffy, curled into a ring lying on top of the rump; ginger outside,
  // cream on the inside of the curl. Tail-local origin = the root at the top back of the rump.
  (function sampleTail() {
    const CX = 0.04, CY = 0.095, R0 = Math.hypot(CX, CY), R1 = 0.05;
    const TH0 = Math.atan2(-CY, -CX) + TAU, SWEEP = 5.2;
    const ns = Math.ceil(R0 * SWEEP / SPACING * 1.4);
    for (let i = 0; i < ns; i++) {
      const s = (i + 0.5) / ns, th = TH0 - SWEEP * s, Rc = R0 + (R1 - R0) * s;
      const ox = Math.cos(th), oy = Math.sin(th);
      let r = 0.058 * (1 - 0.35 * s) * (1 + 0.2 * Math.sin(Math.PI * s));
      if (s > 0.9) r *= Math.sqrt(Math.max(0.02, 1 - ((s - 0.9) / 0.1) ** 2));
      const px = CX + Rc * ox, py = CY + Rc * oy, pz = 0.02;
      const na = Math.max(8, Math.ceil(TAU * r / SPACING * 1.4));
      for (let j = 0; j < na; j++) {
        const a = (j + (i & 1) * 0.5) / na * TAU, ca = Math.cos(a), sa = Math.sin(a);
        const nx = ca * ox, ny = ca * oy, nz = sa;
        const x = px + r * nx, y = py + r * ny, z = pz + r * nz;
        let hid = false;
        for (let q = 0; q < 3 && !hid; q++) if (inside(TORSO[q], x + TAIL_AT[0], y + TAIL_AT[1], z)) hid = true;
        if (hid) continue;
        addPt(B_TAIL, x, y, z, nx, ny, nz, ca < -0.25 + jit() ? P_CR : P_OR, 1, K_COAT, 0, 0);
      }
    }
  })();

  // Legs: thick shoulder / thigh masses, then tapering segments hanging along -y from each joint,
  // and a round paw. Cream on the inner/back side and the lower legs; far legs darker.
  function legRegion(front, s, y, nx, L) {
    const u = -y / L, j = jit();
    if (front) {
      if (s === 0) return nx < -0.55 + j ? P_CR : P_OR;
      if (s === 1) return (nx < -0.2 + j || u > 0.6 + j) ? P_CR : P_OR;
      return P_CR;
    }
    if (s === 0) return (nx < -0.6 + j && u > 0.4) ? P_CR : P_OR;
    if (s === 1) return nx < -0.15 + j ? P_CR : P_OR;
    return P_CR;
  }
  for (let l = 0; l < 4; l++) {
    const front = l < 2, far = (l & 1) === 1, f = far ? 0.62 : 1;
    const Ls = front ? FRONT_L : HIND_L, R0 = front ? FRONT_R0 : HIND_R0, R1 = front ? FRONT_R1 : HIND_R1;
    const b0 = B_LEG + l * 4;
    // shoulder / thigh mass on the upper segment
    sampleEll(b0, front ? shape(0.0, -0.03, 0, 0.062, 0.085, 0.055, 0, 0) : shape(0.012, -0.055, 0, 0.082, 0.1, 0.062, 0, 0),
              (x, y, z, nx) => (front ? P_OR : (nx < -0.6 + jit() && y < -0.09 ? P_CR : P_OR)), f, null);
    for (let s = 0; s < 3; s++) {
      const L = Ls[s], r0 = R0[s], r1 = R1[s];
      const E = shape(0, -L / 2, 0, L / 2 + r1 * 0.7, r0, r0 * 0.86, -Math.PI / 2, 1 - r1 / r0);
      sampleEll(b0 + s, E, (x, y, z, nx) => legRegion(front, s, y, nx, L), f, null);
      if (s > 0) sampleEll(b0 + s, shape(0, 0, 0, r0 * 1.05, r0 * 1.05, r0 * 0.9, 0, 0),
                           (x, y, z, nx) => legRegion(front, s, -0.5 * L, nx, L), f, null);
    }
    sampleEll(b0 + 3, shape(0.02, -0.004, 0, 0.05, 0.03, 0.042, 0, 0), () => P_CR, f, null);
  }

  const NP = MB.x.length;
  const PX = Float32Array.from(MB.x), PY = Float32Array.from(MB.y), PZ = Float32Array.from(MB.z);
  const NX = Float32Array.from(MB.nx), NY = Float32Array.from(MB.ny), NZ = Float32Array.from(MB.nz);
  const PB = Uint8Array.from(MB.b), PP = Uint16Array.from(MB.p), PF = Float32Array.from(MB.f);
  const PK = Uint8Array.from(MB.k), A1 = Float32Array.from(MB.a1), A2 = Float32Array.from(MB.a2);
  const FJ = new Float32Array(NP);
  for (let i = 0; i < NP; i++) FJ[i] = (jr() - 0.5) * 0.14;   // fur texture
  const BO = new Float32Array(NB * 5); // per bone: ox, oy, oz, cos, sin

  // ---------- Canvas, grid, layout ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, fs = 10, cw = 6, ch = 11, cols = 0, rows = 0, portrait = false;
  let S = 300, ox = 0, oy = 0, horizonRow = 0, horizonY = 0, groundY = 0, mref = 400;
  let sunX = 0, sunY = 0, sunR = 40, sunGR = 100;
  let cellFont = '', bfFont = '', bfW = 10, bgGrad = null, sunGrad = null;
  let zbuf, stampA, cchar, ccol, ckind, touched, order, nT = 0, stamp = 0;
  const counts = new Uint32Array(NCOLOR);
  let hillTop, treeTop, sunCol, nRun = 0, runs = new Int32Array(0);
  let skyC, skyCh, skyCol, skyTw, nSky = 0;
  let bmin = 0, bmax = 0, rmin = 0, rmax = 0;
  let needResize = true, dirty = true;

  // Clouds: [x, row, half-width px, half-height px, speed px/s] each.
  const NCLOUD = 5, CLOUD = new Float32Array(NCLOUD * 5);
  let nCloud = 0;

  function resize() {
    needResize = false;
    W = canvas.clientWidth || innerWidth;
    H = canvas.clientHeight || innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fs = clamp(Math.round(Math.min(W, H * 0.8) / 80), 7, 14);
    cellFont = `${fs}px ${MONO}`;
    ctx.font = cellFont;
    cw = ctx.measureText('M').width || fs * 0.6;
    ch = fs * 1.1;
    cols = Math.ceil(W / cw);
    rows = Math.ceil(H / ch);
    const n = cols * rows;
    zbuf = new Float32Array(n); stampA = new Uint32Array(n);
    cchar = new Uint8Array(n); ccol = new Uint16Array(n); ckind = new Uint8Array(n);
    touched = new Int32Array(n); order = new Int32Array(n); stamp = 0;
    hillTop = new Int16Array(cols); treeTop = new Int16Array(cols); sunCol = new Float32Array(cols);
    runs = new Int32Array(rows * 3 * 8);

    // Layout: horizon ~55% (portrait) / 60%, dog's ground line lower, dog ~40% from the left.
    portrait = H > W * 1.1;
    horizonRow = Math.round(H * (portrait ? 0.55 : 0.6) / ch);
    horizonY = horizonRow * ch;
    groundY = H * (portrait ? 0.79 : 0.86);
    S = portrait ? Math.min(W * 0.66, H * 0.32) : Math.min(W * 0.38, H * 0.55);
    ox = W * (portrait ? 0.46 : 0.4) - 0.12 * S;
    oy = groundY - PIVOT * ct * S;
    mref = Math.max(Math.min(W, H), H * 0.6);

    bfFont = `700 ${Math.round(fs * 2)}px ${MONO}`;
    ctx.font = bfFont;
    bfW = ctx.measureText('}{').width;

    sunX = W * (portrait ? 0.76 : 0.72);
    sunR = portrait ? W * 0.15 : Math.min(W * 0.1, H * 0.12);
    sunY = horizonY - sunR * 0.45;
    sunGR = sunR * 3.6;

    const hf = horizonY / H;
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#170c33');
    bgGrad.addColorStop(hf * 0.42, '#3c1856');
    bgGrad.addColorStop(hf * 0.75, '#86305c');
    bgGrad.addColorStop(hf * 0.999, '#d8683e');
    bgGrad.addColorStop(Math.min(1, hf + 0.001), '#5a6a2a');
    bgGrad.addColorStop(Math.min(1, hf + (1 - hf) * 0.4), '#2c4a20');
    bgGrad.addColorStop(1, '#152a14');
    sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunGR);
    sunGrad.addColorStop(0, 'rgba(255,214,140,0.75)');
    sunGrad.addColorStop(0.25, 'rgba(255,170,100,0.38)');
    sunGrad.addColorStop(0.6, 'rgba(255,120,110,0.12)');
    sunGrad.addColorStop(1, 'rgba(255,110,110,0)');
    for (let c = 0; c < cols; c++) {
      const dx = ((c + 0.5) * cw - sunX) / (W * 0.3);
      sunCol[c] = Math.exp(-dx * dx);
    }

    buildSky();
    const r = mulberry32(31);
    nCloud = portrait ? 3 : NCLOUD;
    for (let i = 0; i < nCloud; i++) seedCloud(i, r, (i + 0.15 + 0.5 * r()) / nCloud * W);
    makeHalo();
    pose(1);
    for (let l = 0; l < 4; l++) lastP[l] = legP[l];
    dirty = true;
  }

  function seedCloud(i, r, x) {
    const o = i * 5;
    const hw = (portrait ? 0.16 : 0.07) * W * (0.7 + 0.6 * r());
    CLOUD[o] = x;
    CLOUD[o + 1] = Math.round(horizonRow * (0.12 + 0.5 * r()));
    CLOUD[o + 2] = hw;
    CLOUD[o + 3] = Math.max(ch * 2.2, hw * (0.16 + 0.08 * r()));
    CLOUD[o + 4] = (reduced ? 2 : 6) + (reduced ? 2 : 8) * r();
  }

  // Static sky: gradient characters (streaky near the horizon), a few stars, and the big sun.
  function buildSky() {
    const c0 = [], h0 = [], k0 = [], t0 = [];
    const r = mulberry32(7);
    for (let row = 0; row < horizonRow; row++) {
      const yf = (row + 0.5) / horizonRow;
      const pIdx = SKY_P[Math.min(SKY_N - 1, (yf * SKY_N) | 0)];
      const dens = 0.16 + 0.42 * Math.pow(yf, 1.6);
      for (let c = 0; c < cols; c++) {
        const x = (c + 0.5) * cw, y = (row + 0.5) * ch;
        const dx = x - sunX, dy = y - sunY, d = Math.hypot(dx, dy) / sunR;
        const q = r(), q2 = r();
        if (d < 1) {
          const ring = d < 0.6 ? 0 : d < 0.78 ? 1 : d < 0.92 ? 2 : 3;
          c0.push(row * cols + c); h0.push([C_AT, C_O, C_o, C_COLON][ring]);
          k0.push(P_SUN[ring] * LEVELS + [15, 14, 13, 12][ring]); t0.push(0);
          continue;
        }
        if (d < 2.1) {
          const g = (2.1 - d) / 1.1;
          if (q < 0.25 + 0.6 * g) {
            c0.push(row * cols + c); h0.push(g > 0.55 ? C_COLON : C_DOT);
            k0.push(P_SUN[3] * LEVELS + lvl(0.45 + 0.4 * g)); t0.push(0);
          }
          continue;
        }
        if (yf < 0.26 && q < 0.022) {
          c0.push(row * cols + c); h0.push(q2 < 0.75 ? C_DOT : C_PLUS);
          k0.push(P_STAR * LEVELS + 8); t0.push(1 + ((q2 * 250) | 0));
          continue;
        }
        // Horizontal streaks: density rises and falls in bands, like layered sunset cloud.
        const band = 0.55 + 0.45 * Math.sin(row * 0.9 + Math.sin(c * 0.045 + row) * 1.4);
        if (q > dens * (0.5 + 0.7 * band)) continue;
        let chr;
        if (yf < 0.4) chr = q2 < 0.75 ? C_DOT : C_COLON;
        else if (yf < 0.75) chr = q2 < 0.45 ? C_DOT : q2 < 0.8 ? C_COLON : C_DASH;
        else chr = q2 < 0.35 ? C_DASH : q2 < 0.65 ? C_TILDE : q2 < 0.85 ? C_COLON : C_EQ;
        c0.push(row * cols + c); h0.push(chr);
        k0.push(pIdx * LEVELS + lvl(0.32 + 0.22 * band + 0.18 * yf + 0.1 * q2)); t0.push(0);
      }
    }
    nSky = c0.length;
    skyC = Int32Array.from(c0); skyCh = Uint8Array.from(h0); skyCol = Uint16Array.from(k0); skyTw = Uint8Array.from(t0);
  }

  // ---------- Cell buffer ----------
  function putc(c, chr, col) {
    if (stampA[c] !== stamp) { stampA[c] = stamp; touched[nT++] = c; }
    zbuf[c] = -1e9; cchar[c] = chr; ccol[c] = col; ckind[c] = 0;
  }
  const put = (c, chr, p, b) => putc(c, chr, p * LEVELS + lvl(b));
  function putXY(x, y, chr, p, b) {
    if (x < 0 || y < 0) return;
    const col = (x / cw) | 0, row = (y / ch) | 0;
    if (col >= cols || row >= rows) return;
    put(row * cols + col, chr, p, b);
  }

  // ---------- State ----------
  let t = 0, skyT = 0, gph = 0, worldU = 0, dist = 0, jumps = 0, jt = -1, yGround = 0, letters = 0;
  const legP = new Float32Array(4), lastP = new Float32Array(4), pawX = new Float32Array(4);
  let headSX = 0, headSY = 0, shadowX = 0, liftNow = 0;
  let eyeOpen = 1, happy = 0, mouthOpen = 0;
  let projX = 0, projY = 0;

  function project(x, y, z) {
    const rx = x * cyw + z * syw, rz = z * cyw - x * syw, yy = y - PIVOT;
    const y2 = yy * ct - rz * st, z2 = yy * st + rz * ct;
    const f = CAM_D / (CAM_D - z2);
    projX = ox + rx * S * f; projY = oy - y2 * S * f;
  }

  function setBone(b, x, y, z, a) {
    const o = b * 5;
    BO[o] = x; BO[o + 1] = y; BO[o + 2] = z; BO[o + 3] = Math.cos(a); BO[o + 4] = Math.sin(a);
  }

  // Pose every bone for the current stride phase and jump.
  function pose(dt) {
    let w = 0, u = 0, jy = 0;
    if (jt >= 0) { u = jt / JUMP_DUR; w = Math.sin(Math.PI * u); jy = JUMP_H * 4 * u * (1 - u); }
    const fr = gph - Math.floor(gph);
    let pb = GAIT.pitch * Math.sin(TAU * (fr + 0.15));
    pb += (0.22 * Math.cos(Math.PI * u) - pb) * w;    // leap: nose up on take-off, down to land
    const cb = Math.cos(pb), sb = Math.sin(pb);
    setBone(B_BODY, 0, BODY_Y, 0, pb);

    let minY = 9, any = false;
    for (let l = 0; l < 4; l++) {
      const front = l < 2;
      let p = gph - GAIT.off[l]; p -= Math.floor(p);
      legP[l] = p;
      let a, fl;
      const ds = GAIT.ds;
      if (p < ds) { a = 1 - 2 * p / ds; fl = 0; }
      else { const v = (p - ds) / (1 - ds); a = -Math.cos(Math.PI * v); fl = Math.sin(Math.PI * v) * GAIT.fx; }
      let s0, s1, s2, sp;
      if (front) {
        // front: elbow folds the forearm back under the chest in swing, reaches forward to land
        s0 = -0.5 + GAIT.af * a; s1 = 0.5 - 1.5 * fl; s2 = 0.15 + 0.45 * fl; sp = -0.7 * fl;
        s0 += (0.95 - s0) * w; s1 += (0.05 - s1) * w; s2 += (0.1 - s2) * w; sp += (-0.2 - sp) * w;
      } else {
        // hind: stifle and hock fold the paw up under the belly in swing, stretch back on push-off
        s0 = 0.55 + GAIT.ah * a; s1 = -1.25 - 0.65 * fl; s2 = 0.8 + 0.85 * fl; sp = -0.6 * fl;
        s0 += (-0.35 - s0) * w; s1 += (-0.45 - s1) * w; s2 += (0.45 - s2) * w; sp += (-0.6 - sp) * w;
      }
      const rt = front ? FRONT_ROOT : HIND_ROOT, rx = rt[0], ry = rt[1], rz = (l & 1) ? -LEG_Z : LEG_Z;
      let jx = rx * cb - ry * sb, jyy = BODY_Y + rx * sb + ry * cb;
      const Ls = front ? FRONT_L : HIND_L, b0 = B_LEG + l * 4;
      let ang = pb + s0;
      setBone(b0, jx, jyy, rz, ang); jx += Math.sin(ang) * Ls[0]; jyy -= Math.cos(ang) * Ls[0];
      ang += s1;
      setBone(b0 + 1, jx, jyy, rz, ang); jx += Math.sin(ang) * Ls[1]; jyy -= Math.cos(ang) * Ls[1];
      ang += s2;
      setBone(b0 + 2, jx, jyy, rz, ang); jx += Math.sin(ang) * Ls[2]; jyy -= Math.cos(ang) * Ls[2];
      setBone(b0 + 3, jx, jyy, rz, sp);
      pawX[l] = jx;
      if (p < ds && jyy - PAW_DROP < minY) { minY = jyy - PAW_DROP; any = true; }
    }
    // Keep a planted paw on the ground; add a little lift in the gallop's suspension phase.
    if (jt < 0) {
      const target = any ? -minY : yGround + GAIT.bob;
      yGround += (target - yGround) * Math.min(1, dt * 22);
    }
    const yo = yGround + jy;
    liftNow = jy;

    // Head stays steady (counter-pitches the body); ears flop back a little; mouth open, tongue out.
    const hx = HEAD_AT[0] * cb - HEAD_AT[1] * sb, hy = BODY_Y + HEAD_AT[0] * sb + HEAD_AT[1] * cb;
    const hA = -0.7 * pb - 0.08 + 0.035 * Math.sin(TAU * (fr + 0.35)) * (1 - w) + 0.06 * w;
    const ch2 = Math.cos(hA), sh2 = Math.sin(hA);
    setBone(B_HEAD, hx, hy, 0, hA);
    const earBack = (reduced ? 0.03 : 0.08) + 0.07 * Math.sin(TAU * fr * 2 + 0.8) + 0.25 * w;
    for (let k = 0; k < 2; k++) {
      const ex = EAR_O[k * 3], ey = EAR_O[k * 3 + 1];
      setBone(B_EAR + k, hx + ex * ch2 - ey * sh2, hy + ex * sh2 + ey * ch2, EAR_O[k * 3 + 2], hA + earBack);
    }
    setBone(B_TONGUE, hx + TONGUE_O[0] * ch2 - TONGUE_O[1] * sh2, hy + TONGUE_O[0] * sh2 + TONGUE_O[1] * ch2, TONGUE_O[2],
            hA + 0.25 * Math.sin(TAU * fr * 2 + 1.5) - 0.3 * w);
    // Face: panting "w" mouth, ^ ^ eyes in the air, the odd blink.
    happy = w;
    mouthOpen = (reduced ? 0.5 : 0.62) + 0.3 * Math.sin(TAU * fr * 2);
    const bt = t % 4.3;
    eyeOpen = bt > 4.1 ? 1 - Math.sin(Math.PI * (bt - 4.1) / 0.2) : 1;
    const tx = TAIL_AT[0] * cb - TAIL_AT[1] * sb, ty = BODY_Y + TAIL_AT[0] * sb + TAIL_AT[1] * cb;
    setBone(B_TAIL, tx, ty, 0, pb + 0.09 * Math.sin(TAU * fr + 2.2) - 0.1 * w);

    for (let b = 0; b < NB; b++) BO[b * 5 + 1] += yo;
    project(hx + 0.15 * ch2, hy + yo + 0.15 * sh2, 0);
    headSX = projX; headSY = projY;
    project(0.02, 0, 0);
    shadowX = projX;
  }

  // ---------- Dog splat (z-buffered, lit, coloured by region) ----------
  function splatDog() {
    bmin = cols; bmax = -1; rmin = rows; rmax = -1;
    for (let i = 0; i < NP; i++) {
      const o = PB[i] * 5, bc = BO[o + 3], bs = BO[o + 4];
      const lx = PX[i], ly = PY[i];
      const x = BO[o] + lx * bc - ly * bs, y = BO[o + 1] + lx * bs + ly * bc, z = BO[o + 2] + PZ[i];
      const rx = x * cyw + z * syw, rz = z * cyw - x * syw, yy = y - PIVOT;
      const y2 = yy * ct - rz * st;
      const z2 = yy * st + rz * ct;
      const f = CAM_D / (CAM_D - z2);
      const px = ox + rx * S * f, py = oy - y2 * S * f;
      if (px < 0 || py < 0) continue;
      const col = (px / cw) | 0, row = (py / ch) | 0;
      if (col >= cols || row >= rows) continue;
      const c = row * cols + col;
      const fresh = stampA[c] !== stamp;
      if (!fresh && zbuf[c] >= z2 + 0.035) continue; // cannot win even with the feature bias

      const k = PK[i];
      let p = PP[i];
      const nxl = NX[i], nyl = NY[i], nz = NZ[i];
      const nx = nxl * bc - nyl * bs, ny = nxl * bs + nyl * bc;
      const rnx = nx * cyw + nz * syw, rnz = nz * cyw - nx * syw;
      const ny2 = ny * ct - rnz * st, nz2 = ny * st + rnz * ct;
      let lam = rnx * LX + ny2 * LY + nz2 * LZ;
      const lam2 = lam < 0 ? -lam : lam;
      if (lam < 0) lam = 0;
      let dd = (z2 + 0.6) / 1.2;
      dd = 0.62 + 0.38 * (dd < 0 ? 0 : dd > 1 ? 1 : dd);
      const rim = nz2 < 0.35 ? (0.35 - (nz2 < 0 ? 0 : nz2)) * 0.35 : 0;   // warm rim glow on silhouettes

      let b = 0, cc = 0, feat = 0, coat = false;
      switch (k) {
        case K_EYE: {
          const sd = p ? -1 : 1, cu = A1[i], cv = A2[i], eu = cu * sd, ev = cv - 0.3 * eu;
          coat = true; p = P_OR_L;
          if (happy > 0.35) {                       // ^ ^ happy eyes while leaping
            const arc = 0.9 * (1 - Math.abs(cu)) - 0.35;
            if (Math.abs(cu) < 1.2 && Math.abs(cv - arc) < 0.42) {
              coat = false; feat = 1; p = P_MOUTH; b = 0.8;
              cc = cu < -0.3 ? C_SL : cu > 0.3 ? C_BS : C_CARET;
            }
          } else if (eyeOpen < 0.22) {              // closed: a lid line
            if (Math.abs(eu) < 1.05 && Math.abs(ev + 0.15) < 0.3) {
              coat = false; feat = 1; p = P_EYE; b = 0.24; cc = C_DASH;
            }
          } else if (Math.abs(eu) < 1) {

  }

  function updateHud(now) {
    const tail = paused ? 'paused' : `${fps} fps`;
    const head = `distance ${Math.floor(dist).toLocaleString('en-US')} m  jumps ${jumps}  `;
    // Narrow screens drop the letter count so nothing is clipped.
    hudEl.textContent = W < 640 ? head + tail : head + `letters ${letters.toLocaleString('en-US')}  ${tail}`;
    hudT = now;
  }

  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) resize();
    if (!paused) update(dt);
    if (!paused || dirty) { render(); dirty = false; frames++; }
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); music(paused ? 'pause' : 'resume'); }
  function replay() {
    t = 0; skyT = 0; gph = 0; worldU = 0; dist = 0; jumps = 0; jt = -1; nDust = 0;
    bfState = 0; bfT = BF_FIRST; paused = false; dirty = true;
    pose(1);
    for (let l = 0; l < 4; l++) lastP[l] = legP[l];
    music('resume'); music('restart');
  }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (paused) togglePause(); jump(); }
  });
  // A tap jumps right away (and resumes if paused); a second tap within 280 ms restarts instead.
  let tapTimer = 0;
  canvas.addEventListener('pointerup', e => {
    if (e.button > 0) return;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = 0; replay(); return; }
    tapTimer = setTimeout(() => { tapTimer = 0; }, 280);
    if (paused) togglePause();
    jump();
  });

  // Hint language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';
  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '點擊跳躍 · 雙擊重新開始' : 'tap to jump · double-tap to restart')
                             : (zh ? '點擊跳躍 · 空白鍵暫停 · R 重新開始 · M 音樂' : 'tap to jump · Space pause · R restart · M music');


  // Score: an original sunny gallop in D major, 132 bpm, 16-bar (64-beat) loop. Plucked lead,
  // glockenspiel counter line, driving octave bass, kick / snare / hat groove and a soft pad.
  if (window.AsciiAudio) AsciiAudio.init({
    bpm: 132, master: 0.78, reverb: 0.18, reverbTime: 1.8,
    build(a) {
      const N = AsciiAudio.notes, LOOP = 64;
      const tune = N(
        'F#5:.5 A5 D6:1 A5:.5 F#5 A5:1 | E5:.5 A5 C#6:1 B5:.5 A5 E5:1 | ' +
        'F#5:.5 B5 D6:1 C#6:.5 B5 F#5:1 | G5:.5 A5 B5 G5 A5:2 | ' +
        'F#5:.5 A5 D6:1 E6:.5 D6 C#6 B5 | A5:1 E5:.5 F#5 G5:1 E5 | ' +
        'B5:.5 A5 G5 F#5 E5:1 G5 | E5:1 C#5 D5:2 | ' +
        'B5:.5 B5 D6:1 B5:.5 A5 G5:1 | C#6:.5 C#6 E6:1 C#6:.5 B5 A5:1 | ' +
        'A5:.5 F#5 A5 C#6 E6:1 C#6 | D6:.5 C#6 B5 A5 B5:2 | ' +
        'G5:.5 B5 D6:1 E6:.5 D6 B5:1 | A5:.5 C#6 E6:1 F#6 E6 | ' +
        'D6:.5 C#6 B5 A5 G5 A5 B5 C#6 | D6:2 r:2');
      a.part(tune, (t, e) => a.pluck(t, e.note, Math.max(0.25, e.sec * 1.2), { vel: 0.5, pan: 0.1 }), { length: LOOP });

      // One chord per half bar (2 beats), 32 slots per loop.
      const CH = { D: ['D', 'F#', 'A'], A: ['A', 'C#', 'E'], Bm: ['B', 'D', 'F#'], G: ['G', 'B', 'D'], 'F#m': ['F#', 'A', 'C#'] };
      const PROG = ('D D A A Bm Bm G G D D A A G G A D ' +
                    'G G A A F#m F#m Bm Bm G G A A G A D D').split(' ');
      const chordAt = beat => CH[PROG[Math.floor((beat % LOOP) / 2)]];

      // Glockenspiel counter line: syncopated chord tones up high, answering the lead.
      const GL = [null, null, 2, 1, null, 2, null, 0];
      a.every(0.5, (t, s) => {
        const k = GL[s % 8];
        if (k == null || (s * 0.5) % LOOP >= LOOP - 2) return;
        const c = chordAt(s * 0.5);
        a.bell(t, c[k] + (k === 0 ? '7' : '6'), 0.7, { vel: 0.16, pan: -0.35, wet: 0.3 });
      });
      // Driving octave bass in 8ths and a soft pad on each chord.
      a.every(0.5, (t, s) => {
        const c = chordAt(s * 0.5);
        a.bass(t, c[0] + (s % 4 === 3 ? '3' : '2'), a.beats(0.4), { vel: s % 2 ? 0.34 : 0.46 });
      });
      a.every(2, (t, s) => {
        const c = chordAt(s * 2);
        a.pad(t, [c[0] + '4', c[1] + '4', c[2] + '4'], a.beats(1.7), { vel: 0.22, attack: 0.08, release: 0.3, cutoff: 1500 });
      });
      // Drums: four-on-the-floor kick, backbeat snare, open 8th hats; a snare fill into the loop.
      a.every(1, (t, s) => {
        const b = s % LOOP;
        a.kick(t, b % 4 === 0 ? 0.6 : 0.5);
        if (b % 2 === 1 && b < LOOP - 2) a.snare(t, 0.36);
      });
      a.every(0.5, (t, s) => {
        const b = (s * 0.5) % LOOP;
        a.hat(t, s % 2 ? 0.34 : 0.16, { pan: 0.25 });
        if (b >= LOOP - 2) a.snare(t, 0.16 + 0.07 * (b - (LOOP - 2)) * 2);
      });

      // Sound effects in sync with the animation.
      const yip = t => {   // a short bright "yip": a quick rising-then-falling chirp
        const c = a.ctx, g = c.createGain(), o = c.createOscillator();
        g.connect(a._out({ bus: 'sfx', pan: 0.15 }, 0.12));
        o.type = 'triangle';
        o.frequency.setValueAtTime(820, t);
        o.frequency.exponentialRampToValueAtTime(1480, t + 0.04);
        o.frequency.exponentialRampToValueAtTime(1050, t + 0.13);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.14, t + 0.01);
        g.gain.setTargetAtTime(0, t + 0.07, 0.03);
        o.connect(g); o.start(t); o.stop(t + 0.3);
      };
      a.on('jump', (a, d, t) => {
        a.boing(t, { freq: 240, vel: 0.6 });
        a.whoosh(t, { dur: 0.45, vel: 0.36, freq: 500, freqEnd: 2600 });
        yip(t + 0.03);
      }, { gap: 0.3 });
      a.on('land', (a, d, t) => {
        a.thud(t, { vel: 0.45, freq: 115 });
        a.noise(t, { dur: 0.22, filter: 'lowpass', freq: 900, freqEnd: 300, vel: 0.14, bus: 'sfx', wet: 0.08 });
      }, { gap: 0.3 });
      a.on('step', (a, d, t) => a.noise(t, { dur: 0.035, filter: 'bandpass', freq: 900 + 500 * Math.random(), q: 1.4,
        vel: 0.12, bus: 'sfx', wet: 0, pan: d.l & 1 ? -0.2 : 0.2 }), { gap: 0.07 });
      const SP = AsciiAudio.scale('D6', 'pentatonic', 10);
      a.on('butterfly', (a, d, t) => {
        a.sparkle(t, { count: 5, spread: 0.07, vel: 0.13, notes: SP });
        for (let i = 0; i < 8; i++)   // fluttering wings: soft airy ticks
          a.noise(t + i * 0.045, { dur: 0.03, filter: 'highpass', freq: 4500, vel: 0.06 * (1 - i / 10), bus: 'sfx', wet: 0.2 });
      });
    }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
