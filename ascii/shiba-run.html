<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASCII Running Shiba | Alex Li (李翔緯)</title>
  <meta name="description" content="A cute Shiba Inu gallops through a sunset meadow, drawn entirely with ASCII characters: a big low sun, parallax hills, trees and swaying grass, drifting clouds, dust puffs and a butterfly to chase. Tap to jump. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#1a0f2e">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #1a0f2e;
      --sky: #140b26;
      --text: #f3eaf6;
      --muted: #d9c6d8;
      --accent: #3b82f6;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: manipulation; /* no double-tap zoom: double-tap means restart */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.12);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(59, 130, 246, 0.28);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.8;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
      .hint { bottom: 30px; } /* stack above the HUD on narrow screens */
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ASCII Running Shiba</h1>
  <a class="back" href="./">← ASCII</a>
  <canvas id="c" role="img" aria-label="Animated cute Shiba Inu drawn with ASCII characters, bouncing along through a sunset meadow with parallax hills, trees, swaying grass and drifting clouds, and jumping after a butterfly"></canvas>
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>

<script src="ascii-audio.js"></script>
<script>
(() => {
  'use strict';

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';

  // ---------- Gait: a happy puppy bound (front pair, then hind pair) with bob, squash and stretch ----------
  // Leg order: front far, front near, hind far, hind near (far = the dog's left, away from the camera).
  const GAIT = reduced
    ? { f: 1.3, amp: 0.3, lift: 0.025, bob: 0.012, sq: 0.012, pitch: 0.02, speed: 0.5, mps: 1.6 }
    : { f: 2.6, amp: 0.55, lift: 0.06, bob: 0.045, sq: 0.045, pitch: 0.06, speed: 1.3, mps: 4.6 };
  const LEG_OFF = [0.07, 0, 0.57, 0.5];
  const JUMP_DUR = 0.8, JUMP_H = 0.27;          // seconds, body units
  const BF_FIRST = 4.0, BF_MIN = 8, BF_MAX = 12; // butterfly schedule (s)

  // ---------- Camera: a 3/4 view from the front-right (the dog runs to the right), looking a little down ----------
  const CAM_D = 4.2, PIVOT = 0.5, TILT = 0.14, YAW = 0.72;
  // Warm light from the low sun ahead (upper right, in front), in view space.
  const LX0 = 0.32, LY0 = 0.55, LZ0 = 0.78;
  const LN = Math.hypot(LX0, LY0, LZ0);
  const LX = LX0 / LN, LY = LY0 / LN, LZ = LZ0 / LN;
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Stateless integer hash -> uint32, for per-cell scenery without storing state.
  function hash2(a, b) {
    let h = Math.imul(a ^ Math.imul(b, 0x9E3779B1), 0x85EBCA6B);
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    return h >>> 0;
  }
  const U32 = 1 / 4294967296;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- Characters & colours ----------
  const CH = [];
  const ci = s => { let i = CH.indexOf(s); if (i < 0) { CH.push(s); i = CH.length - 1; } return i; };
  const C_SP = ci(' '); // occluder: hides what is behind, never drawn
  const C_FUR = [...'.:;~=+*%#@'].map(ci);       // soft coat ramp, dim -> dense (as in shiba-sit)
  const NFUR = C_FUR.length;
  const C_SL = ci('/'), C_BS = ci('\\'), C_BAR = ci('|'), C_COMMA = ci(','), C_APOS = ci("'"), C_DOT = ci('.'),
        C_COLON = ci(':'), C_DASH = ci('-'), C_TILDE = ci('~'), C_EQ = ci('='), C_STAR = ci('*'), C_PLUS = ci('+'),
        C_LP = ci('('), C_RP = ci(')'), C_AT = ci('@'), C_O = ci('O'), C_o = ci('o'), C_US = ci('_'),
        C_PCT = ci('%'), C_AMP = ci('&'), C_HASH = ci('#'), C_CARET = ci('^'), C_BTICK = ci('`');
  const TREE_TEX = [C_PCT, C_AMP, C_STAR, C_HASH];

  const LEVELS = 16;
  const PAL = [];
  const pal = (r, g, b) => { PAL.push([r, g, b]); return PAL.length - 1; };
  // Shiba
  const P_OR_D = pal(160, 80, 35), P_OR = pal(220, 120, 50), P_OR_L = pal(240, 150, 70);
  const P_CR = pal(250, 232, 204), P_CR_D = pal(214, 176, 142);
  const P_EARIN = pal(242, 160, 150);
  const P_EYE = pal(34, 20, 16), P_CATCH = pal(255, 255, 255);
  const P_NOSE = pal(44, 30, 28), P_MOUTH = pal(120, 58, 38), P_MIN = pal(150, 40, 55);
  const P_TONGUE = pal(250, 120, 140), P_TONGUE_D = pal(214, 80, 106);
  const P_COLLAR = pal(150, 44, 62), P_BELL = pal(255, 200, 80);
  // Scenery
  const P_HILL = pal(146, 98, 178), P_HILLRIM = pal(230, 140, 172);
  const P_TREE = pal(58, 112, 72), P_TREERIM = pal(240, 158, 84);
  const P_GRASS = [pal(112, 192, 70), pal(78, 166, 62), pal(168, 208, 84), pal(140, 200, 76)];
  const P_FLOWER = [pal(255, 216, 80), pal(255, 136, 190), pal(255, 246, 230)];
  const P_CLOUD = pal(255, 170, 190), P_CLOUDTOP = pal(206, 140, 212);
  const P_DUST = pal(230, 206, 166), P_STAR = pal(232, 222, 255);
  const P_SUN = [pal(255, 244, 200), pal(255, 216, 128), pal(255, 184, 100), pal(255, 150, 104)];
  const SKY_STOPS = [[0, 118, 86, 200], [0.42, 196, 98, 196], [0.72, 255, 128, 156], [1, 255, 178, 98]];
  const SKY_N = 14, SKY_P = [];
  for (let k = 0; k < SKY_N; k++) {
    const f = k / (SKY_N - 1);
    let j = 0;
    while (j < SKY_STOPS.length - 2 && f > SKY_STOPS[j + 1][0]) j++;
    const a = SKY_STOPS[j], b = SKY_STOPS[j + 1], m = (f - a[0]) / (b[0] - a[0]);
    SKY_P.push(pal(a[1] + (b[1] - a[1]) * m, a[2] + (b[2] - a[2]) * m, a[3] + (b[3] - a[3]) * m));
  }

  // Colour strings cached per (palette entry, brightness level).
  const NCOLOR = PAL.length * LEVELS;
  const COLSTR = new Array(NCOLOR);
  PAL.forEach(([r, g, b], p) => {
    for (let l = 0; l < LEVELS; l++) {
      // Top levels overshoot 1 and wash toward white, so lit characters read as glowing.
      const m = 0.3 + 1.05 * l / (LEVELS - 1), w = Math.max(0, m - 1) * 160;
      const lift = v => Math.min(255, v * m + w) | 0;
      COLSTR[p * LEVELS + l] = `rgb(${lift(r)},${lift(g)},${lift(b)})`;
    }
  });
  const lvl = b => { const l = (b * 15.99) | 0; return l < 0 ? 0 : l > 15 ? 15 : l; };
  // ---------- The Shiba: the same character model as shiba-sit (big round head, short muzzle, cupped ears,
  // cream urajiro mask), on a plump bean-shaped puppy body with short stubby legs. Built facing +z, y up,
  // ground y = 0; x > 0 is the dog's left (the far side). Rigid parts get one 3x4 matrix each per frame.
  const rng = mulberry32(20260801);
  const smooth = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
  const K_COAT = 0, K_EARIN = 1, K_EYE = 2, K_MOUTH = 3, K_NOSE = 4, K_TONGUE = 5, K_COLLAR = 6, K_BELL = 7;
  const R_BODY = 0, R_HEAD = 1, R_EARL = 2, R_EARR = 3, R_TONGUE = 4, R_TAIL = 5, R_BELL = 6, R_LEG = 7, NPART = 11;

  const H0 = [0, 0.76, 0.31];            // head centre (before the cute big-head scaling)
  const NP = [0, 0.64, 0.265];          // neck pivot
  const EX = 0.078, EY = 0.024, EW = 0.032, EH = 0.03;   // big round eyes (head-local)
  const TONGUE_A = [0, -0.09, 0.24];
  const HSC = 1.24;                     // big head = cute: head parts are scaled about the neck pivot
  const hsc = (v, j) => NP[j] + (v - NP[j]) * HSC;
  const H0S = [hsc(H0[0], 0), hsc(H0[1], 1), hsc(H0[2], 2)];
  // Eye catchlights: a bright white highlight, upper-right in each eye (toward the sun), on the head surface.
  const CATCH = [1, -1].map(sd => {
    const lx = sd * EX + 0.3 * EW, ly = EY + 0.38 * EH;
    const lz = 0.165 * Math.sqrt(1 - (lx / 0.19) ** 2 - ((ly - 0.01) / 0.165) ** 2) + 0.004;
    return [hsc(H0[0] + lx, 0), hsc(H0[1] + ly, 1), hsc(H0[2] + lz, 2)];
  });
  const CATCH2 = [1, -1].map(sd => {
    const lx = sd * EX - 0.45 * EW, ly = EY - 0.45 * EH;
    const lz = 0.165 * Math.sqrt(1 - (lx / 0.19) ** 2 - ((ly - 0.01) / 0.165) ** 2) + 0.004;
    return [hsc(H0[0] + lx, 0), hsc(H0[1] + ly, 1), hsc(H0[2] + lz, 2)];
  });
  const TAS = [hsc(H0[0] + TONGUE_A[0], 0), hsc(H0[1] + TONGUE_A[1], 1), hsc(H0[2] + TONGUE_A[2], 2)];

  const sol = (cx, cy, cz, rx, ry, rz, ax, name) => ({ c: [cx, cy, cz], r: [rx, ry, rz], ax: ax || 0, name });
  const BODY = [
    sol(0, 0.42, -0.06, 0.2, 0.185, 0.31, 0, 'torso'),       // round "bean" belly
    sol(0, 0.47, 0.15, 0.18, 0.195, 0.165, 0, 'chest'),      // fluffy chest
    sol(0, 0.43, -0.26, 0.19, 0.18, 0.165, 0, 'rump'),
    sol(0, 0.585, 0.22, 0.14, 0.13, 0.13, 0, 'neck'),
    sol(0.115, 0.37, -0.27, 0.1, 0.14, 0.135, 0, 'haunch'),
    sol(-0.115, 0.37, -0.27, 0.1, 0.14, 0.135, 0, 'haunch')
  ];
  const LEGS = [[0.092, 0.33, 0.165], [-0.092, 0.33, 0.165], [0.108, 0.33, -0.27], [-0.108, 0.33, -0.27]]; // hip pivots
  const PAW_B = 0.33;                   // pivot -> bottom of the paw
  const hs = (x, y, z, rx, ry, rz, ax, name) => sol(H0[0] + x, H0[1] + y, H0[2] + z, rx, ry, rz, ax, name);
  const HEAD = [
    hs(0, 0.01, 0, 0.19, 0.165, 0.165, 0, 'cranium'),
    hs(0.094, -0.07, 0.045, 0.112, 0.084, 0.105, 0, 'cheek'),
    hs(-0.094, -0.07, 0.045, 0.112, 0.084, 0.105, 0, 'cheek'),
    hs(0, -0.068, 0.15, 0.092, 0.068, 0.115, 0.12, 'muzzle'),
    hs(0, -0.032, 0.258, 0.03, 0.022, 0.019, 0, 'nose')
  ];

  function inside(s, x, y, z, lim) {
    const ca = Math.cos(s.ax), sa = Math.sin(s.ax);
    const dx = x - s.c[0], dy0 = y - s.c[1], dz0 = z - s.c[2];
    const dy = dy0 * ca + dz0 * sa, dz = -dy0 * sa + dz0 * ca;
    return (dx / s.r[0]) ** 2 + (dy / s.r[1]) ** 2 + (dz / s.r[2]) ** 2 < lim;
  }
  const insideAny = (list, self, x, y, z) => {
    for (let j = 0; j < list.length; j++) if (list[j] !== self && inside(list[j], x, y, z, 0.985)) return true;
    return false;
  };

  const BUF = { x: [], y: [], z: [], nx: [], ny: [], nz: [], k: [], p: [], r: [], a1: [], a2: [] };
  function add(x, y, z, nx, ny, nz, k, p, part, a1, a2) {
    const l = Math.hypot(nx, ny, nz) || 1;
    if (part >= R_HEAD && part <= R_TONGUE) { x = hsc(x, 0); y = hsc(y, 1); z = hsc(z, 2); }
    BUF.x.push(x); BUF.y.push(y); BUF.z.push(z);
    BUF.nx.push(nx / l); BUF.ny.push(ny / l); BUF.nz.push(nz / l);
    BUF.k.push(k); BUF.p.push(p); BUF.r.push(part); BUF.a1.push(a1 || 0); BUF.a2.push(a2 || 0);
  }

  // Area-uniform samples on a (pitched) ellipsoid surface, skipping points buried in other solids.
  function sampleSolid(s, dens, others, emit) {
    const [rx, ry, rz] = s.r, ca = Math.cos(s.ax), sa = Math.sin(s.ax);
    const area = 4 * Math.PI * Math.pow((Math.pow(rx * ry, 1.6) + Math.pow(rx * rz, 1.6) + Math.pow(ry * rz, 1.6)) / 3, 1 / 1.6);
    const n = Math.round(area * dens), maxS = Math.max(ry * rz, rx * rz, rx * ry);
    let made = 0, guard = 0;
    while (made < n && guard++ < n * 30) {
      const u = rng() * 2 - 1, ph = rng() * TAU, q = Math.sqrt(1 - u * u);
      const dx = q * Math.cos(ph), dy = u, dz = q * Math.sin(ph);
      const sc = Math.hypot(ry * rz * dx, rx * rz * dy, rx * ry * dz);
      if (rng() * maxS > sc) continue;
      made++;
      const lx = rx * dx, ly = ry * dy, lz = rz * dz;
      const nx = dx / rx, ny0 = dy / ry, nz0 = dz / rz;
      const x = s.c[0] + lx, y = s.c[1] + ly * ca - lz * sa, z = s.c[2] + ly * sa + lz * ca;
      const ny = ny0 * ca - nz0 * sa, nz = ny0 * sa + nz0 * ca;
      if (others && insideAny(others, s, x, y, z)) continue;
      const nl = Math.hypot(nx, ny, nz);
      emit(x, y, z, nx / nl, ny / nl, nz / nl, s);
    }
  }

  // Body: ginger coat, cream "urajiro" on the fluffy chest, throat, belly and the backs of the thighs.
  const jit = () => (rng() - 0.5) * 0.08;
  BODY.forEach(s => sampleSolid(s, 21000, BODY, (x, y, z, nx, ny, nz, s) => {
    let cream = false;
    const ax = Math.abs(x);
    switch (s.name) {
      case 'torso': cream = ny < -0.5 + jit(); break;
      case 'chest': cream = (nz > 0.5 + jit() && ax < 0.09 + jit() * 0.6) || ny < -0.4 + jit(); break;
      case 'neck': cream = nz > 0.35 + jit() && ax < 0.1 + jit() * 0.6; break;
      case 'rump': cream = ny < -0.45 + jit() || nz < -0.75 + jit(); break;
      default: cream = ny < -0.45 + jit() || (nz < -0.55 + jit() && y < 0.4); // haunch
    }
    add(x, y, z, nx, ny, nz, K_COAT, cream ? P_CR : P_OR, R_BODY);
  }));

  // Legs: short stubby columns with round cream paws; cream socks and inner sides.
  LEGS.forEach((L, l) => {
    const sd = L[0] > 0 ? 1 : -1, hind = l >= 2;
    const leg = sol(L[0], L[1] - 0.13, L[2], hind ? 0.064 : 0.058, 0.16, hind ? 0.07 : 0.062, 0, 'leg');
    const paw = sol(L[0], L[1] - PAW_B + 0.038, L[2] + 0.026, 0.066, 0.04, 0.082, 0, 'paw');
    const pair = [leg, paw];
    pair.forEach(s => sampleSolid(s, 26000, pair, (x, y, z, nx, ny, nz, s) => {
      const u = L[1] - y, j = jit();
      const cream = s === paw || u > 0.2 + j || nx * sd < -0.35 + j || (hind ? nz < -0.3 + j : nz > 0.55 + j && u > 0.1);
      add(x, y, z, nx, ny, nz, K_COAT, cream ? P_CR : P_OR, R_LEG + l);
    }));
  });

  // Head: shiba-sit's round fox face with a short muzzle, but with big round eyes, a button nose and a big
  // cream mask sweeping from the chin up over the cheeks. Eyes and mouth are decided per frame.
  HEAD.forEach(s => sampleSolid(s, s.name === 'nose' ? 90000 : 46000, HEAD, (x, y, z, nx, ny, nz, s) => {
    const lx = x - H0[0], ly = y - H0[1], lz = z - H0[2], ax = Math.abs(lx);
    if (s.name === 'nose') { add(x, y, z, nx, ny, nz, K_NOSE, P_NOSE, R_HEAD); return; }
    if (s.name !== 'cranium' && ax < 0.07 && ly < -0.045 && ly > -0.15 && lz > 0.12 && nz > 0.15) {
      add(x, y, z, nx, ny, nz, K_MOUTH, P_CR, R_HEAD, lx, ly); return;
    }
    let cream = false;
    if (s.name === 'cranium') {
      const side = lx > 0 ? 1 : -1, cu = (lx - side * EX) / EW, cv = (ly - EY) / EH;
      if (lz > 0.04 && Math.abs(cu) < 1.45 && Math.abs(cv) < 1.6) {
        add(x, y, z, nx, ny, nz, K_EYE, side > 0 ? 0 : 1, R_HEAD, cu, cv); return;
      }
      const bu = (ax - 0.068) / 0.022, bv = (ly - 0.094) / 0.014;   // cream eyebrow dots
      // the mask: up from the muzzle and sweeping toward the cheeks in a curve
      const ex = ax > 0.06 ? ax - 0.06 : 0, edge = -0.03 + 4.5 * ex * ex;
      cream = (lz > 0.04 && bu * bu + bv * bv < 1) ||
              (lz > 0.02 + jit() * 0.5 && ly < edge + jit() * 0.25 && ax < 0.17) ||
              (ly < -0.09 + jit() * 0.5);
    } else if (s.name === 'cheek') {
      cream = ly < -0.075 + 0.5 * (lz - 0.02) + jit() * 0.3;   // the mask sweeps up toward the front
    } else { // muzzle: cream with a little ginger bridge
      cream = !(ly > -0.026 + jit() * 0.2 && ax < 0.03 + jit() * 0.2 && lz < 0.2);
    }
    add(x, y, z, nx, ny, nz, K_COAT, cream ? P_CR : P_OR_L, R_HEAD);
  }));

  // Ears: erect triangles, cupped on the front (pink inside, cream fluff), ginger behind.
  const EARS = [];
  [1, -1].forEach((s, e) => {
    const bx = H0[0] + s * 0.105, by = H0[1] + 0.115, bz = H0[2] - 0.025;
    const tx = H0[0] + s * 0.162, ty = H0[1] + 0.27, tz = H0[2] - 0.01;
    let dx = tx - bx, dy = ty - by, dz = tz - bz;
    const h = Math.hypot(dx, dy, dz); dx /= h; dy /= h; dz /= h;
    let n0x = s * 0.25, n0z = 1;
    const n0l = Math.hypot(n0x, n0z); n0x /= n0l; n0z /= n0l;
    let axx = dy * n0z, axy = dz * n0x - dx * n0z, axz = -dy * n0x;   // A = D x N0
    const al = Math.hypot(axx, axy, axz); axx /= al; axy /= al; axz /= al;
    const fx = axy * dz - axz * dy, fy = axz * dx - axx * dz, fz = axx * dy - axy * dx; // Nf = A x D
    EARS.push([hsc(bx, 0), hsc(by, 1), hsc(bz, 2), dx, dy, dz, axx, axy, axz]);
    const hw = 0.074, part = e ? R_EARR : R_EARL, cran = [HEAD[0]];
    const n = Math.round(h * hw * 64000);
    for (let i = 0; i < n * 2 + 260; i++) {
      const u = 1 - Math.sqrt(rng()), v = rng() * 2 - 1, w = Math.pow(1 - u, 0.85) * (1 + 0.12 * Math.sin(Math.PI * u));
      const off = v * hw * w;
      let x = bx + dx * h * u + axx * off, y = by + dy * h * u + axy * off, z = bz + dz * h * u + axz * off;
      const bulge = (1 - v * v) * (1 - u);
      let k = K_COAT, a1 = 0, nx, ny, nz;

  function updateButterfly(dt) {
    if (bfState === 0) {
      bfT -= dt;
      if (bfT > 0) return;
      bfState = 1; bfAge = 0; bfX = W + bfW; bfVX = -(0.22 * W + 30);
      bfBase = headSY - S * 0.3; bfY = bfBase; bfYellow = Math.random() < 0.5 ? 1 : 0;
      music('event', 'butterfly');
      return;
    }
    bfAge += dt;
    if (bfState === 1) {
      bfX += bfVX * dt;
      bfY = bfBase + S * 0.07 * Math.sin(bfAge * 5.2) + S * 0.03 * Math.sin(bfAge * 11);
      if (bfX < headSX + (-bfVX) * 0.4) {
        if (!reduced) jump();
        bfState = 2; bfEsc = 0; bfVY = 0;
      }
    } else {
      bfEsc += dt;
      if (bfEsc > 0.3) { bfVY -= H * 1.4 * dt; bfVX += (0.06 * W - bfVX) * Math.min(1, dt * 2); }
      bfX += bfVX * dt; bfY += bfVY * dt + S * 0.05 * Math.sin(bfAge * 11) * dt * 8;
      if (bfY < -ch * 4 || bfX < -bfW * 2) { bfState = 0; bfT = BF_MIN + (BF_MAX - BF_MIN) * Math.random(); }
    }
  }
  let halo = null;
  function makeHalo() {
    const R = Math.max(10, fs * 3.2);
    halo = document.createElement('canvas');
    halo.width = halo.height = Math.ceil(R * 2);
    const x = halo.getContext('2d'), gr = x.createRadialGradient(R, R, 0, R, R, R);
    gr.addColorStop(0, 'rgba(255,255,235,0.8)');
    gr.addColorStop(0.3, 'rgba(255,230,150,0.35)');
    gr.addColorStop(1, 'rgba(255,220,140,0)');
    x.fillStyle = gr; x.fillRect(0, 0, halo.width, halo.height);
  }
  function drawButterfly() {
    if (bfState === 0) return;
    const open = ((bfAge * (bfState === 2 ? 16 : 11)) | 0) & 1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.9;
    ctx.drawImage(halo, bfX - halo.width / 2, bfY - halo.height / 2);
    ctx.restore();
    ctx.font = bfFont;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = bfYellow ? '#ffe36a' : '#fffaf0';
    ctx.fillText(open ? '}{' : '><', bfX - bfW / 2, bfY);
    ctx.textBaseline = 'top';
    ctx.font = cellFont;
  }

  // ---------- Drawing ----------
  function buildScene() {
    stamp++; nT = 0;
    scrollPx = worldU * S;
    putSky();
    putClouds();
    putHills();
    putTrees();
    putMeadow();
    putDust();
    splatDog();
  }

  // Bucket by colour so fillStyle changes once per colour, not once per cell.
  function drawCells() {
    counts.fill(0);
    for (let i = 0; i < nT; i++) counts[ccol[touched[i]]]++;
    let acc = 0;
    for (let c = 0; c < NCOLOR; c++) { const n = counts[c]; counts[c] = acc; acc += n; }
    for (let i = 0; i < nT; i++) { const c = touched[i]; order[counts[ccol[c]]++] = c; }
    let cur = -1, n = 0;
    for (let i = 0; i < nT; i++) {
      const c = order[i];
      if (cchar[c] === C_SP) continue;
      const cc = ccol[c];
      if (cc !== cur) { cur = cc; ctx.fillStyle = COLSTR[cc]; }
      const row = (c / cols) | 0;
      ctx.fillText(CH[cchar[c]], (c - row * cols) * cw, row * ch);
      n++;
    }
    letters = n;
  }

  // Background fills: sky/meadow gradient, sun glow, hill + tree silhouettes, dark dog underlay.
  function silhouette(g, top, fill) {
    g.fillStyle = fill;
    g.beginPath();
    g.moveTo(0, horizonY);
    for (let c = 0; c < cols; c++) { const y = top[c] * ch; g.lineTo(c * cw, y); g.lineTo((c + 1) * cw, y); }
    g.lineTo(cols * cw, horizonY);
    g.closePath();
    g.fill();
  }
  function drawBackdrop(g) {
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, W, H);
    g.fillStyle = sunGrad;
    g.fillRect(sunX - sunGR, sunY - sunGR, sunGR * 2, sunGR * 2);
    silhouette(g, hillTop, '#4a2a62');
    silhouette(g, treeTop, '#1d3a28');
    g.fillStyle = '#26120a';
    g.beginPath();
    for (let i = 0; i < nRun; i++) g.rect(runs[i * 3 + 1] * cw, runs[i * 3] * ch, runs[i * 3 + 2] * cw, ch);
    g.fill();
  }

  // Bloom: shrink the frame, subtract the backdrop with 'difference', blur, and add it back on top.
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  const bgc = document.createElement('canvas'), bctx = bgc.getContext('2d');
  const glow2 = document.createElement('canvas'), g2ctx = glow2.getContext('2d');
  const GLOW_DIV = 5, GLOW_A = 0.75;
  function drawGlow() {
    const gw = Math.ceil(W / GLOW_DIV), gh = Math.ceil(H / GLOW_DIV);
    if (glow.width !== gw || glow.height !== gh) {
      glow.width = bgc.width = glow2.width = gw;
      glow.height = bgc.height = glow2.height = gh;
    }
    bctx.setTransform(gw / W, 0, 0, gh / H, 0, 0);
    drawBackdrop(bctx);
    gctx.globalCompositeOperation = 'copy';
    gctx.drawImage(canvas, 0, 0, gw, gh);
    gctx.globalCompositeOperation = 'difference';
    gctx.drawImage(bgc, 0, 0);
    g2ctx.globalCompositeOperation = 'copy';
    g2ctx.filter = 'blur(2px)';
    g2ctx.drawImage(glow, 0, 0);
    g2ctx.filter = 'none';
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = GLOW_A;
    ctx.drawImage(glow2, 0, 0, W, H);
    ctx.restore();
  }

  function render() {
    buildScene();
    drawBackdrop(ctx);
    ctx.textBaseline = 'top';
    ctx.font = cellFont;
    drawCells();
    drawGlow();
    drawButterfly();
  }

  // ---------- Loop, HUD, controls ----------
  let paused = false, last = performance.now();
  let frames = 0, fpsT = last, fps = 0, hudT = 0;
  // Music (ascii-audio.js): no-op when the engine is missing; sound cues fire where the motion happens.
  const music = (fn, ...a) => window.AsciiAudio && AsciiAudio[fn](...a);

  function jump() {
    if (jt >= 0) return;
    jt = 0; jumps++;
    music('event', 'jump');
    puff(pwX[2], pwZ[2], 5, 1);
    puff(pwX[3], pwZ[3], 4, 1);
  }

  function update(dt) {
    t += dt; skyT += dt;
    gph += GAIT.f * dt;
    worldU += GAIT.speed * dt;
    dist += GAIT.mps * dt;
    if (jt >= 0) {
      jt += dt;
      if (jt >= JUMP_DUR) {
        jt = -1; landT = t;
        for (let l = 0; l < 4; l++) puff(pwX[l], pwZ[l], 4, 1.3);
        music('event', 'land');
        music('event', 'jingle', { v: 1 });
      }
    }
    pose(dt);
    if (jt < 0) {
      for (let l = 0; l < 4; l++) {
        if (legP[l] < lastP[l] - 0.5) {
          puff(pwX[l], pwZ[l], reduced ? 1 : 4, (l & 1) ? 1 : 0.7);
          music('event', 'step', { l });
          if (l === 1) music('event', 'jingle', { v: 0.5 });   // the collar bell, once per stride
        }
      }
    }
    for (let l = 0; l < 4; l++) lastP[l] = legP[l];
    for (let i = 0; i < nCloud; i++) {
      const o = i * 5;
      CLOUD[o] -= (CLOUD[o + 4] + GAIT.speed * S * 0.015) * dt;
      if (CLOUD[o] < -CLOUD[o + 2] * 1.3) seedCloud(i, Math.random, W + CLOUD[o + 2] * (1.3 + Math.random()));
    }
    updateDust(dt);
    updateButterfly(dt);
  }

  function updateHud(now) {
    const tail = paused ? 'paused' : `${fps} fps`;
    const head = `distance ${Math.floor(dist).toLocaleString('en-US')} m  jumps ${jumps}  `;
    // Narrow screens drop the letter count so nothing is clipped.
    hudEl.textContent = W < 640 ? head + tail : head + `letters ${letters.toLocaleString('en-US')}  ${tail}`;
    hudT = now;
  }

  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) resize();
    if (!paused) update(dt);
    if (!paused || dirty) { render(); dirty = false; frames++; }
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); music(paused ? 'pause' : 'resume'); }
  function replay() {
    t = 0; skyT = 0; gph = 0; worldU = 0; dist = 0; jumps = 0; jt = -1; nDust = 0;
    bfState = 0; bfT = BF_FIRST; paused = false; dirty = true;
    pose(1);
    for (let l = 0; l < 4; l++) lastP[l] = legP[l];
    music('resume'); music('restart');
  }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (paused) togglePause(); jump(); }
  });
  // A tap jumps right away (and resumes if paused); a second tap within 280 ms restarts instead.
  let tapTimer = 0;
  canvas.addEventListener('pointerup', e => {
    if (e.button > 0) return;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = 0; replay(); return; }
    tapTimer = setTimeout(() => { tapTimer = 0; }, 280);
    if (paused) togglePause();
    jump();
  });

  // Hint language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';
  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '點擊跳躍 · 雙擊重新開始' : 'tap to jump · double-tap to restart')
                             : (zh ? '點擊跳躍 · 空白鍵暫停 · R 重新開始 · M 音樂' : 'tap to jump · Space pause · R restart · M music');


  // Score: an original sunny gallop in D major, 132 bpm, 16-bar (64-beat) loop. Plucked lead,
  // glockenspiel counter line, driving octave bass, kick / snare / hat groove and a soft pad.
  if (window.AsciiAudio) AsciiAudio.init({
    bpm: 132, master: 0.78, reverb: 0.18, reverbTime: 1.8,
    build(a) {
      const N = AsciiAudio.notes, LOOP = 64;
      const tune = N(
        'F#5:.5 A5 D6:1 A5:.5 F#5 A5:1 | E5:.5 A5 C#6:1 B5:.5 A5 E5:1 | ' +
        'F#5:.5 B5 D6:1 C#6:.5 B5 F#5:1 | G5:.5 A5 B5 G5 A5:2 | ' +
        'F#5:.5 A5 D6:1 E6:.5 D6 C#6 B5 | A5:1 E5:.5 F#5 G5:1 E5 | ' +
        'B5:.5 A5 G5 F#5 E5:1 G5 | E5:1 C#5 D5:2 | ' +
        'B5:.5 B5 D6:1 B5:.5 A5 G5:1 | C#6:.5 C#6 E6:1 C#6:.5 B5 A5:1 | ' +
        'A5:.5 F#5 A5 C#6 E6:1 C#6 | D6:.5 C#6 B5 A5 B5:2 | ' +
        'G5:.5 B5 D6:1 E6:.5 D6 B5:1 | A5:.5 C#6 E6:1 F#6 E6 | ' +
        'D6:.5 C#6 B5 A5 G5 A5 B5 C#6 | D6:2 r:2');
      a.part(tune, (t, e) => a.pluck(t, e.note, Math.max(0.25, e.sec * 1.2), { vel: 0.5, pan: 0.1 }), { length: LOOP });

      // One chord per half bar (2 beats), 32 slots per loop.
      const CH = { D: ['D', 'F#', 'A'], A: ['A', 'C#', 'E'], Bm: ['B', 'D', 'F#'], G: ['G', 'B', 'D'], 'F#m': ['F#', 'A', 'C#'] };
      const PROG = ('D D A A Bm Bm G G D D A A G G A D ' +
                    'G G A A F#m F#m Bm Bm G G A A G A D D').split(' ');
      const chordAt = beat => CH[PROG[Math.floor((beat % LOOP) / 2)]];

      // Glockenspiel counter line: syncopated chord tones up high, answering the lead.
      const GL = [null, null, 2, 1, null, 2, null, 0];
      a.every(0.5, (t, s) => {
        const k = GL[s % 8];
        if (k == null || (s * 0.5) % LOOP >= LOOP - 2) return;
        const c = chordAt(s * 0.5);
        a.bell(t, c[k] + (k === 0 ? '7' : '6'), 0.7, { vel: 0.16, pan: -0.35, wet: 0.3 });
      });
      // Driving octave bass in 8ths and a soft pad on each chord.
      a.every(0.5, (t, s) => {
        const c = chordAt(s * 0.5);
        a.bass(t, c[0] + (s % 4 === 3 ? '3' : '2'), a.beats(0.4), { vel: s % 2 ? 0.34 : 0.46 });
      });
      a.every(2, (t, s) => {
        const c = chordAt(s * 2);
        a.pad(t, [c[0] + '4', c[1] + '4', c[2] + '4'], a.beats(1.7), { vel: 0.22, attack: 0.08, release: 0.3, cutoff: 1500 });
      });
      // Drums: four-on-the-floor kick, backbeat snare, open 8th hats; a snare fill into the loop.
      a.every(1, (t, s) => {
        const b = s % LOOP;
        a.kick(t, b % 4 === 0 ? 0.6 : 0.5);
        if (b % 2 === 1 && b < LOOP - 2) a.snare(t, 0.36);
      });
      a.every(0.5, (t, s) => {
        const b = (s * 0.5) % LOOP;
        a.hat(t, s % 2 ? 0.34 : 0.16, { pan: 0.25 });
        if (b >= LOOP - 2) a.snare(t, 0.16 + 0.07 * (b - (LOOP - 2)) * 2);
      });

      // Sound effects in sync with the animation.
      const yip = t => {   // a short bright "yip": a quick rising-then-falling chirp
        const c = a.ctx, g = c.createGain(), o = c.createOscillator();
        g.connect(a._out({ bus: 'sfx', pan: 0.15 }, 0.12));
        o.type = 'triangle';
        o.frequency.setValueAtTime(820, t);
        o.frequency.exponentialRampToValueAtTime(1480, t + 0.04);
        o.frequency.exponentialRampToValueAtTime(1050, t + 0.13);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.14, t + 0.01);
        g.gain.setTargetAtTime(0, t + 0.07, 0.03);
        o.connect(g); o.start(t); o.stop(t + 0.3);
      };
      a.on('jump', (a, d, t) => {
        a.boing(t, { freq: 240, vel: 0.6 });
        a.whoosh(t, { dur: 0.45, vel: 0.36, freq: 500, freqEnd: 2600 });
        yip(t + 0.03);
      }, { gap: 0.3 });
      a.on('land', (a, d, t) => {
        a.thud(t, { vel: 0.45, freq: 115 });
        a.noise(t, { dur: 0.22, filter: 'lowpass', freq: 900, freqEnd: 300, vel: 0.14, bus: 'sfx', wet: 0.08 });
      }, { gap: 0.3 });
      a.on('step', (a, d, t) => a.noise(t, { dur: 0.035, filter: 'bandpass', freq: 900 + 500 * Math.random(), q: 1.4,
        vel: 0.12, bus: 'sfx', wet: 0, pan: d.l & 1 ? -0.2 : 0.2 }), { gap: 0.07 });
      // The little collar bell: a quiet two-partial tinkle, throttled.
      a.on('jingle', (a, d, t) => {
        a.bell(t, 'A6', 0.35, { vel: 0.035 * d.v, bus: 'sfx', wet: 0.3, pan: 0.1 });
        a.bell(t + 0.04, 'E7', 0.3, { vel: 0.025 * d.v, bus: 'sfx', wet: 0.3, pan: 0.15 });
      }, { gap: 0.35 });
      const SP = AsciiAudio.scale('D6', 'pentatonic', 10);
      a.on('butterfly', (a, d, t) => {
        a.sparkle(t, { count: 5, spread: 0.07, vel: 0.13, notes: SP });
        for (let i = 0; i < 8; i++)   // fluttering wings: soft airy ticks
          a.noise(t + i * 0.045, { dur: 0.03, filter: 'highpass', freq: 4500, vel: 0.06 * (1 - i / 10), bus: 'sfx', wet: 0.2 });
      });
    }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
