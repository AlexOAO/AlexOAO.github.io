<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASCII Bangkok at Night | Alex Li (李翔緯)</title>
  <meta name="description" content="Bangkok at night drawn entirely with coloured ASCII characters: a full moon over the Chao Phraya River, a modern skyline with a pixelated tower, Wat Arun's porcelain prangs glowing gold, the Grand Palace with tiered orange and green roofs and gilded spires, tuk-tuks on the riverside road, a dinner cruise, long-tail boats and floating krathong lanterns over warm reflections. Tap Wat Arun to light its tiers, the Grand Palace for wind chimes, the river for a boat or a krathong, the road for a tuk-tuk and the sky for lanterns. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#070818">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@500&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #0b0c1e;
      --sky: #070818;
      --text: #f6efe0;
      --muted: #c9bba0;
      --accent: #f5b942;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: none; /* taps trigger the shows, drags move the parallax and ripple the river */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(245, 185, 66, 0.45);
      background: rgba(70, 40, 10, 0.4);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(245, 185, 66, 0.26);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.8;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
      .hint { bottom: 30px; } /* stack above the HUD on narrow screens */
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ASCII Bangkok at Night</h1>
  <a class="back" href="./">← ASCII</a>
  <canvas id="c" role="img" aria-label="Animated night view of Bangkok drawn with coloured ASCII characters: a full moon, a modern skyline with a pixelated tower, Wat Arun's porcelain prangs glowing gold and the Grand Palace with tiered orange and green roofs and golden spires resolving into place, tuk-tuks on the riverside road, a dinner cruise, long-tail boats and floating krathongs on the Chao Phraya with warm reflections, then the title Bangkok at Night; tapping Wat Arun lights its tiers, tapping the Grand Palace rings wind chimes, tapping the river sends a boat or a krathong, tapping the road sends a tuk-tuk and tapping the sky releases lanterns"></canvas>
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>

<script src="ascii-audio.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Timeline (seconds of scene time, one 24 s loop) ----------
  const T = {
    MOON: 0.3, FAR: 0.9, CITY: 1.6, CITY_DUR: 1.6,
    TOWER: 2.8, TOWER_DUR: 1.8,        // the pixelated tower, bottom -> top
    WAT: 4.6, WAT_DUR: 2.8,            // Wat Arun: central prang, then the four small prangs
    PALACE: 7.6, PALACE_DUR: 2.8,      // Grand Palace halls, roofs, spires and the golden chedi
    LIGHTS: 10.4,                      // floodlights warm up, windows switch on
    NEON: 10.8, NEON_DUR: 1.6,
    ROAD: 11.6,                        // street lamps run along the riverside road, traffic starts
    BOATS: 12.4, REFL: 13.0, KRATHONG: 13.8,
    TITLE: 15.4,                       // "BANGKOK", then " AT NIGHT"
    LANTERNS: 17.2, HOLD: 18.4,
    FADE: 21.0, FADE_DUR: 2.4, END: 24.0
  };
  const PHASES = [[0, 'sky', '天空'], [T.FAR, 'skyline', '天際線'], [T.TOWER, 'tower', '高樓'], [T.WAT, 'wat arun', '鄭王廟'],
    [T.PALACE, 'grand palace', '大皇宮'], [T.LIGHTS, 'lights', '點燈'], [T.BOATS, 'river', '河面'], [T.KRATHONG, 'krathong', '水燈'],
    [T.TITLE, 'title', '標題'], [T.HOLD, 'hold', '停留'], [T.FADE, 'fade', '淡出']];
  const TITLE_A = 'BANGKOK', TITLE_B = ' AT NIGHT';
  const TA_STEP = 0.14, TB_START = T.TITLE + 1.4, TB_STEP = 0.11;

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_START = reduced ? T.HOLD + 0.5 : 0;   // reduced motion: open (and stay) on the finished night view
  const RES = 0.45;                             // seconds a cell spends as scrambled glyphs before it resolves
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Stateless integer hash -> [0, 1).
  function hash2(a, b) {
    let h = Math.imul(a ^ Math.imul(b, 0x9E3779B1), 0x85EBCA6B);
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  // Smooth 2D value noise from the hash lattice.
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * fx + (c - a + (a - b - c + d) * fx) * fy;
  }

  // ---------- Characters & colours ----------
  const CH = [];
  const ci = s => { let i = CH.indexOf(s); if (i < 0) { CH.push(s); i = CH.length - 1; } return i; };
  const C_SP = ci(' '); // occluder: hides what is behind, never drawn
  const C_SL = ci('/'), C_BS = ci('\\'), C_BAR = ci('|'), C_HASH = ci('#'), C_EQ = ci('='),
        C_US = ci('_'), C_DASH = ci('-'), C_DOT = ci('.'), C_STAR = ci('*'), C_PLUS = ci('+'), C_o = ci('o'),
        C_COLON = ci(':'), C_LB = ci('['), C_RB = ci(']'), C_CARET = ci('^'), C_AT = ci('@'), C_TILDE = ci('~'),
        C_GT = ci('>'), C_LT = ci('<'), C_LP = ci('('), C_RP = ci(')'), C_Q = ci("'"), C_H = ci('H'), C_O = ci('O'), C_A = ci('A');
  const SCR = [...'01#$%&*+=?@<>/\\:;'].map(ci);   // scrambled glyphs a cell shows before it resolves
  const STAR_G = [C_DOT, C_DOT, C_Q, C_PLUS, C_DOT, C_STAR];
  const letter = s => ci(s);

  const LEVELS = 16;
  const PAL = [];
  const pal = (r, g, b) => { PAL.push([r, g, b]); return PAL.length - 1; };
  const hsl = (h, s, l) => {
    const a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  };
  const P_WHITE = pal(255, 255, 255), P_SCR = pal(255, 214, 140), P_STAR = pal(210, 208, 255);
  const P_MOON = pal(255, 240, 200), P_MOON_D = pal(200, 180, 150);
  const P_FAR = pal(74, 78, 140), P_FAR_LIT = pal(255, 190, 120);
  const P_BLD = pal(92, 98, 166), P_WOFF = pal(66, 70, 124);
  const P_WIN = [pal(255, 204, 120), pal(255, 234, 190), pal(160, 205, 255), pal(255, 170, 96)];
  const P_GLASS = pal(110, 140, 210), P_GLASS_E = pal(190, 214, 255), P_PIX = pal(236, 244, 255);
  const P_WAT = pal(236, 186, 112), P_WAT_E = pal(255, 226, 160), P_PORC = pal(214, 232, 255), P_PORC2 = pal(255, 246, 216);
  const P_ROOF = pal(255, 112, 36), P_ROOF2 = pal(236, 78, 34), P_ROOFG = pal(64, 206, 128);
  const P_GOLD = pal(255, 196, 72), P_GOLD_HI = pal(255, 236, 160), P_WALL = pal(232, 226, 210), P_COL = pal(226, 164, 84);
  const P_PWIN = pal(255, 210, 130);
  const NEON = [pal(255, 70, 170), pal(80, 255, 150), pal(70, 228, 255), pal(255, 224, 70), pal(255, 130, 50), pal(190, 110, 255), pal(255, 66, 90)];
  const P_LAMP = pal(255, 200, 110), P_KERB = pal(150, 136, 150), P_ROAD = pal(90, 86, 120), P_STEEL = pal(150, 150, 180);
  const P_WATER = pal(56, 84, 166), P_RIP = pal(255, 214, 160);
  const P_FLAME = pal(255, 170, 56), P_LOTUS_G = pal(90, 210, 110), P_LOTUS_P = pal(255, 120, 176);
  const P_LANT = pal(255, 138, 48), P_LANT_C = pal(255, 226, 130);
  const P_BOAT = pal(220, 200, 170), P_HULL = pal(170, 120, 80), P_SPRAY = pal(220, 236, 255);
  const P_CAR_W = pal(255, 244, 220), P_CAR_R = pal(255, 58, 60), P_TAXI_P = pal(255, 96, 176), P_TAXI_G = pal(150, 236, 80);
  const P_RED = pal(255, 48, 56);
  const RB = [];
  for (let k = 0; k < 12; k++) RB.push(pal(...hsl(k * 30, 1, 0.62)));

  // Colour strings cached per (palette entry, brightness level).
  const NCOLOR = PAL.length * LEVELS;
  const COLSTR = new Array(NCOLOR);
  PAL.forEach(([r, g, b], p) => {
    for (let l = 0; l < LEVELS; l++) {
      // Top levels overshoot 1 and wash toward white, so lit characters read as glowing.
      const m = 0.18 + 1.12 * l / (LEVELS - 1), w = Math.max(0, m - 1) * 170;
      const lift = v => Math.min(255, v * m + w) | 0;
      COLSTR[p * LEVELS + l] = `rgb(${lift(r)},${lift(g)},${lift(b)})`;
    }
  });

  // ---------- Canvas, grid, layout ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const hintEl = document.getElementById('hint');

  // Hint / HUD language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';

  let W = 0, H = 0, fs = 10, cw = 6, ch = 11, cols = 0, rows = 0, hr = 0, yH = 0, K = 400, Sw = 0, sx0 = 0;
  let cellFont = '', bgGrad = null;
  let stampA, cchar, ccol, ckind, clb, touched, order, nT = 0, stamp = 0;
  const counts = new Uint32Array(NCOLOR);
  let needResize = true, dirty = true;
  let moonX = 0, moonY = 0, moonR = 0;
  let kcW = 0, kcP = 0, kcT = 0, palL = 0, palR = 0;
  let topCol = { wat: null, pal: null, tow: null };
  // Sprites: every static cell of the scene, with its build time and colour group.
  let nS = 0, sC, sR, sCh, sP, sB, sT0, sL, sG, sY, sX, sF;
  let nSolid = 0;
  let stars = [];
  let signs = [];

  const G_STATIC = 0, G_WIN = 1, G_WAT = 2, G_PAL = 3, G_TOWER = 4, G_NEON = 5, G_LAMP = 6, G_BEACON = 7;
  const F_HALO = 1, F_EDGE = 2, F_STUD = 4, F_ROOF = 8, F_CHOFA = 16, F_GOLD = 32, F_WIN = 64, F_PIX = 128;

  const U = u => sx0 + u * Sw;               // stage fraction -> px
  const colU = u => Math.round(U(u) / cw);
  const rowsOf = px => Math.max(1, Math.round(px / ch));
  const colsOf = px => Math.max(1, Math.round(px / cw));

  function resize() {
    needResize = false;
    W = canvas.clientWidth || innerWidth;
    H = canvas.clientHeight || innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fs = clamp(Math.round(Math.min(W, H) / 90), 7, 13);
    cellFont = `${fs}px ${MONO}`;
    ctx.font = cellFont;
    cw = ctx.measureText('M').width || fs * 0.6;
    ch = Math.round(fs * 1.15);
    cols = Math.ceil(W / cw);
    rows = Math.ceil(H / ch);
    hr = Math.round(H * (W / H > 1 ? 0.6 : 0.56) / ch);
    yH = hr * ch;
    K = Math.min(yH * 0.92, W / (W / H > 1 ? 1.5 : 1.38));   // every landmark scales from K
    Sw = Math.min(W, K * 2.0);
    sx0 = (W - Sw) / 2;
    const n = cols * rows;
    stampA = new Uint32Array(n);
    cchar = new Uint8Array(n); ccol = new Uint16Array(n); ckind = new Uint8Array(n); clb = new Float32Array(n);
    touched = new Int32Array(n); order = new Int32Array(n); stamp = 0;

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    const hf = yH / H;
    bgGrad.addColorStop(0, '#05061a');
    bgGrad.addColorStop(hf * 0.6, '#0c0b2c');
    bgGrad.addColorStop(hf * 0.97, '#2a1a34');   // warm city glow above the river
    bgGrad.addColorStop(Math.min(1, hf + 0.02), '#0b0d26');
    bgGrad.addColorStop(1, '#04050f');

    makeHalos();
    buildScene();
    dirty = true;
  }

  // Boundary character from how far the edge moves sideways per row going up.
  function edgeChar(delta, s) {
    const a = Math.abs(delta);
    if (a > 1.9) return C_US;
    if (s === 0 || a < 0.35) return C_BAR;
    return s * delta > 0 ? C_SL : C_BS;
  }

  // ---------- Scene construction ----------
  let A = null;
  function add(L, col, row, chr, p, b, t0, g, y, x, f) {
    if (col < -6 || col >= cols + 6 || row < 0 || row >= rows) return;
    A.c.push(col); A.r.push(row); A.ch.push(chr); A.p.push(p); A.b.push(b); A.t0.push(t0);
    A.l.push(L); A.g.push(g || 0); A.y.push(y || 0); A.x.push(x || 0); A.f.push(f || 0);
  }
  // Settle a range of sprites bottom -> top over [T0, T0 + DUR], with a little scatter.
  function settle(i0, T0, DUR) {
    let lo = 1e9, hi = -1e9;
    for (let i = i0; i < A.c.length; i++) { if (A.r[i] < lo) lo = A.r[i]; if (A.r[i] > hi) hi = A.r[i]; }
    for (let i = i0; i < A.c.length; i++) A.t0[i] = T0 + DUR * (0.85 * (hi - A.r[i]) / Math.max(1, hi - lo) + 0.12 * hash2(i, 5));
    return lo;
  }

  function buildScene() {
    A = { c: [], r: [], ch: [], p: [], b: [], t0: [], l: [], g: [], y: [], x: [], f: [] };
    const wide = W / H > 1.2;
    kcW = colU(wide ? 0.2 : 0.19);
    kcP = colU(0.66);
    kcT = colU(0.44);
    moonX = U(0.86); moonY = H * (wide ? 0.15 : 0.12); moonR = Math.max(ch * 2.6, Math.min(W, H) * 0.06);

    buildMoon();
    buildFar();
    buildCity();
    buildTower();
    buildWat();
    buildPalace();
    buildRoad();

    nS = A.c.length;
    sC = Int16Array.from(A.c); sR = Int16Array.from(A.r); sCh = Uint8Array.from(A.ch); sP = Uint16Array.from(A.p);
    sB = Float32Array.from(A.b); sT0 = Float32Array.from(A.t0); sL = Uint8Array.from(A.l); sG = Uint8Array.from(A.g);
    sY = Float32Array.from(A.y); sX = Float32Array.from(A.x); sF = Uint8Array.from(A.f);
    nSolid = 0;
    for (let i = 0; i < nS; i++) if (sCh[i] !== C_SP && sC[i] >= 0 && sC[i] < cols) nSolid++;
    // Top row of each tappable landmark per column (hit tests).
    const mk = () => new Int16Array(cols + 12).fill(32767);
    topCol = { wat: mk(), pal: mk(), tow: mk() };
    for (let i = 0; i < nS; i++) {
      const arr = sG[i] === G_WAT ? topCol.wat : sG[i] === G_PAL ? topCol.pal : sG[i] === G_TOWER ? topCol.tow : null;
      if (!arr) continue;
      const c = sC[i] + 6;
      if (c >= 0 && c < arr.length && sR[i] < arr[c]) arr[c] = sR[i];
    }
    A = null;

    // Stars only in open sky, well above the skyline.
    const r2 = mulberry32(7);
    stars = [];
    const ns = Math.round(cols * hr * 0.011);
    for (let i = 0; i < ns; i++) {
      const c = (r2() * cols) | 0, r = (r2() * (hr * 0.55)) | 0;
      if (Math.hypot((c + 0.5) * cw - moonX, (r + 0.5) * ch - moonY) < moonR * 1.7) continue;
      stars.push({ c, r, g: STAR_G[(r2() * STAR_G.length) | 0], ph: r2() * 6.283, sp: 0.5 + r2() * 1.8, b: 0.3 + 0.5 * r2() });
    }
  }

  // Full moon (Loy Krathong is on the full moon): '@' disc, softer maria, 'o' rim.
  function buildMoon() {
    const c0 = Math.floor((moonX - moonR) / cw) - 1, c1 = Math.ceil((moonX + moonR) / cw) + 1;
    const r0 = Math.floor((moonY - moonR) / ch) - 1, r1 = Math.ceil((moonY + moonR) / ch) + 1;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const dx = (c + 0.5) * cw - moonX, dy = (r + 0.5) * ch - moonY, d = Math.hypot(dx, dy);
      if (d > moonR) continue;
      const q = d / moonR, t0 = T.MOON + q * 0.8 + hash2(c, r) * 0.15;
      const mar = vnoise(dx / moonR * 2.2 + 3.1, dy / moonR * 2.2 + 1.7);
      if (q > 0.86) add(0, c, r, C_o, P_MOON, 0.7, t0, G_STATIC);
      else if (mar > 0.64) add(0, c, r, C_O, P_MOON_D, 0.6, t0, G_STATIC);
      else add(0, c, r, C_AT, P_MOON, 0.82 + 0.15 * (1 - q), t0, G_STATIC);
    }
  }

  // Distant skyline: hazy dotted blocks across the whole width.
  function buildFar() {
    const r = mulberry32(77);
    let c = -2;
    while (c < cols + 2) {
      const w = 3 + ((r() * 6) | 0), xf = c / cols;
      let h = (0.06 + 0.16 * r()) * K;
      if (xf > 0.8 || xf < 0.06) h *= 1.4;
      const top = hr - 1 - Math.max(2, Math.round(h / ch));
      for (let x = c; x < c + w; x++) {
        const t0 = T.FAR + clamp(xf, 0, 1) * 1.1 + hash2(x, 3) * 0.2;
        for (let y = top; y < hr; y++) {
          if (y === top) { add(0, x, y, x === c || x === c + w - 1 ? C_DOT : C_COLON, P_FAR, 0.34, t0, G_STATIC); continue; }
          const hh = hash2(x * 5, y);
          if (hh < 0.05) add(0, x, y, C_DOT, P_FAR_LIT, 0.55, t0 + 1, G_STATIC);
          else add(0, x, y, hh < 0.22 ? C_DOT : hh < 0.3 ? C_COLON : C_SP, P_FAR, 0.24, t0, G_STATIC);
        }
      }
      if (h > 0.22 * K && c + (w >> 1) < cols) add(0, c + (w >> 1), top - 1, C_DOT, P_RED, 0.8, T.FAR + 1.5, G_BEACON, 0, 0, F_HALO);
      c += w + (r() < 0.3 ? 1 : 0);
    }
  }

  // Modern city: outlined blocks with window grids, low behind the landmarks, taller toward the edges.
  const H_WORDS = ['HOTEL', 'SKY BAR', 'PAD THAI', 'MASSAGE', 'MUAY THAI', 'NOODLES', 'KARAOKE', 'SOI 11', 'MARKET', '24H', 'SPA', 'RIVERSIDE'];
  function buildCity() {
    const r = mulberry32(2024);
    const i0 = A.c.length;
    const base = Math.max(5, Math.round(cols / 22));
    const PAT = [C_EQ, C_HASH, C_COLON, C_H];
    const wat0 = kcW - colsOf(0.31 * K), wat1 = kcW + colsOf(0.31 * K);
    const pal0 = kcP - colsOf(0.36 * K), pal1 = kcP + colsOf(0.48 * K);
    const blocks = [];
    let c = -2;
    while (c < cols + 2) {

  // A tall glass tower with a spiral of pixel cut-outs winding up it (MahaNakhon-like, unnamed).

  // ---- Wat Arun: Khmer-style prangs on stepped terraces, studded with porcelain ----
  function prangHW(y, main) {
    if (main) { if (y < 0.06) return 0.30; if (y < 0.12) return 0.245; if (y < 0.18) return 0.19; if (y < 0.235) return 0.155; }

          else if (top) A1(d, C_EQ, P_WAT_E, 0.78, F_EDGE);
          else if (ad <= (main ? 1 : 0)) A1(d, C_EQ, P_WAT_E, 0.6, 0);          // steep central stairs

        else if (h < 0.62) A1(d, C_COLON, P_WAT, 0.62, 0);

  function buildWat() {

  // ---- Grand Palace: white crenellated wall, halls with stacked orange/green roofs, chofa, gilded spires, chedi ----

  function buildPalace() {

    const hw = Math.max(8, colsOf(0.17 * K));
    const ridge = hall(kcP, hw, hr - 1, wh + Math.max(3, rowsOf(0.07 * K)), 3, tierH, 1);
    const sw = Math.max(2, colsOf(0.02 * K));

    }

  // Riverside road: street lamps, the road surface and the embankment wall.
  let lampStep = 9;
  function buildRoad() {

  // ---------- Scene state ----------
  const LINGER = 24;   // extra seconds the finished city stays up (one 24 s music loop)

      const f = sF[i];

          if (ta >= 0 && ta < 5) {
            const hue = y * 24 - ta * (reduced ? 2 : 9) + (f & F_PIX ? 3 : 0);
            p = RB[((Math.floor(hue) % 12) + 12) % 12]; b = Math.max(b, f & F_PIX ? 1 : 0.8) * (ta > 4.4 ? (5 - ta) / 0.6 : 1); kind = f & F_PIX ? 1 : 0;
          }
          break;
        }
        case G_WAT: {
          const y = sY[i];
          b = sB[i] * flood + flash;
          if (f & F_STUD) {
            b += 0.14 * Math.sin(gT * 2.1 + i * 1.7);
            if (!reduced && t > T.LIGHTS && hash2(i, (skyT * 2.5) | 0) < 0.025) { chr = C_STAR; p = P_WHITE; b = 1; kind = 1; }
          }
          if (wa >= 0 && wa < WAT_SHOW) {
            const band = Math.exp(-(((y - wrp) / 0.045) ** 2));
            b += band * 0.5;
            if (band > 0.4) { p = band > 0.8 && (f & (F_STUD | F_EDGE)) ? P_WHITE : P_GOLD_HI; kind = f & (F_STUD | F_EDGE) ? 1 : 0; }
            else if (y < wrp) {
              b += 0.18;
              const fl = reduced ? (skyT * 1.5) | 0 : (skyT * 10) | 0;
              if (hash2(i, fl) < (reduced ? 0.02 : 0.06) * (1 - wa / WAT_SHOW)) { chr = C_STAR; p = P_WHITE; b = 1.1; kind = 1; }
              else if (f & F_EDGE) p = P_GOLD_HI;
            }
          }
          break;
        }
        case G_PAL: {
          if (f & F_WIN) {
            const on = reduced || t > T.LIGHTS + sX[i];
            if (!on) { p = P_WOFF; b = 0.34 + flash; }
            else b = 0.66 + 0.2 * hash2(i, 1) + flash;
            break;
          }
          b = sB[i] * flood + flash;
          if (f & F_GOLD) b += 0.08 * Math.sin(gT * 1.4 + sC[i] * 0.3);
          if (f & F_CHOFA) kind = 1;
          if (pa >= 0 && pa < PAL_SHOW) {
            const band = Math.exp(-(((sY[i] - prp) / 0.06) ** 2));
            if (f & (F_GOLD | F_ROOF)) { b += band * 0.45; if (band > 0.5) { p = f & F_GOLD ? P_GOLD_HI : P_GOLD; if (f & F_GOLD) kind = 1; } }
            if ((f & F_CHOFA) && sY[i] < prp) {
              const fl = reduced ? (skyT * 1.5) | 0 : (skyT * 9) | 0;
              if (hash2(i, fl) < (reduced ? 0.2 : 0.55) * (1 - pa / PAL_SHOW)) { chr = C_STAR; p = P_WHITE; b = 1.1; kind = 1; }
            }
          }
          break;
        }
        case G_NEON: {
          const on = signOn(sX[i]);
          if (!on) { b = 0.14; break; }
          b = (0.82 + 0.12 * Math.sin(gT * 3 + sY[i])) * on + flash;
          if (on === 1) kind = f & F_HALO;
          break;
        }
        case G_LAMP: {
          const lit = t - (T.ROAD + sX[i] * 1.0);
          if (lit < 0 && !reduced) { b = 0.3 + flash; break; }
          b = 0.85 + 0.08 * Math.sin(gT * 2.2 + sC[i]) + (lit < 0.3 && !reduced ? 0.4 : 0); kind = 1;
          break;
        }
        case G_BEACON: { const on = reduced || ((skyT + sC[i] * 0.07) % 1.4) < 0.55; b = on ? 1 : 0.35; kind = on ? 1 : 0; break; }
      }
      put(idx, chr, p, b, kind | (f & F_HALO && sG[i] === G_STATIC ? 1 : 0));
    }
  }

  function drawStars() {
    const a = smooth(skyT / 1.2);
    const sh = SH[0];
    for (const s of stars) {
      const col = s.c + sh;
      if (col < 0 || col >= cols) continue;
      const tw = reduced ? 0.8 : 0.5 + 0.5 * Math.sin(skyT * s.sp + s.ph);
      put(s.r * cols + col, s.g, P_STAR, a * s.b * (0.35 + 0.65 * tw), 2);
    }
  }

  // ---------- River: base ripples, stretched warm reflections, pointer and tap rings ----------
  let rips = [];   // { c, r, t0, amp }
  const RIP_LIFE = 2.4, RIP_SPEED = reduced ? 7 : 14;
  function drawWater() {
    const reflA = reduced ? 1 : 0.4 + 0.6 * smooth((t - T.REFL) / 2);
    const depth = rows - hr - 1;
    const gT = skyT;
    const nr = rips.length;
    for (let r = hr + 1; r < rows; r++) {
      const p = (r - hr) / Math.max(1, depth);
      const m = hr - 1 - Math.floor((r - hr - 1) * 0.6);
      const fade = 1 - 0.55 * p;
      const dir = r & 1 ? 1 : -1;
      const drift = gT * (reduced ? 0.15 : 0.5) * dir;
      for (let c = 0; c < cols; c++) {
        const rn = vnoise(c * 0.11 + drift, r * 0.8 + gT * 0.05);
        let off = 0, hl = 0;
        for (let k = 0; k < nr; k++) {
          const R = rips[k], age = gT - R.t0, rad = age * RIP_SPEED, dc = c - R.c;
          if (dc > rad + 6 || dc < -rad - 6) continue;
          const dr = (r - R.r) * 2.1, d = Math.sqrt(dc * dc + dr * dr);
          const w = Math.exp(-(((d - rad) / 1.8) ** 2)) * R.amp * Math.max(0, 1 - age / RIP_LIFE);
          off += w * 2.2 * Math.sin(d * 0.9); if (w > hl) hl = w;
        }
        const dx = Math.round((rn - 0.5) * (1.5 + 4 * p) + off);
        const sc = c + dx;
        const i = r * cols + c;
        if (m >= 0 && sc >= 0 && sc < cols) {
          const src = m * cols + sc;
          if (stampA[src] === stamp && cchar[src] !== C_SP && !(ckind[src] & 2)) {
            const cc = ccol[src], lv = (cc % LEVELS) / 15, sp = (cc / LEVELS) | 0;
            if (lv > 0.48 && sp !== P_SCR) {
              if (rn > 0.42) { put(i, rn > 0.6 ? C_EQ : C_DASH, sp, lv * (0.72 - 0.22 * p) * reflA, 0); continue; }
            } else if (lv > 0.25 && rn > 0.62 && sp !== P_SCR) { put(i, C_DASH, sp, lv * 0.38 * fade * reflA, 0); continue; }
          }
        }
        if (hl > 0.3) { put(i, hl > 0.7 ? C_o : C_TILDE, P_RIP, 0.3 + 0.5 * Math.min(1, hl), 0); continue; }
        if (rn > 0.62) put(i, C_TILDE, P_WATER, (0.26 + 0.3 * (rn - 0.62)) * fade + 0.06, 0);
        else if (rn > 0.47) put(i, C_DASH, P_WATER, 0.2 * fade + 0.05, 0);
        else if (rn > 0.38) put(i, C_DOT, P_WATER, 0.18 * fade + 0.04, 0);
      }
    }
  }

  // ---------- Road traffic: tuk-tuks and pink / green taxis ----------
  let cars = [];   // { x px, v px/s, type 0 tuk-tuk 1 taxi, p palette, user, t0 }
  const TUK_TOP = [...'/~~~]'].map(ci), TUK_BOT = [...'o===o'].map(ci);
  const TAXI_TOP = [...' .-. '].map(ci), TAXI_BOT = [...'o[_]o'].map(ci);
  function spawnCar(type, dir, user, x) {
    const sp = (user ? W / 1.6 : W / (14 + 10 * Math.random())) * (reduced ? 0.4 : 1);
    const p = type === 0 ? NEON[(Math.random() * NEON.length) | 0] : (Math.random() < 0.5 ? P_TAXI_P : P_TAXI_G);
    cars.push({ x: x != null ? x : dir > 0 ? -6 * cw : W + 6 * cw, v: dir * sp, type, p, user: !!user, t0: skyT });
  }
  function seedCars() {
    cars = cars.filter(c => c.user);
    const n = Math.max(3, Math.round(cols / 40));
    for (let i = 0; i < n; i++) spawnCar(i % 3 === 2 ? 1 : 0, i & 1 ? -1 : 1, false, W * (i + 0.3) / n);
  }
  function updateCars(dt) {
    for (const c of cars) {
      c.x += c.v * dt;
      if (!c.user) { if (c.x < -8 * cw) c.x += W + 16 * cw; else if (c.x > W + 8 * cw) c.x -= W + 16 * cw; }
    }
    cars = cars.filter(c => !c.user || (c.x > -20 * cw && c.x < W + 20 * cw));
  }
  function drawCars() {
    const sh = SH[1];
    for (const v of cars) {
      const dir = v.v > 0 ? 1 : -1, c0 = Math.round(v.x / cw) + sh;
      const a = v.user ? 1 : fadeA, kd = v.user ? 2 : 0;
      if (a < 0.02) continue;
      const top = v.type === 0 ? TUK_TOP : TAXI_TOP, bot = v.type === 0 ? TUK_BOT : TAXI_BOT;
      for (let k = 0; k < 5; k++) {
        const c = dir > 0 ? c0 + k : c0 + 4 - k;
        if (top[k] === C_SP && bot[k] === C_SP) continue;
        const tc = dir > 0 ? top[k] : (top[k] === C_SL ? C_BS : top[k] === C_BS ? C_SL : top[k] === C_RB ? C_LB : top[k]);
        if (tc !== C_SP) putCR(c, hr - 2, tc, v.p, (v.user ? 1.05 : 0.85) * a, kd | (v.user ? 1 : 0));
        putCR(c, hr - 1, bot[k], bot[k] === C_o ? P_STEEL : v.p, (bot[k] === C_o ? 0.6 : 0.8) * a, kd);
      }
      putCR(dir > 0 ? c0 + 5 : c0 - 1, hr - 1, C_STAR, P_CAR_W, a, kd | 1);       // headlight
      putCR(dir > 0 ? c0 - 1 : c0 + 5, hr - 1, C_DASH, P_CAR_R, 0.8 * a, kd);      // tail light
      if (v.user) for (let k = 2; k < 16; k++) {                                     // neon speed streak
        const c = dir > 0 ? c0 - k : c0 + 4 + k;
        putCR(c, hr - 1, k < 6 ? C_EQ : C_DASH, v.p, 1 - k / 16, 2);
        if (k < 9) putCR(c, hr - 2, C_DASH, v.p, 0.6 - k / 16, 2);
      }
    }
  }

  // ---------- Boats: dinner cruise and long-tail boats ----------
  let boats = [];   // { type 0 cruise 1 long-tail, x px (left edge), r row, v px/s, user }
  const CRUISE = ['  .o-o-o-o-o-o-o-o.  ', '  |H H H H H H H H|  ', ' [H=H=H=H=H=H=H=H=H] ', '\\===================>'];
  const LONG = ['    _o_    ', '~=--\\_____>'];
  const mirror = s => [...s].reverse().map(x => x === '/' ? '\\' : x === '\\' ? '/' : x === '>' ? '<' : x === '[' ? ']' : x === ']' ? '[' : x).join('');
  const SPR = {};
  [['c', CRUISE], ['l', LONG]].forEach(([k, s]) => { SPR[k + 1] = s.map(r => [...r].map(ci)); SPR[k + -1] = s.map(r => [...mirror(r)].map(ci)); });
  function spawnBoat(type, r, dir, user, x) {
    const L = (type === 0 ? CRUISE : LONG)[0].length;
    const v = (type === 0 ? W / 70 : user ? W / 2.6 : W / 9) * (reduced ? 0.4 : 1);
    boats.push({ type, r, x: x != null ? x : dir > 0 ? -L * cw : W, v: v * dir, L, user: !!user, t0: skyT });
  }
  function seedBoats() {
    boats = boats.filter(b => b.user);
    const depth = rows - hr;
    spawnBoat(0, hr + 4 + Math.round(depth * 0.08), 1, false, W * 0.08);
    spawnBoat(1, hr + 3 + Math.round(depth * 0.3), -1, false, W * 0.75);
  }
  function updateBoats(dt) {
    for (const b of boats) {
      b.x += b.v * dt;
      if (!b.user) { const L = b.L * cw; if (b.v > 0 && b.x > W + L) b.x = -L * 1.2; else if (b.v < 0 && b.x < -L * 1.2) b.x = W + L; }
      if (b.user && !reduced && hash2(frameNo, b.r) < 0.08) ripple(b.x + (b.v > 0 ? 0 : b.L * cw), (b.r + 1) * ch, 0.35);
    }
    boats = boats.filter(b => !b.user || (b.x > -b.L * cw * 1.6 && b.x < W + b.L * cw * 0.6));
  }
  function drawBoats() {
    for (const b of boats) {
      const dir = b.v > 0 ? 1 : -1, spr = SPR[(b.type === 0 ? 'c' : 'l') + dir];
      const a = b.user ? 1 : fadeA, kd = b.user ? 2 : 0;
      if (a < 0.02) continue;
      const c0 = Math.round(b.x / cw), nr = spr.length;
      for (let j = 0; j < nr; j++) {
        const row = b.r - (nr - 1 - j);
        for (let k = 0; k < spr[j].length; k++) {
          const g = spr[j][k];
          if (g === C_SP) continue;
          const c = c0 + k;
          let p = P_BOAT, br = 0.7, kind = kd;
          if (b.type === 0) {
            if (g === C_o) { p = RB[((k + ((skyT * 3) | 0)) % 12 + 12) % 12]; br = 1; kind |= 1; }
            else if (g === C_H) { p = P_PWIN; br = 0.9; }
            else if (j === nr - 1) { p = P_HULL; br = 0.8; }
          } else {
            if (g === C_TILDE) { p = P_SPRAY; br = 0.5 + 0.4 * Math.random(); }
            else if (j === nr - 1 && g !== C_EQ && g !== C_DASH) { p = P_HULL; br = 0.85; }
            else if (g === C_o) { p = P_LAMP; br = 0.9; }
            if (g === C_GT || g === C_LT) { p = P_LOTUS_P; br = 1; kind |= 1; }
          }
          putCR(c, row, g, p, br * a, kind);
        }
      }
      if (b.type === 1) {   // wake behind the stern
        for (let k = 1; k < (b.user ? 18 : 7); k++) {
          const c = dir > 0 ? c0 - k : c0 + b.L + k - 1;
          if (hash2(k, (skyT * 12) | 0) < 0.7) putCR(c, b.r + (k & 1), k < 4 ? C_TILDE : C_DASH, P_SPRAY, (0.75 - k * 0.04) * a, kd);
        }
      }
    }
  }

  // ---------- Krathongs: little lotus floats with a candle, drifting on the river ----------
  let krs = [];   // { x, y, vx, ph, user, t0 }
  function spawnKrathong(x, y, user) {
    if (krs.length > 40) krs.shift();
    krs.push({ x, y, vx: (reduced ? 0.4 : 1) * (W * 0.006 + Math.random() * W * 0.006) * (Math.random() < 0.7 ? 1 : -1), ph: Math.random() * 6.28, user: !!user, t0: skyT, pc: Math.random() < 0.5 ? P_LOTUS_P : P_GOLD });
  }
  function seedKrathongs() {
    krs = krs.filter(k => k.user);
    const n = W < 640 ? 5 : 8;
    for (let i = 0; i < n; i++) spawnKrathong(W * (0.06 + 0.88 * (i + 0.5) / n + (hash2(i, 4) - 0.5) * 0.06), yH + (H - yH) * (0.35 + 0.35 * hash2(i, 8)), false);
  }
  function updateKrathongs(dt) {
    for (const k of krs) {
      k.x += k.vx * dt; k.y -= (reduced ? 0.6 : 1.5) * dt;
      if (!k.user) {   // the scene's own krathongs keep drifting around (reduced motion stays on this view)
        if (k.x > W + 3 * cw) k.x = -3 * cw; else if (k.x < -3 * cw) k.x = W + 3 * cw;
        if (k.y < yH + 4 * ch) k.y = yH + (H - yH) * 0.7;
      }
    }
    krs = krs.filter(k => k.x > -4 * cw && k.x < W + 4 * cw && k.y > yH + 2 * ch);
  }
  function drawKrathongs() {
    for (const k of krs) {
      const a = k.user ? 1 : fadeA, kd = k.user ? 2 : 0;
      if (a < 0.02) continue;
      const c = Math.round(k.x / cw), r = Math.round((k.y + Math.sin(skyT * 1.6 + k.ph) * ch * 0.3) / ch);
      const fl = reduced ? 0.9 : 0.8 + 0.25 * Math.sin(skyT * 9 + k.ph * 3);
      putCR(c, r - 1, C_STAR, P_FLAME, fl * a, kd | 1);
      putCR(c - 1, r, C_LP, P_LOTUS_G, 0.8 * a, kd);
      putCR(c, r, C_AT, k.pc, 0.85 * a, kd);
      putCR(c + 1, r, C_RP, P_LOTUS_G, 0.8 * a, kd);
      putCR(c, r + 1, C_BAR, P_FLAME, 0.4 * a, kd);
      if (r + 2 < rows) putCR(c, r + 2, C_DOT, P_FLAME, 0.25 * a, kd);
    }
  }

  // ---------- Sky lanterns (khom loi) ----------
  let lans = [];   // { x, y, vx, vy, ph, user }
  function spawnLantern(x, y, user) {
    if (lans.length > 40) lans.shift();
    lans.push({ x, y, vx: (Math.random() - 0.5) * W * 0.01, vy: -(H * (0.028 + 0.02 * Math.random())) * (reduced ? 0.5 : 1), ph: Math.random() * 6.28, user: !!user });
  }
  function updateLanterns(dt) {
    for (const l of lans) { l.x += (l.vx + Math.sin(skyT * 0.7 + l.ph) * W * 0.004) * dt; l.y += l.vy * dt; }
    lans = lans.filter(l => l.y > -2 * ch);
  }
  function drawLanterns() {
    for (const l of lans) {
      const a = (l.user ? 1 : fadeA) * clamp(l.y / (H * 0.12), 0, 1);
      if (a < 0.02) continue;
      const fl = reduced ? 0.9 : 0.85 + 0.15 * Math.sin(skyT * 7 + l.ph * 5);
      const c = Math.round(l.x / cw), r = Math.round(l.y / ch);
      if (l.y > H * 0.15) {
        putCR(c - 1, r, C_LP, P_LANT, 0.8 * a, 3); putCR(c, r, C_O, P_LANT_C, fl * a, 3); putCR(c + 1, r, C_RP, P_LANT, 0.8 * a, 3);
        putCR(c, r + 1, C_DOT, P_FLAME, fl * a * 0.8, 2);
      } else putCR(c, r, l.y > H * 0.07 ? C_O : C_o, P_LANT_C, fl * a * 0.9, 3);
    }
  }

  // ---------- Shooting stars ----------
  let shooters = [];
  function spawnShooter(x, y, user) {
    const dir = x > W * 0.5 ? -1 : 1;
    const sp = (reduced ? 0.35 : 1) * Math.min(W, H) * (0.7 + 0.3 * Math.random());
    const ang = 0.38 + 0.2 * Math.random();
    shooters.push({ x: x - dir * Math.cos(ang) * sp * 0.25, y: y - Math.sin(ang) * sp * 0.25, vx: dir * Math.cos(ang) * sp, vy: Math.sin(ang) * sp, age: 0, life: reduced ? 1.8 : 0.9 });
    music('event', 'shoot', { x: x / W, user: !!user });
  }
  function updateShooters(dt) {
    for (const s of shooters) { s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; }
    shooters = shooters.filter(s => s.age < s.life);
  }
  function drawShooters() {
    for (const s of shooters) {
      const a = 1 - s.age / s.life, sp = Math.hypot(s.vx, s.vy), ux = s.vx / sp, uy = s.vy / sp;
      const chr = ux * uy > 0 ? C_BS : C_SL;
      for (let k = 0; k < 12; k++) {
        const x = s.x - ux * k * cw * 0.9, y = s.y - uy * k * cw * 0.9;
        if (y >= yH - 4 * ch) continue;
        putXY(x, y, k === 0 ? C_STAR : k < 4 ? chr : C_DOT, k === 0 ? P_WHITE : P_STAR, a * (1.1 - k * 0.08), k === 0 ? 3 : 2);
      }
    }
  }

  // ---------- Drawing ----------
  // Bucket by colour so fillStyle changes once per colour, not once per cell.
  function drawCells(alpha) {
    counts.fill(0);
    for (let i = 0; i < nT; i++) counts[ccol[touched[i]]]++;
    let acc = 0;
    for (let c = 0; c < NCOLOR; c++) { const n = counts[c]; counts[c] = acc; acc += n; }
    for (let i = 0; i < nT; i++) { const c = touched[i]; order[counts[ccol[c]]++] = c; }
    let cur = -1, n = 0, fw = -1;
    for (let i = 0; i < nT; i++) {
      const c = order[i];
      if (cchar[c] === C_SP) continue;
      const f = ckind[c] & 2;
      if (f !== fw) { fw = f; ctx.globalAlpha = f ? 1 : alpha; }
      const cc = ccol[c];
      if (cc !== cur) { cur = cc; ctx.fillStyle = COLSTR[cc]; }
      const row = (c / cols) | 0;
      ctx.fillText(CH[cchar[c]], (c - row * cols) * cw, row * ch);
      n++;
    }
    ctx.globalAlpha = 1;
    letters = n;
  }

  // Light halos: one pre-rendered radial sprite per palette entry.
  let halos = [];
  function makeHalos() {
    const R = Math.max(6, cw * 2.2);
    halos = PAL.map(([r, g, b]) => {
      const c = document.createElement('canvas');
      c.width = c.height = Math.ceil(R * 2);
      const x = c.getContext('2d'), gr = x.createRadialGradient(R, R, 0, R, R, R);
      gr.addColorStop(0, 'rgba(255,255,255,0.7)');
      gr.addColorStop(0.2, `rgba(${r | 0},${g | 0},${b | 0},0.6)`);
      gr.addColorStop(0.55, `rgba(${r | 0},${g | 0},${b | 0},0.14)`);
      gr.addColorStop(1, `rgba(${r | 0},${g | 0},${b | 0},0)`);
      x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
      return c;
    });
  }
  function drawHalos(alpha) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < nT; i++) {
      const c = touched[i];
      if (!(ckind[c] & 1) || cchar[c] === C_SP) continue;
      const img = halos[(ccol[c] / LEVELS) | 0], row = (c / cols) | 0;
      ctx.globalAlpha = clb[c] * (ckind[c] & 2 ? 1 : alpha) * 0.6;
      ctx.drawImage(img, (c - row * cols + 0.5) * cw - img.width / 2, (row + 0.5) * ch - img.height / 2);
    }
    ctx.restore();
  }

  // Bloom: shrink the frame, remove the background with 'difference', blur, and add it back on top.
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  const GLOW_DIV = 5, GLOW_A = 0.8;
  function drawGlow() {
    const gw = Math.ceil(W / GLOW_DIV), gh = Math.ceil(H / GLOW_DIV);
    if (glow.width !== gw || glow.height !== gh) { glow.width = gw; glow.height = gh; }
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'copy';
    gctx.filter = 'blur(2px)';
    gctx.drawImage(canvas, 0, 0, gw, gh);
    gctx.filter = 'none';
    gctx.globalCompositeOperation = 'difference';
    gctx.setTransform(gw / W, 0, 0, gh / H, 0, 0);
    gctx.fillStyle = bgGrad;
    gctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = GLOW_A;
    ctx.drawImage(glow, 0, 0, W, H);
    ctx.restore();
  }

  // Title typed out at the bottom in warm gold neon.
  let typed = 0;
  function titleCount(tt) {
    if (tt < T.TITLE) return 0;
    if (tt < TB_START) return Math.min(TITLE_A.length, 1 + Math.floor((tt - T.TITLE) / TA_STEP));
    return TITLE_A.length + Math.min(TITLE_B.length, 1 + Math.floor((tt - TB_START) / TB_STEP));
  }
  function drawTitle(alpha) {
    const n = titleCount(t);
    typed = n;
    if (!n || alpha < 0.01) return;
    const full = TITLE_A + TITLE_B;
    const tf = Math.round(clamp(Math.min(W * 0.075, H * 0.06), 20, 58));
    ctx.save();
    ctx.font = `700 ${tf}px ${MONO}`;
    ctx.textBaseline = 'middle';
    const adv = ctx.measureText('M').width * 1.08;
    const y = H - Math.max(tf * 1.9, (H - yH) * 0.3) - (W < 640 ? 18 : 0);
    const x0 = W / 2 - adv * full.length / 2;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(255,150,40,0.95)';
    ctx.shadowBlur = tf * 0.45;
    for (let k = 0; k < n; k++) {
      const s = full[k];
      if (s === ' ') continue;
      const tk = k < TITLE_A.length ? T.TITLE + k * TA_STEP : TB_START + (k - TITLE_A.length) * TB_STEP;
      const fresh = reduced ? 0 : clamp(1 - (t - tk) / 0.25, 0, 1);
      ctx.fillStyle = fresh > 0 ? `rgb(255,${(200 + 55 * fresh) | 0},${(110 + 145 * fresh) | 0})` : '#ffc861';
      ctx.fillText(s, x0 + k * adv, y);
    }
    const doneT = TB_START + TITLE_B.length * TB_STEP;
    if (!reduced && t < doneT + 1.6 && (skyT % 0.8) < 0.45) { ctx.fillStyle = '#ffe7b0'; ctx.fillText('_', x0 + n * adv, y); }
    // Small Thai line under the title once it is complete.
    const sub = smooth((t - doneT - 0.2) / 0.8);
    if (sub > 0) {
      ctx.globalAlpha = alpha * sub * 0.85;
      ctx.shadowBlur = tf * 0.3;
      ctx.font = `500 ${Math.round(tf * 0.4)}px "Noto Sans Thai", "Noto Sans TC", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd9a0';
      ctx.fillText('กรุงเทพฯ ยามราตรี  ·  RIVER OF KINGS', W / 2, y + tf * 0.82);
    }
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.font = cellFont;
    const alpha = reduced ? 1 : Math.min(smooth(t / 0.8), 1 - smooth((t - T.FADE) / T.FADE_DUR));
    fadeA = alpha;
    stamp++; nT = 0; built = 0; resolving = 0;
    drawStars();
    drawShooters();
    if (alpha > 0.001) {
      drawSprites();
      drawCars();
      drawWater();
    }
    drawBoats();
    drawKrathongs();
    drawLanterns();
    drawCells(alpha);
    drawHalos(alpha);
    drawGlow();
    drawTitle(alpha);
  }

  // ---------- Loop, HUD, controls ----------
  let paused = false, last = performance.now();
  let par = 0, parTo = 0;
  let frames = 0, fpsT = last, fps = 0, hudT = 0, nextShoot = 7;

  function phaseName() {
    let s = PHASES[0];
    for (const p of PHASES) if (t >= p[0]) s = p;
    return zh ? s[2] : s[1];
  }
  function updateHud(now) {
    const tail = paused ? (zh ? '暫停' : 'paused') : `${fps} fps`;
    const pct = nSolid ? (100 * built / nSolid).toFixed(1) : '0.0';
    hudEl.textContent = W < 640 ? `${phaseName()}  ${pct}%  ${tail}`
      : zh ? `階段 ${phaseName()}  完成 ${pct}%  字元 ${letters.toLocaleString('en-US')}  ${tail}`
           : `phase ${phaseName()}  built ${pct}%  letters ${letters.toLocaleString('en-US')}  ${tail}`;
    hudT = now;
  }

  let seeded = false;
  function seedAll() { seedCars(); seedBoats(); seedKrathongs(); }
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) { resize(); if (!seeded) { seeded = true; if (reduced) seedAll(); } }
    if (!paused) {
      const t1 = t, typed1 = titleCount(t);
      skyT += dt;
      if (!reduced) {
        // Linger on the finished city: the scene clock waits just before the fade for one more music loop.
        if (t < T.FADE - 0.3) linger = 0;
        if (linger < LINGER && t + dt >= T.FADE - 0.3) { t = Math.max(t, T.FADE - 0.3); linger += dt; } else t += dt;
        if (t >= T.END) {
          t = 0; music('restart');
          cars = cars.filter(c => c.user); boats = boats.filter(b => b.user); krs = krs.filter(k => k.user); lans = lans.filter(l => l.user);
        }
        if (t > 3 && t < T.FADE && skyT > nextShoot) {
          spawnShooter(W * (0.15 + 0.7 * Math.random()), H * (0.05 + 0.12 * Math.random()));
          nextShoot = skyT + 8 + Math.random() * 6;
        }
        // Timeline-driven life on the road and the river (also without sound).
        const cr = x => t1 < x && x <= t;
        if (cr(T.ROAD)) seedCars();
        if (cr(T.BOATS)) seedBoats();
        if (cr(T.KRATHONG)) seedKrathongs();
        if (cr(T.LANTERNS)) for (let i = 0; i < 5; i++) spawnLantern(W * (0.12 + 0.76 * Math.random()), yH - ch * (4 + 6 * Math.random()), false);
      }
      frameNo++;
      updateCars(dt);
      updateBoats(dt);
      updateKrathongs(dt);
      updateLanterns(dt);
      updateShooters(dt);
      rips = rips.filter(r => skyT - r.t0 < RIP_LIFE);
      if (Math.abs(parTo - par) > 0.002) par += (parTo - par) * Math.min(1, dt * 1.6);
      SH[0] = Math.round(-par * 1.2); SH[1] = Math.round(-par * 2.6);
      render(); dirty = false; frames++;
      soundCues(t1, t, typed1);
    } else if (dirty) { render(); dirty = false; frames++; }
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  // ---------- Sound cues ----------
  const music = (fn, ...a) => window.AsciiAudio && AsciiAudio[fn](...a);
  const crossed = (a, b, x) => a < x && x <= b;
  function soundCues(a, b, typed1) {
    if (!window.AsciiAudio || b < a) return;
    if (crossed(a, b, T.MOON)) music('event', 'moon');
    if (crossed(a, b, T.CITY)) music('event', 'build', { dur: 1.6, low: 1 });
    if (crossed(a, b, T.TOWER)) music('event', 'build', { dur: T.TOWER_DUR });
    if (crossed(a, b, T.WAT)) music('event', 'build', { dur: T.WAT_DUR, warm: 1 });
    if (crossed(a, b, T.PALACE)) music('event', 'build', { dur: T.PALACE_DUR, warm: 1 });
    if (resolving > 0) music('event', 'resolve');
    if (crossed(a, b, T.LIGHTS)) music('event', 'lights');
    signs.forEach((s, i) => { if (crossed(a, b, s.on)) music('event', 'neon', { i }); });
    if (crossed(a, b, T.ROAD)) music('event', 'lamps');
    if (crossed(a, b, T.KRATHONG)) music('event', 'krathong', { x: 0.5, auto: 1 });
    if (crossed(a, b, T.LANTERNS)) music('event', 'lantern', { x: 0.5 });
    const n = titleCount(b);
    if (n > typed1) music('event', 'type', { space: (TITLE_A + TITLE_B)[n - 1] === ' ' });
    if (crossed(a, b, TB_START + TITLE_B.length * TB_STEP + 0.1)) music('event', 'titleDone');
    if (crossed(a, b, T.FADE)) music('event', 'fade');
  }

  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); music(paused ? 'pause' : 'resume'); }
  function replay() {
    t = T_START; shooters = []; rips = []; watT = palT = towT = -99; paused = false; dirty = true; linger = 0;
    cars = []; boats = []; krs = []; lans = [];
    if (reduced) seedAll();
    music('resume'); music('restart');
  }

  // Hit tests in screen pixels (each landmark lives on its own parallax layer).
  const isBuilt = t0 => reduced || (t >= t0 && t < T.FADE + T.FADE_DUR * 0.6);
  function onLandmark(arr, layer, x, y) {
    const c = Math.floor(x / cw) - SH[layer], r = y / ch;
    for (let d = -1; d <= 1; d++) {
      const k = c + d + 6;
      if (k >= 0 && k < arr.length && arr[k] < 32767 && r >= arr[k] - 1 && r < hr - 2) return true;
    }
    return false;
  }
  function ripple(x, y, amp) {
    if (rips.length > 10) rips.shift();
    rips.push({ c: x / cw, r: y / ch, t0: skyT, amp });
  }
  function tapAt(x, y) {
    const r = y / ch;
    if (r >= hr + 1) {
      ripple(x, y, 1.3);
      if (y < yH + (H - yH) * 0.42) {
        const dir = x < W / 2 ? 1 : -1;
        spawnBoat(1, Math.max(hr + 3, Math.round(r)), dir, true);
        music('event', 'longtail', { x: x / W });
      } else { spawnKrathong(x, y, true); music('event', 'krathong', { x: x / W }); }
    } else if (r >= hr - 3.5) {
      spawnCar(0, x < W / 2 ? 1 : -1, true);
      music('event', 'tuktuk', { x: x / W });
    } else if (isBuilt(T.WAT + T.WAT_DUR * 0.5) && onLandmark(topCol.wat, 1, x, y)) {
      watT = skyT; music('event', 'wat', { x: x / W });
    } else if (isBuilt(T.PALACE + T.PALACE_DUR * 0.6) && onLandmark(topCol.pal, 1, x, y)) {
      palT = skyT; music('event', 'palace', { x: x / W });
    } else if (isBuilt(T.TOWER + T.TOWER_DUR) && onLandmark(topCol.tow, 0, x, y)) {
      towT = skyT; music('event', 'tower', { x: x / W });
    } else {
      const n = reduced ? 2 : 3 + ((Math.random() * 3) | 0);
      for (let i = 0; i < n; i++) spawnLantern(x + (Math.random() - 0.5) * cw * 10, y + Math.random() * ch * 3, true);
      music('event', 'lantern', { x: x / W, user: 1 });
    }
    dirty = true;
  }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
  });
  // A press only counts as a tap if it moved less than 8 px; moving (or dragging a finger)
  // shifts the parallax and trails soft ripples across the river.
  let downX = 0, downY = 0, pressed = false, dragged = false, tapTimer = 0, tapResumed = false, lastRip = 0, ripX = -1e9, ripY = 0;
  const setPar = e => { if (!reduced) parTo = clamp(e.clientX / W * 2 - 1, -1, 1); };
  const moveRipple = e => {
    if (e.clientY <= yH + ch || paused) return;
    if (skyT - lastRip < 0.15 || Math.hypot(e.clientX - ripX, e.clientY - ripY) < cw * 3) return;
    lastRip = skyT; ripX = e.clientX; ripY = e.clientY;
    ripple(e.clientX, e.clientY, 0.6);
  };
  canvas.addEventListener('pointerdown', e => {
    pressed = true; dragged = false; downX = e.clientX; downY = e.clientY;
    if (e.pointerType !== 'mouse') setPar(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' || pressed) { setPar(e); moveRipple(e); }
    if (pressed && Math.hypot(e.clientX - downX, e.clientY - downY) >= 8) dragged = true;
  });
  const ptrOff = () => { pressed = false; parTo = 0; };
  canvas.addEventListener('pointerleave', ptrOff);
  canvas.addEventListener('pointercancel', ptrOff);
  canvas.addEventListener('pointerup', e => {
    const wasTap = pressed && !dragged;
    pressed = false;
    if (e.pointerType !== 'mouse') parTo = 0;
    if (e.button > 0 || !wasTap) return;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = 0; if (!tapResumed) togglePause(); return; }
    tapTimer = setTimeout(() => { tapTimer = 0; }, 280);
    tapResumed = paused;
    if (paused) { togglePause(); return; }   // a tap on the paused scene just resumes it
    tapAt(e.clientX, e.clientY);
  });

  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '點寺廟/皇宮 · 點河面放船或水燈 · 點路面嘟嘟車 · 點天空放天燈 · 雙擊暫停' : 'tap temples · river: boat / krathong · road: tuk-tuk · sky: lanterns')
                             : (zh ? '點鄭王廟點亮塔層 · 點大皇宮響風鈴 · 點河面放長尾船或水燈 · 點路面叫嘟嘟車 · 點天空放天燈 · 雙擊/空白鍵 暫停 · R 重播 · M 音樂'
                                   : 'click Wat Arun: light · Grand Palace: chimes · river: boat / krathong · road: tuk-tuk · sky: lanterns · Space pause · R replay · M music');

  // Score: an original Thai-flavoured piece in G major pentatonic at 120 bpm, 12 bars = one 24 s scene
  // loop (restarted every loop). Bars 0-1: khim-like hammered-string arpeggios over a low drone while the
  // sky and the city appear; bars 2-9: ching / chap finger cymbals, a soft hand-drum groove and bass, a
  // ranat-like xylophone running in eighths and the khim melody; bars 10-11: the groove drops out for the fade.
  if (window.AsciiAudio) AsciiAudio.init({
    bpm: 120, master: 0.7, reverb: 0.28, reverbTime: 2.6,
    build(a) {
      const N = AsciiAudio.notes, TR = AsciiAudio.transpose, LOOP = 48;
      const ROOTS = ['G2', 'G2', 'G2', 'E2', 'C3', 'D3', 'G2', 'E2', 'A2', 'D3', 'G2', 'G2'];
      const SHIFT = [0, 0, 0, 1, 2, 1, 0, 1, 2, 1, 0, 0];
      const SC = ['G4', 'A4', 'B4', 'D5', 'E5', 'G5', 'A5', 'B5', 'D6', 'E6'];
      const RUN = [0, 2, 4, 2, 1, 3, 5, 3];
      // Khim: hammered strings, a bright pluck with a soft octave ring; long notes get a tremolo.
      const khim = (tt, note, dur, vel, pan = -0.2) => {
        const n = dur > 0.6 ? Math.min(6, Math.floor(dur / 0.125)) : 1;
        for (let k = 0; k < n; k++) a.pluck(tt + k * 0.125, note, 0.5, { type: 'sawtooth', vel: vel * (k ? 0.55 - k * 0.06 : 1), pan, wet: 0.32 });
        a.musicBox(tt + 0.004, TR(note, 12), 0.7, { vel: vel * 0.14, pan: -pan, wet: 0.4 });
      };
      // Ranat: a woody xylophone, a short triangle knock plus a little square bite.
      const ranat = (tt, note, vel) => {
        a.celesta(tt, note, 0.35, { vel, pan: 0.3, wet: 0.25 });
        a.pluck(tt, note, 0.15, { type: 'square', vel: vel * 0.22, pan: 0.3, wet: 0.2 });
      };
      const ching = (tt, vel) => {   // open finger-cymbal ring
        a.bell(tt, 2380, 0.9, { vel: vel * 0.5, pan: 0.15, wet: 0.3 });
        a.noise(tt, { dur: 0.45, filter: 'highpass', freq: 6500, attack: 0.002, vel: vel * 0.35, pan: 0.15, wet: 0.2 });
      };
      const chap = (tt, vel) => a.noise(tt, { dur: 0.05, filter: 'bandpass', freq: 4800, q: 3, attack: 0.002, vel, pan: 0.15, wet: 0.1 });
      a.every(0.5, (tt, s) => {
        const beat = (s * 0.5) % LOOP, bar = Math.floor(beat / 4), q = beat % 4;
        const root = ROOTS[bar], groove = bar >= 2 && bar <= 9;
        if (q === 0 && bar < 11) a.pad(tt, ['G2', 'D3', 'G3'], a.beats(bar === 10 ? 7 : 4), { vel: 0.26, cutoff: 900, attack: 0.5, release: 1.6 });
        if (groove) {
          // Ranat running line (eighths) on the pentatonic, shifting with the bar.
          const k = RUN[(s % 8)] + SHIFT[bar];
          ranat(tt, SC[Math.min(SC.length - 1, k + 2)], (s & 1) ? 0.16 : 0.24);
          // Ching on the off-beats, chap on the beats.
          if (q === 1 || q === 3) ching(tt, 0.2);
          if (q === 0 || q === 2) chap(tt, 0.16);
          // Hand drum: low tones and a slap.
          if (q === 0 || q === 2.5) a.thud(tt, { freq: 120, vel: 0.5, bus: 'music' });
          if (q === 1.5 || q === 3) { a.thud(tt, { freq: 260, vel: 0.22, bus: 'music' }); a.noise(tt, { dur: 0.06, filter: 'bandpass', freq: 1100, q: 2, vel: 0.12, wet: 0.08 }); }
          if (q === 0) a.bass(tt, root, a.beats(1.4), { vel: 0.5 });
          if (q === 2) a.bass(tt, TR(root, 7), a.beats(0.9), { vel: 0.36 });
          if (q === 3.5) a.bass(tt, TR(root, 12), a.beats(0.4), { vel: 0.3 });
        } else {
          if (q === 0) { ching(tt, 0.16); a.bass(tt, root, a.beats(3.5), { vel: 0.32 }); }
          if (bar >= 10 && q === 2) ching(tt, 0.12);
        }
      });
      a.part(N('G4:.5 B4 D5 G5 D5 B4 G4 D4 | E4:.5 G4 B4 E5 D5:2'), (tt, e) => khim(tt, e.note, e.sec, 0.46), { length: LOOP, offset: 0 });
      a.part(N('D5:.5 E5 G5:1 E5:.5 D5 B4:1 | A4:.5 B4 D5:1 E5:.5 D5 B4 A4 | G4:1 A4:.5 B4 D5:1 B4:.5 A4 | E4:1 G4:.5 A4 G4:2'),
        (tt, e) => khim(tt, e.note, e.sec, 0.5), { length: LOOP, offset: 8 });
      a.part(N('G5:.5 E5 D5 E5 G5:1 A5 | G5:.5 E5 D5:1 B4 D5 | E5:.5 G5 E5 D5 B4:1 A4 | B4:.5 A4 G4:1 r:2'),
        (tt, e) => {
          khim(tt, e.note, e.sec, 0.46, 0.1);
          a.lead(tt, TR(e.note, -12), e.sec * 0.9, { vel: 0.22, cutoff: 1800, pan: -0.1, wet: 0.35 });   // soft pi-like double
        }, { length: LOOP, offset: 24 });
      a.part(N('D5:.5 B4 A4 G4 E4:1 D4 | G4:4'), (tt, e) => khim(tt, e.note, e.sec, 0.42), { length: LOOP, offset: 40 });

      // Sound effects in sync with the picture.
      const SP = AsciiAudio.scale('G5', 'pentatonic', 10);
      const pan = x => ((x == null ? 0.5 : x) * 2 - 1) * 0.8;
      a.on('moon', (a, d, t) => a.chime(t, 'D6', 3, { vel: 0.14 }));
      a.on('build', (a, d, t) => a.sweep(t, d.dur || 2, { from: d.low ? 80 : d.warm ? 200 : 140, to: d.low ? 700 : d.warm ? 1200 : 1500, q: 2.2, attack: (d.dur || 2) * 0.85, vel: 0.24, bus: 'sfx', wet: 0.3 }), { gap: 0.5 });
      a.on('resolve', (a, d, t) => a.tick(t, { vel: 0.05 }), { gap: 0.13 });
      a.on('lights', (a, d, t) => ['G5', 'B5', 'D6', 'E6', 'G6'].forEach((n, i) => a.bell(t + i * 0.1, n, 1.6, { vel: 0.1, bus: 'sfx', pan: -0.5 + i * 0.25, wet: 0.5 })));
      a.on('neon', (a, d, t) => {
        a.noise(t, { dur: 0.2, filter: 'bandpass', freq: 160 + (d.i % 4) * 40, q: 6, attack: 0.01, vel: 0.45, bus: 'sfx', wet: 0.1 });
        a.ding(t + 0.06, SP[(d.i * 3) % SP.length], { vel: 0.07, dur: 1 });
      }, { gap: 0.12 });
      a.on('lamps', (a, d, t) => { for (let i = 0; i < 6; i++) a.ding(t + i * 0.16, SP[i + 2], { vel: 0.05, pan: -0.7 + i * 0.28, dur: 1 }); });
      a.on('type', (a, d, t) => { if (!d.space) a.tick(t, { vel: 0.16 }); }, { gap: 0.05 });
      a.on('titleDone', (a, d, t) => { a.chime(t, 'G5', 3, { vel: 0.22 }); a.bell(t, 'G2', 3, { vel: 0.12, bus: 'sfx', wet: 0.6 }); });
      a.on('fade', (a, d, t) => a.sweep(t, T.FADE_DUR, { from: 3000, to: 300, q: 1.2, attack: 0.8, vel: 0.12, bus: 'sfx', wet: 0.6 }));
      // Taps.
      a.on('wat', (a, d, t) => {
        // A ranat run climbing the tiers, then porcelain sparkles.
        const p = pan(d.x);
        ['G4', 'A4', 'B4', 'D5', 'E5', 'G5', 'A5', 'B5', 'D6', 'E6'].forEach((n, i) => {
          a.celesta(t + i * 0.12, n, 0.5, { vel: 0.3, bus: 'sfx', pan: p, wet: 0.35 });
          a.pluck(t + i * 0.12, n, 0.15, { type: 'square', vel: 0.07, bus: 'sfx', pan: p, wet: 0.2 });
        });
        a.sparkle(t + 1.3, { count: 7, vel: 0.12, notes: SP, spread: 0.08 });
      }, { gap: 0.3 });
      a.on('palace', (a, d, t) => {
        // Temple bells: a soft low gong and a shower of little wind chimes under the eaves.
        const p = pan(d.x);
        a.bell(t, 'G2', 3.5, { vel: 0.28, bus: 'sfx', pan: p, wet: 0.6 });
        a.bell(t, 'D3', 3, { vel: 0.12, bus: 'sfx', pan: p, wet: 0.6 });
        for (let i = 0; i < 14; i++) a.bell(t + 0.15 + i * 0.09 + Math.random() * 0.06, SP[(Math.random() * SP.length) | 0], 1.4,
          { vel: 0.07 + Math.random() * 0.05, bus: 'sfx', pan: p + (Math.random() - 0.5) * 0.6, wet: 0.55 });
      }, { gap: 0.4 });
      a.on('tower', (a, d, t) => { a.whoosh(t, { dur: 0.8, freq: 500, freqEnd: 4000, vel: 0.08, pan: pan(d.x) }); a.sparkle(t + 0.1, { count: 6, vel: 0.12, notes: SP }); }, { gap: 0.3 });
      a.on('longtail', (a, d, t) => {
        // Putt-putt of the long-tail engine passing by, then the spray.
        const p = pan(d.x);
        for (let i = 0; i < 22; i++) a.noise(t + i * 0.07, { dur: 0.06, filter: 'bandpass', freq: 180 + i * 6, q: 3, attack: 0.004, vel: 0.5 * Math.sin(Math.PI * (i + 1) / 23), pan: p * (1 - i / 11), bus: 'sfx', wet: 0.1 });
        a.whoosh(t + 0.2, { dur: 1.4, freq: 1200, freqEnd: 4500, q: 0.8, vel: 0.1, pan: -p });
      }, { gap: 0.4 });
      a.on('krathong', (a, d, t) => {
        a.pop(t, { freq: 300, vel: d.auto ? 0.1 : 0.2, pan: pan(d.x) });
        ['D5', 'G5', 'B5'].forEach((n, i) => khim(t + 0.1 + i * 0.14, n, 0.4, d.auto ? 0.14 : 0.26, pan(d.x)));
      }, { gap: 0.2 });
      a.on('tuktuk', (a, d, t) => {
        const p = pan(d.x);
        a.lead(t, 'E5', 0.12, { type: 'square', vel: 0.45, cutoff: 2600, pan: p, bus: 'sfx', wet: 0.1 });
        a.lead(t + 0.17, 'E5', 0.16, { type: 'square', vel: 0.45, cutoff: 2600, pan: p, bus: 'sfx', wet: 0.1 });
        for (let i = 0; i < 16; i++) a.noise(t + 0.1 + i * 0.05, { dur: 0.04, filter: 'bandpass', freq: 320, q: 4, vel: 0.3 * (1 - i / 16), pan: p - i * 0.06 * Math.sign(p || 1), bus: 'sfx', wet: 0.05 });
      }, { gap: 0.3 });
      a.on('lantern', (a, d, t) => {
        a.whoosh(t, { dur: 1.2, freq: 300, freqEnd: 1500, q: 0.8, vel: d.user ? 0.07 : 0.04, pan: pan(d.x) });
        ['G5', 'D6', 'G6'].forEach((n, i) => a.bell(t + 0.2 + i * 0.22, n, 2, { vel: d.user ? 0.1 : 0.06, bus: 'sfx', pan: pan(d.x), wet: 0.6 }));
      }, { gap: 0.3 });
      a.on('shoot', (a, d, t) => { a.whoosh(t, { dur: 0.6, freq: 2000, freqEnd: 6500, q: 1.4, vel: d.user ? 0.12 : 0.06, pan: pan(d.x), wet: 0.5 }); a.ding(t + 0.25, 'E7', { vel: d.user ? 0.08 : 0.04, pan: pan(d.x) }); }, { gap: 0.3 });
    }
  });

  requestAnimationFrame(frame);
})();
