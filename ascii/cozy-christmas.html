<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASCII Cozy Christmas Room | Alex Li (李翔緯)</title>
  <meta name="description" content="A warm wood-panelled living room on Christmas night, drawn entirely with coloured ASCII characters: a crackling fire, a twinkling tree, string lights, an old CRT TV flipping channels, a blinking 12:00 VCR clock, snow falling past the window and a sleeping orange cat. Tap the TV, the tree, the fire or the cat. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#140b07">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #140b07;
      --sky: #140b07;
      --text: #f6ede2;
      --muted: #cdb39a;
      --accent: #f59e42;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: manipulation; /* no double-tap zoom: double-tap means replay */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(245, 158, 66, 0.45);
      background: rgba(245, 158, 66, 0.12);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(245, 158, 66, 0.28);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.75;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
      .hint { bottom: 30px; } /* stack above the HUD on narrow screens */
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ASCII Cozy Christmas Room</h1>
  <a class="back" href="./">← ASCII</a>
  <canvas id="c" role="img" aria-label="Animated ASCII drawing of a cozy living room on Christmas night: a crackling fireplace with stockings, a twinkling Christmas tree with presents, string lights, an old TV changing channels, a VCR clock blinking 12:00, snow falling outside the window and an orange cat asleep on the rug"></canvas>
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>

<script src="ascii-audio.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Timeline (seconds of scene time) ----------
  // The room starts dark: the fire catches, the string lights come on left to right,
  // the tree lights climb, the star flares, then the TV clicks on and the clock starts blinking.
  const T = { FIRE: 0.3, FIRE_DUR: 2.2, DARK: 2.6, STRING: 1.2, TREE: 2.4, STAR: 3.4, TV: 4.0, CLOCK: 4.4, DONE: 5 };
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';
  const TAU = Math.PI * 2;

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash(a, b) {
    let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function inTri(px, py, ax, ay, bx, by, cx, cy) {
    const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
    const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
    const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
    return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
  }
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const u = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
    return Math.hypot(px - ax - u * dx, py - ay - u * dy);
  }

  // ---------- Scene space ----------
  // The room is designed in a fixed 864 x 985 "scene" box (x 8..872, y 60..1045). It is fitted to the
  // screen and every character cell samples the scene at its centre. Walls, floor and string lights
  // carry on past the box so wide and tall screens are filled.
  const SX0 = 8, SY0 = 60, SW = 864, SH = 985;
  const FLOOR_Y = 760;

  // ---------- Lights: colour modes and patterns ----------
  const MODES = [
    { en: 'classic', zh: '經典', pat: 'twinkle',
      cols: [[255, 70, 60], [70, 225, 90], [80, 140, 255], [255, 205, 60], [255, 140, 40], [205, 95, 255]] },
    { en: 'candy cane', zh: '紅綠', pat: 'alternate', cols: [[255, 55, 50], [60, 235, 85]] },
    { en: 'icicle', zh: '冰晶', pat: 'sparkle', cols: [[235, 242, 255], [95, 155, 255], [140, 220, 255]] },
    { en: 'sugarplum', zh: '糖梅', pat: 'chase', cols: [[195, 95, 255], [60, 230, 225], [255, 120, 205]] },
    { en: 'candlelight', zh: '燭光', pat: 'breathe', cols: [[255, 214, 130], [255, 172, 70]] },
    { en: 'rainbow', zh: '彩虹', pat: 'wave',
      cols: [[255, 60, 60], [255, 150, 40], [255, 230, 60], [70, 230, 90], [70, 160, 255], [190, 90, 255]] }
  ];
  let mode = 0, prevMode = 0, modeT = -10, lastModeTap = -100;

  // Light list: kind 0 string bulb, 1 tree, 2 mantel garland, 3 wreath.
  // Fixed lights (tree, garland, wreath) are seeded; string bulbs are rebuilt on resize to span the screen.
  const fixedLights = [];
  (function buildFixedLights() {
    const r = mulberry32(1225);
    let n = 0;
    while (n < 96) {
      const y = 200 + 452 * Math.sqrt(r());
      const w = treeHalf(y);
      if (w <= 0) continue;
      const x = 160 + (r() * 2 - 1) * w * 0.92;
      fixedLights.push({ k: 1, x, y, o: (y - 185) / 24 + (x - 160) / 26, ph: r() * TAU, f: 1.5 + 2.5 * r(), c: (r() * 60) | 0, on: 0 });
      n++;
    }
    for (let x = 586, i = 0; x < 868; x += 21, i++)
      fixedLights.push({ k: 2, x, y: 466 + 4 * Math.sin(x * 0.11), o: i, ph: r() * TAU, f: 1.5 + 2 * r(), c: i, on: 0 });
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * TAU + 0.2;
      fixedLights.push({ k: 3, x: 718 + Math.cos(a) * 49, y: 300 + Math.sin(a) * 49, o: i, ph: r() * TAU, f: 1.5 + 2 * r(), c: i * 2 + 1, on: 0 });
    }
  })();
  let lights = fixedLights.slice();

  function treeHalf(y) {
    const ty = (y - 185) / 505;
    if (ty < 0 || ty > 1) return -1;
    const f = (ty * 6) % 1;
    return (8 + ty * 128) * (0.7 + 0.3 * Math.pow(f, 0.6));
  }
  const wireY = x => { const q = ((((x - 8) % 116) + 116) % 116) / 58 - 1; return 74 + 15 * (1 - q * q); };

  // ---------- Presents (front to back) ----------
  const GIFTS = [
    { x0: 255, y0: 726, x1: 340, y1: 806, box: [196, 146, 62], rib: [176, 36, 40], rx: 297, ry: 764, bow: 1 },
    { x0: 170, y0: 720, x1: 227, y1: 806, box: [200, 186, 176], rib: [186, 40, 44], rx: 198, ry: 760, stripes: 1 },
    { x0: 74, y0: 712, x1: 176, y1: 801, box: [40, 58, 118], rib: [168, 172, 196], rx: 124, ry: 756, bow: 1 },
    { x0: 222, y0: 680, x1: 318, y1: 762, box: [40, 96, 50], rib: [204, 42, 42], rx: 270, ry: 720, bow: 1 },
    { x0: 10, y0: 660, x1: 96, y1: 762, box: [138, 30, 36], rib: [200, 150, 66], rx: 52, ry: 708 }
  ];
  const ORNAMENTS = [];
  (function () {
    const r = mulberry32(77), C = [[190, 34, 40], [214, 164, 62], [196, 200, 214], [190, 34, 40], [60, 110, 200]];
    let n = 0;
    while (n < 16) {
      const y = 230 + 430 * r(), w = treeHalf(y);
      if (w < 20) continue;
      ORNAMENTS.push({ x: 160 + (r() * 2 - 1) * w * 0.7, y, c: C[n % C.length] });
      n++;
    }
  })();

  // ---------- TV programmes ----------
  const CHANNELS = 6;
  const BARS = [[200, 200, 200], [210, 200, 40], [40, 200, 200], [40, 190, 50], [200, 40, 200], [200, 40, 40], [40, 50, 200]];
  // Bitmap digits (3 x 5) for the VCR clock.
  const GLYPH = {
    '1': [' # ', '## ', ' # ', ' # ', '###'], '2': ['## ', '  #', ' # ', '#  ', '###'],
    '0': ['###', '# #', '# #', '# #', '###'], '8': ['###', '# #', '###', '# #', '###'], ':': [' ', '#', ' ', '#', ' ']
  };
  const CLOCK_MAP = (() => {
    const on = [], ghost = [];
    for (let y = 0; y < 5; y++) { on.push(''); ghost.push(''); }
    ['1', ' ', '2', ' ', ':', ' ', '0', ' ', '0'].forEach((c, i) => {
      for (let y = 0; y < 5; y++) {
        if (c === ' ') { on[y] += ' '; ghost[y] += ' '; continue; }
        on[y] += GLYPH[c][y];
        ghost[y] += (c === ':' ? GLYPH[':'] : GLYPH['8'])[y];
      }
    });
    return { on, ghost, w: on[0].length };
  })();

  // ---------- Canvas, grid, layout ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const hintEl = document.getElementById('hint');
  const stat = document.createElement('canvas'), sctx = stat.getContext('2d');
  const glowA = document.createElement('canvas'), gA = glowA.getContext('2d');
  const glowB = document.createElement('canvas'), gB = glowB.getContext('2d');
  const glowC = document.createElement('canvas'), gC = glowC.getContext('2d');

  let W = 0, H = 0, dpr = 1, fs = 8, cw = 5, ch = 8, cols = 0, rows = 0, font = '';
  let coreX = 0, coreY = 0, coreW = 1, coreH = 1, K = 1; // K = scene units per screen px
  let HX = 3, HY = 5; // half a cell, in scene units (thin features use at least this)
  let lightMap = null, flakeBuf = null;
  let dynIdx = null, dynX = null, dynY = null, nDyn = 0;
  let fire = null, fireNext = null, fw = 0, fh = 0, fc0 = 0, fr0 = 0;
  let scr = { c0: 0, r0: 0 }, clk = { c0: 0, r0: 0, nc: 0, nr: 0, bitmap: false };
  let needResize = true, dirty = true;
  let vignette = null;

  const pxX = sx => coreX + (sx - SX0) / K;
  const pxY = sy => coreY + (sy - SY0) / K;
  const firstCol = sx => Math.ceil(pxX(sx) / cw - 0.5);
  const lastCol = sx => Math.floor(pxX(sx) / cw - 0.5);
  const firstRow = sy => Math.ceil(pxY(sy) / ch - 0.5);
  const lastRow = sy => Math.floor(pxY(sy) / ch - 0.5);
  const cellOf = (sx, sy) => {
    const c = Math.floor(pxX(sx) / cw), r = Math.floor(pxY(sy) / ch);
    return c < 0 || r < 0 || c >= cols || r >= rows ? -1 : r * cols + c;
  };

  function resize() {
    needResize = false;
    W = canvas.clientWidth || innerWidth;
    H = canvas.clientHeight || innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    stat.width = canvas.width; stat.height = canvas.height;

    // Fit the scene box; portrait phones crop a sliver off each side so the room is bigger.
    const A = SW / SH, portrait = W / H < 0.75;
    coreW = Math.min(W * (portrait ? 1.1 : 1), (H - (portrait ? 0 : 8)) * A * (portrait ? 1 : 0.985));
    coreH = coreW / A;
    coreX = (W - coreW) / 2;
    coreY = portrait ? Math.max(0, (H - coreH) * 0.3) : (H - coreH) / 2;
    K = SW / coreW;

    fs = clamp(Math.min(coreH / 104, coreW / (84 * 0.6)), 5.5, 14);
    font = `700 ${fs.toFixed(2)}px ${MONO}`;
    ctx.font = font;
    cw = ctx.measureText('M').width || fs * 0.6;
    ch = fs * 1.02;
    cols = Math.ceil(W / cw);
    rows = Math.ceil(H / ch);
    HX = cw * K * 0.55; HY = ch * K * 0.55;
    const n = cols * rows;
    lightMap = new Int16Array(n);
    flakeBuf = new Uint8Array(n);

    // String bulbs across the whole visible width.
    const xs = SX0 + (0 - coreX) * K, xe = SX0 + (W - coreX) * K;
    const strings = [];
    let i = 0;
    for (let x = 8 + 19.33 + Math.floor((xs - 8) / 38.67) * 38.67; x < xe + 20; x += 38.67, i++)
      strings.push({ k: 0, x, y: wireY(x) + 10, o: i, ph: hash(i, 3) * TAU, f: 1.5 + 2.5 * hash(i, 5), c: (i * 5 + (i >> 1)), on: 0 });
    const x0 = strings.length ? strings[0].x : 0, x1 = strings.length ? strings[strings.length - 1].x : 1;
    strings.forEach(s => { s.on = T.STRING + 1.0 * (s.x - x0) / Math.max(1, x1 - x0); });
    lights = strings.concat(fixedLights);
    lights.forEach(L => {
      if (L.k === 1) L.on = T.TREE + 0.9 * (1 - (L.y - 185) / 505) + 0.1 * hash(L.x | 0, L.y | 0);
      else if (L.k === 2) L.on = T.TREE + 0.05 * L.o;
      else if (L.k === 3) L.on = T.TREE + 0.4 + 0.05 * L.o;
      const c = cellOf(L.x, L.y);
      L.cell = -1;
      if (c >= 0 && !lightMap[c]) { lightMap[c] = lights.indexOf(L) + 1; L.cell = c; }
      if (L.k === 0 && c >= 0 && c + cols < n) lightMap[c + cols] = lightMap[c];
    });

    // Fire grid aligned to the cells of the firebox opening.
    fc0 = firstCol(658); fr0 = firstRow(556);
    fw = Math.max(4, lastCol(797) - fc0 + 1); fh = Math.max(4, lastRow(748) - fr0 + 1);
    fire = new Float32Array(fw * fh); fireNext = new Float32Array(fw * fh);
    for (let i = 0; i < fh * 2; i++) stepFire(); // a resize must not put the fire out
    scr = { c0: firstCol(368), r0: firstRow(528) };
    clk.c0 = firstCol(414); clk.r0 = firstRow(654);
    clk.nc = lastCol(527) - clk.c0 + 1; clk.nr = lastRow(700) - clk.r0 + 1;
    clk.bitmap = clk.nc >= CLOCK_MAP.w + 2 && clk.nr >= 5;

    // Glow buffers.
    glowA.width = Math.ceil(W / 4); glowA.height = Math.ceil(H / 4);
    glowB.width = glowA.width; glowB.height = glowA.height;
    glowC.width = Math.ceil(W / 14); glowC.height = Math.ceil(H / 14);

    const cx = pxX(440), cy = pxY(560);
    vignette = ctx.createRadialGradient(cx, cy, coreH * 0.25, cx, cy, Math.max(W, H) * 0.85);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(0.6, 'rgba(8,3,1,0.18)');
    vignette.addColorStop(1, 'rgba(8,3,1,0.7)');

    bake();
    dirty = true;
  }

  // ---------- Colours ----------
  const COL = new Array(32768);
  const colKey = (r, g, b) => ((clamp(r, 0, 255) >> 3) << 10) | ((clamp(g, 0, 255) >> 3) << 5) | (clamp(b, 0, 255) >> 3);
  function colStr(k) {
    let s = COL[k];
    if (!s) s = COL[k] = `rgb(${((k >> 10) & 31) * 8.23 | 0},${((k >> 5) & 31) * 8.23 | 0},${(k & 31) * 8.23 | 0})`;
    return s;
  }

  // ---------- Per-cell shading ----------
  // shade() writes into these registers: colour, character, emission (for the bloom), dynamic flag.
  let OB = false, oR = 0, oG = 0, oB = 0; // optional separate backing colour
  let R = 0, G = 0, B = 0, C = ' ', E = 0, DY = 0, HH = 0, CI = 0, BAKE = false;
  const set = (r, g, b, c) => { R = r; G = g; B = b; C = c; };
  const pick = s => s[(HH * s.length) | 0];
  const DENSE = '#%&@8', MID = '%#=*+', SOFT = ':;=+*';
  function amb(x, y) {
    const dx = x - 727, dy = (y - 650) * 1.2;
    let a = 0.78 + 0.6 * Math.exp(-(dx * dx + dy * dy) / (2 * 240 * 240));
    a += 0.18 * Math.exp(-((x - 160) ** 2 + (y - 430) ** 2) / (2 * 140 * 140));
    a += 0.14 * Math.exp(-((x - 440) ** 2 + (y - 520) ** 2) / (2 * 130 * 130));
    if (y < 140) a *= 0.7 + 0.3 * clamp((y - 20) / 120, 0, 1);
    return a;
  }
  function lit(r, g, b, c, x, y, k = 1) { const a = amb(x, y) * k; set(r * a, g * a, b * a, c); }

  // Scene state read by shade().
  let t = 0, skyT = 0, breath = 0, stretchP = 0, eyesOpen = false, yawn = false, tailFlick = 0, earTw = 0;
  let channel = 0, chT = -10, tvSwitchT = -10, flame = 0, fireBoost = 0, gust = 0;

  function shade(x, y, ci) {
    C = ' '; E = 0; DY = 0; OB = false; CI = ci; HH = hash(ci, 17);
    // Single-cell lights.
    const li = lightMap[ci];
    if (li) { if (BAKE) { DY = 1; return; } lightShade(lights[li - 1]); return; }

    // Sleeping cat (dynamic box: cat + the rug under it).
    if (x > 440 && x < 820 && y > 750 && y < 912) {
      if (BAKE) { DY = 1; return; }
      if (catShade(x, y)) return;
    }
    if (rug(x, y)) return;
    // Presents and tree.
    for (let i = 0; i < GIFTS.length; i++) if (gift(GIFTS[i], x, y)) return;
    if (x > 118 && x < 206 && y > 118 && y < 206 && star(x, y)) return;
    if (tree(x, y)) return;
    // TV, antenna, cabinet.
    if (tv(x, y)) return;
    if (cabinet(x, y)) return;
    // Fireplace and mantel things.
    if (fireplace(x, y)) return;
    if (candles(x, y)) return;
    if (wreath(x, y)) return;
    // Window and curtains.
    if (curtains(x, y)) return;
    if (windowShade(x, y)) return;
    // String-light wire, then the room shell.
    if (wire(x, y)) return;
    if (y >= FLOOR_Y) floor(x, y); else wall(x, y);
  }

  // ----- lights -----
  function lightRGB(L, m, tt) {
    const M = MODES[m], n = M.cols.length;
    const mod = (v, m) => ((Math.floor(v) % m) + m) % m;
    let ci = mod(L.k === 0 ? L.o : L.c, n);
    if (M.pat === 'alternate') ci = mod(L.o, 2);
    if (M.pat === 'wave') ci = mod(L.o + tt * 4, n);
    let b;
    switch (M.pat) {
      case 'twinkle': { const s = 0.5 + 0.5 * Math.sin(tt * L.f + L.ph); b = 0.3 + 0.7 * s * s; break; }
      case 'alternate': b = ((Math.floor(tt * 1.4) + Math.floor(L.o)) & 1) ? 1 : 0.2; break;
      case 'sparkle': { const s = Math.sin(tt * L.f * 2.1 + L.ph); b = 0.42 + 0.12 * Math.sin(tt * 1.3 + L.ph) + (s > 0.9 ? 0.55 : 0); break; }
      case 'chase': { const s = Math.max(0, Math.cos(L.o * 0.9 - tt * 5)); b = 0.18 + 0.82 * s * s * s; break; }
      case 'breathe': b = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(tt * 1.4 - L.o * 0.12)); break;
      default: b = 0.95;
    }
    if (reduced) b = 0.55 + 0.45 * b;
    return [M.cols[ci], b];
  }
  function lightShade(L) {
    const a = t - L.on;
    if (a < 0) { // not on yet: a dark, unlit bulb
      if (L.k === 0) set(70, 60, 48, 'o'); else if (L.k === 1) set(40, 70, 40, '.'); else set(60, 70, 50, '.');
      return;
    }
    // Mode change: lights pick up the new mode in a quick sweep.
    const sweep = clamp((t - modeT) * 2.2 - (L.k === 0 ? (L.x - 8) / 900 : (L.k === 1 ? (1 - (L.y - 185) / 505) : 0.5)) * 0.8, 0, 1);
    const m = sweep < 0.5 ? prevMode : mode;
    let [c, b] = lightRGB(L, m, t);
    if (sweep > 0.35 && sweep < 0.65) b *= 0.3;
    if (a < 0.18) b = 1.3; // switch-on flash
    const k = 0.25 + 0.85 * b;
    set(c[0] * k + (b > 1 ? 60 : 0), c[1] * k + (b > 1 ? 60 : 0), c[2] * k + (b > 1 ? 60 : 0),

    const tail = paused ? 'paused' : `${fps} fps`;
    const M = MODES[mode];
    const head = `lights ${nl}  flame ${flame.toFixed(2)}  flakes ${FLAKES}  `;
    hudEl.textContent = W < 640 ? head + tail : head + `ch ${channel + 1}  ${zh ? M.zh : M.en}  ${tail}`;
    hudT = now;
  }

  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) resize();
    if (!paused) { const t1 = t; step(dt); soundCues(t1, t); }
    if (!paused || dirty) { render(); dirty = false; frames++; }
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  // ---------- Music (ascii-audio.js) ----------
  const music = (fn, ...a) => window.AsciiAudio && AsciiAudio[fn](...a);
  // Fire a sound cue on the frame where the scene clock crosses an animation event.
  const crossed = (a, b, x) => a < x && x <= b;
  function soundCues(a, b) {
    if (!window.AsciiAudio) return;
    let nb = 0;
    for (const L of lights) if (L.cell >= 0 && crossed(a, b, L.on)) nb++;
    if (nb) music('event', 'bulb', { n: nb });
    if (crossed(a, b, T.STAR)) music('event', 'star');
    if (crossed(a, b, T.TV)) music('event', 'tvOn');
    if (crossed(a, b, stretchT + 0.25)) music('event', 'stretch');
  }

  function resetState() {
    t = reduced ? T.DONE : 0; skyT = 0;
    channel = 0; chT = -10; tvSwitchT = -10; lastChannelAuto = 0;
    mode = prevMode = 0; modeT = 0; lastModeTap = -100;
    stretchT = -100; fireBoost = 0; gust = 0; flame = reduced ? 0.8 : 0;
    nextFlick = t + 4; nextEar = t + 6;
    if (fire) fire.fill(0);
    if (reduced && fire) for (let i = 0; i < 40; i++) stepFire();
  }
  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); music(paused ? 'pause' : 'resume'); }
  function replay() { resetState(); paused = false; dirty = true; music('resume'); music('restart'); }

  // Tap targets in scene space.
  function tap(px, py) {
    if (paused) { togglePause(); return; }
    const x = SX0 + (px - coreX) * K, y = SY0 + (py - coreY) * K;
    if (x > 440 && x < 820 && y > 750 && y < 912) {
      if (t - stretchT > STRETCH_LEN) stretchT = t;
    } else if (x > 345 && x < 535 && y > 380 && y < 645) {
      changeChannel(false);
    } else if (x > 0 && x < 345 && y > 115 && y < 810) {
      setMode(mode + 1); lastModeTap = t; music('event', 'pattern');
    } else if (x > 560 && x < 880 && y > 455 && y < 795) {
      fireBoost = 1; music('event', 'stoke');
    } else if (x > 330 && x < 553 && y > 158 && y < 505) {
      gust = 1; music('event', 'gust');
    } else togglePause();
  }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
  });
  // Single tap = poke something / pause (decided after 280 ms), two quick taps = replay.
  let tapTimer = 0;
  canvas.addEventListener('pointerup', e => {
    if (e.button > 0) return;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = 0; replay(); }
    else tapTimer = setTimeout(() => { tapTimer = 0; tap(x, y); }, 280);
  });

  // Hint language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';
  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '點電視、樹、爐火或貓 · 點牆暫停 · 雙擊重播' : 'tap the TV, tree, fire or cat · tap wall to pause')
                             : (zh ? '點電視轉台、點樹換燈、點爐火、點貓 · 空白鍵 暫停 · R 重播 · M 音樂'
                                   : 'click the TV, tree, fire or cat · Space pause · R replay · M music · double-click to replay');

  // Score: "Silent Night" (Franz Xaver Gruber, 1818, public domain) on music box, in 6/8 written as
  // 3 beats a bar, with a lilting celesta accompaniment, a warm pad, a soft bass and fire crackle.
  // 26 bars (78 beats): the carol plus two quiet bars before it loops.
  if (window.AsciiAudio) AsciiAudio.init({
    bpm: 76, master: 0.78, reverb: 0.42, reverbTime: 3.6,
    build(a) {
      const N = AsciiAudio.notes, LOOP = 78, up = n => AsciiAudio.transpose(n, 12);
      const tune = N(
        'G4:1.5 A4:.5 G4:1 E4:3 | G4:1.5 A4:.5 G4:1 E4:3 | D5:2 D5:1 B4:3 | C5:2 C5:1 G4:3 | ' +
        'A4:2 A4:1 C5:1.5 B4:.5 A4:1 | G4:1.5 A4:.5 G4:1 E4:3 | A4:2 A4:1 C5:1.5 B4:.5 A4:1 | G4:1.5 A4:.5 G4:1 E4:3 | ' +
        'D5:2 D5:1 F5:1.5 D5:.5 B4:1 | C5:3 E5:3 | C5:1 G4 E4 G4:1.5 F4:.5 D4:1 | C4:6 | r:6');
      a.part(tune, (t, e) => a.musicBox(t, up(e.note), Math.max(1.2, e.sec * 1.8), { vel: 0.55 }), { length: LOOP });

      const CH = { C: ['C', 'E', 'G'], F: ['F', 'A', 'C'], G7: ['G', 'B', 'F'], Am: ['A', 'C', 'E'] };
      const PROG = 'C C C C G7 G7 C C F F C C F F C C G7 G7 C C C G7 C C F C'.split(' ');
      const chordAt = beat => CH[PROG[Math.floor((beat % LOOP) / 3)]];
      a.every(3, (t, s) => {
        const c = chordAt(s * 3);
        a.pad(t, [c[0] + '3', c[1] + '3', c[2] + '4'], a.beats(2.6), { vel: 0.24, attack: 0.9, release: 1.6, cutoff: 700 });
        a.bass(t, c[0] + '2', a.beats(2.4), { vel: 0.22 });
      });
      // Celesta in eighths: root, fifth, third, fifth, third, fifth.
      const ARP = [0, 2, 1, 2, 1, 2];
      a.every(0.5, (t, s) => {
        const c = chordAt(s * 0.5), i = s % 6;
        a.celesta(t, c[ARP[i]] + (ARP[i] === 0 ? '3' : '4'), a.beats(1.2), { vel: i === 0 ? 0.16 : 0.1, pan: i % 2 ? 0.3 : -0.3 });
      });
      // Fire crackle: sparse tiny noise pops.
      a.every(0.25, (t) => {
        if (Math.random() > 0.22) return;
        const d = Math.random();
        a.noise(t + Math.random() * 0.06, { dur: 0.012 + 0.03 * d, filter: 'bandpass', freq: 1400 + 3600 * Math.random(), q: 0.9,
          vel: 0.06 + 0.12 * Math.random(), wet: 0.06, pan: 0.45 });
      });

      // Sound effects in sync with the animation.
      const SP = AsciiAudio.scale('C6', 'pentatonic', 10);
      a.on('bulb', (a, d, t) => a.sparkle(t, { count: 1, vel: 0.12, notes: SP }), { gap: 0.07 });
      a.on('star', (a, d, t) => a.chime(t, 'G5', 3, { vel: 0.34 }));
      a.on('tvOn', (a, d, t) => {
        a.tick(t, { vel: 0.4 });
        a.noise(t + 0.02, { dur: 0.5, filter: 'highpass', freq: 7000, vel: 0.12, bus: 'sfx', wet: 0.1 });
      });
      a.on('channel', (a, d, t) => {
        a.tick(t, { vel: 0.35 });
        a.noise(t + 0.01, { dur: 0.3, filter: 'bandpass', freq: 3200, q: 0.5, vel: 0.14, bus: 'sfx', wet: 0.05 });
      }, { gap: 0.15 });
      a.on('pattern', (a, d, t) => a.sparkle(t, { count: 4, vel: 0.2, notes: SP }), { gap: 0.2 });
      a.on('stoke', (a, d, t) => {
        a.whoosh(t, { dur: 0.6, vel: 0.35, freq: 200, freqEnd: 900 });
        for (let i = 0; i < 6; i++) a.noise(t + 0.1 + Math.random() * 0.6, { dur: 0.02, filter: 'bandpass', freq: 2500, q: 0.8, vel: 0.3, bus: 'sfx', wet: 0.05 });
      }, { gap: 0.3 });
      a.on('gust', (a, d, t) => a.sweep(t, 1.4, { from: 400, to: 2200, vel: 0.16, bus: 'sfx' }), { gap: 0.5 });
      // A sleepy "mew" (pitch-bent triangle) and a soft purr (low noise pulses).
      a.on('stretch', (a, d, t) => {
        const c = a.ctx, g = c.createGain(), lp = c.createBiquadFilter(), o = c.createOscillator();
        lp.type = 'lowpass'; lp.frequency.value = 2200;
        o.type = 'triangle';
        o.frequency.setValueAtTime(560, t);
        o.frequency.exponentialRampToValueAtTime(880, t + 0.16);
        o.frequency.exponentialRampToValueAtTime(520, t + 0.5);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.09, t + 0.05);
        g.gain.setTargetAtTime(0, t + 0.35, 0.08);
        o.connect(lp); lp.connect(g); g.connect(a._out({ bus: 'sfx', pan: 0.25 }, 0.3));
        o.start(t); o.stop(t + 0.9);
        for (let i = 0; i < 18; i++)
          a.noise(t + 0.9 + i * 0.075, { dur: 0.06, filter: 'lowpass', freq: 160, vel: 0.35 * Math.sin(Math.PI * (i + 1) / 19), bus: 'sfx', wet: 0.05, pan: 0.25 });
      }, { gap: 2 });
    }
  });

  resetState();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
