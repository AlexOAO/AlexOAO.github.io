<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASCII Ocean Waves | Alex Li (李翔緯)</title>
  <meta name="description" content="A moonlit open sea drawn entirely with ASCII characters: rolling swells in perspective, breaking crests with lingering foam and streaks of moonlight on the horizon. Pointer height sets the sea state and a tap sends a big breaking wave. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #0b1120;
      --sky: #000000;
      --text: #e6edf6;
      --muted: #a3b1c6;
      --accent: #3b82f6;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: none; /* vertical drags set the sea state, so no scrolling or zooming */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.12);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(59, 130, 246, 0.28);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.75;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
      .hint { bottom: 30px; } /* stack above the HUD on narrow screens */
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ASCII Ocean Waves</h1>
  <a class="back" href="./">← ASCII</a>
  <canvas id="c" role="img" aria-label="Animated moonlit open sea drawn with ASCII characters, with swells rolling toward the viewer, breaking crests and white foam under a dark sky"></canvas>
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>

<script src="ascii-audio.js"></script>
<script>
(() => {
  'use strict';

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_START = 0;                       // scene time at load (headless tests change this)
  const TIME_SCALE = reduced ? 0.35 : 0.8; // sea time per real second
  const CYCLE = 22 * 0.8;                  // scene time of one calm -> big swells -> calm loop (~22 s real)

  // ---------- Camera / world ----------
  const HORIZON = 0.35;     // horizon at 35% of the screen height
  const CAM_H = 3;          // camera height above mean sea level (world units)
  const NEAR_EXTRA = 2;     // sample this much closer than the bottom row (big swells rise into view)
  const FOAM_TAU = 1.4;     // seconds for foam to fade to 1/e
  const FOAM_THR = 0.22;    // crest curvature that starts to break
  const FOAM_GAIN = 7;
  // Shading: lit faces only; FACE_DROP darkens rows below a crest's top edge.
  const BRT_BASE = 0.65, BRT_SLOPE = 1.6, BRT_H = 0.9, HZ_LIFT = -0.02, FACE_DROP = 0.035;
  const CRASH_RATE = 0.12;  // foam coverage growth per second of sea time that sounds a crash
  // Interaction: pointer height blends the sea state over the swell cycle; a tap sends a big wave.
  const SEA_MAX = reduced ? 0.5 : 1.3; // sea state at the bottom of the screen (cycle peak = 1)
  const SEA_TAU = 0.8;      // seconds for the sea state to ease toward the pointer
  const HOLD_MS = 2500;     // the sea keeps the pointer's state this long after it leaves
  const BIG_DUR = reduced ? 1.4 : 2.8;   // sea time for a big wave to roll in from the horizon
  const BIG_AMP = reduced ? 0.6 : 1.35;  // its height at the break (world units)
  const BIG_LF = 2.2, BIG_LB = 4.2, BIG_WID = 7; // front / back slope length and half-width
  const MAX_BIG = 3, MAX_SPRAY = reduced ? 120 : 1000;
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';
  // Moonlight from high up beyond the horizon (upper back), as seen from the camera.
  const LX0 = 0.1, LY0 = 0.5, LZ0 = 0.86;
  const LN = Math.hypot(LX0, LY0, LZ0);
  const LX = LX0 / LN, LY = LY0 / LN, LZ = LZ0 / LN;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- Waves ----------
  // [wavelength, amplitude, direction (rad from "toward the camera"), shaped crest?, grows with the swell cycle?]
  // Shaped waves use ((1+sin)^3/4 - 0.625): sharp crests, flat troughs, zero mean.
  const WAVES = [
    [24, 0.5, 0.00, 1, 1],
    [15, 0.24, 0.22, 1, 1],
    [10, 0.14, -0.3, 1, 1],
    [6.2, 0.09, 0.7, 0, 0],
    [3.7, 0.065, -1.0, 0, 0],
    [2.3, 0.04, 0.45, 0, 0],
    [1.4, 0.024, -0.6, 0, 0],
    [0.9, 0.014, 1.3, 0, 0]
  ];
  const NW = WAVES.length;
  const KX = new Float32Array(NW), KZ = new Float32Array(NW), KK = new Float32Array(NW),
        OM = new Float32Array(NW), A0 = new Float32Array(NW), PH0 = new Float32Array(NW),
        SHP = new Uint8Array(NW), GROW = new Uint8Array(NW), LAM = new Float32Array(NW);
  const wr = mulberry32(4242);
  WAVES.forEach(([lam, a, dir, shp, grow], w) => {
    const k = 2 * Math.PI / lam;
    // Travelling toward the camera: phase k(d.x) + wt with d.z > 0 moves crests to smaller z.
    KX[w] = k * Math.sin(dir); KZ[w] = k * Math.cos(dir); KK[w] = k * k;
    OM[w] = Math.sqrt(9.8 * k); A0[w] = a; PH0[w] = wr() * 6.283;
    SHP[w] = shp; GROW[w] = grow; LAM[w] = lam;
  });
  const AMP = new Float32Array(NW), PT = new Float32Array(NW);

  // ---------- Characters & colours ----------
  // Lit faces use a mixed, code-like glyph set, brighter tiers denser; foam and spray use loose letters.
  const CH = [];
  const ci = s => { let i = CH.indexOf(s); if (i < 0) { CH.push(s); i = CH.length - 1; } return i; };
  const tier = s => Uint8Array.from([...s].map(ci));
  const TIERS = [tier('~-^+~*=^'), tier('+*~%^8$=x'), tier('$8&%#*+@&'), tier('@$&8#%$8')];
  const T_LET = tier('xtrjfvczea[]{}()|');     // loose letters at crest edges
  const T_SPRAY = tier('+xtt=+zvr+*');         // foam / spray
  const C_PLUS = ci('+'), C_PEAK = ci('^');
  const BTHR = 0.5;                            // cells dimmer than this stay black

  const LEVELS = 16;
  const PAL = [];
  const pal = (r, g, b) => { PAL.push([r, g, b]); return PAL.length - 1; };
  const P_SEA = pal(207, 224, 255);    // pale moonlit blue-white (level 10 = #cfe0ff)
  const P_FOAM = pal(228, 238, 255);   // spray, a touch whiter
  const NCOLOR = PAL.length * LEVELS;
  const COLSTR = new Array(NCOLOR);
  PAL.forEach(([r, g, b], p) => {
    for (let l = 0; l < LEVELS; l++) {
      // Top levels overshoot 1 and wash toward white, so lit characters read as glowing.
      const m = 0.3 + 1.05 * l / (LEVELS - 1), w = Math.max(0, m - 1) * 160;
      const lift = v => Math.min(255, v * m + w) | 0;
      COLSTR[p * LEVELS + l] = `rgb(${lift(r)},${lift(g)},${lift(b)})`;
    }
  });

  // ---------- Canvas, grid, layout ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, fs = 9, cw = 5, ch = 10, cols = 0, rows = 0, hr = 0, hyPx = 0, F = 500;
  let cellFont = '', bgGrad = null;
  let cchar, ccol, touched, order, nT = 0;
  let nS = 0, ZS, ATT, FOAM, FHASH, GHASH, colDrawn;
  const counts = new Uint32Array(NCOLOR);
  let needResize = true, dirty = true;

  function resize() {
    needResize = false;
    W = canvas.clientWidth || innerWidth;
    H = canvas.clientHeight || innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fs = clamp(Math.round(Math.min(W, H * 1.2) / 130), 7, 10);
    cellFont = `${fs}px ${MONO}`;
    ctx.font = cellFont;
    cw = ctx.measureText('M').width || fs * 0.6;
    ch = fs * 1.1;
    cols = Math.ceil(W / cw);
    rows = Math.ceil(H / ch);
    hr = Math.round(H * HORIZON / ch);
    hyPx = hr * ch;
    F = Math.max(W * 0.72, H * 0.75);
    const n = cols * rows;
    cchar = new Uint8Array(n); ccol = new Uint16Array(n);
    touched = new Int32Array(n); order = new Int32Array(n);

    // Depth samples, near -> far. Each step is under one row at sea level; beyond the bottom row
    // a few coarser samples catch swells that rise into view from below the frame.
    const seaH = H - hyPx, zNear = CAM_H * F / seaH;
    const zs = [];
    let z = Math.max(0.8, zNear - NEAR_EXTRA);
    while (z < zNear) { zs.push(z); z += 0.25; }
    for (let dy = seaH; dy > ch * 0.3; dy -= ch * 0.7) zs.push(CAM_H * F / dy);
    nS = zs.length;
    ZS = Float32Array.from(zs);
    // Per-sample wave fade: waves shorter than ~3 rows of depth would only alias into noise.
    ATT = new Float32Array(nS * NW);
    for (let i = 0; i < nS; i++) {
      const zz = ZS[i], foot = zz * zz * ch / (CAM_H * F) + zz * cw / F;
      for (let w = 0; w < NW; w++) ATT[i * NW + w] = clamp(LAM[w] / (foot * 3) - 0.5, 0, 1);
    }
    FOAM = new Float32Array(nS * cols);
    FHASH = new Float32Array(nS * cols);
    const r = mulberry32(99);
    for (let i = 0; i < FHASH.length; i++) FHASH[i] = 0.45 + 0.9 * r();
    // Glyph variety hashed per sea position: stable frame to frame, changes only as the water moves.
    GHASH = new Uint8Array(nS * cols);
    for (let i = 0; i < GHASH.length; i++) GHASH[i] = (r() * 256) | 0;
    colDrawn = new Uint8Array(rows + 1);

    bgGrad = '#000000'; // pure black sky and sea background
    dirty = true;
  }

  // ---------- Sea: column-wise height-field ray march on the character grid ----------
  let t = T_START, swells = 0, foamCov = 0, intensity = 0, crest = 0; // crest: highest near swell (for the surf sound)
  // Pointer sea state: seaSet eases toward seaTgt; ctlW blends it in over the cycle and back out.
  let ctlOn = false, relT = -1e9, seaTgt = 0, seaSet = 0, ctlW = 0;
  // Big waves: { x0, zT, z0, zb, p, tb, amp, foam, born, sounded, sx, sy }.
  const BIG = [];
  const spray = [];         // splash particles in screen space: { x, y, vx, vy, life, max, g }

  function seaState(rdt) {
    const held = ctlOn || performance.now() - relT < HOLD_MS;
    ctlW += ((held ? 1 : 0) - ctlW) * Math.min(1, rdt / (held ? 0.5 : 1.6));
    seaSet += (seaTgt - seaSet) * Math.min(1, rdt / SEA_TAU);
  }

  function buildSea(dt) {
    const ph = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
    const cyc = reduced ? 0.15 : 0.5 - 0.5 * Math.cos(2 * Math.PI * ph);
    if (ctlW < 0.01 && !ctlOn) seaSet = cyc; // the pointer takes over from wherever the cycle is
    intensity = cyc + (seaSet - cyc) * ctlW;
    const I = intensity;
    for (let w = 0; w < NW; w++) {
      AMP[w] = A0[w] * (GROW[w] ? 0.4 + 0.85 * I : 0.85 + 0.25 * I);
      PT[w] = OM[w] * t + PH0[w];
    }
    // A wave group that sweeps in from far away and rears up in the foreground mid-cycle.
    const gs = reduced ? 0 : Math.pow(Math.sin(Math.PI * Math.pow(ph, 1.5)), 2) * 0.8 * (1 - ctlW * (1 - clamp(I, 0, 1)));
    const zg = 72 - 75 * ph; // reaches the foreground late in the cycle
    const thr = FOAM_THR, decay = Math.exp(-dt / FOAM_TAU);
    const midC = cols >> 1;
    const hrFar = Math.min(rows, hr + Math.round((rows - hr) * 0.3));
    const half = W / 2;
    const nB = BIG.length;
    nT = 0; swells = 0;
    let foamN = 0, seaN = 0, crestN = -1;

    for (let c = 0; c < cols; c++) {
      const px = (c + 0.5) * cw - half;
      let top = rows;
      let prevH = -1e9, rising = false;
      colDrawn.fill(0);
      for (let i = 0; i < nS; i++) {
        const z = ZS[i], x = px * z / F;
        const dz = (z - zg) / 16, env = 1 + gs * Math.exp(-dz * dz);
        let h = 0, hx = 0, hz = 0, K = 0;
        const ab = i * NW;
        for (let w = 0; w < NW; w++) {
          let a = AMP[w] * ATT[ab + w];
          if (a < 1e-4) continue;
          if (GROW[w]) a *= env;
          const th = KX[w] * x + KZ[w] * z + PT[w];
          const s = Math.sin(th), co = Math.cos(th);
          let g, gp, gpp;
          if (SHP[w]) { const u = 1 + s, u2 = u * u; g = a * (u2 * u * 0.25 - 0.625); gp = a * 0.75 * u2 * co; gpp = a * 0.75 * (2 * u * co * co - u2 * s); }
          else { g = a * s; gp = a * co; gpp = -g; }
          h += g; hx += gp * KX[w]; hz += gp * KZ[w];
          if (GROW[w]) K -= gpp * KK[w]; // only swells break; chop curvature is noise
        }
        // Big waves: a lone ridge, steeper in front, that sheds foam around the tap point as it breaks.
        let bf = 0, bl = 0; // bf: whitewater to deposit, bl: moonlit sheen on the big swell
        for (let b = 0; b < nB; b++) {
          const bw = BIG[b], dz = z - bw.zb, dx = x - bw.x0;
          if (dz < -9 || dz > 16) continue;
          const L2 = dz < 0 ? BIG_LF * BIG_LF : BIG_LB * BIG_LB, W2 = BIG_WID * BIG_WID;
          const g = bw.amp * Math.exp(-dz * dz / L2 - dx * dx / W2);
          h += g; hz -= g * 2 * dz / L2; hx -= g * 2 * dx / W2;
          if (g > bl * BIG_AMP) bl = g / BIG_AMP;
          K += 0.6 * g * (2 / L2 - 4 * dz * dz / (L2 * L2));
          if (bw.foam > 0.01 && dz > -3.5 && dz < 1.5) {
            const wb = 3.2 + 2.5 * Math.max(0, bw.tb), ea = (dz + 0.8) / 1.4;
            const nf = bw.foam * Math.exp(-ea * ea - dx * dx / (wb * wb));
            if (nf > bf) bf = nf;
          }
        }
        if (c === midC && z < 14 && h > crestN) crestN = h;

        // Foam lives at fixed sea positions: steep crests deposit it, then it fades as waves pass.
        const fi = i * cols + c;
        let f = FOAM[fi] * decay;
        const st = K - thr;
        if (st > 0 && h > 0) { const nf = st * FOAM_GAIN * FHASH[fi]; if (nf > f) f = nf > 1 ? 1 : nf; }
        if (bf > 0) { const nf = bf * FHASH[fi]; if (nf > f) f = nf > 1 ? 1 : nf; }
        FOAM[fi] = f;
        if (z > 30) f *= clamp(1.5 - z / 60, 0, 1); // distant foam thins into streaks

        const sy = (hyPx + (CAM_H - h) * F / z) / ch;
        let r0 = sy < 0 ? 0 : sy | 0; // a big crest may rise over the horizon
        if (r0 >= top) continue;

        if (c === midC) {
          if (h > prevH) rising = true;
          else if (rising && h < prevH - 0.01) { rising = false; swells++; }
          prevH = h;
        }

        // Shade by slope toward the moon, plus a narrow glint toward the camera.
        const nl = 1 / Math.sqrt(hx * hx + 1 + hz * hz);
        const nx = -hx * nl, ny = nl, nz = -hz * nl;
        const ndl = nx * LX + ny * LY + nz * LZ;
        const vx = -x, vy = CAM_H - h, vz = -z, vl = 1 / Math.sqrt(vx * vx + vy * vy + vz * vz);
        let hx2 = LX + vx * vl, hy2 = LY + vy * vl, hz2 = LZ + vz * vl;
        const hl = 1 / Math.sqrt(hx2 * hx2 + hy2 * hy2 + hz2 * hz2);
        let sp = (nx * hx2 + ny * hy2 + nz * hz2) * hl;
        sp = sp > 0 ? sp : 0;
        sp *= sp; sp *= sp; sp *= sp; sp *= sp; sp *= sp; // ^32
        const near = z < 22 ? 0.12 * (1 - z / 22) : 0;
        let b = 0.5 * bl + BRT_BASE + near + BRT_SLOPE * (ndl - LY) + BRT_H * h / (1 + (h < 0 ? -h : h)) + 0.2 * sp + (K > 0 ? 1.1 * K : 0);
        // Far rows: keep the contrast (crest lines vs black gaps) and lift them a little, so the
        // horizon reads as thin dense bright lines.
        const fog = clamp((z - 20) / 120, 0, 1);
        b = BTHR + (b - BTHR) * (1 + 1.2 * fog) + HZ_LIFT * fog;
        if (b > 1) b = 1;

        const foamy = f > 0.22;
        if (foamy) foamN++;
        const gh = GHASH[fi];

        for (let r = r0; r < top; r++) {
          if (r >= rows) continue;
          seaN++;
          // Faces below the top edge face the camera and fall into the moon's shadow.
          const bb = r > r0 ? b - FACE_DROP * (r - r0) : b;
          const hsh = (gh + r * 37) & 255, cell = r * cols + c;
          if (foamy && r - r0 < 2 + bf * 4 && hsh < f * 150 + bf * 90) { // big-wave whitewater runs deeper
            // Spray: loose letters and + sparkles, a few twinkling bright.
            const tw = (hsh & 31) === 0 && Math.sin(t * 5 + gh) > 0.6;
            cchar[cell] = tw ? C_PLUS : T_SPRAY[hsh % T_SPRAY.length];
            ccol[cell] = P_FOAM * LEVELS + (tw ? 15 : 10 + ((f * 4.99) | 0));
            touched[nT++] = cell; colDrawn[r] = 1;
            continue;
          }
          if (bb < BTHR) {
            // Just under the threshold at a crest edge: an occasional stray letter.
            if (r === r0 && bb > BTHR - 0.14 && hsh < 10) {
              cchar[cell] = T_LET[hsh % T_LET.length]; ccol[cell] = P_SEA * LEVELS + 6;
              touched[nT++] = cell; colDrawn[r] = 1;
            }
            continue;
          }
          if (r - hr < 3) {
            // The last rows before the horizon thin out into scattered peaks and sparkles.
            if (hsh < 60) { cchar[cell] = hsh < 40 ? C_PEAK : C_PLUS; ccol[cell] = P_SEA * LEVELS + 8; touched[nT++] = cell; colDrawn[r] = 1; }
            continue;
          }
          const u = (bb - BTHR) / (1 - BTHR);
          const tr = TIERS[u < 0.3 ? 0 : u < 0.55 ? 1 : u < 0.8 ? 2 : 3];
          if (sp > 0.5 && (hsh & 15) === 0) { cchar[cell] = C_PLUS; ccol[cell] = P_FOAM * LEVELS + 15; }
          else {
            cchar[cell] = (hsh & 7) === 0 ? T_LET[hsh % T_LET.length] : tr[hsh % tr.length];
            ccol[cell] = P_SEA * LEVELS + 4 + ((u * 7.99) | 0); // mostly pale blue, only the brightest near white
          }
          touched[nT++] = cell; colDrawn[r] = 1;
        }
        top = r0;
        if (top <= hr) break;
      }
      // Little wave peaks: ^ on the empty cell above the top edge of far crest lines.
      for (let r = hr + 1; r < hrFar; r++) {
        if (!colDrawn[r] || colDrawn[r - 1]) continue;
        const ph2 = (c * 131 + r * 71 + ((t * 0.7) | 0) * 17) & 255;
        if (ph2 < 70) { const cell = (r - 1) * cols + c; cchar[cell] = C_PEAK; ccol[cell] = P_SEA * LEVELS + 9; touched[nT++] = cell; }
      }
    }
    foamCov = seaN ? Math.min(1, foamN / seaN * 4) : 0;
    crest = crestN;
  }

  // ---------- Big waves and spray ----------
  // A tap at screen (sx, sy): the crest stops at the depth of that sea row, centred on its column.
  function bigWave(sx, sy) {
    if (BIG.length >= MAX_BIG) BIG.shift();
    const seaH = H - hyPx, yy = Math.max(sy, hyPx + seaH * 0.12);
    const zT = Math.max(ZS[0] + 1, CAM_H * F / (yy - hyPx));
    const bw = { x0: (sx - W / 2) * zT / F, zT, z0: zT + 55, zb: zT + 55, p: 0, tb: -1, amp: 0, foam: 0,
                 born: performance.now(), sounded: false, sx, sy: yy };
    BIG.push(bw);
    dirty = true;
    return bw;
  }

  function updateBig(sdt) {
    const rdt = sdt / TIME_SCALE;
    for (let b = BIG.length - 1; b >= 0; b--) {
      const bw = BIG[b], span = bw.z0 - bw.zT;
      if (bw.tb < 0) {
        bw.p = Math.min(1, bw.p + sdt / BIG_DUR);
        const q = 1 - bw.p;
        bw.zb = bw.zT + span * q * (0.35 + 0.65 * q);              // eases in but still moving at the break
        bw.amp = BIG_AMP * (0.2 + 0.8 * bw.p * bw.p);              // shoals up as it nears
        bw.foam = clamp((bw.p - 0.86) / 0.14, 0, 1) * 0.45;        // the lip starts to feather
        if (bw.p >= 1) { bw.tb = 0; breakBig(bw); }
      } else {
        bw.tb += sdt;
        bw.zb = bw.zT - span * 0.35 / BIG_DUR * 0.6 * bw.tb;       // the whitewater runs on a little
        bw.amp = BIG_AMP * Math.exp(-bw.tb / 0.45);
        bw.foam = Math.exp(-bw.tb / 0.8);
        if (bw.tb < 0.7 && !reduced) emitSpray(bw, Math.round(rdt * 160), 0.6);
        if (bw.tb > 2.5) BIG.splice(b, 1);
      }
    }
    // Spray: ballistic flecks with a little air drag.
    const gy = reduced ? 160 : 420, drag = Math.exp(-rdt * 0.8);
    for (let i = spray.length - 1; i >= 0; i--) {
      const s = spray[i];
      s.life -= rdt;
      if (s.life <= 0) { spray[i] = spray[spray.length - 1]; spray.pop(); continue; }
      s.vx *= drag; s.vy = s.vy * drag + gy * rdt;
      s.x += s.vx * rdt; s.y += s.vy * rdt;
    }
  }

  function breakBig(bw) {
    emitSpray(bw, reduced ? 40 : 380, 1);
    music('event', 'bigcrash', { v: reduced ? 0.4 : 1, pan: clamp(bw.sx / W * 2 - 1, -0.8, 0.8) });
    quietT = performance.now();
  }

  const SR = mulberry32(7);
  function emitSpray(bw, n, power) {
    const crestY = hyPx + (CAM_H - BIG_AMP) * F / bw.zT;   // screen row of the crest top at the break
    const spread = Math.min(W * 0.35, BIG_WID * F / bw.zT * 0.32);
    const up = reduced ? 0.35 : 1;
    for (let k = 0; k < n && spray.length < MAX_SPRAY; k++) {
      const u = SR() * 2 - 1, d = u * u * Math.sign(u); // denser near the tap point
      spray.push({ x: bw.sx + d * spread, y: crestY + SR() * ch * 4,
        vx: (d * 160 + (SR() - 0.5) * 110) * up, vy: -(90 + SR() * 420 * power) * up * (1 - 0.5 * Math.abs(d)),
        life: 0.9 + SR() * 1.3, max: 2.2, g: T_SPRAY[(SR() * T_SPRAY.length) | 0] });
    }
  }

  function drawSpray() {
    for (let i = 0; i < spray.length; i++) {
      const s = spray[i], lv = 9 + Math.min(6, (s.life / s.max * 9) | 0);
      ctx.fillStyle = COLSTR[P_FOAM * LEVELS + lv];
      // Snap to the character grid so the splash stays ASCII.
      ctx.fillText(CH[s.g], Math.round(s.x / cw) * cw, Math.round(s.y / ch) * ch);
    }
  }

  // Bucket by colour so fillStyle changes once per colour, not once per cell.
  function drawCells() {
    counts.fill(0);
    for (let i = 0; i < nT; i++) counts[ccol[touched[i]]]++;
    let acc = 0;
    for (let c = 0; c < NCOLOR; c++) { const n = counts[c]; counts[c] = acc; acc += n; }
    for (let i = 0; i < nT; i++) { const c = touched[i]; order[counts[ccol[c]]++] = c; }
    let cur = -1;
    for (let i = 0; i < nT; i++) {
      const c = order[i], cc = ccol[c];
      if (cc !== cur) { cur = cc; ctx.fillStyle = COLSTR[cc]; }
      const row = (c / cols) | 0;
      ctx.fillText(CH[cchar[c]], (c - row * cols) * cw, row * ch);
    }
  }

  // Pure black sky with two faint stars.
  function drawSky() {
    ctx.fillStyle = 'rgba(190,205,235,0.45)';
    ctx.fillRect(Math.round(W * 0.07), Math.round(hyPx * 0.5), 1.5, 1.5);
    ctx.fillStyle = 'rgba(190,205,235,0.3)';
    ctx.fillRect(Math.round(W * 0.5), Math.round(hyPx * 0.64), 1.5, 1.5);
  }

  // Bloom: shrink the frame, remove the background with 'difference', blur, and add it back on top.
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  const GLOW_DIV = 5, GLOW_A = 0.5;
  function drawGlow() {
    const gw = Math.ceil(W / GLOW_DIV), gh = Math.ceil(H / GLOW_DIV);
    if (glow.width !== gw || glow.height !== gh) { glow.width = gw; glow.height = gh; }
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'copy';
    gctx.filter = 'blur(2px)';
    gctx.drawImage(canvas, 0, 0, gw, gh);
    gctx.filter = 'none';
    gctx.globalCompositeOperation = 'difference';
    gctx.setTransform(gw / W, 0, 0, gh / H, 0, 0);
    gctx.fillStyle = bgGrad;
    gctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = GLOW_A;
    ctx.drawImage(glow, 0, 0, W, H);
    ctx.restore();
  }

  function render(dt) {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.font = cellFont;
    drawSky();
    buildSea(dt);
    drawCells();
    if (spray.length) drawSpray();
    drawGlow();
  }

  // ---------- Loop, HUD, controls ----------
  let paused = false, last = performance.now();
  let frames = 0, fpsT = last, fps = 0, hudT = 0;

  function updateHud(now) {
    const tail = paused ? 'paused' : `${fps} fps`, sea = `sea ${intensity.toFixed(2)}`;
    // Narrow screens get a short line so nothing is clipped.
    hudEl.textContent = W < 640 ? `swells ${swells}  ${sea}  foam ${foamCov.toFixed(2)}  ${tail}`
      : `swells ${swells}  ${sea}  foam ${foamCov.toFixed(2)}  letters ${nT.toLocaleString('en-US')}  ${tail}`;
    hudT = now;
  }

  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) resize();
    const sdt = paused ? 0 : dt * TIME_SCALE;
    if (!paused) { t += sdt; seaState(dt); updateBig(sdt); }
    if (!paused || dirty) { render(sdt); dirty = false; frames++; }
    if (!paused) soundCues(sdt);
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  // ---------- Sound (ascii-audio.js) ----------
  const music = (fn, ...a) => window.AsciiAudio && AsciiAudio[fn](...a);
  // A crash when foam spreads fast (a big crest breaking); `foamRate` is coverage per second.
  // A big wave's own crash keeps the foam-spread crash quiet for a moment (quietT).
  let foamPrev = 0, foamRate = 0, armed = true, quietT = -1e9;
  function soundCues(sdt) {
    if (!window.AsciiAudio || sdt <= 0) return;
    foamRate += ((foamCov - foamPrev) / sdt - foamRate) * Math.min(1, sdt * 6);
    foamPrev = foamCov;
    // The rising swell starts once a tap is surely not the first half of a double tap.
    const now = performance.now();
    for (const bw of BIG) {
      if (bw.sounded || bw.tb >= 0 || now - bw.born < 300) continue;
      bw.sounded = true;
      music('event', 'swell', { dur: (1 - bw.p) * BIG_DUR / TIME_SCALE, v: reduced ? 0.4 : 1,
                                pan: clamp(bw.sx / W * 2 - 1, -0.8, 0.8) });
    }
    if (now - quietT < 2500) { armed = foamRate < CRASH_RATE * 0.3; return; }
    if (armed && foamRate > CRASH_RATE) { armed = false; music('event', 'crash', { v: Math.min(1, intensity) }); }
    else if (!armed && foamRate < CRASH_RATE * 0.3) armed = true;
  }

  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); music(paused ? 'pause' : 'resume'); }
  // Reset the sea state: back to the calm start of the cycle with no foam.
  function replay() { t = T_START; if (FOAM) FOAM.fill(0); BIG.length = 0; spray.length = 0; paused = false; dirty = true; music('resume'); music('restart'); }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
    else if (e.key === 'w' || e.key === 'W') bigWave(W * (0.25 + 0.5 * Math.random()), hyPx + (H - hyPx) * (0.3 + 0.4 * Math.random()));
  });
  // Pointer height sets the sea state (higher = calmer). A tap sends a big wave at once; a second
  // tap within 280 ms takes that wave back and toggles pause instead.
  function setSea(y) { seaTgt = clamp((y / H - 0.3) / 0.6, 0, 1) * SEA_MAX; ctlOn = true; }
  function releaseSea() { if (ctlOn) { ctlOn = false; relT = performance.now(); } }
  let down = null, tapTimer = 0, lastBig = null;
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') { setSea(e.clientY); return; }
    if (!down || down.id !== e.pointerId) return;
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.drag = true;
    if (down.drag) setSea(e.clientY);
  });
  canvas.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    down = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointerup', e => {
    if (!down || down.id !== e.pointerId) return;
    const tap = !down.drag;
    down = null;
    if (e.pointerType !== 'mouse') releaseSea();
    if (!tap) return;
    if (tapTimer) {
      clearTimeout(tapTimer); tapTimer = 0;
      const i = BIG.indexOf(lastBig);
      if (i >= 0 && lastBig.tb < 0) BIG.splice(i, 1);
      lastBig = null;
      togglePause();
    } else {
      lastBig = bigWave(e.clientX, e.clientY);
      tapTimer = setTimeout(() => { tapTimer = 0; }, 280);
    }
  });
  canvas.addEventListener('pointercancel', () => { down = null; releaseSea(); });
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') releaseSea(); });

  // Hint language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';
  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '上下拖曳調整海況 · 點擊送出大浪 · 雙擊暫停' : 'drag up/down: sea state · tap: big wave · double-tap: pause')
                             : (zh ? '滑鼠越低浪越大 · 點擊送出大浪 · 雙擊/空白鍵 暫停 · R 重設 · M 音樂'
                                   : 'lower mouse = rougher sea · click: big wave · double-click/Space pause · R reset · M music');

  // Sound: a soundscape more than a score. Endless surf from filtered noise that swells with
  // each near crest, a crash of foam when a big wave breaks, a distant wind, and on top a very
  // sparse, calm original melody (celesta and bell on D major pentatonic) over a soft pad. 60 bpm.
  if (window.AsciiAudio) AsciiAudio.init({
    bpm: 60, master: 0.9, reverb: 0.35, reverbTime: 4.5,
    build(a) {
      const c = a.ctx, N = AsciiAudio.notes, LOOP = 64;
      // Soft pink-ish noise (one-pole filtered white), 4 s, looped.
      const len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      let b0 = 0, b1 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.97 * b0 + 0.03 * w; b1 = 0.6 * b1 + 0.4 * w;
        d[i] = b0 * 3.2 + b1 * 0.35;
      }
      // An endless noise layer: source -> filter -> gain -> (pan) -> sfx bus, so replays never cut it.
      function layer(type, f, q, pan, wet) {
        const src = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
        src.buffer = buf; src.loop = true;
        fl.type = type; fl.frequency.value = f; fl.Q.value = q; g.gain.value = 0;
        src.connect(fl); fl.connect(g); g.connect(a._out({ bus: 'sfx', pan }, wet));
        src.start(a.time(0), Math.random() * 3.5);
        return { fl, g };
      }
      const surfL = layer('lowpass', 500, 0.5, -0.45, 0.25), surfR = layer('lowpass', 500, 0.5, 0.45, 0.25);
      const wash = layer('bandpass', 2400, 0.7, 0.1, 0.35);
      const wind = layer('bandpass', 700, 1.6, -0.2, 0.5);
      // Wind: a slow wandering whistle in the distance.
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 0.07; lg.gain.value = 260;
      lfo.connect(lg); lg.connect(wind.fl.frequency); lfo.start(a.time(0));

      // Follow the sea four times a beat: near crest height drives the whoosh, foam the hiss.
      a.every(0.25, (tt, k) => {
        const sw = clamp((crest + 0.2) / 1.6, 0, 1), I = Math.min(1.3, intensity); // follows the pointer's sea state
        const lvl = 0.05 + 0.11 * I + 0.22 * sw * sw, cut = 260 + 400 * I + 1500 * sw * sw;
        surfL.g.gain.setTargetAtTime(lvl, tt, 0.35); surfR.g.gain.setTargetAtTime(lvl * (0.85 + 0.15 * Math.sin(k * 0.21)), tt, 0.4);
        surfL.fl.frequency.setTargetAtTime(cut, tt, 0.35); surfR.fl.frequency.setTargetAtTime(cut * 1.1, tt, 0.4);
        wash.g.gain.setTargetAtTime(0.006 + 0.04 * foamCov + 0.016 * sw, tt, 0.5);
        wind.g.gain.setTargetAtTime(0.03 + 0.016 * Math.sin(k * 0.04) + 0.012 * I, tt, 1.5);
      });

      // Melody: two calm phrases, one note every 2-4 beats, long ringing tails.
      const tune = N('r:2 A5:2 F#5:4 | E5:2 D5:2 r:4 | B4:2 D5:2 E5:4 | r:4 A4:4 | ' +
                     'r:2 F#5:2 A5:3 B5:1 | A5:4 r:4 | E5:2 F#5:2 D5:4 | r:8');
      a.part(tune, (tt, e, a) => {
        a.celesta(tt, e.note, 3.5, { vel: 0.6, wet: 0.65, pan: 0.15 });
        a.bell(tt + 0.01, e.note, 4, { vel: 0.16, wet: 0.8, pan: -0.15 });
      }, { length: LOOP });
      // Soft pad, one chord per 8 beats: Dadd9, Bm7, Gmaj7, Asus4 (twice).
      const PROG = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'D3', 'E3', 'A3']];
      a.every(8, (tt, k) => a.pad(tt, PROG[k % 4], 7, { vel: 0.55, attack: 3, release: 4, cutoff: 650, wet: 0.6 }));

      // A breaking crest: a white-noise burst that settles slowly into the surf.
      a.on('crash', (a, d, t) => {
        a.noise(t, { dur: 3.2, filter: 'lowpass', freq: 5200, freqEnd: 500, q: 0.5, attack: 0.12,
          vel: 0.25 + 0.3 * d.v, wet: 0.45, pan: (Math.random() - 0.5) * 0.4, bus: 'sfx' });
      }, { gap: 3 });

      // A big wave rolling in: a low swell of noise that rises in pitch and level until it breaks.
      a.on('swell', (a, d, t) => {
        const dur = Math.max(0.6, d.dur);
        a.noise(t, { dur: dur + 0.5, filter: 'lowpass', freq: 160, freqEnd: 1600, q: 0.8, attack: dur * 0.92,
          vel: 0.5 * d.v, wet: 0.4, pan: d.pan * 0.6, bus: 'sfx' });
        a.noise(t, { dur: dur + 0.3, filter: 'lowpass', freq: 70, freqEnd: 260, q: 1.2, attack: dur * 0.85,
          vel: 0.55 * d.v, wet: 0.2, pan: d.pan * 0.3, bus: 'sfx' });
      }, { gap: 0.4 });
      // It breaks: a thump, a wide roar of white water and a hiss of spray settling slowly.
      a.on('bigcrash', (a, d, t) => {
        a.boom(t, { vel: 0.35 * d.v, pan: d.pan * 0.4 });
        a.noise(t, { dur: 4.2, filter: 'lowpass', freq: 6500, freqEnd: 420, q: 0.45, attack: 0.06,
          vel: 0.6 * d.v, wet: 0.5, pan: d.pan * 0.6, bus: 'sfx' });
        a.noise(t + 0.08, { dur: 1.8, filter: 'highpass', freq: 3800, attack: 0.1, vel: 0.22 * d.v, wet: 0.55,
          pan: -d.pan * 0.3, bus: 'sfx' });
      }, { gap: 0.4 });
    }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
