  <meta name="description" content="Leonardo da Vinci's Mona Lisa rebuilt from about 7,500 coloured ASCII characters in a gold character frame: the fragments fly in, a light sweeps across, then the painting shatters into a drifting cloud and reassembles. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg: #0b1120;
      --sky: #000000;
      --text: #e6edf6;
      --muted: #a3b1c6;
      --accent: #3b82f6;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: none; /* fingers push the fragments around; also no double-tap zoom */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.12);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(59, 130, 246, 0.28);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.75;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
      .hint { bottom: 30px; } /* stack above the HUD on narrow screens */
    }
  </style>
</head>

    }
  }
  const NF = F.c.length;
  const FORDER = [[], [], [], []];
  for (let k = 0; k < NF; k++) FORDER[F.g[k]].push(k);

  // ---------- Canvas, layout ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, fs = 8, cw = 5, ch = 9, ox = 0, oy = 0, cellFont = '', labelFont = '', labelFs = 10;
  let xMin = 0, xMax = 1, yMin = 0, yMax = 1, cxU = 0, cyU = 0;
  let needResize = true, needInit = true, dirty = true;
  const counts = new Uint32Array(NCOLOR + 1), order = new Int32Array(NP);

  function resize() {
    needResize = false;
    W = canvas.clientWidth || innerWidth;
    H = canvas.clientHeight || innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // The grid is fixed (96 x 78 + frame + label), so the cell size comes from the viewport.
    const narrow = W < 640;
    const TOP = narrow ? 52 : 46, BOT = narrow ? 50 : 38, SIDE = narrow ? 8 : 16;
    ch = Math.max(3, Math.min((H - TOP - BOT) / GRID_R, (W - 2 * SIDE) / (GRID_C * ASP)));
    cw = ch * ASP;
    ctx.font = `100px ${MONO}`;
    const em = (ctx.measureText('M').width || 60) / 100;
    fs = Math.max(3, Math.min(cw / em, ch * 1.02));
    cellFont = `${fs.toFixed(2)}px ${MONO}`;
    labelFs = Math.max(7, Math.min(13, fs * 1.15, (W - 32) / (LABEL.length * em)));
    labelFont = `${labelFs.toFixed(1)}px ${MONO}`;
    ox = (W - PW * cw) / 2;
    oy = TOP + Math.max(0, (H - TOP - BOT - GRID_R * ch) / 2) + FR * ch;
    // Screen bounds in row-height units, relative to the painting's top-left cell.
    xMin = -ox / ch + 0.5; xMax = (W - ox) / ch - 1.2;
    yMin = -oy / ch + 0.5; yMax = (H - oy) / ch - 1.5;
    cxU = (xMin + xMax) / 2; cyU = (yMin + yMax) / 2;
    dirty = true;
  }

  // ---------- Simulation ----------
  let t = T_START, glintAcc = 0;
  let ptrOn = false, ptrX = 0, ptrY = 0, qAny = false;

  function initAssemble() {
    needInit = false;
    const home = t >= T.ASM_END;
    for (let i = 0; i < NP; i++) {
      QX[i] = QY[i] = QVX[i] = QVY[i] = GLINT[i] = 0;
      CPH[i] = rng() * 16; CR[i] = (rng() < 0.5 ? -1 : 1) * (6 + 8 * rng());
      if (home) { ST[i] = S_HOME; PX[i] = HX[i]; PY[i] = HY[i]; continue; }
      ST[i] = S_WAIT;
      PX[i] = xMin + rng() * (xMax - xMin); PY[i] = yMin + rng() * (yMax - yMin);
      VX[i] = (rng() - 0.5) * 3; VY[i] = (rng() - 0.5) * 3;
      const rad = Math.hypot(HX[i] - PCX, (HY[i] - PCY) * 0.75) / 40;  // centre first
      T0[i] = 0.25 + 2.35 * clamp(0.55 * rng() + 0.45 * rad, 0, 1);
      DUR[i] = T.ASM_END - 0.02 - T0[i] < 1.4 ? T.ASM_END - 0.02 - T0[i] : 1.4;
      SPIN[i] = (rng() < 0.5 ? -1 : 1) * (0.9 + 1.4 * rng());
    }
  }

  function startShatter() {
    const ex = PW * ASP * (0.25 + 0.5 * Math.random()), ey = PH * (0.2 + 0.5 * Math.random());
    KX.fill(0); KY.fill(0); KN.fill(0);
    for (let i = 0; i < NP; i++) { const k = CHUNK[i]; KX[k] += HX[i]; KY[k] += HY[i]; KN[k]++; }
    for (let k = 0; k < NCHUNK; k++) {
      if (!KN[k]) continue;
      KX[k] /= KN[k]; KY[k] /= KN[k];
      const dx = KX[k] - ex, dy = KY[k] - ey, d = Math.hypot(dx, dy) + 0.5;
      const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.9;
      const sp = (5 + 56 * Math.pow(Math.random(), 1.4)) * (0.6 + 0.4 * Math.exp(-d / 30)); // wide spread fills the cloud
      KVX[k] = Math.cos(a) * sp; KVY[k] = Math.sin(a) * sp - 6;
      KW[k] = (Math.random() - 0.5) * 5;
      KR[k] = T.SHATTER + d / T.CRACK_SPEED + Math.random() * 0.06;
    }
    for (let i = 0; i < NP; i++) {
      const k = CHUNK[i];
      ST[i] = S_PEND; REL[i] = KR[k];
      VX[i] = KVX[k] - KW[k] * (HY[i] - KY[k]) + (Math.random() - 0.5) * 2.5;
      VY[i] = KVY[k] + KW[k] * (HX[i] - KX[k]) + (Math.random() - 0.5) * 2.5;
      CR[i] = KW[k] * 3 + (KW[k] < 0 ? -1 : 1) * (5 + 5 * Math.random());
      RET[i] = T.RETURN + Math.random() * T.RET_SPREAD;
    }
  }

  function step(dt) {
    const t1 = t + dt;
    if (!reduced && t < T.SHATTER && t1 >= T.SHATTER) startShatter();
    t = t1;
    if (reduced && t > T_HOLD) t = T_HOLD;
    const burst = t < T.DRIFT;
    const fDrag = Math.exp(-(burst ? 1.0 : 0.35) * dt);
    const grav = burst ? 4 * dt : 0, swirl = (burst ? 4 : 2.4) * dt, wander = (burst ? 1.5 : 6) * dt;
    const wall = 6 * dt, spinK = burst ? 1 : 0.45, pull = burst ? 0 : 0.14 * dt; // pull keeps the cloud from hollowing out

    for (let i = 0; i < NP; i++) {
      const s = ST[i];
      if (s === S_HOME) continue;
      if (s === S_WAIT) {
        PX[i] += VX[i] * dt; PY[i] += VY[i] * dt; CPH[i] += CR[i] * 0.3 * dt;
        if (t >= T0[i]) { ST[i] = S_PATH; SX[i] = PX[i]; SY[i] = PY[i]; }
      } else if (s === S_PATH) {
        const k = (t - T0[i]) / DUR[i];
        if (k >= 1) { ST[i] = S_HOME; PX[i] = HX[i]; PY[i] = HY[i]; continue; }
        const e = easeIO(k < 0 ? 0 : k), a = SPIN[i] * e, ca = Math.cos(a), sa = Math.sin(a), m = 1 - e;
        const dx = SX[i] - HX[i], dy = SY[i] - HY[i];
        PX[i] = HX[i] + (dx * ca - dy * sa) * m; PY[i] = HY[i] + (dx * sa + dy * ca) * m;
        CPH[i] += CR[i] * m * dt;
      } else if (s === S_PEND) {
        if (t >= REL[i]) { ST[i] = S_FREE; GLINT[i] = 0.9; }
      } else { // S_FREE
        let vx = VX[i] * fDrag, vy = VY[i] * fDrag + grav;
        const px = PX[i], py = PY[i], rx = px - cxU, ry = py - cyU, rr = Math.hypot(rx, ry) + 4;
        vx -= ry / rr * swirl + rx * pull; vy += rx / rr * swirl - ry * pull;
        if (wander) { const w = WPH[i] + t * 0.8; vx += Math.cos(w) * wander; vy += Math.sin(w * 1.3) * wander; }
        if (px < xMin) vx += (xMin - px) * wall; else if (px > xMax) vx -= (px - xMax) * wall;
        if (py < yMin) vy += (yMin - py) * wall; else if (py > yMax) vy -= (py - yMax) * wall;
        VX[i] = vx; VY[i] = vy; PX[i] = px + vx * dt; PY[i] = py + vy * dt;
        CPH[i] += CR[i] * spinK * dt;
        if (t >= RET[i]) { ST[i] = S_PATH; SX[i] = PX[i]; SY[i] = PY[i]; T0[i] = t; DUR[i] = 2.2 + 0.8 * WPH[i] / 6.283; SPIN[i] = CR[i] > 0 ? 1.2 : -1.2; }
      }
    }

    pushStep(dt);

    // Shimmer: a few random cells catch the light while the painting is whole.
    const fGl = Math.exp(-3 * dt);
    for (let i = 0; i < NP; i++) if (GLINT[i] > 0.003) GLINT[i] *= fGl; else GLINT[i] = 0;
    const whole = (t >= T.ASM_END && t < T.SHATTER) || t >= T.RETURN + T.RET_SPREAD + 3;
    if (whole && !reduced) {
      glintAcc += 45 * dt;
      while (glintAcc >= 1) { glintAcc--; GLINT[(Math.random() * NP) | 0] = 0.5 + 0.5 * Math.random(); }
    }
  }

  // Pointer: radial push within ~6 cells, spring back to zero offset.
  function pushStep(dt) {
    if (ptrOn || qAny) {
      const mx = (ptrX - ox) / ch, my = (ptrY - oy) / ch, R = 4.2, R2 = R * R;
      const kdt = 70 * dt, cdt = 9 * dt, push = 260 * dt;
      qAny = false;
      for (let i = 0; i < NP; i++) {
        let qx = QX[i], qy = QY[i], vx = QVX[i], vy = QVY[i];
        if (ptrOn) {
          const dx = PX[i] + qx - mx, dy = PY[i] + qy - my, d2 = dx * dx + dy * dy;
          if (d2 < R2) { const d = Math.sqrt(d2) + 0.05, f = (1 - d / R) * push / d; vx += dx * f; vy += dy * f; }
        }
        if (qx === 0 && qy === 0 && vx === 0 && vy === 0) continue;
        vx += -qx * kdt - vx * cdt; vy += -qy * kdt - vy * cdt;
        qx += vx * dt; qy += vy * dt;
        if (Math.abs(qx) + Math.abs(qy) + Math.abs(vx) + Math.abs(vy) < 0.002) qx = qy = vx = vy = 0;
        else qAny = true;
        QX[i] = qx; QY[i] = qy; QVX[i] = vx; QVY[i] = vy;
      }
    }
  }

  // ---------- Drawing ----------
  let nDisp = 0, nLetters = 0;

  function sweepAt() {
    for (let s = 0; s < T.SWEEPS.length; s++) {
      const k = (t - T.SWEEPS[s]) / T.SWEEP_DUR;
      if (k > 0 && k < 1) return -0.3 + 1.6 * easeIO(k);
    }
    return -9;
  }

  function drawPainting() {
    const sc = sweepAt();
    let disp = 0, nv = 0;
    counts.fill(0);
    for (let i = 0; i < NP; i++) {
      const s = ST[i];
      const x = PX[i] + QX[i], y = PY[i] + QY[i];
      const ddx = x - HX[i], ddy = y - HY[i];
      if (ddx * ddx + ddy * ddy > 0.25) disp++;
      const sx = ox + x * ch, sy = oy + y * ch;
      if (sx < -cw || sy < -ch || sx > W || sy > H) { VIS[i] = 0; continue; }
      VIS[i] = 1; DX[i] = sx; DY[i] = sy; nv++;

      let b = 1, settle = 1;
      if (s === S_WAIT) { b = 0.5; settle = 0; }
      else if (s === S_PATH) { const k = clamp((t - T0[i]) / DUR[i], 0, 1); b = 0.5 + 0.5 * k; settle = k > 0.88 ? 1 : 0; }
      else if (s === S_FREE) { b = 0.85; settle = 0; }
      const gl = GLINT[i];
      let r = BR[i] * b + gl * 120, g = BG[i] * b + gl * 105, bl = BB[i] * b + gl * 80;
      if (sc > -9) {
        const d = (s === S_HOME || s === S_PEND ? UD[i] : (x / (PW * ASP)) * 0.45 + (y / PH) * 0.55) - sc;
        const a1 = (d - 0.06) / 0.055, a2 = (d + 0.05) / 0.065;
        const wv = Math.exp(-a1 * a1), wg = Math.exp(-a2 * a2);
        const m = 1 + 0.25 * wv + 0.4 * wg;
        r = r * m + 170 * wv + 120 * wg; g = g * m + 40 * wv + 95 * wg; bl = bl * m + 200 * wv + 20 * wg;
      }
      const ri = r > 255 ? 255 : r | 0, gi = g > 255 ? 255 : g | 0, bi = bl > 255 ? 255 : bl | 0;
      const q = ((ri >> 4) << 8) | ((gi >> 4) << 4) | (bi >> 4);
      CQ[i] = q; counts[q]++;
      CHI[i] = settle ? LUMCH[(0.3 * ri + 0.59 * gi + 0.11 * bi) | 0]
                      : FLY[((CPH[i] < 0 ? -CPH[i] : CPH[i]) + (i & 7)) % FLY.length | 0];
    }
    nDisp = disp; nLetters = nv;
    // Bucket by colour so fillStyle changes once per colour, not once per cell.
    let acc = 0;
    for (let c = 0; c < NCOLOR; c++) { const n = counts[c]; counts[c] = acc; acc += n; }
    for (let i = 0; i < NP; i++) if (VIS[i]) order[counts[CQ[i]]++] = i;
    let cur = -1;
    for (let j = 0; j < nv; j++) {
      const i = order[j], q = CQ[i];
      if (q !== cur) { cur = q; ctx.fillStyle = COLSTR[q]; }
      ctx.fillText(CH[CHI[i]], DX[i], DY[i]);
    }
  }

  function drawFrame() {
    let n = 0;
    for (let g = 0; g < 4; g++) {
      ctx.fillStyle = FCOL[g];
      const L = FORDER[g];
      for (let j = 0; j < L.length; j++) {
        const k = L[j], a = t - F.t[k];
        if (a < 0.15) continue;
        ctx.fillText(F.ch[k], ox + F.c[k] * cw, oy + F.r[k] * ch); n++;
      }
    }
    ctx.fillStyle = FLASH; // the drawing tip of the frame
    for (let k = 0; k < NF; k++) {
      const a = t - F.t[k];
      if (a < 0 || a >= 0.15) continue;
      ctx.fillText(F.ch[k], ox + F.c[k] * cw, oy + F.r[k] * ch); n++;
    }
    return n;
  }

  function drawLabel() {
    const a = smooth((t - T.LABEL) / 1.0);
    if (a <= 0) return 0;
    ctx.font = labelFont;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.7 * a;
    ctx.fillStyle = 'rgb(214,166,84)';
    ctx.fillText(LABEL, W / 2, oy + (PH + FR) * ch + Math.max(ch * 0.7, 4));
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    return LABEL.replace(/ /g, '').length;
  }

  // Bloom: shrink the frame, remove the background with 'difference', blur, and add it back on top.
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  const GLOW_DIV = 5, GLOW_A = 0.7, BGC = "#000";
  function drawGlow() {
    const gw = Math.ceil(W / GLOW_DIV), gh = Math.ceil(H / GLOW_DIV);
    if (glow.width !== gw || glow.height !== gh) { glow.width = gw; glow.height = gh; }
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'copy';
    gctx.filter = 'blur(2px)';
    gctx.drawImage(canvas, 0, 0, gw, gh);
    gctx.filter = 'none';
    gctx.globalCompositeOperation = 'difference';
    gctx.setTransform(gw / W, 0, 0, gh / H, 0, 0);
    gctx.fillStyle = BGC;
    gctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = GLOW_A;
    ctx.drawImage(glow, 0, 0, W, H);
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = BGC;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.font = cellFont;
    const nf = drawFrame();
    drawPainting();
    drawGlow();
    nLetters += nf + drawLabel();
  }

  // ---------- Loop, HUD, controls ----------
  let paused = false, last = performance.now();
  let frames = 0, fpsT = last, fps = 0, hudT = 0;
  const fmt = n => n.toLocaleString('en-US');

  function updateHud(now) {
    const inPlace = ((NP - nDisp) / NP * 100).toFixed(1);
    const tail = paused ? 'paused' : `${fps} fps`;
    // Narrow screens get a short line so nothing is clipped.
    hudEl.textContent = W < 640 ? `in place ${inPlace}%  ${tail}`
      : `fragments ${fmt(nDisp)}  in place ${inPlace}%  letters ${fmt(nLetters)}  ${tail}`;
    hudT = now;
  }

  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) resize();
    if (needInit) initAssemble();
    if (!paused) {
      step(dt);
      if (!reduced && t >= T.END) t = T.LOOP;   // later loops: short hold, sweep, shatter again
    } else if (qAny || ptrOn) {
      pushStep(dt); dirty = true;               // pointer still pushes while paused
    }
    if (!paused || dirty) { render(); dirty = false; frames++; }
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); }
  function replay() { t = T_START; paused = false; needInit = true; dirty = true; }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
  });

  // Pointer pushes the cells; a press only counts as a tap if it moved less than 8 px.
  let downX = 0, downY = 0, pressed = false, dragged = false;
  function setPtr(e) {
    const rc = canvas.getBoundingClientRect();
    ptrX = e.clientX - rc.left; ptrY = e.clientY - rc.top; ptrOn = !reduced;
  }
  canvas.addEventListener('pointerdown', e => {
    setPtr(e); pressed = true; dragged = false; downX = e.clientX; downY = e.clientY;
  });
  canvas.addEventListener('pointermove', e => {
    setPtr(e);
    if (pressed && Math.hypot(e.clientX - downX, e.clientY - downY) >= 8) dragged = true;
  });
  const ptrOff = () => { ptrOn = false; pressed = false; };
  canvas.addEventListener('pointerleave', ptrOff);
  canvas.addEventListener('pointercancel', ptrOff);
  // Single tap = pause (decided after 280 ms), two quick taps = replay.
  let tapTimer = 0;
  canvas.addEventListener('pointerup', e => {
    const wasTap = pressed && !dragged;
    pressed = false;
    if (e.pointerType !== 'mouse') ptrOn = false;
    if (e.button > 0 || !wasTap) return;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = 0; replay(); }
    else tapTimer = setTimeout(() => { tapTimer = 0; togglePause(); }, 280);
  });

  // Hint language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';
  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '點擊暫停 · 雙擊重播' : 'tap to pause · double-tap to replay')
                             : (zh ? '空白鍵 暫停 · R 重播 · 點擊暫停 · 雙擊重播'
                                   : 'Space pause · R replay · click to pause · double-click to replay');

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
