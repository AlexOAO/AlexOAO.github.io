<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <title>ASCII | Alex Li (李翔緯)</title>
  <meta name="description" content="ASCII by Alex Li (李翔緯): small things drawn with characters, like a spinning 3D ASCII Christmas tree. 用字元畫出來的小作品。">
  <link rel="canonical" href="https://xiang-wei-li.com/ascii/">
  <meta name="theme-color" content="#0b1120">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #e6edf6; --muted: #a3b1c6; --dim: #8291a7; --line: rgba(148,163,184,0.14);
      --accent: #3b82f6; --accent-2: #06b6d4; --accent-3: #8b5cf6;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --display: 'Inter', 'Noto Sans TC', sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh; min-height: 100svh; overflow-x: hidden;
      font-family: 'Noto Sans TC', 'Inter', sans-serif; background: #0b1120; color: var(--text); line-height: 1.7;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse 50% 40% at 25% 20%, rgba(59,130,246,0.2), transparent 70%),
                  radial-gradient(ellipse 45% 40% at 80% 75%, rgba(139,92,246,0.16), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift { to { transform: translate3d(3vw, 2vh, 0) scale(1.05); } }
    ::selection { background: rgba(59,130,246,0.35); color: #fff; }
    :focus-visible { outline: 2px solid #60a5fa; outline-offset: 3px; border-radius: 6px; }
    @view-transition { navigation: auto; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .back { font-family: var(--display); font-size: 0.92rem; font-weight: 600; color: var(--muted); text-decoration: none; transition: color 0.3s; }
    .back:hover { color: var(--text); }
    .lang-toggle {
      font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; color: var(--text);
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.3);
      border-radius: 20px; padding: 0.3rem 0.8rem; cursor: pointer; transition: background 0.3s;
    }
    .lang-toggle:hover { background: rgba(59,130,246,0.25); }

    header.intro { margin: 4.5rem 0 3rem; animation: rise 1s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
    h1 {
      font-family: var(--mono); font-weight: 700; letter-spacing: 0.04em; line-height: 1;
      font-size: clamp(3.5rem, 14vw, 6.5rem);
      background: linear-gradient(110deg, #60a5fa, #22d3ee 45%, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 .cur { -webkit-text-fill-color: #22d3ee; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .lead { color: var(--muted); font-size: 1.1rem; margin-top: 1rem; text-wrap: pretty; }

    /* Sections: the main pieces, then series such as World Cities. Jump links sit under the intro. */
    .jump { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.4rem; }
    .jump a {
      font-family: var(--display); font-size: 0.82rem; font-weight: 600; color: var(--muted); text-decoration: none;
      border: 1px solid var(--line); border-radius: 20px; padding: 0.3rem 0.85rem; transition: color 0.3s, border-color 0.3s, background 0.3s;
    }
    .jump a:hover { color: var(--text); border-color: rgba(96,165,250,0.4); background: rgba(59,130,246,0.08); }
    .jump .n { color: var(--dim); font-weight: 500; margin-left: 0.3rem; }
    .sec { scroll-margin-top: 1.5rem; }
    .sec + .sec { margin-top: 4rem; }
    .sec-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1.4rem; }
    .sec-head h2 { font-family: var(--mono); font-size: 1.3rem; font-weight: 700; letter-spacing: 0.03em; color: #e2e8f0; }
    .sec-head p { color: var(--dim); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 1.5rem; }
    .card {
      display: flex; flex-direction: column; text-decoration: none; color: inherit; overflow: hidden;
      background: linear-gradient(180deg, rgba(30,41,59,0.62), rgba(30,41,59,0.38)); border: 1px solid var(--line); border-radius: 20px;
      transition: border-color 0.4s, transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
      animation: rise 1s var(--ease) both; animation-delay: calc(0.15s + var(--i, 0) * 0.08s);
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(96,165,250,0.4); box-shadow: 0 30px 60px -30px rgba(37,99,235,0.5); }
    .preview {
      background: #05070d; border-bottom: 1px solid var(--line); display: grid; place-items: center; padding: 1.25rem 0.5rem; overflow: hidden;
      min-height: calc(12 * 13px * 1.15 + 2.5rem);
    }
    .preview pre {
      font-family: var(--mono); font-size: 13px; line-height: 1.15; color: #22c55e; white-space: pre;
      transition: transform 1.2s var(--ease);
    }
    .card:hover .preview pre { transform: scale(1.06); }
    .body { padding: 1.4rem 1.5rem 1.6rem; display: flex; flex-direction: column; flex: 1; }
    .card h3 { font-size: 1.15rem; font-weight: 700; color: #e2e8f0; line-height: 1.4; transition: color 0.3s; }
    .card:hover h3 { color: #60a5fa; }
    .card p { color: var(--muted); font-size: 0.92rem; margin-top: 0.5rem; flex: 1; }
    .more { display: inline-flex; align-items: center; gap: 0.45rem; margin-top: 1.1rem; font-family: var(--display); font-size: 0.85rem; font-weight: 600; color: #60a5fa; transition: gap 0.3s var(--ease); }
    .card:hover .more { gap: 0.7rem; }

    /* Tree preview colours */
    .t-star { color: #facc15; text-shadow: 0 0 8px rgba(250,204,21,0.8); }
    .t-trunk { color: #a16207; }
    .t-red { color: #ef4444; }
    .t-blue { color: #3b82f6; }
    .t-bow { color: #facc15; }
    .t-ball { color: #ef4444; }
    .t-light { color: #fde047; animation: twinkle 1.6s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.37s); }
    .t-star { animation: twinkle 2.4s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: 0.25; } }

    /* Rose preview colours (reuses .t-red for roses, .t-bow for the bow) */
    .r-pink { color: #f472b6; }
    .r-rose { color: #fb7185; }
    .r-wrap { color: #94a3b8; }
    .r-bloom { color: #f43f5e; animation: bloom 2.8s ease-in-out infinite; }
    @keyframes bloom { 50% { color: #fda4af; text-shadow: 0 0 8px rgba(244,63,94,0.85); } }
    .r-petal { display: inline-block; color: #f9a8d4; animation: petal 4.5s ease-in infinite; }
    @keyframes petal { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-0.6em, 6.5em) rotate(160deg); opacity: 0; } }

    /* Mona Lisa preview: gold frame around per-cell colours from the painting; a light band sweeps across */
    .m-frame { color: #d4a73c; }
    .m-g { animation: glint 7s linear infinite; animation-delay: calc(var(--d, 0) * 0.05s); }
    @keyframes glint { 0%, 7%, 100% { filter: none; text-shadow: none; } 3.5% { filter: brightness(1.7); text-shadow: 0 0 6px rgba(255,236,170,0.75); } }

    /* Eiffel preview: gold tower, dim skyline with lit windows, blinking sparkles */
    .e-gold { color: #f5b942; }
    .e-city { color: #334155; }
    .e-win { color: #fde047; }
    .e-sky { color: #cbd5e1; animation: twinkle 3.2s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -1.1s); }
    .e-spark { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,0.9); animation: spark 1.8s steps(1) infinite; animation-delay: calc(var(--k, 0) * -0.45s); }
    @keyframes spark { 50% { color: #f5b942; text-shadow: none; } }

    /* Black hole preview: cream lensed arc, white photon ring, amber disk with a flowing shimmer */
    .b-arc { color: #fde68a; text-shadow: 0 0 6px rgba(253,230,138,0.55); }
    .b-ring { color: #fff7ed; text-shadow: 0 0 5px rgba(255,237,213,0.8); }
    .b-disk { color: #f59e0b; animation: shimmer 3s ease-in-out infinite; animation-delay: calc((var(--x, 0) - 17) * 0.12s); }
    @keyframes shimmer { 50% { color: #fef3c7; text-shadow: 0 0 6px rgba(251,191,36,0.8); } }

    /* Money rain preview: green bills at different tilts that flutter; one keeps falling */
    .g-bill { display: inline-block; color: #22c55e; transform: rotate(var(--t, 0deg)); animation: flutter 3.2s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.9s); }
    .g-bill b { font-weight: inherit; color: #86efac; }
    @keyframes flutter { 50% { transform: rotate(calc(var(--t, 0deg) * -0.6)) translateY(0.15em); } }
    .g-fall { animation: fall 6s linear infinite; }
    @keyframes fall {
      0% { transform: translate(0, -1.6em) rotate(-10deg); opacity: 0; }
      10% { opacity: 1; }
      35% { transform: translate(0.7em, 3em) rotate(14deg); }
      65% { transform: translate(-0.4em, 6.5em) rotate(-12deg); }
      88% { opacity: 1; }
      100% { transform: translate(0.3em, 10.5em) rotate(8deg); opacity: 0; }
    }
    .g-dim { color: #166534; }

    /* Diamond ring preview: icy gem, silver band, twinkling glints */
    .d-gem { color: #e0f2fe; text-shadow: 0 0 6px rgba(186,230,253,0.85); }
    .d-band { color: #cbd5e1; }
    .d-glint { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.95); animation: twinkle 1.7s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.6s); }

    /* Red rose preview (reuses .r-bloom for the heart of the flower) */
    .s-rose { color: #ef4444; }
    .s-stem { color: #16a34a; }
    .s-leaf { color: #22c55e; }
    .s-star { color: #fde68a; animation: twinkle 2.2s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.8s); }

    /* Birthday cake preview: chocolate layers, cream, pink candle, flickering flame, confetti */
    .c-choc { color: #9a5b2e; }
    .c-cream { color: #fde7c7; }
    .c-candle { color: #f472b6; }
    .c-flame { display: inline-block; color: #fb923c; text-shadow: 0 0 8px rgba(251,146,60,0.9); transform-origin: 50% 100%; animation: flicker 0.9s ease-in-out infinite alternate; }
    @keyframes flicker { 50% { color: #fde047; transform: scaleY(1.15) skewX(-6deg); } 100% { transform: scaleY(0.9) skewX(5deg); } }
    .c-conf { animation: twinkle 2s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.5s); }

    /* Ocean preview: grey swells darker far away, a bright crest that sweeps along, foam */
    .o-moon { color: #fef9c3; text-shadow: 0 0 10px rgba(254,249,195,0.9); }
    .o-far { color: #475569; }
    .o-mid { color: #64748b; }
    .o-near { color: #94a3b8; }
    .o-crest { color: #cbd5e1; animation: crest 3.4s ease-in-out infinite; animation-delay: calc((var(--x, 0) - 17) * 0.14s); }
    @keyframes crest { 0%, 100% { color: #94a3b8; } 50% { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,0.8); } }
    .o-foam { color: #e2e8f0; animation: twinkle 2.6s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.43s); }

    /* Shiba previews: orange fur, cream muzzle/cheeks/inner ears, dark eyes and nose */
    .k-fur { color: #f59e42; }
    .k-cream { color: #fde9c9; }
    .k-eye { color: #2a1708; text-shadow: 0 0 2px #fde9c9, 0 0 4px rgba(253,233,201,0.7); font-weight: 700; }
    .k-nose { color: #2a1708; text-shadow: 0 0 2px #fde9c9, 0 0 4px rgba(253,233,201,0.7); font-weight: 700; }
    .k-tail { display: inline-block; color: #f59e42; transform-origin: 0 100%; animation: wag 0.7s ease-in-out infinite alternate; }
    .k-tail.k-cream { color: #fde9c9; }
    @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg) translateX(0.12em); } }
    .k-heart { display: inline-block; color: #f472b6; text-shadow: 0 0 6px rgba(244,114,182,0.8); animation: floatUp 2.8s ease-out infinite; }
    @keyframes floatUp { 0% { transform: translateY(0.6em); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-1.1em); opacity: 0; } }
    .k-sun { color: #fb923c; text-shadow: 0 0 8px rgba(251,146,60,0.7); }
    .k-sun2 { color: #f472b6; }
    .k-grass { color: #22c55e; }
    .k-blade { display: inline-block; color: #4ade80; animation: sway 1.4s ease-in-out infinite alternate; animation-delay: calc(var(--x, 0) * -0.17s); }
    @keyframes sway { to { transform: translateX(-0.25em) skewX(-14deg); } }
    .k-fly { display: inline-block; color: #c4b5fd; text-shadow: 0 0 6px rgba(196,181,253,0.8); animation: flutterBy 1.8s ease-in-out infinite; }
    @keyframes flutterBy { 0%, 100% { transform: translate(0, 0) scaleX(1); } 25% { transform: translate(0.3em, -0.3em) scaleX(0.35); } 50% { transform: translate(0.6em, 0.1em) scaleX(1); } 75% { transform: translate(0.25em, 0.3em) scaleX(0.35); } }
    .k-moon { color: #fef3c7; text-shadow: 0 0 8px rgba(254,243,199,0.7); }
    .k-z { display: inline-block; color: #93c5fd; animation: zzz 3.6s ease-out infinite; animation-delay: calc(var(--k, 0) * -1.2s); }
    @keyframes zzz { 0% { transform: translate(-0.3em, 0.8em) scale(0.7); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(0.4em, -0.8em) scale(1.1); opacity: 0; } }
    .k-breathe { display: inline-block; animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: translateY(-0.14em); } }
    .k-bed { color: #475569; }

    /* Snow globe preview: pale glass, snowy roof and ground, warm windows, twinkling lights, falling flakes, gold on wood */
    .sg-glass { color: #93b4d8; }
    .sg-snow { color: #cbd5e1; }
    .sg-roof { color: #f1f5f9; }
    .sg-chim { color: #94a3b8; }
    .sg-wall { color: #c08552; }
    .sg-tree { color: #22c55e; }
    .sg-wood { color: #9a5b2e; }
    .sg-gold { color: #f5b942; }
    .sg-win { color: #fcd34d; text-shadow: 0 0 6px rgba(252,211,77,0.85); animation: sgGlow 2.4s ease-in-out infinite; }
    @keyframes sgGlow { 50% { color: #fde68a; text-shadow: 0 0 10px rgba(252,211,77,1); } }
    .sg-light { color: #f87171; filter: hue-rotate(calc(var(--x, 0) * 70deg)); text-shadow: 0 0 5px currentColor; animation: twinkle 1.6s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.37s); }
    .sg-flake { display: inline-block; color: #fff; animation: sgFall 3.2s linear infinite; animation-delay: calc(var(--k, 0) * -0.7s); }
    @keyframes sgFall { 0% { transform: translateY(-0.6em); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(1.4em); opacity: 0; } }
    .sg-smoke { display: inline-block; color: #94a3b8; animation: sgSmoke 3s ease-out infinite; }
    @keyframes sgSmoke { 0% { transform: translate(0, 0.5em); opacity: 0; } 30% { opacity: 0.9; } 100% { transform: translate(0.4em, -0.9em); opacity: 0; } }

    /* Santa's sleigh preview: red sleigh and coat, glowing gold runner, brown reindeer with a red nose,
       the whole team bobbing in a wave, a twinkling gold trail, moon and mountains */
    .ss-bob { display: inline-block; animation: ss-bob 1.8s ease-in-out infinite; animation-delay: calc(var(--x, 0) * -0.05s); }
    @keyframes ss-bob { 50% { transform: translateY(-0.2em); } }
    .ss-red { color: #ef4444; }
    .ss-fur { color: #f8fafc; }
    .ss-skin { color: #fdba8c; }
    .ss-gift { color: #34d399; }
    .ss-gold { color: #fcd34d; text-shadow: 0 0 6px rgba(252,211,77,0.75); }
    .ss-rein { color: #dc2626; }
    .ss-deer { color: #d08a4e; }
    .ss-antler { color: #f1e6cc; }
    .ss-nose { display: inline-block; color: #ff4d4d; text-shadow: 0 0 8px rgba(255,77,77,0.95);
               animation: ss-bob 1.8s ease-in-out infinite, ss-nose 1.2s ease-in-out infinite; animation-delay: calc(var(--x, 0) * -0.05s), 0s; }
    @keyframes ss-nose { 50% { color: #fecaca; text-shadow: 0 0 12px rgba(255,90,90,1); } }
    .ss-trail { color: #fde68a; animation: twinkle 1.3s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.33s); }
    .ss-star { color: #cbd5e1; animation: twinkle 2.6s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.7s); }
    .ss-moon { color: #fef9c3; text-shadow: 0 0 10px rgba(254,249,195,0.8); }
    .ss-mtn { color: #475569; }

    /* Snowy bridge preview: grey night, lamps that glow and sputter, shimmering reflections, drifting snow */
    .nb-bldg { color: #273449; }
    .nb-bridge { color: #64748b; }
    .nb-post, .nb-rail { color: #94a3b8; }
    .nb-water { color: #1e293b; }
    .nb-snow { color: #cbd5e1; }
    .nb-foot { color: #475569; }
    .nb-lamp { color: #fff; text-shadow: 0 0 8px rgba(241,245,249,0.95); animation: nbFlicker 6s steps(1) infinite; }
    @keyframes nbFlicker { 0%, 60%, 63%, 66%, 100% { opacity: 1; } 61%, 64% { opacity: 0.2; text-shadow: none; } }
    .nb-ref { display: inline-block; color: #e2e8f0; animation: nbShimmer 1.6s ease-in-out infinite alternate; animation-delay: calc(var(--k, 0) * -0.37s); }
    @keyframes nbShimmer { to { color: #64748b; transform: translateX(0.25em); } }
    .nb-flake { display: inline-block; color: #e2e8f0; animation: nbDrift 4s linear infinite; animation-delay: calc(var(--k, 0) * -0.9s); }
    @keyframes nbDrift { 0% { transform: translate(0.3em, -0.6em); opacity: 0; } 20%, 80% { opacity: 1; } 100% { transform: translate(-0.5em, 1.2em); opacity: 0; } }
    .nb-spark { color: #fff; animation: twinkle 2.4s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.7s); }

    /* Cozy Christmas preview: colour-cycling string and tree lights, flipping TV, blinking 12:00, flickering fire, breathing cat */
    .cr-wire { color: #3f5f45; }
    .cr-bulb { color: #ef4444; text-shadow: 0 0 6px currentColor; animation: crBulb 2.4s steps(1) infinite; animation-delay: calc(var(--k, 0) * -0.61s); }
    @keyframes crBulb { 0% { color: #ef4444; } 25% { color: #4ade80; } 50% { color: #60a5fa; opacity: 0.45; } 75% { color: #facc15; } }
    .cr-tree { color: #16a34a; }
    .cr-orn { color: #f43f5e; }
    .cr-star { color: #facc15; text-shadow: 0 0 8px rgba(250,204,21,0.85); animation: twinkle 2.4s ease-in-out infinite; }
    .cr-trunk { color: #92400e; }
    .cr-gift-r { color: #dc2626; }
    .cr-gift-b { color: #3b82f6; }
    .cr-curtain { color: #b91c1c; }
    .cr-wood { color: #a16207; }
    .cr-snow { color: #f8fafc; animation: twinkle 2.2s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.7s); }
    .cr-moon { color: #fefce8; text-shadow: 0 0 8px rgba(254,252,232,0.9); }
    .cr-ground { color: #dbeafe; }
    .cr-tv { color: #a8a29e; }
    .cr-knob { color: #4ade80; }
    .cr-screen { animation: crChannel 8s steps(1) infinite; text-shadow: 0 0 6px currentColor; }
    @keyframes crChannel { 0% { color: #7dd3fc; } 25% { color: #c084fc; } 50% { color: #f87171; } 62% { color: #94a3b8; } 75% { color: #4ade80; } }
    .cr-clock { color: #4ade80; text-shadow: 0 0 6px rgba(74,222,128,0.8); animation: crBlink 1.2s steps(1) infinite; }
    @keyframes crBlink { 60% { color: #14532d; text-shadow: none; } }
    .cr-wreath { color: #15803d; }
    .cr-bow { color: #ef4444; }
    .cr-candle { color: #fde68a; text-shadow: 0 0 6px rgba(253,230,138,0.9); animation: twinkle 1.3s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -0.4s); }
    .cr-stock { color: #ef4444; }
    .cr-brick { color: #b45339; }
    .cr-fire { display: inline-block; color: #fb923c; text-shadow: 0 0 8px rgba(251,146,60,0.9); transform-origin: 50% 100%; animation: flicker 0.8s ease-in-out infinite alternate; animation-delay: calc(var(--k, 0) * -0.17s); }
    .cr-rug { color: #dc2626; }
    .cr-rug-in { color: #1e3a8a; }

    // Small framed portrait generated from the real painting (head and shoulders, 15x10 area-averaged cells,
    // brightened with a warm bias): one luminance-ramp char + one 3-digit hex colour per cell,
    // inside a gold +===+ frame. A light band sweeps diagonally across.
    function monaPreview() {
      const W = 15, H = 10;
      const CH = '+++++++~~++++++****+~-:.::++++###~*%%*-...+**##*:*##*~:..:~+~~-:##*#*:...--::..~*~*~....::--:..~~-:....:---:..:~+~~:...::...-#%%%#~:...:..+%@@@@#~--:.';
      const COL = 'ef5ef5ef4ff4ff4ff5ee5ed5ed5ee5ef5ef6ef5ee5ef5ff6ff5ff5ff5fd3fa1f90c60a41952a83ff5ff6ff5ff6ff7ff6ff7fa3fe1ff3ff2ff0f90831412632ed6ff6ff6ff8ff7ff5e61fe2ff2ff2fe0fb0c51512312763cc4de6db4cb4c83e61ff2ff2fe1ff1ff1d615124135338a49b5983973942922f91fe1fa0fe1fa1a31512413423774784994ba4a73912921f92fb1f81c51831622413423774894b95ba4973822822b51fb1fc1fb0fb0d60721622543773952952732922f80ff2ff2ff2ff2ff1fa0c40831722732a52723832fd0ff2ff3ff4ff4ff4ff1fa0f70e70e71a42';
      const frame = (c, d) => `<span class="m-frame m-g" style="--d:${d}">${c}</span>`;
      const edge = y => frame('+', y) + Array.from({ length: W }, (_, x) => frame('=', x + 1 + y)).join('') + frame('+', W + 1 + y);
      const rows = [edge(0)];
      for (let y = 0; y < H; y++) {
        let line = frame('|', y + 1);
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          line += `<span class="m-g" style="color:#${COL.substr(i * 3, 3)};--d:${x + y + 2}">${Site.esc(CH[i])}</span>`;
        }
        rows.push(line + frame('|', W + y + 2));
      }
      rows.push(edge(H + 1));
      return rows.join('\n');
    }

    // Small Eiffel Tower: gold girders, * blinking sparkles, + . stars, dim skyline with # lit windows.
    function eiffelPreview() {
      const rows = [

        '      / * \\      ',

        ' _ /  /   \\  \\ _ ',
        '|#|__/_____\\__|#|',
        '|#|=#=|=#=|=#=|#|'
      ];
      let k = 0, s = 0;
      return rows.map((r, y) => [...r].map((c, x) => {
        if (c === ' ') return c;
        if (c === '*') return `<span class="e-spark" style="--k:${k++}">*</span>`;
        if (y <= 1 && (c === '+' || c === '.')) return `<span class="e-sky" style="--k:${s++}">${c}</span>`;
        if (c === '#') return `<span class="e-win">#</span>`;
        const tower = y <= 5 || (y <= 7 && x >= 3 && x <= 13) || (y === 8 && (c === '/' || c === '\\'));
        return `<span class="${tower ? 'e-gold' : 'e-city'}">${Site.esc(c)}</span>`;
      }).join('')).join('\n');
    }

    // Paint rows using a same-sized mask: each mask letter picks a class (space = plain text).
    // Every painted span gets --k (running index) and --x (column) for staggered animations.
    function paint(rows, masks, map) {
      let k = 0;
      return rows.map((r, y) => [...r].map((c, x) => {
        const cl = map[masks[y][x]];
        if (c === ' ' || !cl) return Site.esc(c);
        return `<span class="${cl}" style="--k:${k++};--x:${x}">${Site.esc(c)}</span>`;
      }).join('')).join('\n');
    }

      return paint([

    }

    function render() {
      const lang = Site.getLang(), T = I18N[lang];
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
      document.getElementById('lead').textContent = T.lead;
      document.getElementById('langToggle').textContent = T.toggle;
      const groups = [
        { id: 'pieces', list: PIECES, title: T.pieces, sub: T.piecesSub },
        { id: 'cities', list: CITIES, title: T.cities, sub: T.citiesSub }
      ].filter(g => g.list.length);
      document.getElementById('jump').innerHTML = groups.map(g =>
        `<a href="#${g.id}">${Site.esc(g.title)}<span class="n">${g.list.length}</span></a>`).join('');
      document.getElementById('sections').innerHTML = groups.map(g => `
        <section class="sec" id="${g.id}">
          <div class="sec-head"><h2>${Site.esc(g.title)}</h2><p>${Site.esc(g.sub)}</p></div>
          <div class="grid">${cards(g.list, lang, T)}</div>
        </section>`).join('');
    }

    function cards(list, lang, T) {
      return list.map((p, i) => `
        <a class="card" href="${Site.esc(p.href)}" style="--i:${i}">
          <div class="preview" aria-hidden="true"><pre>${p.preview}</pre></div>
          <div class="body">
            <h3>${Site.esc(p.title[lang])}</h3>
            <p>${Site.esc(p.desc[lang])}</p>
            <span class="more">${Site.esc(T.open)} ${Site.arrowSvg}</span>
          </div>
        </a>`).join('');
    }

    render();
    document.getElementById('langToggle').addEventListener('click', () => { Site.toggleLang(); render(); });
  </script>
