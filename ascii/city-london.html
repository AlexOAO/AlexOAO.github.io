<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASCII London on the Thames | Alex Li (李翔緯)</title>
  <meta name="description" content="London at night drawn entirely with ASCII characters: a misty sky and a full moon, a blue skyline with St Paul's and the Shard, the golden Palace of Westminster, Big Ben with a clock showing your local time, and Tower Bridge lit in blue, all mirrored in the rippling Thames. Tap Big Ben to hear the hour, tap Tower Bridge to open it for a tall ship. Vanilla JS on a single canvas.">
  <meta name="theme-color" content="#05070f">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #0b1120;
      --sky: #05070f;
      --text: #f4ecd8;
      --muted: #b9b4a4;
      --accent: #fbbf24;
      --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: block;
      touch-action: none; /* taps ring Big Ben, open the bridge, launch boats; drags stir the mist */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      background: rgba(40, 30, 8, 0.45);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover, .back:focus-visible {
      background: rgba(251, 191, 36, 0.25);
      border-color: var(--accent);
      outline: none;
    }
    .hud, .hint {
      position: fixed;
      z-index: 1;
      bottom: 12px;
      color: var(--muted);
      opacity: 0.8;
      font: 11px/1.4 var(--mono);
      white-space: pre;
      pointer-events: none;
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    .hud { left: 12px; }
    .hint {
      right: 12px;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
    }
    @media (max-width: 1180px) {
      .hint { bottom: 30px; } /* stack above the HUD when both would not fit on one line */
    }
    @media (max-width: 640px) {
      .hud, .hint { font-size: 10px; }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ASCII London on the Thames</h1>
  <a class="back" href="./">← ASCII</a>
  <canvas id="c" role="img" aria-label="Animated London night scene drawn with ASCII characters: a misty sky with a full moon, a blue skyline, the golden Palace of Westminster, Big Ben whose clock shows the local time, and blue-lit Tower Bridge, all reflected in the rippling Thames; tapping Big Ben rings the hour and tapping Tower Bridge raises it for a tall ship"></canvas>
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>

<script src="ascii-audio.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Timeline (seconds of scene time, one loop) ----------
  const T = {
    SKYLINE: 1.3, SKYLINE_DUR: 2.2,   // moon first, then the blue city resolves
    PALACE: 3.3, PALACE_DUR: 3.0,     // Palace of Westminster, bottom to top
    TOWER: 6.0, TOWER_DUR: 2.8,       // Elizabeth Tower (Big Ben)
    LIGHTS: 8.9,                      // clock face and windows switch on
    BRIDGE: 10.2, BRIDGE_DUR: 2.8,    // Tower Bridge, blue lights at BLUE
    BLUE: 13.0,
    RIVER: 13.2,                      // reflections settle
    TITLE: 15.0, TYPE_DT: 0.1,        // title typed at the bottom
    HOLD: 17.6, SWEEP: 18.0, SWEEP_DUR: 2.6,
    FADE: 21.2, FADE_DUR: 2.4, END: 24.0
  };
  const PHASES = [['sky', '天空', 0], ['skyline', '天際線', T.SKYLINE], ['palace', '國會大廈', T.PALACE], ['big ben', '大笨鐘', T.TOWER],
                  ['lights', '點燈', T.LIGHTS], ['bridge', '塔橋', T.BRIDGE], ['river', '河面', T.RIVER], ['title', '標題', T.TITLE],
                  ['hold', '停留', T.HOLD], ['fade', '淡出', T.FADE]];
  const TITLE = 'LONDON  ON  THE  THAMES';

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_START = reduced ? T.HOLD + 0.4 : 0;   // reduced motion: open on (and stay with) the finished scene
  const CALM = reduced ? 0.4 : 1;               // speed of ripples, mist and twinkles
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';
  const HORIZON = 0.68;                         // embankment line, fraction of the screen height

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Stateless integer hash -> [0, 1).
  function hash2(a, b) {
    let h = Math.imul(a ^ Math.imul(b, 0x9E3779B1), 0x85EBCA6B);
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const odd = v => (v | 0) % 2 ? v | 0 : (v | 0) + 1;

  // ---------- Mist / ripple texture: tileable value-noise fbm ----------
  const CNX = 256, CNY = 64;
  const NOISE = new Float32Array(CNX * CNY);
  (function buildNoise() {
    const r = mulberry32(1834);
    let amp = 1, tot = 0;
    for (let o = 0; o < 5; o++) {
      const gx = 6 << o, gy = Math.min(3 << o, 32);
      const lat = new Float32Array(gx * gy);
      for (let i = 0; i < lat.length; i++) lat[i] = r();
      for (let y = 0; y < CNY; y++) {
        const fy = y / CNY * gy, y0 = fy | 0, ty = smooth(fy - y0), y1 = (y0 + 1) % gy;
        for (let x = 0; x < CNX; x++) {
          const fx = x / CNX * gx, x0 = fx | 0, tx = smooth(fx - x0), x1 = (x0 + 1) % gx;
          const a = lat[y0 * gx + x0], b = lat[y0 * gx + x1], c = lat[y1 * gx + x0], d = lat[y1 * gx + x1];
          NOISE[y * CNX + x] += amp * (a + (b - a) * tx + (c - a + (a - b - c + d) * tx) * ty);
        }
      }
      tot += amp; amp *= 0.5;
    }
    let lo = 1e9, hi = -1e9;
    for (let i = 0; i < NOISE.length; i++) { const v = NOISE[i] / tot; NOISE[i] = v; if (v < lo) lo = v; if (v > hi) hi = v; }
    for (let i = 0; i < NOISE.length; i++) NOISE[i] = (NOISE[i] - lo) / (hi - lo);
  })();
  function noise(u, v) {
    u = (u - Math.floor(u)) * CNX; v = (v - Math.floor(v)) * CNY;
    const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0;
    const x1 = (x0 + 1) & (CNX - 1), y1 = (y0 + 1) & (CNY - 1), r0 = y0 * CNX, r1 = y1 * CNX;
    const a = NOISE[r0 + x0], b = NOISE[r0 + x1], c = NOISE[r1 + x0], d = NOISE[r1 + x1];
    return a + (b - a) * fx + (c - a + (a - b - c + d) * fx) * fy;
  }

  // ---------- Glyphs ----------
  const CH = [' '];
  const ci = s => { let i = CH.indexOf(s); if (i < 0) { CH.push(s); i = CH.length - 1; } return i; };
  const set = s => Uint8Array.from([...s].map(ci));
  const G_SKY = set('  ..::-~');
  const G_WATER = set('_-~=~-.~');
  const G_MOON = set(':oO0@');
  const G_RES = set('01#%&*+=?/\\$@x');
  const C = {};
  for (const s of '.:-_=~+*^/\\|#()[]<>AHoOix\'`,!') C[s] = ci(s);

  // Colour keys: 5 bits per channel, so fillStyle changes once per quantised colour.
  const NKEY = 32768;
  const COLSTR = new Array(NKEY);
  const colStr = k => COLSTR[k] || (COLSTR[k] = `rgb(${(k >> 10) * 8 + 4},${((k >> 5) & 31) * 8 + 4},${(k & 31) * 8 + 4})`);
  const keyOf = (r, g, b) => ((clamp(r, 0, 255) >> 3) << 10) | ((clamp(g, 0, 255) >> 3) << 5) | (clamp(b, 0, 255) >> 3);
  const counts = new Uint32Array(NKEY);
  const K_HAND_DARK = keyOf(52, 34, 16), K_HAND_GOLD = keyOf(255, 214, 120);

  // ---------- Materials: [r, g, b, emission] ----------
  const M_FAR = 0, M_FARWIN = 1, M_FARLM = 2, M_TIP = 3, M_GOLD = 4, M_GOLDHI = 5, M_GOLDDIM = 6, M_WIN = 7,
        M_FACE = 8, M_BLUE = 9, M_BLUEDIM = 10, M_TB = 11, M_TBWIN = 12, M_LAMP = 13, M_AYRTON = 14, M_BELFRY = 15, M_TBHI = 16;
  const MAT = [
    [52, 72, 118, 0], [170, 200, 255, 55], [74, 98, 150, 0], [255, 70, 70, 200],
    [212, 158, 80, 0], [255, 206, 120, 0], [146, 102, 52, 0], [255, 218, 136, 150],
    [255, 238, 178, 110], [96, 150, 255, 120], [66, 100, 186, 30], [214, 180, 124, 0],
    [255, 214, 150, 130], [255, 192, 104, 170], [255, 246, 220, 200], [226, 172, 88, 0], [250, 218, 158, 0]
  ];
  const GOLDISH = new Uint8Array(MAT.length);
  [M_GOLD, M_GOLDHI, M_GOLDDIM, M_TB, M_TBHI, M_BELFRY].forEach(m => { GOLDISH[m] = 1; });

  // ---------- Canvas, grid, layout ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const hintEl = document.getElementById('hint');
  const back = document.createElement('canvas'), bctx = back.getContext('2d', { willReadFrequently: true });
  const emis = document.createElement('canvas'), ectx = emis.getContext('2d', { willReadFrequently: true });
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  const halo = document.createElement('canvas'), hctx = halo.getContext('2d');
  let bImg = null, eImg = null;

  let W = 0, H = 0, fs = 9, cw = 5, ch = 10, cols = 0, rows = 0, n = 0, hr = 0, yH = 0, M = 500, K = 300, Sw = 0, sx0 = 0, cellFont = '';
  let CR, CG, CB, CK, EMI, OVK, LAY, HSH, keys, order;
  let moonX = 0, moonY = 0, moonR = 10;
  // Structure cells (built per resize): column, row, glyph, material, group, settle time, light-on time.
  let nS = 0, sCol, sRow, sCh, sMat, sGrp, sT0, sOn;
  const GROUPS = 4;                       // 0 far skyline, 1 palace, 2 Elizabeth Tower, 3 Tower Bridge
  let gTotal = new Int32Array(GROUPS);
  let BB = null, TB = null;               // Big Ben clock and Tower Bridge geometry
  let lampCols = [], wallSkip = null;
  let needResize = true, dirty = true;

  const U = u => sx0 + u * Sw;            // stage fraction -> px
  const colU = u => Math.round(U(u) / cw);

  function resize() {
    needResize = false;
    W = canvas.clientWidth || innerWidth;
    H = canvas.clientHeight || innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fs = clamp(Math.round(Math.min(W, H * 1.2) / 118), 7, 11);
    cellFont = `${fs}px ${MONO}`;
    ctx.font = cellFont;
    cw = ctx.measureText('M').width || fs * 0.6;
    ch = Math.round(fs * 1.15);
    cols = Math.ceil(W / cw);
    rows = Math.ceil(H / ch);
    n = cols * rows;
    hr = Math.round(H * HORIZON / ch);
    yH = hr * ch;
    M = Math.min(W, H * 0.95);
    Sw = Math.min(W, H * 1.55);
    sx0 = (W - Sw) / 2;
    K = Math.min(H * 0.5, Sw * 0.95);     // height of Big Ben in px; every landmark scales from it

    CR = new Float32Array(n); CG = new Float32Array(n); CB = new Float32Array(n);
    CK = new Uint8Array(n); EMI = new Uint8Array(n); OVK = new Int32Array(n); LAY = new Uint8Array(n);
    keys = new Uint16Array(n); order = new Int32Array(n);
    HSH = new Uint8Array(n);
    const r = mulberry32(77);
    for (let i = 0; i < n; i++) HSH[i] = (r() * 256) | 0;
    back.width = cols; back.height = rows; bImg = bctx.createImageData(cols, rows);
    emis.width = cols; emis.height = rows; eImg = ectx.createImageData(cols, rows);
    glow.width = cols; glow.height = rows; halo.width = cols; halo.height = rows;

    moonX = U(0.87); moonY = H * 0.15; moonR = Math.max(ch * 2.6, Math.min(W, H) * 0.06);
    buildStructures();
    dirty = true;
  }

  // ---------- Structures ----------
  function buildStructures() {
    const cc = [], rr = [], gl = [], mt = [], gp = [], on = [];
    const add = (c, r, g, m, grp, onT) => {
      if (r < 0 || r >= hr) return;
      if (grp > 0 && (c < 0 || c >= cols)) return;
      cc.push(c); rr.push(r); gl.push(typeof g === 'number' ? g : ci(g)); mt.push(m); gp.push(grp); on.push(onT || 0);
    };
    const rnd = mulberry32(1859);
    const rb = hr - 2;                         // bottom row of buildings (the embankment wall is hr - 1)
    const rowsOf = px => Math.max(1, Math.round(px / ch));
    const colsOf = px => Math.max(1, Math.round(px / cw));
    const winOn = (base, spread) => base + rnd() * spread;

    // --- Far skyline (group 0): hazy blue blocks across the full width, plus St Paul's, the Shard, the Gherkin.
    for (let c = -4; c < cols + 4;) {
      const w = 3 + ((rnd() * 6) | 0);
      const h = rowsOf(K * (0.05 + 0.13 * rnd() * rnd() + 0.03 * rnd()));
      const top = rb - h + 1;
      for (let x = c; x < c + w; x++) {
        for (let y = top; y <= rb; y++) {
          const edge = x === c || x === c + w - 1;
          if (y === top) add(x, y, edge ? '.' : '_', M_FAR, 0);
          else if (edge) add(x, y, '|', M_FAR, 0);
          else if ((x - c) % 2 === 1 && (y - top) % 2 === 0) add(x, y, rnd() < 0.5 ? '#' : ':', M_FARWIN, 0, rnd() < 0.5 ? winOn(T.LIGHTS, 2.5) : 1e9);
          else add(x, y, hash2(x, y) < 0.5 ? ':' : '.', M_FAR, 0);
        }
      }
      c += w + (rnd() < 0.25 ? 1 : 0);
    }
    // St Paul's dome.
    {
      const c0 = colU(0.585), rd = Math.max(4, colsOf(K * 0.075)), base = rb - rowsOf(K * 0.16);
      for (let x = c0 - rd - 2; x <= c0 + rd + 2; x++) for (let y = base + 1; y <= rb; y++)
        add(x, y, x === c0 - rd - 2 || x === c0 + rd + 2 ? '|' : (x + y) % 3 ? ':' : '#', M_FARLM, 0);
      const drum = Math.max(2, rowsOf(K * 0.06));
      for (let j = 0; j < drum; j++) for (let x = c0 - rd + 1; x <= c0 + rd - 1; x++)
        add(x, base - j, j === 0 ? '=' : (x - c0) % 2 ? '|' : ':', M_FARLM, 0);
      const dr = Math.max(2, Math.round(rd * cw / ch * 1.05)), top0 = base - drum;
      for (let j = 0; j < dr; j++) {
        const hw = Math.round((rd - 1) * Math.sqrt(1 - Math.pow((j + 0.5) / dr, 2)));
        for (let x = c0 - hw; x <= c0 + hw; x++) add(x, top0 - j, x === c0 - hw ? '(' : x === c0 + hw ? ')' : j === 0 ? '_' : ':', M_FARLM, 0);
      }
      const lt = top0 - dr;
      add(c0, lt, 'A', M_FARLM, 0); add(c0, lt - 1, '|', M_FARLM, 0); add(c0, lt - 2, '+', M_FARWIN, 0, T.LIGHTS);
    }
    // The Shard, seen between the towers of Tower Bridge.
    {
      const c0 = colU(0.775), hS = rowsOf(K * 0.78), hw0 = Math.max(3, colsOf(K * 0.06));
      for (let j = 0; j < hS; j++) {
        const f = j / hS, hw = Math.round(hw0 * (1 - f) + 0.3), y = rb - j;
        for (let x = c0 - hw; x <= c0 + hw; x++) {
          if (x === c0 - hw) add(x, y, hw ? '/' : '|', M_FARLM, 0);
          else if (x === c0 + hw) add(x, y, '\\', M_FARLM, 0);
          else if (hash2(x, y) < 0.18) add(x, y, '.', M_FARWIN, 0, winOn(T.LIGHTS, 2.5));
          else add(x, y, (x + j) % 2 ? '|' : ':', M_FAR, 0);
        }
      }
      add(c0, rb - hS, '*', M_TIP, 0, T.LIGHTS);
    }
    // The Gherkin, right of the bridge.
    {
      const c0 = colU(0.975), hG = rowsOf(K * 0.42), hw0 = Math.max(2, colsOf(K * 0.05));
      for (let j = 0; j < hG; j++) {
        const f = (j + 0.5) / hG, hw = Math.round(hw0 * Math.sin(Math.PI * Math.min(0.97, 0.18 + 0.85 * f)) ** 0.8), y = rb - j;
        for (let x = c0 - hw; x <= c0 + hw; x++)
          add(x, y, x === c0 - hw ? '(' : x === c0 + hw ? ')' : (x + j) % 2 ? '/' : '\\', M_FARLM, 0);
      }
    }

    // --- Elizabeth Tower (group 2) geometry first, the palace runs up to it.
    const bw = odd(Math.max(13, colsOf(K * 0.13))), bc = colU(0.478), bl = bc - (bw >> 1), br = bc + (bw >> 1);
    const fr = odd(Math.max(7, Math.round((bw - 2) * cw / ch * 1.15)));
    const rS = rb - rowsOf(K * 0.5);
    const rBoxBot = rS, rBoxTop = rBoxBot - fr - 1;

    // --- Palace of Westminster (group 1).
    const p0 = colU(0.012), p1 = bl - 2;
    const fh = Math.max(6, rowsOf(K * 0.21)), rt = rb - fh + 1;
    for (let c = p0; c <= p1; c++) {
      for (let r = rt; r <= rb; r++) {
        const k = c - p0;
        if (r === rt) add(c, r, k % 3 === 0 ? '^' : '-', M_GOLDHI, 1);
        else if (r === rb) add(c, r, '#', M_GOLDDIM, 1);
        else if (k % 4 === 0) add(c, r, '|', M_GOLD, 1);
        else if ((r - rt) % 3 === 0) add(c, r, '=', M_GOLDDIM, 1);
        else add(c, r, 'H', M_WIN, 1, rnd() < 0.85 ? winOn(T.LIGHTS, 1.6) : 1e9);
      }
    }
    // Little turrets along the roofline.
    for (let c = p0 + 8; c < p1 - 3; c += 12) {
      add(c - 1, rt - 1, '[', M_GOLDHI, 1); add(c, rt - 1, 'H', M_WIN, 1, winOn(T.LIGHTS, 1)); add(c + 1, rt - 1, ']', M_GOLDHI, 1);
      add(c - 1, rt - 2, '/', M_GOLDHI, 1); add(c, rt - 2, '^', M_GOLDHI, 1); add(c + 1, rt - 2, '\\', M_GOLDHI, 1);
    }
    // Victoria Tower at the far end.
    {
      const vw = odd(Math.max(9, colsOf(K * 0.13))), vc = Math.max(p0 + (vw >> 1) + 1, colU(0.085)), v0 = vc - (vw >> 1), v1 = vc + (vw >> 1);
      const vt = rb - rowsOf(K * 0.72) + 1;
      for (let c = v0; c <= v1; c++) {
        for (let r = vt; r <= rb; r++) {
          const k = (r - vt) % 5;
          if (c === v0 || c === v1) add(c, r, '|', M_GOLDHI, 1);
          else if (r === vt) add(c, r, '=', M_GOLDHI, 1);
          else if (r >= rb - 2 && Math.abs(c - vc) <= 1) add(c, r, r === rb - 2 ? (c < vc ? '/' : c > vc ? '\\' : '^') : '.', M_GOLDDIM, 1);
          else if (k === 0) add(c, r, '=', M_GOLDDIM, 1);
          else if ((c - v0) % 2 === 0 && k < 4) add(c, r, 'H', M_WIN, 1, winOn(T.LIGHTS, 1.6));
          else add(c, r, '#', M_GOLD, 1);
        }
      }
      for (const c of [v0, v0 + 1, v1 - 1, v1]) { add(c, vt - 1, '|', M_GOLDHI, 1); add(c, vt - 2, c === v0 || c === v1 ? 'A' : '^', M_GOLDHI, 1); }
      for (let c = v0 + 2; c <= v1 - 2; c++) add(c, vt - 1, c % 2 ? '^' : '-', M_GOLD, 1);
      add(vc, vt - 2, '|', M_GOLDHI, 1); add(vc, vt - 3, '|', M_GOLDHI, 1); add(vc, vt - 4, '+', M_GOLDHI, 1);
    }
    // Central Tower: an octagonal lantern with a spire.
    {
      const c0 = colU(0.27), hb = rowsOf(K * 0.13), hs = rowsOf(K * 0.16);
      for (let j = 1; j <= hb; j++) for (let x = c0 - 2; x <= c0 + 2; x++)
        add(x, rt - j, Math.abs(x - c0) === 2 ? '|' : j % 2 ? 'H' : '=', Math.abs(x - c0) === 2 ? M_GOLDHI : j % 2 ? M_WIN : M_GOLDDIM, 1, winOn(T.LIGHTS, 1));
      for (let j = 0; j < hs; j++) {

    // --- Elizabeth Tower (group 2).

          else if (k === 0) add(c, r, '=', M_TB, 3);
          else if (k === 2 && (c - a0) % 2 === 0) add(c, r, 'H', M_TBWIN, 3, T.BRIDGE + 1.8 + rnd() * 0.8);

  // ---------- Scene state ----------
  let t = T_START, skyT = 0, wt = 0, mistT = 0, loopN = 0, fadeA = 1;
  let par = 0, parTo = 0, ptrX = -1e4, ptrY = -1e4, ptrA = 0, ptrATo = 0, stir = 0;
  let letters = 0, built = 0, litWin = 0, litPrev = -1, typed = 0;

  let bas = null;       // { t0 } bascule lift on the sky clock

  let boats = [], stars = [], rockets = [], sparks = [];

  // ---------- Cell writing ----------
  function put(i, r, g, b, k, e) { CR[i] = r; CG[i] = g; CB[i] = b; CK[i] = k; if (e) EMI[i] = Math.min(255, e); }

  }

  const SKY_TOP = [3, 5, 13], SKY_BOT = [16, 22, 42];
  function drawSky() {
    const ox = Math.round(-par * 3);              // moon and stars drift against the pointer

      const bR = SKY_TOP[0] + (SKY_BOT[0] - SKY_TOP[0]) * f, bG = SKY_TOP[1] + (SKY_BOT[1] - SKY_TOP[1]) * f, bB = SKY_TOP[2] + (SKY_BOT[2] - SKY_TOP[2]) * f;

        const i = r * cols + c, h = HSH[i], x = (c - ox * 0.5 + 0.5) * cw;
        const cl = noise(x / (M * 2.4) + wt * 0.004, y / (H * 1.3) + 0.2);

    const r0 = Math.max(0, Math.floor((my - R2) / ch)), r1 = Math.min(hr - 1, Math.ceil((my + R2) / ch));

  // Structures with the resolve effect, floodlights, window lights and the light sweep.
  function drawStructures() {
    const flood = smooth((t - T.LIGHTS) / 1.2);
    const blueOn = smooth((t - T.BLUE) / 0.6);
    const sweepP = reduced ? -1 : (t - T.SWEEP) / T.SWEEP_DUR;

      } else if (m === M_FAR || m === M_FARLM) {

          else { R = 70; G = 50; B = 40; }

          const on = clamp((t - sOn[s]) / 0.25, 0, 1);
          R *= 0.4 + 0.6 * on; G *= 0.4 + 0.6 * on; B *= 0.4 + 0.6 * on; e *= on;

  // Big Ben's face: lit at dusk, hands at the viewer's local time, flashing softly on each bong.

  }

    const hand = (theta, len) => {
      const sx = Math.sin(theta) * (B.rx - 0.6), sy = Math.cos(theta) * (B.ry - 0.6);
      const ang = ((Math.atan2(sy * ch, sx * cw) * 180 / Math.PI) + 360) % 180;
      const k = ang < 22.5 || ang >= 157.5 ? C['-'] : ang < 67.5 ? C['/'] : ang < 112.5 ? C['|'] : C['\\'];
      for (let l = 0.2; l <= len; l += 0.08) mark(Math.round(B.bc + sx * l), Math.round(B.fcR - sy * l), k);
    };
    hand(hh / 12 * Math.PI * 2, 0.55);
    hand(mm / 60 * Math.PI * 2, 0.95);
    mark(B.bc, B.fcR, C['o']);
  }

  // Tower Bridge bascules: two leaves hinged at the towers, lifted by a tap.
  function basAngle() {
    if (!bas) return 0;
    const e = skyT - bas.t0, sp = reduced ? 1.4 : 1;
    return 1.2 * (smooth(e / (3 * sp)) - smooth((e - 7.4 * sp) / (3 * sp)));
  }
  function drawBascules() {
    const age = t - TB.basT0;
    if (age < -0.45) return;
    const a = basAngle(), half = (TB.R0 - TB.L1 - 1) / 2;
    const flood = 0.5 + 0.42 * smooth((t - T.LIGHTS) / 1.2);
    const g = a < 0.3 ? null : a < 1.05 ? 1 : 2;
    for (const side of [-1, 1]) {
      const px = side < 0 ? TB.L1 + 0.5 : TB.R0 - 0.5;   // hinge (column edge)
      const len = half * cw;
      for (let s = 0; s <= len; s += Math.min(cw, ch) * 0.5) {
        const x = px * cw - side * Math.cos(a) * s, y = (TB.rDk + 0.5) * ch - Math.sin(a) * s;
        const c = Math.floor(x / cw), r = Math.floor(y / ch);
        if (c <= TB.L1 || c >= TB.R0 || r < 0) continue;
        const k = g === null ? C['='] : g === 1 ? (side < 0 ? C['/'] : C['\\']) : C['|'];
        const i = r * cols + c;
        LAY[i] = 2; OVK[i] = -1;
        if (age < 0) { const q = 1 + age / 0.45; putF(i, 120 * q, 180 * q, 255 * q, G_RES[(hash2(c, (skyT * 20) | 0) * G_RES.length) | 0], 30); continue; }
        putF(i, 214 * flood, 180 * flood, 124 * flood, k, 0);
        // Truss under the leaf while it lies flat.
        if (a < 0.3 && r + 1 < hr - 1) { const j = i + cols; LAY[j] = 2; OVK[j] = -1; putF(j, 146 * flood, 102 * flood, 52 * flood, (c % 2) ? C['/'] : C['\\'], 0); }
      }
    }
  }

  // Low mist over the river and the far bank; the pointer clears and stirs it.
  function drawMist() {
    const top = Math.floor(hr * 0.42), bot = Math.min(rows - 1, hr + Math.round((rows - hr) * 0.5));
    const pr = M * 0.13, sweepP = reduced ? -1 : (t - T.SWEEP) / T.SWEEP_DUR;
    const xs = -0.3 * W + 1.6 * W * sweepP;
    for (let r = top; r <= bot; r++) {
      const y = (r + 0.5) * ch, ey = Math.exp(-Math.pow((y - yH) / (H * 0.16), 2));
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c, x = (c + 0.5) * cw;
        let m = noise(x / (M * 1.5) + mistT * 0.012, y / (H * 0.9) + mistT * 0.003);
        m = smooth((m - 0.42) / 0.36) * ey * 0.5;
        if (ptrA > 0.01) { const dx = x - ptrX, dy = y - ptrY; m *= 1 - 0.9 * ptrA * Math.exp(-(dx * dx + dy * dy) / (pr * pr)); }
        if (m < 0.03) continue;
        let mr = 70, mg = 82, mb = 108;
        if (sweepP > 0 && sweepP < 1) { const v = (x + (yH - y) * 0.45 - xs) / (0.09 * W + 20), b = Math.exp(-v * v) * Math.sin(Math.PI * sweepP); mr += 120 * b; mg += 110 * b; mb += 90 * b; }
        const a = m * (LAY[i] === 0 ? 1 : 0.45);
        CR[i] += (mr - CR[i]) * a; CG[i] += (mg - CG[i]) * a; CB[i] += (mb - CB[i]) * a;
        if (LAY[i] === 0 && m > 0.22) CK[i] = (HSH[i] & 1) ? C['~'] : C['-'];
      }
    }
  }

  // Embankment wall and its lamps (orange 'i's), always on.
  function drawEmbankment() {
    const r = hr - 1, a = reduced ? 1 : clamp(t / 1.0, 0, 1) * fadeA * 0.6 + 0.4 * Math.min(1, t / 1.0);
    for (let c = 0; c < cols; c++) {
      if (wallSkip[c]) continue;
      putRC(c, r, 40 * a, 44 * a, 60 * a, (c % 4) ? C['_'] : C['='], 0, 2);
    }
    for (const c of lampCols) {
      const fl = 0.85 + 0.15 * Math.sin(wt * 3 + c);
      putRC(c, r, 255 * a * fl, 176 * a * fl, 90 * a * fl, C['i'], 190 * a, 2);
    }
  }

  // The Thames: rippling dark water mirroring every bright cell above it, plus the moon's path.
  function drawWater() {
    const wDepth = Math.max(1, rows - hr);
    const settle = reduced ? 1 : smooth((t - T.RIVER) / 1.8);
    const amp = reduced ? 1.4 : 4.5 - 2.8 * settle;
    const refl = 0.55 + 0.3 * settle;
    const ox = Math.round(-par * 3), mx = moonX + ox * cw;
    const moonA = (reduced ? 1 : clamp((t - 0.6) / 1.2, 0, 1)) * fadeA;
    for (let r = hr; r < rows; r++) {
      const p = (r - hr) / wDepth, y = (r + 0.5) * ch;
      const rm = hr - 1 - (r - hr);
      const fade = Math.exp(-p * 1.6) * refl;
      const fu = M * (0.08 + 0.5 * p), vv = r * 0.13 + wt * 0.02;
      const gw = moonR * (0.7 + 2.4 * p);
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c, x = (c + 0.5) * cw, h = HSH[i];
        const rn = noise(x / fu + wt * 0.03 * (r & 1 ? 1 : -1), vv);
        const mod = 0.7 + 0.6 * rn;
        let R = (10 + 14 * rn) * (1 - 0.4 * p) * mod, G = (14 + 18 * rn) * (1 - 0.4 * p) * mod, B = (28 + 30 * rn) * (1 - 0.4 * p) * mod;
        let k = G_WATER[(rn * 7.99) | 0], e = 0;
        if (rm >= 0) {
          const dx = Math.round((rn - 0.5) * amp * (1 + 0.12 * (r - hr)));
          const si = rm * cols + clamp(c + dx, 0, cols - 1);
          const lum = CR[si] * 0.3 + CG[si] * 0.59 + CB[si] * 0.11;
          if (lum > 34 && LAY[si] !== 0) {
            const s = fade * (rn > 0.45 ? 1 : 0.3);
            R += CR[si] * s * 0.75; G += CG[si] * s * 0.75; B += CB[si] * s * 0.8;
            if (s * lum > 26) { k = rn > 0.7 ? C['='] : rn > 0.56 ? C['-'] : C['~']; e = Math.min(130, EMI[si] * s * 0.7); }
          }
        }
        // Moon glitter.
        if (moonA > 0) {
          const gx = (x + (rn - 0.5) * 3 * cw - mx) / gw, g = Math.exp(-gx * gx) * moonA * 0.7 * (1 - 0.5 * p);
          if (g > 0.05 && rn > 0.5) { R += 150 * g; G += 158 * g; B += 185 * g; if (g > 0.25) { k = rn > 0.66 ? C['='] : C['-']; e = Math.max(e, 70 * g); } }
        }
        put(i, R, G, B, k, e); OVK[i] = -1; LAY[i] = 4;
      }
    }
    // A darker line under the wall.
    for (let c = 0; c < cols; c++) { const i = hr * cols + c; CR[i] *= 0.6; CG[i] *= 0.6; CB[i] *= 0.6; }
  }

  // ---------- Moving things ----------
  function spawnBoat(p, dir, x) {
    p = clamp(p, 0.08, 0.9);
    const L = Math.max(5, Math.round(M * (0.04 + 0.09 * p) / cw));
    boats.push({ p, dir, x: x != null ? x : (dir > 0 ? -L * cw : W + L * cw), L, v: M * (0.02 + 0.04 * p) * (reduced ? 0.5 : 1) });
    music('event', 'boat', { p, pan: dir > 0 ? -0.6 : 0.6 });
  }
  function drawBoats() {
    const wDepth = H - yH;
    for (const bt of boats) {
      const y = yH + bt.p * wDepth, r = Math.round(y / ch), cH = Math.round(bt.x / cw), L = bt.L;
      // Wake: two arms opening behind the boat.
      const wl = Math.round(L * 3), spread = 0.1 + 0.18 * bt.p;
      for (let k = 1; k < wl; k++) {
        const c = cH - bt.dir * (Math.floor(L / 2) + k);
        if (c < 0 || c >= cols) continue;
        const a = 1 - k / wl, off = Math.round(k * spread);
        for (const rr of off ? [r - off, r + off] : [r]) {
          if (rr <= hr || rr >= rows) continue;
          const i = rr * cols + c;
          CR[i] = CR[i] * (1 + 0.5 * a) + 34 * a; CG[i] = CG[i] * (1 + 0.5 * a) + 40 * a; CB[i] = CB[i] * (1 + 0.5 * a) + 56 * a; CK[i] = k % 3 ? C['~'] : C['-'];
        }
      }
      const c0 = cH - (L >> 1);
      for (let k = 0; k < L; k++) putRC(c0 + k, r, 46, 40, 52, k === 0 ? C['\\'] : k === L - 1 ? C['/'] : C['_'], 0, 3);
      for (let k = 0; k < L; k++) { const c = c0 + k; if (c >= 0 && c < cols && r + 1 < rows) { const i = (r + 1) * cols + c; CR[i] *= 0.5; CG[i] *= 0.5; CB[i] *= 0.5; } }
      const rc = r - 1, cabW = Math.max(2, Math.round(L * 0.6)), cc0 = cH - (cabW >> 1);
      if (rc > hr) {
        for (let k = 0; k < cabW; k++) {
          if (k === 0 || k === cabW - 1) putRC(cc0 + k, rc, 70, 62, 80, k ? C[']'] : C['['], 0, 3);
          else putRC(cc0 + k, rc, 255, 214, 130, C['o'], 170, 3);
        }
        const bow = cH + bt.dir * (L >> 1);
        putRC(bow, rc, bt.dir > 0 ? 80 : 255, bt.dir > 0 ? 255 : 70, bt.dir > 0 ? 120 : 70, C['.'], 170, 3);
        if (rc - 1 > hr) putRC(cH, rc - 1, 255, 250, 235, C['*'], 220, 3);
      }
    }
  }

  // Tall ship: comes out from beyond the open bridge and sails toward the viewer.
  const SHIP_DUR = 10;
  function shipP() { return ship ? (skyT - ship.t0) / (SHIP_DUR * (reduced ? 1.4 : 1)) : -1; }
  function drawShip() {
    const p = shipP();
    if (p < 0 || p > 1) return;
    const s = 1 + 2.3 * Math.pow(p, 1.5);
    const yW = yH + (H * 0.99 - yH) * Math.pow(p, 1.25);
    const xC = TB.gapC * cw + ship.dir * W * 0.45 * p * p;
    const rW = Math.floor(yW / ch);
    const hullW = Math.max(5, Math.round(K * 0.085 * s / cw)), hullR = Math.max(1, Math.round(K * 0.022 * s / ch));
    const mastR = Math.max(5, Math.round(K * 0.3 * s / ch));
    const cC = Math.round(xC / cw);
    const lit = 0.7;
    // Hull, bow-on: widest at the deck, narrowing to the waterline.
    for (let j = 0; j < hullR; j++) {
      const r = rW - 1 - j, hw = Math.round((hullW / 2) * (0.6 + 0.4 * (j + 1) / hullR));
      for (let c = cC - hw; c <= cC + hw; c++) {
        const edge = c === cC - hw ? C['\\'] : c === cC + hw ? C['/'] : j === hullR - 1 ? C['='] : C['_'];
        const port = j === hullR - 2 && (c - cC) % 3 === 0 && c !== cC - hw && c !== cC + hw;
        if (port) putRC(c, r, 255, 200, 120, C['o'], 150, 3);
        else putRC(c, r, 44, 32, 36, edge, 0, 3);
      }
      if (j === hullR - 1) { putRC(cC - hw - 1, r, 255, 60, 60, C['.'], 200, 3); putRC(cC + hw + 1, r, 70, 255, 120, C['.'], 200, 3); }
    }
    // Mast and three tiers of square sails, lit warm by the city.
    const deck = rW - hullR;
    for (let j = 1; j <= mastR; j++) putRC(cC, deck - j, 110, 86, 70, C['|'], 0, 3);
    putRC(cC, deck - mastR - 1, 255, 250, 235, C['*'], 230, 3);
    const tiers = [[0.18, 0.42, 1.25], [0.47, 0.68, 1.0], [0.72, 0.88, 0.72]];
    for (const [a, b, wf] of tiers) {
      const ra = deck - Math.round(mastR * b), rb2 = deck - Math.round(mastR * a);
      const hw = Math.max(1, Math.round(hullW * 0.55 * wf));
      for (let r = ra; r <= rb2; r++) {
        for (let c = cC - hw; c <= cC + hw; c++) {
          const yard = r === ra;
          const k = yard ? C['-'] : c === cC - hw ? C['('] : c === cC + hw ? C[')'] : c === cC ? C['|'] : C['#'];
          const sh = 0.75 + 0.25 * Math.cos((c - cC) / (hw + 1) * 1.4);
          putRC(c, r, (yard ? 120 : 214 * sh) * lit, (yard ? 96 : 204 * sh) * lit, (yard ? 80 : 182 * sh) * lit, k, 0, 3);
        }
      }
    }
  }

  // Shooting stars and fireworks (they live in the sky, so the river reflects them).
  function spawnStar(x, y) {
    const dir = x < W / 2 ? 1 : -1, sp = M * (reduced ? 0.45 : 1.1);
    stars.push({ x: x - dir * M * 0.12, y: y - M * 0.06, vx: dir * sp, vy: sp * 0.42, age: 0, life: reduced ? 1.5 : 0.85 });
    music('event', 'star', { pan: clamp(x / W * 2 - 1, -0.8, 0.8) });
  }
  const FW = [[255, 90, 90], [240, 240, 255], [100, 150, 255], [255, 204, 90], [120, 230, 210]];
  function launch(x, y) {
    const ty = Math.min(y, yH - ch * 6);
    const g = H * (reduced ? 0.6 : 1.1);
    rockets.push({ x, y: yH - ch, vy: -Math.sqrt(2 * g * (yH - ch - ty)), ty, g, col: FW[(Math.random() * FW.length) | 0] });
    music('event', 'launch', { x: x / W });
  }
  function burst(x, y, col) {
    const calm = reduced, nP = calm ? 50 : 120 + ((Math.random() * 50) | 0);
    let col2 = FW[(Math.random() * FW.length) | 0];
    if (col2 === col) col2 = FW[(FW.indexOf(col) + 2) % FW.length];
    const sp = H * (0.11 + 0.06 * Math.random()) * (calm ? 0.55 : 1);
    for (let j = 0; j < nP && sparks.length < 1200; j++) {
      const z = 2 * Math.random() - 1, a = Math.random() * 6.2832, rr = Math.sqrt(1 - z * z), v = sp * (0.85 + 0.15 * Math.random());
      sparks.push({ x, y, vx: rr * Math.cos(a) * v, vy: rr * Math.sin(a) * v, age: 0, life: 1.3 + Math.random() * 0.9, col: j % 3 ? col : col2 });
    }
    music('event', 'burst', { x: x / W, calm });
  }
  function updateMovers(dt) {
    for (const b of boats) b.x += b.dir * b.v * dt;
    boats = boats.filter(b => b.x > -b.L * cw * 4 && b.x < W + b.L * cw * 4);
    for (const s of stars) { s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; }
    stars = stars.filter(s => s.age < s.life);
    for (const r of rockets) { r.vy += r.g * dt; r.y += r.vy * dt; }
    rockets = rockets.filter(r => { if (r.y <= r.ty || r.vy > -H * 0.05) { burst(r.x, Math.max(r.y, r.ty), r.col); return false; } return true; });
    const g = H * 0.07, drag = 1 - Math.min(0.5, 0.9 * dt);
    for (const p of sparks) { p.age += dt; p.vx *= drag; p.vy = p.vy * drag + g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    sparks = sparks.filter(p => p.age < p.life);
    if (bas && skyT - bas.t0 > 11 * (reduced ? 1.4 : 1)) bas = null;
    if (ship && shipP() > 1) ship = null;
    if (chime && skyT - chime.t0 > chime.end) chime = null;
  }
  function drawSkyMovers() {
    const cell = (x, y, R, G, B, k, e) => {
      const c = Math.floor(x / cw), r = Math.floor(y / ch);
      if (c < 0 || c >= cols || r < 0 || r >= hr) return;
      const i = r * cols + c;
      put(i, R, G, B, k, e); OVK[i] = -1; LAY[i] = 3;
    };
    for (const s of stars) {
      const a = Math.sin(Math.PI * Math.min(1, s.age / s.life)), sp = Math.hypot(s.vx, s.vy);
      const ux = s.vx / sp, uy = s.vy / sp;
      const k = Math.abs(uy * ch) < Math.abs(ux * cw) * 0.4 ? C['-'] : ux * uy > 0 ? C['\\'] : C['/'];
      for (let j = 12; j >= 0; j--) {
        const f = 1 - j / 13, b = a * f;
        cell(s.x - ux * j * cw * 0.9, s.y - uy * j * cw * 0.9, 230 * b, 236 * b, 255 * b, j === 0 ? C['*'] : j < 4 ? k : C['.'], 200 * b);
      }
    }
    for (const r of rockets) {
      cell(r.x, r.y, 255, 225, 170, C['^'], 200);
      for (let k = 1; k <= 3; k++) cell(r.x, r.y + k * ch, 200 - 40 * k, 160 - 30 * k, 110 - 20 * k, k < 2 ? C[':'] : C['.'], 60);
    }
    for (const p of sparks) {
      const a = p.age / p.life;
      if (a > 0.55 && Math.random() < 0.25 && !reduced) continue;
      const b = 0.35 + 0.75 * Math.pow(1 - a, 0.7);
      cell(p.x, p.y, p.col[0] * b, p.col[1] * b, p.col[2] * b, a < 0.25 ? C['*'] : a < 0.45 ? C['o'] : a < 0.7 ? C['+'] : C['.'], 200 * b);
    }
  }

  // ---------- Render ----------
  function buildScene() {
    EMI.fill(0);
    fadeA = reduced ? 1 : 1 - smooth((t - T.FADE) / T.FADE_DUR);
    drawSky();
    drawSkyMovers();
    const behind = ship && shipP() < 0.14;
    drawStructures();
    if (behind) drawShip();
    if (behind) redrawBridgeOver();
    drawClock();
    drawBascules();
    drawEmbankment();
    drawWater();
    drawBoats();
    drawMist();
    if (ship && !behind) drawShip();
  }
  // When the ship is still beyond the bridge, the towers, walkway and piers hide it.
  function redrawBridgeOver() {
    for (let s = 0; s < nS; s++) {
      if (sGrp[s] !== 3 || t < sT0[s]) continue;
      const c = sCol[s], r = sRow[s];
      if (c < TB.L0 - 1 || c > TB.R1 + 1) continue;
      const i = r * cols + c, m = MAT[sMat[s]];
      if (LAY[i] !== 3) continue;   // only where the ship drew
      const f = sMat[s] === M_BLUE || sMat[s] === M_BLUEDIM ? 0.32 + 0.68 * smooth((t - T.BLUE) / 0.6) : 0.5 + 0.42 * smooth((t - T.LIGHTS) / 1.2);
      putF(i, m[0] * f, m[1] * f, m[2] * f, sCh[s], m[3] * f); LAY[i] = 2;
    }
  }

  // Quantise, bucket by colour and draw; fill the backing and glow images.
  function drawCells() {
    const bd = bImg.data, ed = eImg.data;
    counts.fill(0);
    let nl = 0;
    for (let i = 0; i < n; i++) {
      const R = CR[i], G = CG[i], B = CB[i];
      const r = Math.min(255, R * 1.22 + 6), g = Math.min(255, G * 1.22 + 6), b = Math.min(255, B * 1.22 + 6);
      const key = OVK[i] >= 0 ? OVK[i] : ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
      keys[i] = key; counts[key]++;
      if (CK[i]) nl++;
      const j = i * 4;
      bd[j] = R * 0.5; bd[j + 1] = G * 0.5; bd[j + 2] = B * 0.5; bd[j + 3] = 255;
      const e = EMI[i];
      if (e) { const s = e / 255; ed[j] = Math.min(255, R) * s; ed[j + 1] = Math.min(255, G) * s; ed[j + 2] = Math.min(255, B) * s; ed[j + 3] = 255; }
      else { ed[j] = 0; ed[j + 1] = 0; ed[j + 2] = 0; ed[j + 3] = 0; }
    }
    letters = nl;
    bctx.putImageData(bImg, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(back, 0, 0, cols * cw, rows * ch);

    let acc = 0;
    for (let c = 0; c < NKEY; c++) { const v = counts[c]; counts[c] = acc; acc += v; }
    for (let i = 0; i < n; i++) order[counts[keys[i]]++] = i;
    ctx.textBaseline = 'top';
    ctx.font = cellFont;
    let cur = -1;
    for (let k = 0; k < n; k++) {
      const i = order[k], ky = keys[i];
      if (CK[i] === 0) continue;
      if (ky !== cur) { cur = ky; ctx.fillStyle = colStr(ky); }
      const row = (i / cols) | 0;
      ctx.fillText(CH[CK[i]], (i - row * cols) * cw, row * ch);
    }

    // Bloom from emissive cells (windows, clock face, lamps, moon, blue lights), blurred at grid resolution.
    ectx.putImageData(eImg, 0, 0);
    gctx.globalCompositeOperation = 'copy';
    gctx.filter = 'blur(1.3px)';
    gctx.drawImage(emis, 0, 0);
    gctx.filter = 'none';
    hctx.globalCompositeOperation = 'copy';
    hctx.filter = 'blur(3.5px)';
    hctx.drawImage(emis, 0, 0);
    hctx.filter = 'none';
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55;
    ctx.drawImage(glow, 0, 0, cols * cw, rows * ch);
    ctx.globalAlpha = 0.45;
    ctx.drawImage(halo, 0, 0, cols * cw, rows * ch);
    ctx.restore();
  }

  // Title typed out at the bottom in warm yellow, with a blinking cursor while it types.
  function drawTitle() {
    const k = reduced ? TITLE.length : clamp(Math.floor((t - T.TITLE) / T.TYPE_DT) + 1, 0, TITLE.length);
    if (k <= 0 || fadeA <= 0.01) return;
    const tfs = Math.round(clamp(Math.min(W * 0.062, H * 0.05), 15, 44));
    ctx.save();
    ctx.font = `700 ${tfs}px ${MONO}`;
    ctx.textBaseline = 'middle';
    const full = ctx.measureText(TITLE).width, x0 = (W - full) / 2, y = Math.min(H * 0.865, H - 64);
    const s = TITLE.slice(0, k);
    ctx.globalAlpha = fadeA;
    ctx.shadowColor = 'rgba(255, 196, 70, 0.75)';
    ctx.shadowBlur = tfs * 0.55;
    ctx.fillStyle = '#ffe27a';
    ctx.fillText(s, x0, y);
    if (!reduced && k < TITLE.length + 1 && t < T.HOLD + 1.2 && (skyT * 2.5) % 1 < 0.6) {
      ctx.fillText('_', x0 + ctx.measureText(s).width, y);
    }
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0, 0, W, H);
    buildScene();
    drawCells();
    drawTitle();
  }

  // ---------- Loop, HUD, controls ----------
  let paused = false, last = performance.now();
  let frames = 0, fpsT = last, fps = 0, hudT = 0;
  const music = (fn, ...a) => window.AsciiAudio && AsciiAudio[fn](...a);

  // Hint/HUD language: ?lang= wins, then saved site preference, then browser.
  let pref = null;
  try { pref = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!pref) { try { pref = localStorage.getItem('lang'); } catch (e) {} }
  if (!pref) pref = navigator.language || 'en';
  const zh = String(pref).toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-Hant' : 'en';

  function phaseName() {
    let p = PHASES[0];
    for (const q of PHASES) if (t >= q[2]) p = q;
    return zh ? p[1] : p[0];
  }
  function updateHud(now) {
    const tail = paused ? (zh ? '暫停' : 'paused') : `${fps} fps`;
    const pct = (built * 100).toFixed(1) + '%';
    hudEl.textContent = W < 640 ? `${phaseName()}  ${pct}  ${tail}`
      : zh ? `階段 ${phaseName()}  完成 ${pct}  字元 ${letters.toLocaleString('en-US')}  ${tail}`
           : `phase ${phaseName()}  built ${pct}  letters ${letters.toLocaleString('en-US')}  ${tail}`;
    hudT = now;
  }

  const crossed = (a, b, x) => a < x && x <= b;
  function soundCues(a, b) {
    if (!window.AsciiAudio) return;
    if (crossed(a, b, T.SKYLINE)) music('event', 'build', { g: 0 });
    if (crossed(a, b, T.PALACE)) music('event', 'build', { g: 1 });
    if (crossed(a, b, T.TOWER)) music('event', 'build', { g: 2 });
    if (crossed(a, b, T.BRIDGE)) music('event', 'build', { g: 3 });
    if (crossed(a, b, T.LIGHTS)) music('event', 'face');
    if (litPrev >= 0 && litWin > litPrev) music('event', 'light', { n: litWin - litPrev });
    litPrev = litWin;
    if (crossed(a, b, T.BLUE)) music('event', 'blue');
    if (crossed(a, b, T.SWEEP)) music('event', 'sweep');
    if (crossed(a, b, T.FADE)) music('event', 'fade');
    const k = clamp(Math.floor((b - T.TITLE) / T.TYPE_DT) + 1, 0, TITLE.length);
    if (k > typed && !reduced && b >= T.TITLE) { if (TITLE[k - 1] !== ' ') music('event', 'type', { last: k === TITLE.length }); }
    typed = b < T.TITLE ? 0 : k;
  }

  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); // no jumps after a hidden tab
    last = now;
    if (needResize) resize();
    if (!paused) {
      const t1 = t;
      skyT += dt; wt += dt * CALM; mistT += dt * CALM * (1 + 5 * stir);
      if (!reduced) {
        t += dt;
        if (t >= T.END) { t -= T.END; loopN++; litPrev = -1; typed = 0; music('restart'); }
        if (crossed(t1, t, T.RIVER + 0.4)) spawnBoat(0.35 + 0.3 * Math.random(), loopN % 2 ? -1 : 1);
      }
      updateMovers(dt);
      render(); dirty = false; frames++;
      soundCues(t1, t);
    } else if (dirty) { render(); dirty = false; frames++; }
    stir *= Math.exp(-dt * 1.5);
    const pa = ptrA;
    ptrA += (ptrATo - ptrA) * Math.min(1, dt * 3);
    if (Math.abs(parTo - par) > 0.002 || Math.abs(pa - ptrA) > 0.002) { par += (parTo - par) * Math.min(1, dt * 1.8); if (paused) dirty = true; }
    if (now - fpsT >= 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    if (now - hudT >= 250) updateHud(now);
    requestAnimationFrame(frame);
  }

  function togglePause() { paused = !paused; dirty = true; updateHud(performance.now()); music(paused ? 'pause' : 'resume'); }
  function replay() {
    t = T_START; loopN = 0; litPrev = -1; typed = 0; paused = false; dirty = true;
    boats = []; stars = []; rockets = []; sparks = []; bas = null; ship = null; chime = null;
    music('resume'); music('restart');
  }

  // Westminster Quarters (the full-hour changes) and then one bong per hour, on the viewer's clock.
  const QN = 0.38;
  const CHANGES = [['E4', 'G#4', 'F#4', 'B3'], ['E4', 'F#4', 'G#4', 'E4'], ['G#4', 'E4', 'F#4', 'B3'], ['B3', 'F#4', 'G#4', 'E4']];
  function ringBigBen() {
    if (chime) return;
    const h = new Date().getHours() % 12 || 12;
    const notes = [], seq = [];
    CHANGES.forEach((ch4, k) => ch4.forEach((nt, j) => { const s = k * QN * 5 + j * QN; notes.push(s); seq.push([s, nt, j === 3 ? QN * 3 : QN * 2.2]); }));
    const b0 = CHANGES.length * QN * 5 + 0.9, gap = reduced ? 2 : 1.6;
    const bongs = [];
    for (let k = 0; k < h; k++) bongs.push(b0 + k * gap);
    chime = { t0: skyT, notes, bongs, end: bongs[bongs.length - 1] + 3 };
    music('event', 'chime', { seq, bongs });
  }
  function openBridge() {
    if (bas) return;
    bas = { t0: skyT };
    ship = { t0: skyT + 2.2 * (reduced ? 1.4 : 1), dir: 1 };
    music('event', 'gears', { dur: 3 * (reduced ? 1.4 : 1), at: 0 });
    music('event', 'gears', { dur: 3 * (reduced ? 1.4 : 1), at: 7.4 * (reduced ? 1.4 : 1) });
    music('event', 'horn', { at: 2.6 * (reduced ? 1.4 : 1) });
  }

  // Hit tests in screen space (cells).
  function onBigBen(x, y) {
    if (!BB || t < BB.faceT0 - 0.5) return false;
    const c = x / cw, r = y / ch;
    return c >= BB.bl - 2 && c <= BB.br + 3 && r >= BB.top - 1 && r <= hr;
  }
  function onBridge(x, y) {
    if (!TB || t < T.BRIDGE + 0.8) return false;
    const c = x / cw, r = y / ch;
    return c >= TB.L0 - 2 && c <= TB.R1 + 3 && r >= TB.rTop - 5 && r <= hr + 1;
  }
  function tapAt(x, y) {
    if (onBigBen(x, y)) ringBigBen();
    else if (onBridge(x, y)) openBridge();
    else if (y > yH + ch * 0.5) spawnBoat((y - yH) / (H - yH), x < W / 2 ? 1 : -1, x < W / 2 ? -cw * 8 : W + cw * 8);
    else if (y < H * 0.3) spawnStar(x, y);
    else launch(x, y);
    dirty = true;
  }

  addEventListener('resize', () => { needResize = true; });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd/Ctrl+R alone
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') replay();
    else if (e.key === 'c' || e.key === 'C') ringBigBen();
    else if (e.key === 'b' || e.key === 'B') openBridge();
  });
  // Tap Big Ben = chime, Tower Bridge = open, river = boat, sky = shooting star / firework; two quick taps = pause.
  // A press counts as a tap only if it moved less than 8 px; moving the pointer (or a finger) pans and stirs the mist.
  let downX = 0, downY = 0, pressed = false, dragged = false, tapTimer = 0, tapResumed = false, lastMX = 0, lastMY = 0;
  const setPtr = e => {
    const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    lastMX = e.clientX; lastMY = e.clientY;
    ptrX = e.clientX; ptrY = e.clientY; ptrATo = 1;
    stir = Math.min(1, stir + Math.hypot(dx, dy) / (M * 0.6));
    if (!reduced) parTo = clamp(e.clientX / W * 2 - 1, -1, 1);
  };
  canvas.addEventListener('pointerdown', e => {
    pressed = true; dragged = false; downX = e.clientX; downY = e.clientY; lastMX = e.clientX; lastMY = e.clientY;
    if (e.pointerType !== 'mouse') setPtr(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' || pressed) setPtr(e);
    if (pressed && Math.hypot(e.clientX - downX, e.clientY - downY) >= 8) dragged = true;
  });
  const ptrOff = () => { pressed = false; parTo = 0; ptrATo = 0; };
  canvas.addEventListener('pointerleave', ptrOff);
  canvas.addEventListener('pointercancel', ptrOff);
  canvas.addEventListener('pointerup', e => {
    const wasTap = pressed && !dragged;
    pressed = false;
    if (e.pointerType !== 'mouse') { parTo = 0; ptrATo = 0; }
    if (e.button > 0 || !wasTap) return;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = 0; if (!tapResumed) togglePause(); return; }
    tapTimer = setTimeout(() => { tapTimer = 0; }, 280);
    tapResumed = paused;
    if (paused) { togglePause(); return; }   // a tap on the paused scene just resumes it
    tapAt(e.clientX, e.clientY);
  });

  // Touch screens have no keyboard, and the full hint would not fit on a phone.
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  hintEl.textContent = touch ? (zh ? '點大笨鐘報時 · 點塔橋開橋 · 點天空流星/煙火 · 點河面放船 · 雙擊暫停'
                                   : 'tap Big Ben: chime · bridge: open · sky: star · river: boat · double-tap pause')
                             : (zh ? '點大笨鐘報時 · 點塔橋開橋讓帆船通過 · 點天空流星/煙火 · 點河面放船 · 雙擊/空白鍵 暫停 · R 重播 · M 音樂'
                                   : 'click Big Ben to chime · Tower Bridge to open · sky: star / fireworks · river: boat · double-click / Space pause · R replay · M music');

  // Score: an original, slightly melancholic nocturne in A minor at 80 bpm, one 32-beat phrase per
  // 24 s scene loop (restarted with the loop). String pad and a bowed cello line on long notes,
  // rolling piano arpeggios from bar 2, and a melody that alternates between piano and a violin
  // voice on alternate loops. The last bar thins out with the scene's fade. Under it, the river
  // laps softly. Big Ben rings the Westminster Quarters (1793, public domain) and the hour.
  if (window.AsciiAudio) AsciiAudio.init({
    bpm: 32 * 60 / T.END, master: 1, reverb: 0.34, reverbTime: 3.6,
    build(a) {
      const c = a.ctx, N = AsciiAudio.notes, LOOP = 32, TR = AsciiAudio.transpose;

      // River: an endless soft noise bed, lapping in slow swells.
      const len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), dd = buf.getChannelData(0);
      let b0 = 0;
      for (let i = 0; i < len; i++) { b0 = 0.965 * b0 + 0.035 * (Math.random() * 2 - 1); dd[i] = b0 * 3; }
      const src = c.createBufferSource(), fl = c.createBiquadFilter(), wg = c.createGain();
      src.buffer = buf; src.loop = true; fl.type = 'lowpass'; fl.frequency.value = 380; fl.Q.value = 0.4; wg.gain.value = 0;
      src.connect(fl); fl.connect(wg); wg.connect(a._out({ bus: 'sfx', pan: 0.1 }, 0.3));
      src.start(a.time(0));
      a.every(0.5, (tt, k) => {
        const s = 0.5 + 0.5 * Math.sin(k * 0.23) * Math.sin(k * 0.067 + 1);
        wg.gain.setTargetAtTime(0.04 + 0.05 * s, tt, 0.7);
        fl.frequency.setTargetAtTime(260 + 320 * s, tt, 0.7);
      });

      const PROG = [
        ['A2', ['A3', 'C4', 'E4']], ['F2', ['F3', 'A3', 'C4']], ['C3', ['G3', 'C4', 'E4']], ['G2', ['G3', 'B3', 'D4']],
        ['A2', ['A3', 'C4', 'E4']], ['F2', ['F3', 'A3', 'C4']], ['D2', ['F3', 'A3', 'D4']], ['E2', ['G#3', 'B3', 'E4']]
      ];
      const DYN = [0.75, 1, 1, 1, 1, 1, 0.9, 0.45];
      // Strings: a soft pad per bar plus a bowed cello root.
      a.every(4, (tt, s) => {
        const bar = s % 8, [root, chd] = PROG[bar], v = DYN[bar];
        a.pad(tt, chd, a.beats(3.7), { vel: 0.55 * v, attack: 0.9, release: 1.6, cutoff: 1000, wet: 0.5 });
        a.lead(tt + 0.05, TR(root, 12), a.beats(3.6), { type: 'sawtooth', vel: 0.24 * v, cutoff: 650, pan: -0.25, wet: 0.4 });
      });
      // Piano: rolling eighth-note arpeggios from bar 1.
      const piano = (tt, nt, v, pan) => {
        a.pluck(tt, nt, 1.8, { type: 'triangle', vel: v, pan, wet: 0.4 });
        a.bell(tt, nt, 1.2, { vel: v * 0.1, pan, wet: 0.45 });
      };
      const ARP = [0, 1, 2, 3, 2, 1, 2, 1];
      a.every(0.5, (tt, s) => {
        const beat = (s / 2) % LOOP, bar = Math.floor(beat / 4), step = s % 8;
        if (bar === 0) return;
        const [root, chd] = PROG[bar], v = DYN[bar];
        const notes = [TR(root, 12), chd[0], chd[1], chd[2]];
        piano(tt, notes[ARP[step]], (step === 0 ? 0.34 : 0.22) * v, -0.2 + 0.1 * ARP[step]);
      });
      // Melody, alternate loops: piano, then a violin voice.
      const TUNES = [
        'E5:1.5 D5:.5 C5:1 B4 | D5:2 B4:2 | A4:1.5 B4:.5 C5:1 E5 | A5:3 G5:.5 F5 | F5:1.5 E5:.5 D5:1 A4 | G#4:3 r:1',
        'C5:2 E5:1 G5 | B4:3 D5:1 | E5:1.5 D5:.5 C5:1 A4 | C5:2 A4:2 | D5:1 F5 A5 G5 | G#4:2 B4:1 r:1'
      ];
      a.part(N(TUNES[0]), (tt, e) => { if (loopN % 2 === 0) { a.pluck(tt, e.note, e.sec * 1.6, { type: 'triangle', vel: 0.42, pan: 0.15, wet: 0.45 }); a.celesta(tt, e.note, e.sec * 1.4, { vel: 0.3, pan: 0.15, wet: 0.5 }); } }, { length: LOOP, offset: 8 });
      a.part(N(TUNES[1]), (tt, e) => { if (loopN % 2 === 1) a.lead(tt, e.note, e.sec * 0.95, { type: 'sawtooth', vel: 0.2, cutoff: 1900, pan: 0.2, wet: 0.5 }); }, { length: LOOP, offset: 8 });

      // ---- Sound effects ----
      const pan = x => (x * 2 - 1) * 0.8;
      const SP = AsciiAudio.scale('A5', 'minorPentatonic', 10);
      a.on('build', (a, d, t) => a.sweep(t, 2.2, { from: 90, to: 900, q: 2.2, attack: 1.8, vel: 0.16, bus: 'sfx', wet: 0.45 }), { gap: 0.5 });
      a.on('face', (a, d, t) => a.chime(t, 'E5', 3, { vel: 0.18 }), { gap: 5 });
      a.on('light', (a, d, t) => a.bell(t, SP[(Math.random() * SP.length) | 0], 1.2, { vel: 0.05, bus: 'sfx', wet: 0.6, pan: (Math.random() - 0.5) * 0.8 }), { gap: 0.3 });
      a.on('blue', (a, d, t) => { a.chime(t, 'A5', 3, { vel: 0.16 }); a.sparkle(t + 0.2, { count: 4, vel: 0.1, notes: SP }); }, { gap: 5 });
      a.on('type', (a, d, t) => a.tick(t, { vel: 0.16, bell: d.last, note: 'E6' }), { gap: 0.04 });
      a.on('sweep', (a, d, t) => a.whoosh(t, { dur: 2.4, freq: 220, freqEnd: 1300, q: 0.8, vel: 0.12, wet: 0.6 }), { gap: 5 });
      a.on('fade', (a, d, t) => a.sweep(t, T.FADE_DUR, { from: 2400, to: 300, q: 1.2, attack: 0.8, vel: 0.1, bus: 'sfx', wet: 0.6 }), { gap: 5 });

      // Big Ben: quarter bells, then the hour bell (E) with a long low hum.
      const bong = t => {
        a.bell(t, 'E3', 6, { vel: 0.6, bus: 'sfx', wet: 0.6 });
        const g = c.createGain(); g.connect(a._out({ bus: 'sfx' }, 0.5));
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.09, t + 0.02); g.gain.setTargetAtTime(0, t + 0.02, 1.6);
        a._osc('sine', 82.4, t, t + 8, g);
        const g2 = c.createGain(); g2.connect(a._out({ bus: 'sfx' }, 0.5));
        g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.03, t + 0.01); g2.gain.setTargetAtTime(0, t + 0.01, 0.8);
        a._osc('sine', 164.8 * 2.4, t, t + 5, g2);
      };
      a.on('chime', (a, d, t) => {
        d.seq.forEach(([s, nt, dur]) => a.bell(t + s, nt, dur + 1.5, { vel: 0.36, bus: 'sfx', wet: 0.55, pan: -0.1 }));
        d.bongs.forEach(s => bong(t + s));
      }, { gap: 1 });
      // Tower Bridge: motor rumble and gear clanks while the leaves move; the ship's deep horn.
      a.on('gears', (a, d, t) => {
        const t0 = t + d.at, dur = d.dur;
        a.noise(t0, { dur, filter: 'lowpass', freq: 160, freqEnd: 240, q: 1, attack: dur * 0.3, vel: 0.5, bus: 'sfx', wet: 0.15 });
        const g = c.createGain(), lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
        lp.connect(g); g.connect(a._out({ bus: 'sfx', pan: 0.4 }, 0.15));
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.05, t0 + 0.5); g.gain.setValueAtTime(0.05, t0 + dur - 0.4); g.gain.linearRampToValueAtTime(0, t0 + dur);
        const o = a._osc('sawtooth', 48, t0, t0 + dur + 0.1, lp);
        o.frequency.linearRampToValueAtTime(58, t0 + dur * 0.5); o.frequency.linearRampToValueAtTime(46, t0 + dur);
        for (let k = 0; k < dur / 0.22; k++) a.noise(t0 + k * 0.22 + Math.random() * 0.03, { dur: 0.05, filter: 'bandpass', freq: 1500 + Math.random() * 900, q: 6, vel: 0.12, bus: 'sfx', pan: 0.4, wet: 0.2 });
        a.thud(t0 + dur, { vel: 0.35, freq: 90 });
      }, { gap: 0 });
      a.on('horn', (a, d, t) => {
        [0, 1.7].forEach((o, i) => {
          const tt = t + d.at + o, dur = i ? 1.6 : 1.0;
          const out = a._out({ bus: 'sfx', pan: 0.35 }, 0.6), lp = c.createBiquadFilter(), g = c.createGain();
          lp.type = 'lowpass'; lp.frequency.value = 520; lp.connect(g); g.connect(out);
          g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(0.07, tt + 0.12);
          g.gain.setValueAtTime(0.07, tt + dur); g.gain.linearRampToValueAtTime(0, tt + dur + 0.5);
          [98, 123.5, 147].forEach(f => a._osc('sawtooth', f, tt, tt + dur + 0.6, lp));
        });
      }, { gap: 0 });
      a.on('boat', (a, d, t) => {
        [0, 0.4].forEach((o, i) => {
          const out = a._out({ bus: 'sfx', pan: d.pan || 0 }, 0.5), lp = c.createBiquadFilter(), g = c.createGain();
          lp.type = 'lowpass'; lp.frequency.value = 700; lp.connect(g); g.connect(out);
          const tt = t + o, dur = i ? 0.5 : 0.25, v = 0.045 + 0.03 * (d.p || 0.5);
          g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(v, tt + 0.05);
          g.gain.setValueAtTime(v, tt + dur); g.gain.linearRampToValueAtTime(0, tt + dur + 0.2);
          [220, 277].forEach(f => a._osc('sawtooth', f, tt, tt + dur + 0.3, lp));
        });
      }, { gap: 1 });
      a.on('star', (a, d, t) => { a.whoosh(t, { dur: 0.8, freq: 1800, freqEnd: 5200, q: 1.4, vel: 0.12, pan: d.pan, wet: 0.5 }); a.ding(t + 0.35, 'E6', { vel: 0.14, pan: d.pan }); a.sparkle(t + 0.5, { count: 3, vel: 0.08, notes: SP }); }, { gap: 0.2 });
      a.on('launch', (a, d, t) => a.noise(t, { dur: 1.1, filter: 'bandpass', freq: 700, freqEnd: 2600, q: 14, attack: 0.9, vel: 0.4, pan: pan(d.x), bus: 'sfx', wet: 0.25 }), { gap: 0.2 });
      a.on('burst', (a, d, t) => {
        const p = pan(d.x);
        a.boom(t, { vel: d.calm ? 0.16 : 0.3, pan: p });
        for (let i = 0; i < (d.calm ? 3 : 8); i++) a.noise(t + 0.25 + Math.random() * 0.9, { dur: 0.02 + Math.random() * 0.03, filter: 'highpass', freq: 3000 + Math.random() * 3000, vel: 0.08 + Math.random() * 0.08, pan: p + (Math.random() - 0.5) * 0.4, bus: 'sfx', wet: 0.2 });
      }, { gap: 0.2 });
    }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
