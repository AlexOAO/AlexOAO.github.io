<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>Project | Alex Li (李翔緯)</title>
  <meta name="description" content="Project story by Alex Li (李翔緯): results, why the project mattered, my role, and how I did it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/post.css?v=20261120g">
  <style>
    .post-nav { display: flex; justify-content: space-between; align-items: center; }
    .lang-toggle {
      font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; color: var(--text);
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.3);
      border-radius: 20px; padding: 0.3rem 0.8rem; cursor: pointer;
    }
    .eyebrow { font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.06em; color: var(--accent-2); font-weight: 500; margin-bottom: 1rem; }
    .lead { font-size: 1.15rem; color: var(--muted); line-height: 1.8; margin-top: 1.1rem; }
    .post-tags { flex-wrap: wrap; }
    .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 1.25rem; }
    .stage-pill {
      font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.65rem; border-radius: 20px; color: #e2e8f0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--c) 24%, transparent), color-mix(in srgb, var(--c2) 24%, transparent));
      border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
    }
    .own { font-size: 0.8rem; color: #c4b5fd; }
    /* Lifecycle strip: the four stages of the homepage chart; the stages this project covers light up. */
    .lc { margin-top: 1.75rem; }
    .lc-gov { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; font-size: 0.75rem; color: #fbbf24; }
    .lc-gov::before { content: ''; flex: 1; order: 2; height: 6px; border-radius: 6px; background: linear-gradient(90deg, rgba(245,158,11,0.75), rgba(245,158,11,0.25)); }
    .lc-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .lc-seg { position: relative; padding-top: 12px; font-size: 0.75rem; color: var(--dim); }
    .lc-seg::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; border-radius: 6px; background: rgba(148,163,184,0.1); }
    .lc-seg.on { color: var(--text); font-weight: 500; }
    .lc-seg.on::before { background: var(--c); box-shadow: 0 0 18px -2px var(--c); transform-origin: 0 50%; animation: grow 0.9s var(--ease) both; animation-delay: calc(0.3s + var(--k) * 0.12s); }
    @keyframes grow { from { transform: scaleX(0); } }
    /* Milestones: one progress row per track (e.g. two vendors); up to 5 steps per row. */
    .ms { margin-top: 1.75rem; }
    .ms-rows { display: grid; gap: 1rem; }
    .ms-track-label { font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: #94a3b8; margin-bottom: -0.4rem; }
    .ms-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
    .ms-step { position: relative; margin: 0; padding: 1.35rem 0.4rem 0 0; }
    .ms-step::before {
      content: ''; position: absolute; top: 0.35rem; left: 0; right: 0; height: 2px; background: rgba(148,163,184,0.2);
      transform-origin: 0 50%; animation: grow 0.7s var(--ease) both; animation-delay: calc(0.4s + var(--k, 0) * 0.12s);
    }
    .ms-step.done::before { background: #10b981; }
    .ms-step:last-child::before { right: auto; width: 12px; }
    .ms-step::after {
      content: ''; position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: calc(0.35s + var(--k, 0) * 0.12s);
    }
    @keyframes pop { from { transform: scale(0); } }
    .ms-step.done::after { background: #10b981; }
    .ms-step.doing::after { background: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.25); animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both, pulse 2s 1.5s infinite; animation-delay: calc(0.35s + var(--k, 0) * 0.12s), 1.5s; }
    .ms-step.todo::after { background: #0f172a; border: 2px solid #475569; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(59,130,246,0.05); } }
    .ms-step .d { display: block; font-size: 0.75rem; color: var(--dim); }
    .ms-step .t { display: block; font-size: 0.85rem; color: #cbd5e1; line-height: 1.5; }
    .ms-step .t .why { display: block; color: #94a3b8; font-weight: 400; }
    .ms-step.todo .t { color: #64748b; }
    @media (max-width: 640px) {
      .ms-track { display: flex; flex-direction: column; gap: 0.7rem; }
      .ms-step { padding: 0 0 0 1.4rem; line-height: 1.45; display: flex; gap: 0.45rem; align-items: baseline; }
      .ms-step::before { top: 12px; bottom: -0.7rem; left: 5px; right: auto; width: 2px; height: auto; transform-origin: 50% 0; animation-name: growDown; }
      .ms-step:last-child::before { display: none; }
      .ms-step .d { flex: 0 0 auto; }
      .ms-step .t { flex: 1 1 auto; }
    }
    @keyframes growDown { from { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .ms-step::before, .ms-step::after { animation: none !important; }
    }
    .lc-label { font-size: 0.78rem; letter-spacing: 0.04em; color: var(--dim); margin-bottom: 0.7rem; }
    .story h3 { font-size: 1.1rem; font-weight: 700; color: var(--text); margin: 1.75rem 0 0.5rem; }
    .story figure { margin: 1.75rem 0; }
    .story figure img { margin: 0; width: 100%; }
    .story figcaption { font-size: 0.85rem; color: var(--dim); text-align: center; margin-top: 0.5rem; }
    /* The first paragraph after "Results" is the headline result: give it a highlighted panel. */
    .story h2:first-child + p {
      font-size: 1.12rem; color: var(--text); line-height: 1.9; padding: 1.25rem 1.4rem; border-radius: 16px;
      background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.06)); border: 1px solid rgba(96,165,250,0.22);
    }
    .kids { display: grid; gap: 0.75rem; margin: 0.5rem 0 1.5rem; }
    .kid { display: block; background: rgba(30,41,59,0.5); border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem 1.1rem; transition: background 0.3s, border-color 0.3s, transform 0.4s var(--ease); text-decoration: none !important; }
    .kid:hover { background: rgba(59,130,246,0.1); border-color: rgba(96,165,250,0.4); transform: translateX(4px); }
    .parent-link { font-size: 0.85rem; color: var(--dim); margin: -0.25rem 0 0.75rem; }
    .parent-link a { color: #93c5fd; }
    .kid-name { font-weight: 700; color: var(--text); }
    .kid p { margin: 0.25rem 0 0; font-size: 0.95rem; line-height: 1.7; color: var(--muted); }
    .pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .pager a {
      color: var(--muted); font-size: 0.9rem; max-width: 48%; padding: 0.9rem 1.1rem; border-radius: 14px; border: 1px solid var(--line);
      transition: color 0.3s, border-color 0.3s, background 0.3s;
    }
    .pager a:hover { color: var(--text); border-color: rgba(96,165,250,0.4); background: rgba(59,130,246,0.06); }
    .pager .next { margin-left: auto; text-align: right; }
    .error { color: #f59e0b; }
    .error a { color: #3b82f6; }
  </style>
</head>
<body>
  <nav class="post-nav">
    <a href="index.html#experience" class="back-link" id="backLink">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span id="backText">Back</span>
    </a>
    <button class="lang-toggle" id="langToggle" aria-label="Switch language">中文</button>
  </nav>

  <article class="post" id="project">
    <p class="lead">Loading...</p>
  </article>
  <div class="post-footer"><div class="pager" id="pager"></div></div>

  <script src="assets/js/common.js?v=20261120g"></script>
  <script src="assets/js/concept-model.js?v=20261126c"></script>
  <script>
    const { esc, dataPath, getJSON, stageNames, stagePills, visibleGroups, STAGE_ORDER, STAGE_COLOR, stageSpan, isGov, QUANT_ORDER, QUANT_COLOR, quantSpan, quantPill } = Site;
    const I18N = {
      en: {
        cmKicker: 'Concept model', close: 'Close',
        back: 'Back to Alex Li', toggle: '中文', kids: 'Sub-projects', partOf: 'Part of: ',
        prev: 'Previous', nextProj: 'Next', noStory: 'The story for this project is not written yet.',
        notFound: 'This project does not exist.', home: 'Back to the homepage', lc: 'Where it sits in the AI lifecycle', ms: 'Milestones',
        lcQuant: 'Where it sits in the quant pipeline', quantRole: 'Personal project',
        stageNo: 'Stage {n}', prevStage: 'Previous stage', nextStage: 'Next stage',
        glance: 'At a glance', gBefore: 'Before', gAfter: 'Now', gDid: 'What I did',
        flowTitle: 'Who does what in this stage', flowAi: 'Role added by AI projects', flowGate: 'Checkpoint', flowMe: 'Where I work', meLabel: 'Me', flowVendor: 'Outsourced vendor', vendorLabel: 'Vendor', stageProjects: 'My projects in this stage', stageAt: 'This stage in the AI lifecycle',
        loadError: 'Content failed to load. A network filter may block this site.',
      },
      zh: {
        cmKicker: '概念模型', close: '關閉',
        back: '回到首頁', toggle: 'EN', kids: '子專案', partOf: '上層專案：',
        prev: '上一個專案', nextProj: '下一個專案', noStory: '這個專案的文章還沒寫。',
        notFound: '找不到這個專案。', home: '回到首頁', lc: '在 AI 生命週期的位置', ms: '專案進度',
        lcQuant: '在量化交易流程的位置', quantRole: '個人專案',
        stageNo: '第 {n} 階段', prevStage: '上一個階段', nextStage: '下一個階段',
        glance: '專案摘要', gBefore: '以前', gAfter: '現在', gDid: '我做了什麼',
        flowTitle: '這個階段的分工流程', flowAi: 'AI 專案新增的角色', flowGate: '檢核關卡', flowMe: '我的位置', meLabel: '我', flowVendor: '委外廠商', vendorLabel: '委外', stageProjects: '我在這個階段的專案', stageAt: '這個階段在 AI 生命週期的位置',
        loadError: '內容載入失敗。可能是網路過濾設備封鎖了本站。',
      },
    };
    const T = k => I18N[Site.getLang()][k];
    const slug = new URLSearchParams(location.search).get('id');
    const colon = () => Site.getLang() === 'en' ? ': ' : '：';

    function inline(t) {
      return esc(t)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+|[\w./?=&#-]+)\)/g, '<a href="$2">$1</a>');
    }
    function markdown(md) {
      const out = []; let para = [], list = null;
      const flush = () => {
        if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; }
        if (list) { out.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join('')}</ul>`); list = null; }
      };
      // Skip the front matter block that the admin (Sveltia CMS) keeps at the top of each file.
      md.replace(/\r/g, '').replace(/^---\n[\s\S]*?\n---\n/, '').split('\n').forEach(line => {
        const l = line.trim();
        if (!l) return flush();
        let m;
        if ((m = l.match(/^!\[(.*?)\]\(([^\s)]+)\)$/))) { flush(); out.push(`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy">${m[1] ? `<figcaption>${inline(m[1])}</figcaption>` : ''}</figure>`); }
        else if ((m = l.match(/^(#{2,3}) (.+)/))) { flush(); out.push(m[1].length === 2 ? `<h2>${inline(m[2])}</h2>` : `<h3>${inline(m[2])}</h3>`); }
        else if ((m = l.match(/^[-*] (.+)/))) { if (para.length) flush(); (list = list || []).push(m[1]); }
        else if ((m = l.match(/^> (.+)/))) { flush(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
        else { if (list) flush(); para.push(l); }
      });
      flush();
      return out.join('');
    }
    // Each project's story: data/stories/<slug>.md (English: data/en/stories/<slug>.md).
    const getStory = () => slug ? fetch(dataPath(`stories/${slug}.md`), { cache: 'no-cache' }).then(r => r.ok ? r.text() : null).catch(() => null) : Promise.resolve(null);

    function render() {
      document.documentElement.lang = Site.getLang() === 'en' ? 'en' : 'zh-Hant';
      document.getElementById('langToggle').textContent = T('toggle');
      document.getElementById('backText').textContent = T('back');
      const root = document.getElementById('project');
      const pager = document.getElementById('pager');

      Promise.all([getJSON(dataPath('about.json')), getJSON(dataPath('work.json')), getJSON(dataPath('projects.json')).catch(() => []), getJSON(dataPath('flows.json')).catch(() => ({})), getJSON(dataPath('roles.json')).catch(() => []), getJSON(dataPath('glance.json')).catch(() => ({})), getJSON(dataPath('models.json')).catch(() => ({})), getStory()]).then(([about, raw, repos, flows, roles, glances, models, story]) => {
        const view = stageView(about, raw, flows, Object.fromEntries(roles.map(r => [r.key, r]))) || workView(about, raw) || quantView(about, repos);
        document.getElementById('backLink').href = view ? view.back : 'index.html#experience';
        if (!view) {
          root.innerHTML = `<p class="lead error">${esc(T('notFound'))} <a href="index.html#experience">${esc(T('home'))}</a></p>`;
          pager.innerHTML = '';
          return;
        }
        document.title = `${view.title} | Alex Li (李翔緯)`;
        const href = x => `project.html?id=${encodeURIComponent(x.slug)}`;
        const kidLinks = view.kids.map(x => `<a class="kid" href="${href(x)}"><div class="kid-name">↳ ${esc(x.name)}</div><p>${esc(x.summary)}</p></a>`).join('');
        root.innerHTML = `
          <header class="post-header">
            <p class="eyebrow">${esc(view.eyebrow)}</p>
            ${view.parent ? `<p class="parent-link">${esc(T('partOf'))}<a href="${href(view.parent)}">${esc(view.parent.name)}</a></p>` : ''}
            <h1>${esc(view.title)}</h1>
            <p class="lead">${esc(view.lead)}</p>
            <div class="meta-row">${view.pills}${view.own ? `<span class="own">${esc(view.own)}</span>` : ''}</div>
            <div class="meta-row post-tags">${view.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
            ${view.lc}
            ${view.ms}
          </header>
          <div class="post-body story">
            ${view.stage ? '' : glancePanel(glances[slug])}
            ${view.stage || !models[slug] ? '' : ConceptModel.html(models[slug], { kicker: T('cmKicker') })}
            ${view.diagram || ''}
            ${story ? markdown(story) : `<p class="error">${esc(T('noStory'))}</p>`}
            ${view.kids.length ? `<h2>${esc(view.kidsTitle || T('kids'))}</h2><div class="kids">${kidLinks}</div>` : ''}
          </div>`;

        const { list, i } = view;
        const link = (x, cls, label) => x ? `<a class="${cls}" href="${href(x)}">${cls === 'prev' ? '← ' : ''}${esc(label)}${colon()}${esc(x.name)}${cls === 'next' ? ' →' : ''}</a>` : '';
        pager.innerHTML = link(list[i - 1], 'prev', T(view.stage ? 'prevStage' : 'prev')) + link(list[i + 1], 'next', T(view.stage ? 'nextStage' : 'nextProj'));
        // Concept model (data/models.json): diagram nodes and buttons open a popup.
        if (!view.stage && models[slug]) ConceptModel.bind(models[slug], root, { close: T('close') });
      }).catch(() => { root.innerHTML = `<p class="lead error">${esc(T('loadError'))}</p>`; });
    }

    // Before -> After card (data/glance.json): the original pain, the new state with up to two proofs, and what I did.
    function glancePanel(g) {
      if (!g || !g.before) return '';
      const proofs = (g.proofs || []).length ? `<div class="ba-proofs">${g.proofs.map(p =>
        `<div class="ba-proof"><b>${esc(p.value)}</b><span>${esc(p.label)}</span></div>`).join('')}</div>` : '';
      const status = g.status ? `<span class="ba-status">${esc(g.status)}</span>` : '';
      return `<section class="ba" aria-label="${esc(T('glance'))}">
        <div class="ba-grid">
          <div class="ba-before"><p class="ba-k">${esc(T('gBefore'))}</p><p class="ba-v">${esc(g.before)}</p></div>
          <div class="ba-arrow" aria-hidden="true">→</div>
          <div class="ba-after"><p class="ba-k">${esc(T('gAfter'))}${status}</p><p class="ba-v">${esc(g.after)}</p>${proofs}</div>
        </div>
        <div class="ba-did"><span class="ba-k">${esc(T('gDid'))}</span><span>${esc(g.did)}</span></div>
      </section>`;
    }

    // One row of segments: which stages (or layers) the project covers. "band" goes above the row (AI governance).
    const lcRow = (label, keys, colors, names, sp, band = '') => `<div class="lc" aria-hidden="true"><p class="lc-label">${esc(label)}</p>
      ${band}<div class="lc-row">${keys.map((k, i) => `<div class="lc-seg ${sp && i >= sp[0] && i <= sp[1] ? 'on' : ''}" style="--c:${colors[k]};--k:${i}">${esc(names[k] || k)}</div>`).join('')}</div></div>`;

    // An AI SDLC stage (id "stage-<key>", or "stage-gov" for the governance band): what the stage is, who takes part,
    // and every project that touches it.
    // Role flow for a stage (data/flows.json): rows of role boxes joined by labelled arrows.
    // A link between two boxes is {left, right} (older data used a [left, right] pair).
    const linkLabels = l => !l ? [] : Array.isArray(l) ? l : [l.left, l.right].filter(t => t);
    // A row with "links" joins its boxes with two-way labels (links[i] sits between box i and i + 1).
    // Box tags: "vendor" (outsourced), "ai" (a role AI projects add), "gate" (a checkpoint), "me" (where I work).
    // Boxes name a role ("key" in data/roles.json): the box shows the role and its one-line definition, links to
    // roles.html, and shows this stage's duty ("does") on hover. "role" / "short" override the name and the line.
    // A row with "split" holds one arrow per column; a box with "ghost" keeps a column empty.
    function flowDiagram(rows, roles) {
      if (!(rows || []).length) return '';
      const box = b => {
        if (b.ghost) return '<div class="flow-box ghost" aria-hidden="true"></div>';
        const r = roles[b.key] || {};
        return `<a class="flow-box ${esc(b.tag || '')}" href="roles.html#role-${esc(b.key)}" title="${esc(b.does || '')}"><b>${esc(b.role || r.name || b.key)}</b><span>${esc(b.short || r.short || '')}</span></a>`;
      };
      const body = rows.map(r => r.arrow
        ? `<div class="flow-arrow ${esc(r.tag || '')}"><em>${r.tag === 'loop' ? '↺ ' : ''}${esc(r.arrow)}</em></div>`
        : r.split
        ? `<div class="flow-split">${r.split.map(t => t ? `<div class="flow-arrow"><em>${esc(t)}</em></div>` : '<div></div>').join('')}</div>`
        : `<div class="flow-row ${r.links ? 'chain' : ''}">${r.boxes.map((b, i) =>
            (i && r.links ? `<div class="flow-link">${linkLabels(r.links[i - 1]).map(t => `<span>${esc(t)}</span>`).join('')}</div>` : '') + box(b)).join('')}</div>`).join('');
      const legend = [['vendor', '#f9a8d4', 'flowVendor'], ['ai', '#a78bfa', 'flowAi'], ['gate', '#fbbf24', 'flowGate'], ['me', '#34d399', 'flowMe']]
        .filter(([tag]) => rows.some(r => (r.boxes || []).some(b => b.tag === tag)))
        .map(([, c, k]) => `<span><i style="border-color:${c};background:color-mix(in srgb, ${c} 25%, transparent)"></i>${esc(T(k))}</span>`).join('');
      return `<div class="flow compact" style="--me-label:'${T('meLabel')}';--vendor-label:'${T('vendorLabel')}'"><p class="flow-title">${esc(T('flowTitle'))}</p>${body}<div class="flow-legend">${legend}</div></div>`;
    }

    function stageView(about, raw, flows, roles) {
      const cfg = about.sdlc || {};
      const names = stageNames(cfg);
      const list = [...(cfg.stages || []).map(st => ({ key: st.key, name: st.name, desc: st.desc })),
        ...(cfg.governance ? [{ key: 'gov', name: names.gov, desc: cfg.governance.desc }] : [])]
        .map(st => ({ ...st, slug: `stage-${st.key}` }));
      const i = list.findIndex(x => x.slug === slug);
      if (i < 0) return null;
      const st = list[i], si = STAGE_ORDER.indexOf(st.key), gov = st.key === 'gov';
      const kids = visibleGroups(raw).flatMap(g => g.projects).filter(p => {
        const sp = stageSpan(p);
        return gov ? isGov(p) : sp && sp[0] <= si && si <= sp[1] && !isGov(p);
      }).map(p => ({ slug: p.slug, name: p.short || p.title, summary: p.summary }));
      return {
        back: 'index.html#about', list, i,
        eyebrow: `AI SDLC · ${gov ? names.gov : T('stageNo').replace('{n}', si + 1)}`, title: st.name, lead: st.desc,
        pills: '', own: '', tags: [], ms: '',
        lc: lcRow(T('stageAt'), STAGE_ORDER, STAGE_COLOR, names, gov ? null : [si, si], gov ? `<div class="lc-gov">${esc(names.gov)}</div>` : ''),
        parent: null, kids, kidsTitle: T('stageProjects'), stage: true, diagram: flowDiagram((flows || {})[st.key], roles),
      };
    }

    // A project from work.json (Experience): AI stages, milestones, company.
    function workView(about, raw) {
      const all = visibleGroups(raw).flatMap(g => g.projects.map(p => ({ g, p, slug: p.slug, name: p.short || p.title, summary: p.summary })));
      const i = all.findIndex(x => x.slug === slug);
      if (i < 0) return null;
      const { g, p } = all[i];
      const names = stageNames(about.sdlc);
      const sp = stageSpan(p);
      const lc = (sp || isGov(p)) ? lcRow(T('lc'), STAGE_ORDER, STAGE_COLOR, names, sp, isGov(p) ? `<div class="lc-gov">${esc(names.gov)}</div>` : '') : '';
      // "Station: detail" shows the detail on its own line.
      const msText = t => { const m = t.match(/^(.+?)[：:]\s*(.+)$/); return m ? `${esc(m[1])}<span class="why">${esc(m[2])}</span>` : esc(t); };
      const msAll = p.milestones || [];
      const msRows = [...new Set(msAll.map(m => m.track || ''))].map(t => {
        const steps = msAll.filter(m => (m.track || '') === t).slice(0, 5);
        return `${t ? `<div class="ms-track-label">${esc(t)}</div>` : ''}<ol class="ms-track" style="--n:${steps.length}">${steps.map((m, k) =>
          `<li class="ms-step ${esc(m.status)}" style="--k:${k}"><span class="d">${esc(m.date)}</span><span class="t">${msText(m.text)}</span></li>`).join('')}</ol>`;
      }).join('');
      return {
        back: 'index.html#experience', list: all, i,
        eyebrow: `${g.org} · ${g.role} · ${p.period}`, title: p.title, lead: p.summary,
        pills: stagePills(p, names), own: p.ownership, tags: p.tags || [], lc,
        ms: msAll.length ? `<div class="ms"><p class="lc-label">${esc(T('ms'))}</p><div class="ms-rows">${msRows}</div></div>` : '',
        parent: p.parent && all.find(x => x.slug === p.parent),
        kids: all.filter(x => x.p.parent === p.slug).map(x => ({ ...x, name: x.p.title })),
      };
    }

    // A repo from projects.json (Quant Lab) that has a "slug": quant layers, no milestones.
    function quantView(about, repos) {
      const items = repos.map(p => ({ p, slug: p.slug, name: p.name, summary: p.desc }));
      // Same order as the homepage: each repo, then the repos under it. Only repos with a story page.
      const list = items.filter(x => !x.p.parent).flatMap(x => [x, ...items.filter(c => c.p.parent === x.name)]).filter(x => x.slug);
      const i = list.findIndex(x => x.slug === slug);
      if (i < 0) return null;
      const { p } = list[i];
      const names = Object.fromEntries(((about.quant || {}).stages || []).map(st => [st.key, st.name]));
      const sp = quantSpan(p);
      return {
        back: 'index.html#projects', list, i,
        eyebrow: `Quant Lab · ${T('quantRole')}`, title: p.name, lead: p.desc,
        pills: quantPill(p, names), own: '', tags: p.tags || [],
        lc: sp ? lcRow(T('lcQuant'), QUANT_ORDER, QUANT_COLOR, names, sp) : '',
        ms: '',
        parent: p.parent && list.find(x => x.name === p.parent),
        kids: list.filter(x => x.p.parent === p.name),
      };
    }

    document.getElementById('langToggle').addEventListener('click', () => { Site.toggleLang(); render(); });
    render();
  </script>
</body>
