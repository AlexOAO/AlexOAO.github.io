    .rm-focus b { display: block; color: #fde68a; font-size: 0.88rem; line-height: 1.6; }
    .rm-focus em { display: block; font-style: normal; color: #cbd5e1; font-size: 0.82rem; }

    /* measures */
    .ms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; margin: 1rem 0; }
    .ms div { padding: 0.7rem 0.85rem; }
    .ms b { display: block; font-size: 0.88rem; color: var(--ink); } .ms span { font-size: 0.8rem; color: var(--mute); }

    .post-body .ck li { padding: 0.55rem 0.8rem 0.55rem 2rem; position: relative; background: var(--box); border: 1px solid var(--line); border-radius: 10px; font-size: 0.86rem; margin: 0; }
    .post-body .ck li::before { content: ''; position: absolute; left: 0.75rem; top: 0.85rem; width: 0.7rem; height: 0.7rem; border: 2px solid #86efac; border-radius: 3px; background: none; }
    .traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.4rem; margin-top: 1rem; }
    .traits div { padding: 0.6rem 0.8rem; font-size: 0.85rem; color: #cbd5e1; } .traits b { display: block; color: var(--ink); font-size: 0.88rem; }
    .updated { color: var(--dim); font-size: 0.85rem; margin-top: 2rem; }

    @media (max-width: 760px) {
      .sum, .lv, .two, .rm-body, .ms, .ck, .traits { grid-template-columns: minmax(0, 1fr); }
      .lv-card { min-height: 0 !important; }

      .gantt-wrap { overflow-x: auto; } .gantt-wrap svg { min-width: 620px; }
    }

  <script>
    const { esc, dataPath, getJSON } = Site;
    const I18N = {
      en: { title: 'Individual Development Plan', back: 'Back to the homepage', toggle: '中文',
        milestone: 'Milestone', q1: 'Where I am going', h1: 'Three levels of growth',
        q2: 'Where I am now', h2: 'Eight competencies: now vs three-year target', now: 'Now', target: 'Three-year target', comp: 'Competency', ev: 'Evidence',
        q3: 'What to build first', h3: 'Priority quadrant', xAxis: 'Importance to the goal →', yAxis: 'Gap to target →',
        q4: 'How I will get there', h4: 'Three-year roadmap', months: 'Month', steps: 'Steps', focus: 'Build', use: 'Use my strengths', plan: 'Plan', out: 'Deliverables',
        q5: 'Steps I have walked', h5: 'The AI value cycle', loop: '↺ Results feed the next problem',
        q6: 'How I will know', h6: 'Measures and yearly checklist', check: 'Yearly minimum',
        h7: 'How I work', updated: 'Last updated', level: 'Level', loadError: 'Content failed to load. A network filter may block this site.' },
      zh: { title: '個人發展計畫', back: '回到首頁', toggle: 'EN',
        milestone: '里程碑', q1: '我要去哪裡', h1: '三個成長層級',
        q2: '我現在在哪裡', h2: '八項職能：目前與三年目標', now: '目前', target: '三年目標', comp: '職能', ev: '證據',
        q3: '先培養什麼', h3: '優先順序象限圖', xAxis: '對目標的重要性 →', yAxis: '與目標的差距 →',
        q4: '怎麼走', h4: '三年發展路徑', months: '月', steps: '工作步驟', focus: '重點培養', use: '運用優勢', plan: '規劃方案', out: '產出',
        q5: '我走過哪些步驟', h5: 'AI 價值循環', loop: '↺ 成效回饋到下一個問題',
        q6: '怎麼知道做到了', h6: '衡量方式與年度檢核', check: '每年至少完成',
        h7: '我的工作方式', updated: '最後更新', level: '第 {n} 層', loadError: '內容載入失敗。可能是網路過濾設備封鎖了本站。' },
    };
    const T = k => I18N[Site.getLang()][k];
    const chips = l => (l || []).length ? `<div class="chips">${l.map(([t, h]) => `<a href="${esc(h)}">${esc(t)} →</a>`).join('')}</div>` : '';
    const ul = l => `<ul>${l.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    const head = (q, h) => `<p class="q">${esc(q)}</p><h2 style="margin-top:0.2rem">${esc(h)}</h2>`;

    // Three-year blueprint: three phase columns (tasks and milestone), then current abilities, upgrade axes and the goal.
    function blueprint(b) {
      const cols = b.phases.map((p, i) => `<div class="bp-col"><div><span class="bp-no">${i + 1}</span><span class="bp-when">${esc(p.when)}</span></div>
        <h3>${esc(p.name)}</h3><p class="bp-line">${esc(p.line)}</p>
        ${p.tasks.map((t, j) => `<div class="bp-task"><b><i>${j + 1}</i>${esc(t.t)}</b><p>${esc(t.d)}</p></div>`).join('')}
        <div class="bp-ms"><span>${esc(T('milestone'))}</span><p>${esc(p.milestone)}</p></div></div>`).join('');
      return `<section class="bp"><h2 class="bp-h">${esc(b.title)}</h2><p class="bp-sub">${esc(b.sub)}</p><div class="bp-cols">${cols}</div>
        <div class="bp-foot">
          <div class="bp-box"><span class="bp-k">${esc(b.have_title)}</span><div class="bp-have">${b.have.map(h => `<div><b>${esc(h.k)}</b><span>${esc(h.v)}</span></div>`).join('')}</div></div>
          <div class="bp-box"><span class="bp-k">${esc(b.axes_title)}</span><div class="bp-axes">${b.axes.map((a, i) => `<div><i>${i + 1}</i>${esc(a)}</div>`).join('')}</div></div>
          <div class="bp-box bp-goal"><span class="bp-k">${esc(b.goal_title)}</span><p>${esc(b.goal)}</p></div>
        </div><p class="bp-tag">${esc(b.tag)}</p></section>`;
    }

    // Radar: eight axes 0..4; "now" solid green, "target" dashed violet.
    function radar(d) {
      const C = d.competencies, n = C.length, cx = 210, cy = 200, R = 140, max = 4;
      const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / max, cy + Math.sin(a) * R * v / max]; };
      const poly = key => C.map((c, i) => pt(i, c[key]).map(x => x.toFixed(1)).join(',')).join(' ');
      let g = '';
      for (let r = 1; r <= max; r++) g += `<polygon points="${C.map((_, i) => pt(i, r).join(',')).join(' ')}" fill="none" stroke="#1e293b" stroke-width="1"/>`;
      C.forEach((c, i) => { const [x, y] = pt(i, max); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1e293b"/>`; });
      g += `<polygon points="${poly('target')}" fill="none" stroke="var(--tgt)" stroke-width="2" stroke-dasharray="5 4"/>`;
      g += `<polygon points="${poly('now')}" fill="rgba(22,163,74,0.18)" stroke="var(--now)" stroke-width="2"/>`;
      C.forEach((c, i) => { const [x, y] = pt(i, c.now); g += `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--now)" stroke="#111a2e" stroke-width="2"><title>${esc(c.name)}: ${c.now} → ${c.target}</title></circle>`; });
      C.forEach((c, i) => { const [x, y] = pt(i, max + 0.55); const anchor = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end';
        g += `<text x="${x}" y="${y + 4}" text-anchor="${anchor}" font-size="14" fill="#cbd5e1">${esc(c.name)}</text>`; });
      [1, 2, 3, 4].forEach(r => g += `<text x="${cx + 3}" y="${cy - R * r / max - 2}" font-size="9.5" fill="#64748b">${r}</text>`);
      return `<svg viewBox="-60 -10 540 420" role="img" aria-label="${esc(T('h2'))}">${g}</svg>`;
    }
    // Quadrant (2x2 matrix): x = importance to the goal (high >= 3.5), y = gap to target (large >= 2).
    function quadrant(d) {
      const cell = (pri, big) => d.competencies.filter(c => (c.importance >= 3.5) === pri && (c.target - c.now >= 2) === big);
      const chip = c => `<span class="qc"><b>${esc(c.name)}</b><em>${c.now} → ${c.target}</em></span>`;
      const box = (cls, title, list) => `<div class="qd ${cls}"><span class="qd-t">${esc(title)}</span><div>${list.map(chip).join('') || '<span class="qd-e">—</span>'}</div></div>`;
      const Q = d.quadrants;
      return `<div class="quad"><div class="qy">${esc(T('yAxis'))}</div>
        <div class="qg">${box('tl', Q.tl, cell(false, true))}${box('tr', Q.tr, cell(true, true))}${box('bl', Q.bl, cell(false, false))}${box('br', Q.br, cell(true, false))}</div>
        <div class="qx">${esc(T('xAxis'))}</div></div>`;
    }
    // Gantt: 0..36 months; level band, five phases, milestones.
    function gantt(d) {
      const W = 760, L = 150, Rr = 16, rowH = 30, top = 30, pw = W - L - Rr, X = m => L + m / 36 * pw;
      const rows = d.roadmap.length, H = top + (rows + 1) * rowH + 40;
      let g = '';
      for (let m = 0; m <= 36; m += 6) g += `<line x1="${X(m)}" y1="${top - 6}" x2="${X(m)}" y2="${H - 34}" stroke="#1e293b"/><text x="${X(m)}" y="${top - 12}" text-anchor="middle" font-size="10.5" fill="#64748b">${m}</text>`;
      g += `<text x="${L - 10}" y="${top - 12}" text-anchor="end" font-size="10.5" fill="#64748b">${esc(T('months'))}</text>`;
      const ly = top + 4;
      g += `<rect x="${X(0)}" y="${ly}" width="${X(12) - X(0) - 2}" height="18" rx="4" fill="#1e3a8a"/><text x="${X(6)}" y="${ly + 13}" text-anchor="middle" font-size="11" fill="#bfdbfe">${esc(d.levels[1].name)}</text>`;
      g += `<rect x="${X(12)}" y="${ly}" width="${X(36) - X(12)}" height="18" rx="4" fill="#3b0764"/><text x="${X(24)}" y="${ly + 13}" text-anchor="middle" font-size="11" fill="#e9d5ff">${esc(d.levels[2].name)}</text>`;
      d.roadmap.forEach((r, i) => {
        const y = top + (i + 1) * rowH + 4;
        g += `<text x="${L - 10}" y="${y + 13}" text-anchor="end" font-size="11.5" fill="#cbd5e1">${esc(r.when)}</text>`;
        g += `<rect x="${X(r.start)}" y="${y}" width="${Math.max(X(r.end) - X(r.start) - 2, 6)}" height="18" rx="4" fill="#2563eb"><title>${esc(r.title)}</title></rect>`;
        const tx = X(r.end) + 6, fits = X(r.end) + 6 + r.title.length * 11 < W;
        g += `<text x="${fits ? tx : X(r.start) - 6}" y="${y + 13}" text-anchor="${fits ? 'start' : 'end'}" font-size="11" fill="#e2e8f0">${esc(r.title)}</text>`;
      });
      const my = H - 26;
      d.milestones.forEach((m, i) => {
        const x = X(m.m);
        g += `<path d="M${x} ${my - 7} L${x + 7} ${my} L${x} ${my + 7} L${x - 7} ${my} Z" fill="#f59e0b"/>`;
        g += `<text x="${Math.min(Math.max(x, L + 20), W - 30)}" y="${my + 21}" text-anchor="middle" font-size="10.5" fill="#fde68a">${esc(m.label)}</text>`;
      });
      return `<div class="gantt-wrap"><svg viewBox="0 0 ${W} ${H + 8}" role="img" aria-label="${esc(T('h4'))}">${g}</svg></div>`;
    }

    function render() {
      document.documentElement.lang = Site.getLang() === 'en' ? 'en' : 'zh-Hant';
      document.title = `${T('title')} IDP | Alex Li (李翔緯)`;
      ['title'].forEach(id => document.getElementById(id).textContent = T(id));
      document.getElementById('backText').textContent = T('back');
      document.getElementById('langToggle').textContent = T('toggle');
      getJSON(dataPath('idp.json')).then(d => {
        document.getElementById('goal').textContent = d.goal;
        document.getElementById('tagline').textContent = d.tagline;
        document.getElementById('sum').innerHTML = d.summary.map(s => `<div class="box"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');
        const lvl = d.levels.map(l => `<div class="box lv-card l${l.n}"><span class="lv-n">${esc(T('level').replace('{n}', l.n))}</span><h3>${esc(l.name)}</h3><p>${esc(l.does)}</p>
          <span class="pill ${l.state}">${esc(l.when)}</span>${chips(l.proof)}</div>`).join('');
        const rows = d.competencies.map(c => `<tr><td>${esc(c.name)}</td><td class="num">${c.now}${c.target > c.now ? ` <span class="up">→ ${c.target}</span>` : ''}</td><td>${chips(c.evidence)}</td></tr>`).join('');
        const scale = d.scale.map((s, i) => `${i + 1}＝${esc(s)}`).join('　');
        const rm = d.roadmap.map(r => `<div class="box rm-card">
          <div class="rm-top"><span class="rm-when">${esc(r.when)}</span><h3>${esc(r.title)}</h3><span class="rm-lv">${esc(d.levels[r.level - 1].name)}</span></div>
          <div class="rm-steps">${r.steps.map(x => `<span>${esc(x)}</span>`).join('')}</div>
          <div class="rm-body">
            <div class="rm-focus"><span class="rm-k k-focus">${esc(T('focus'))}</span>${r.focus.map(x => `<b>${esc(x)}</b>`).join('')}
              <span class="rm-k k-use">${esc(T('use'))}</span>${r.use.map(x => `<em>${esc(x)}</em>`).join('')}</div>
            <div><span class="rm-k k-plan">${esc(T('plan'))}</span>${ul(r.plan)}</div>
            <div><span class="rm-k k-out">${esc(T('out'))}</span>${ul(r.output)}</div>
          </div></div>`).join('');
        const cy = d.cycle.map((c, i) => `<div class="box cy-step ${c.gate ? 'gate' : ''}"><span class="cy-i">${c.gate ? '◆' : String(i < 5 ? i + 1 : i).padStart(2, '0')}</span>
          <b>${esc(c.name)}</b><span class="pill ${c.state}">${esc(d.states[c.state])}</span>${c.proof ? chips([c.proof]) : ''}</div>`).join('');
        document.getElementById('idp').innerHTML = `
          ${d.blueprint ? blueprint(d.blueprint) : ''}
          ${head('1 · ' + T('q1'), T('h1'))}<div class="lv">${lvl}</div>
          ${head('2 · ' + T('q2'), T('h2'))}
          <div class="two"><div class="box chart">${radar(d)}<div class="legend"><span><i style="border-color:var(--now)"></i>${esc(T('now'))}</span><span><i style="border-color:var(--tgt);border-top-style:dashed"></i>${esc(T('target'))}</span></div></div>
            <div><table class="tbl"><thead><tr><th>${esc(T('comp'))}</th><th>${esc(T('now'))} → ${esc(T('target'))}</th><th>${esc(T('ev'))}</th></tr></thead><tbody>${rows}</tbody></table>
            <p class="note">${scale}</p></div></div>
          ${head('3 · ' + T('q3'), T('h3'))}<div class="box chart">${quadrant(d)}</div><p class="note">${esc(d.selfNote)}</p>
          ${head('4 · ' + T('q4'), T('h4'))}<div class="box chart">${gantt(d)}</div><div class="rm">${rm}</div>
          ${head('5 · ' + T('q5'), T('h5'))}<div class="cy">${cy}</div><p class="loop">${esc(T('loop'))}</p>
          ${head('6 · ' + T('q6'), T('h6'))}<div class="ms">${d.measures.map(m => `<div class="box"><b>${esc(m.name)}</b><span>${esc(m.what)}</span></div>`).join('')}</div>
          <p class="rm-k k-out">${esc(T('check'))}</p><ul class="ck">${d.checklist.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="lead2">${esc(d.review)}</p>
          <h2>${esc(T('h7'))}</h2><div class="traits">${d.traits.map(([a, b]) => `<div class="box"><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div>
          <p class="updated">${esc(T('updated'))}：${esc(d.updated)}</p>`;
      }).catch(e => { console.error(e); document.getElementById('idp').innerHTML = `<p class="error">${esc(T('loadError'))}</p>`; });
    }
    document.getElementById('langToggle').addEventListener('click', () => { Site.toggleLang(); render(); });
    render();
  </script>
</body>
</html>
