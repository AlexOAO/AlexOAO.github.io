      const cl = center.lines;
      g += `<g ${center.i != null ? `class="bub" role="button" tabindex="0" data-open="pop" data-i="${center.i}"` : ''}><circle cx="${cx}" cy="${cy}" r="78" fill="#111a2e" stroke="#475569" stroke-width="2"/>
        ${cl.map((t, k) => `<text x="${cx}" y="${cy + (k - (cl.length - 1) / 2) * 26 + 7}" text-anchor="middle" font-size="${zh ? 20 : 15}" font-weight="800" fill="#f1f5f9">${esc(t)}</text>`).join('')}</g>`;
      return `<svg viewBox="0 0 600 440" role="group" aria-label="${esc(title)}">${g}</svg>`;
    }
    // Rising steps (growth levels, three-year blueprint).
    function stairs(items, title, flag) {
      const zh = zhL(), n = items.length, w = 168, gap = 18, x0 = 30, base = 380;
      let g = `<line x1="20" y1="${base}" x2="580" y2="${base}" stroke="#334155" stroke-width="2"/>`;
      items.forEach((it, k) => {
        const h = 120 + k * 80, x = x0 + k * (w + gap), y = base - h;
        g += `<g class="bub" role="button" tabindex="0" data-open="pop" data-i="${it.i}" aria-label="${esc(it.name)}">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${it.dash ? '#1e1b4b' : it.color}" stroke="${it.color}" stroke-width="3" ${it.dash ? 'stroke-dasharray="8 6"' : ''}/>
          <text x="${x + 14}" y="${y + 30}" font-size="15" font-weight="700" fill="#e0e7ff">${esc(it.top)}</text>
          <text x="${x + 14}" y="${y + 62}" font-size="${zh ? 24 : 18}" font-weight="800" fill="#fff">${esc(it.name)}</text>
          <text x="${x + 14}" y="${base - 16}" font-size="${zh ? 15 : 13}" fill="#e2e8f0">${esc(it.sub)}</text></g>`;
      });
      g += `<path d="M60 ${base - 150} Q 300 ${base - 330} 540 ${base - 320}" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
        <polygon points="548,${base - 322} 532,${base - 330} 534,${base - 312}" fill="#f59e0b"/>`;
      if (flag) g += `<g class="bub" role="button" tabindex="0" data-open="pop" data-i="${flag.i}"><rect x="420" y="6" width="160" height="38" rx="8" fill="#f59e0b"/><text x="500" y="32" text-anchor="middle" font-size="${zh ? 18 : 14}" font-weight="800" fill="#1f1300">${esc(flag.label)}</text></g>`;
      return `<svg viewBox="0 0 600 400" role="group" aria-label="${esc(title)}">${g}</svg>`;
    }
    const ITEM = t => t;           // plain text line in a popup
    const HTML = h => ({ html: h }); // pre-built HTML line in a popup

    function cCycle(d) {
      const nodes = d.cycle.map((c, k) => ({ no: c.gate ? '◆' : String(k < 5 ? k + 1 : k), label: c.name, color: SC[c.state], diamond: c.gate,
        i: pop({ color: SC[c.state], title: c.name, sub: d.states[c.state], items: [c.gate ? T('gateNote') : T('stepNote'), c.proof ? HTML(chips([c.proof])) : T('noProof')] }) }));
      const legend = `<p class="note">${['done', 'now', 'gap'].map(k => `<span style="color:${SC[k]}">●</span> ${esc(d.states[k])}`).join('　')}</p>`;
      return concept('sec-5', T('q5'), T('h5'), T('c5'), radial(nodes, { lines: T('c5c').split('|') }, T('h5'), true),
        nodes.map(n => btn(`${n.no} ${n.label}`, d.states[d.cycle[nodes.indexOf(n)].state], n.color, n.i)).join(''), false, legend + `<p class="loop">${esc(T('loop'))}</p>`);
    }
    function cLevels(d) {
      const its = d.levels.map(l => ({ top: T('level').replace('{n}', l.n), name: l.name, sub: l.when, color: SC[l.state], dash: l.state === 'next',
        i: pop({ color: SC[l.state], title: `${T('level').replace('{n}', l.n)} ${l.name}`, sub: l.when, items: [l.does, ...(l.proof || []).length ? [HTML(chips(l.proof))] : []] }) }));
      return concept('sec-1', T('q1'), T('h1'), T('c1'), stairs(its, T('h1')), its.map(x => btn(`${x.top} ${x.name}`, x.sub, x.color, x.i)).join(''));
    }
    function cTraits(d) {
      const tr = d.traits.map(t => Array.isArray(t) ? { name: t[0], desc: t[1] } : t);
      const nodes = tr.map((t, k) => ({ no: String(k + 1), label: t.name, color: '#0ea5e9', i: pop({ color: '#0ea5e9', title: t.name, sub: T('h7'), items: [t.desc] }) }));
      return concept('sec-7', '', T('h7'), T('c7'), radial(nodes, { lines: T('c7c').split('|') }, T('h7')), nodes.map(n => btn(n.label, tr[+n.no - 1].desc, n.color, n.i)).join(''));
    }
    function cComp(d) {
      const btns = d.competencies.map(c => btn(c.name, `${c.now} → ${c.target}`, c.target - c.now >= 2 ? '#f59e0b' : '#16a34a', pop({
        color: c.target - c.now >= 2 ? '#f59e0b' : '#16a34a', title: c.name, sub: `${T('now')} ${c.now} → ${T('target')} ${c.target}`,
        items: [`${T('now')}：${c.now}｜${d.scale[c.now - 1] || ''}`, `${T('target')}：${c.target}｜${d.scale[c.target - 1] || ''}`, `${T('imp')}：${c.importance}`, ...(c.evidence || []).length ? [HTML(chips(c.evidence))] : []] }))).join('');
      const left = `<div class="box chart">${radar(d)}<div class="legend"><span><i style="border-color:var(--now)"></i>${esc(T('now'))}</span><span><i style="border-color:var(--tgt);border-top-style:dashed"></i>${esc(T('target'))}</span></div></div>`;
      return concept('sec-2', T('q2'), T('h2'), T('c2'), left, btns, true, `<p class="note">${d.scale.map((x, k) => `${k + 1}＝${esc(x)}`).join('　')}</p>`);
    }
    function cQuad(d) {
      const Q = d.quadrants, C = d.competencies;
      const cell = (pri, big) => C.filter(c => (c.importance >= 3.5) === pri && (c.target - c.now >= 2) === big);
      const defs = [['tr', true, true, '#f59e0b'], ['br', true, false, '#16a34a'], ['tl', false, true, '#94a3b8'], ['bl', false, false, '#2563eb']];
      const btns = defs.map(([k, pri, big, col]) => { const l = cell(pri, big);
        return btn(Q[k], T('qm_' + k), col, pop({ color: col, title: Q[k], sub: T('qm_' + k), items: l.length ? l.map(c => `${c.name}：${c.now} → ${c.target}`) : [T('none')] })); }).join('');
      return concept('sec-3', T('q3'), T('h3'), T('c3'), `<div class="box chart">${quadrant(d)}</div>`, btns, true, `<p class="note">${esc(d.selfNote)}</p>`);
    }
    function cBlue(b) {
      const cols = ['#2563eb', '#0891b2', '#9333ea'];
      const its = b.phases.map((ph, k) => ({ top: ph.when, name: ph.name, sub: '', color: cols[k],
        i: pop({ color: cols[k], title: `${ph.when} ${ph.name}`, sub: ph.line, items: [...ph.tasks.map(t => `${t.t}：${t.d}`), `${T('milestone')}：${ph.milestone}`] }) }));
      const gi = pop({ color: '#f59e0b', title: b.goal_title, sub: b.tag, items: [b.goal] });
      const hi = pop({ color: '#16a34a', title: b.have_title, sub: '', items: b.have.map(h => `${h.k}：${h.v}`) });
      const ai = pop({ color: '#7c3aed', title: b.axes_title, sub: '', items: b.axes.map((a, k) => `${k + 1}. ${a}`) });
      const btns = its.map((x, k) => btn(`${x.top} ${x.name}`, b.phases[k].line, x.color, x.i)).join('') + btn(b.have_title, b.have.map(h => h.k).join('・'), '#16a34a', hi)
        + btn(b.axes_title, b.axes.join('・'), '#7c3aed', ai) + btn(b.goal_title, b.goal, '#f59e0b', gi);
      return concept('sec-plan3', '', b.title, b.sub, stairs(its, b.title, { label: b.goal_title, i: gi }), btns);
    }
    function cRoad(d) {
      const btns = d.roadmap.map(r => btn(`${r.when}`, r.title, '#2563eb', pop({ color: '#2563eb', title: `${r.when} ${r.title}`, sub: d.levels[r.level - 1].name,
        items: [`${T('steps')}：${r.steps.join(' › ')}`, `${T('focus')}：${r.focus.join('・')}`, `${T('use')}：${r.use.join('・')}`, ...r.plan.map(x => `${T('plan')}：${x}`), `${T('out')}：${r.output.join('・')}`] }))).join('');
      return concept('sec-4', T('q4'), T('h4'), T('c4'), `<div class="box chart">${gantt(d)}</div>`, btns, 'stack');
    }
    function cMeasure(d) {
      const ci = pop({ color: '#f59e0b', title: T('check'), sub: d.review, items: d.checklist });
      const nodes = d.measures.map((m, k) => ({ no: String(k + 1), label: m.name, color: '#16a34a', i: pop({ color: '#16a34a', title: m.name, sub: T('h6'), items: [m.what] }) }));
      return concept('sec-6', T('q6'), T('h6'), T('c6'), radial(nodes, { lines: T('c6c').split('|'), i: ci }, T('h6')),
        nodes.map((n, k) => btn(n.label, d.measures[k].what, n.color, n.i)).join('') + btn(T('check'), d.review, '#f59e0b', ci));
    }

    // ── Popup: one <dialog> for both diagrams ──
    let current = null;
    function openPopup(kind, i) {
      if (!current) return;
      const dlg = document.getElementById('dlg');
      let color, no = '', title, sub, items, more;
      if (kind === 'step') { const st = current.cycle4.steps[i]; color = STEP_COLORS[i]; no = String(i + 1).padStart(2, '0'); title = st.name; sub = st.sub;
        items = st.method.map(m => {
          const el = m.href && document.getElementById(m.href.slice(1));
          const name = el ? (el.id === 'goal' ? T('goalName') : el.textContent.trim()) : '';
          return { html: el ? `<a href="${esc(m.href)}" data-close>${esc(m.q)}<span>${esc(name)} ↓</span></a>`
                            : `<span style="display:flex;justify-content:space-between;gap:.6rem">${esc(m.q)}<span class="pending">${esc(T('pending'))}</span></span>` };
        }); more = null; }
      else if (kind === 'pop') { const e = POP[i]; color = e.color; title = e.title; sub = e.sub; items = e.items; more = e.more; }
      else { const it = current.iceberg.items[i]; color = it.level === 'above' ? '#0ea5e9' : '#f59e0b'; title = `${it.name}${Site.getLang() === 'en' ? '' : ' ' + it.en}`; sub = `${it.level === 'above' ? current.iceberg.above : current.iceberg.below}｜${it.desc}`; items = it.items; }
      dlg.style.setProperty('--c', color);
      dlg.innerHTML = `<div class="dlg-head"><div class="tx"><h3>${no ? `${no} ` : ''}${esc(title)}</h3><p>${esc(sub)}</p></div>
        <button class="dlg-x" aria-label="${esc(T('close'))}" data-close>×</button></div>
        <div class="dlg-body"><ul>${items.map(x => `<li>${typeof x === 'string' ? esc(x) : x.html}</li>`).join('')}</ul>${more ? `<a class="dlg-more" href="${esc(more.href)}" data-close>${esc(more.text)} ↓</a>` : ''}</div>`;
      dlg.showModal();
    }
    document.addEventListener('click', e => {
      const dlg = document.getElementById('dlg');
      if (e.target === dlg || e.target.closest('[data-close]')) {
        const a = e.target.closest('a[href^="#"]');
        if (a) e.preventDefault();
        dlg.close();
        // Jump after the popup is closed: a modal dialog blocks scrolling the page behind it.
        if (a) setTimeout(() => {
          const id = a.getAttribute('href').slice(1), el = document.getElementById(id === 'sec-top' ? 'goal' : id);
          if (!el) return;
          history.replaceState(null, '', '#' + id);
          document.querySelectorAll('.hit').forEach(x => x.classList.remove('hit'));
          el.classList.add('hit');
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 0);
        return;
      }
      const t = e.target.closest('[data-open]'); if (t) openPopup(t.dataset.open, +t.dataset.i);
    });
    document.addEventListener('keydown', e => {
      const t = e.target.closest && e.target.closest('g[data-open]');
      if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPopup(t.dataset.open, +t.dataset.i); }
    });

    function render() {
      document.documentElement.lang = Site.getLang() === 'en' ? 'en' : 'zh-Hant';
      document.title = `${T('title')} IDP | Alex Li (李翔緯)`;
      ['title'].forEach(id => document.getElementById(id).textContent = T(id));
      document.getElementById('backText').textContent = T('back');
      document.getElementById('langToggle').textContent = T('toggle');
      getJSON(dataPath('idp.json')).then(d => {
        current = d;
        document.getElementById('goal').textContent = d.goal;
        document.getElementById('tagline').textContent = d.tagline;
        document.getElementById('sum').innerHTML = d.summary.map(s => `<div class="box"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');
        const lvl = d.levels.map(l => `<div class="box lv-card l${l.n}"><span class="lv-n">${esc(T('level').replace('{n}', l.n))}</span><h3>${esc(l.name)}</h3><p>${esc(l.does)}</p>
          <span class="pill ${l.state}">${esc(l.when)}</span>${chips(l.proof)}</div>`).join('');
        const rows = d.competencies.map(c => `<tr><td>${esc(c.name)}</td><td class="num">${c.now}${c.target > c.now ? ` <span class="up">→ ${c.target}</span>` : ''}</td><td>${chips(c.evidence)}</td></tr>`).join('');
        const scale = d.scale.map((s, i) => `${i + 1}＝${esc(s)}`).join('　');
        const rm = d.roadmap.map(r => `<div class="box rm-card">
          <div class="rm-top"><span class="rm-when">${esc(r.when)}</span><h3>${esc(r.title)}</h3><span class="rm-lv">${esc(d.levels[r.level - 1].name)}</span></div>
          <div class="rm-steps">${r.steps.map(x => `<span>${esc(x)}</span>`).join('')}</div>
          <div class="rm-body">
            <div class="rm-focus"><span class="rm-k k-focus">${esc(T('focus'))}</span>${r.focus.map(x => `<b>${esc(x)}</b>`).join('')}
              <span class="rm-k k-use">${esc(T('use'))}</span>${r.use.map(x => `<em>${esc(x)}</em>`).join('')}</div>
            <div><span class="rm-k k-plan">${esc(T('plan'))}</span>${ul(r.plan)}</div>
            <div><span class="rm-k k-out">${esc(T('out'))}</span>${ul(r.output)}</div>
          </div></div>`).join('');
        const cy = d.cycle.map((c, i) => `<div class="box cy-step ${c.gate ? 'gate' : ''}"><span class="cy-i">${c.gate ? '◆' : String(i < 5 ? i + 1 : i).padStart(2, '0')}</span>
          <b>${esc(c.name)}</b><span class="pill ${c.state}">${esc(d.states[c.state])}</span>${c.proof ? chips([c.proof]) : ''}</div>`).join('');
        POP.length = 0;
        document.getElementById('idp').innerHTML = `
          ${d.cycle4 ? ring4(d.cycle4) : ''}
          ${band(d, 0)}
          ${cCycle(d)}
          ${cLevels(d)}
          ${cTraits(d)}
          ${band(d, 1)}
          ${d.iceberg ? iceberg(d.iceberg) : ''}
          ${cComp(d)}
          ${cQuad(d)}
          ${band(d, 2)}
          ${d.blueprint ? cBlue(d.blueprint) : ''}
          ${cRoad(d)}
          ${band(d, 3)}
          ${cMeasure(d)}
          <p class="updated">${esc(T('updated'))}：${esc(d.updated)}</p>`;
      }).catch(e => { console.error(e); document.getElementById('idp').innerHTML = `<p class="error">${esc(T('loadError'))}</p>`; });
    }
    document.getElementById('langToggle').addEventListener('click', () => { Site.toggleLang(); render(); });
    render();
  </script>
</body>
</html>
