    // Radar: eight axes 0..4; "now" solid green, "target" dashed violet.
    function radar(d) {
      const C = d.competencies, n = C.length, cx = 210, cy = 200, R = 140, max = 4;
      const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / max, cy + Math.sin(a) * R * v / max]; };
      const poly = key => C.map((c, i) => pt(i, c[key]).map(x => x.toFixed(1)).join(',')).join(' ');
      let g = '';
      for (let r = 1; r <= max; r++) g += `<polygon points="${C.map((_, i) => pt(i, r).join(',')).join(' ')}" fill="none" stroke="#1e293b" stroke-width="1"/>`;

    }
    // Quadrant (2x2 matrix): x = importance to the goal (high >= 3.5), y = gap to target (large >= 2).
    function quadrant(d) {

        <div class="qg">${box('tl', Q.tl, cell(false, true))}${box('tr', Q.tr, cell(true, true))}${box('bl', Q.bl, cell(false, false))}${box('br', Q.br, cell(true, false))}</div>
        <div class="qx">${esc(T('xAxis'))}</div></div>`;

    // Gantt: 0..36 months; level band, five phases, milestones.
    function gantt(d) {
      const W = 760, L = 150, Rr = 16, rowH = 30, top = 30, pw = W - L - Rr, X = m => L + m / 36 * pw;
      const rows = d.roadmap.length, H = top + (rows + 1) * rowH + 40;

      g += `<text x="${L - 10}" y="${top - 12}" text-anchor="end" font-size="10.5" fill="#64748b">${esc(T('months'))}</text>`;
      const ly = top + 4;

      g += `<rect x="${X(12)}" y="${ly}" width="${X(36) - X(12)}" height="18" rx="4" fill="#3b0764"/><text x="${X(24)}" y="${ly + 13}" text-anchor="middle" font-size="11" fill="#e9d5ff">${esc(d.levels[2].name)}</text>`;
      d.roadmap.forEach((r, i) => {

    // ── IDP four-step ring: four clickable quadrants; each opens a popup with the step's details ──
    const STEP_COLORS = ['#7c3aed', '#2563eb', '#b45309', '#047857'];
    const lines2 = (name, zh) => {
      if (zh) { const h = Math.ceil(name.length / 2); return [name.slice(0, h), name.slice(h)]; }
      const w = name.replace('-', '- ').split(' '); if (w.length < 2) return [name, '']; const h = Math.ceil(w.length / 2); return [w.slice(0, h).join(' ').replace('- ', '-'), w.slice(h).join(' ')];
    };
    function ring4(c) {
      const zh = Site.getLang() !== 'en', cx = 220, cy = 220, ro = 178, ri = 70, ra = 198, g = 0.05;
      const P = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];

        const [x0, y0] = P(ro, a0), [x1, y1] = P(ro, a1), [x2, y2] = P(ri, a1), [x3, y3] = P(ri, a0), [tx, ty] = P(124, am);
        const [l1, l2] = lines2(st.name, zh), fs = zh ? 24 : 17;

          <text x="${tx}" y="${ty - (l2 ? fs * 0.15 : -fs * 0.35)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(l1)}</text>
          ${l2 ? `<text x="${tx}" y="${ty + fs * 1.05}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(l2)}</text>` : ''}</g>`;
        const b0 = a0 + 0.2, b1 = a1 - 0.12, [p0x, p0y] = P(ra, b0), [p1x, p1y] = P(ra, b1);
        const tX = -Math.sin(b1), tY = Math.cos(b1), nX = Math.cos(b1), nY = Math.sin(b1);
        svg += `<path d="M${p0x} ${p0y} A${ra} ${ra} 0 0 1 ${p1x} ${p1y}" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
          <polygon points="${p1x + tX * 16},${p1y + tY * 16} ${p1x + nX * 10 - tX * 3},${p1y + nY * 10 - tY * 3} ${p1x - nX * 10 - tX * 3},${p1y - nY * 10 - tY * 3}" fill="#f59e0b"/>`;
      });
      svg += `<circle cx="${cx}" cy="${cy}" r="${ri - 8}" fill="#0b1120" stroke="#334155"/><text x="${cx}" y="${cy + 11}" text-anchor="middle" font-size="32" font-weight="800" fill="#e2e8f0" font-family="Inter, sans-serif">IDP</text>`;
      const list = c.steps.map((st, i) => `<button class="step4" style="--c:${STEP_COLORS[i]}" data-open="step" data-i="${i}">
        <span class="no">${String(i + 1).padStart(2, '0')}</span><span><b>${esc(st.name)}</b><span>${esc(st.sub)}</span></span><span class="go">›</span></button>`).join('');
      return `<p class="q">${esc(T('idpTag'))}</p><h2 id="sec-0" style="margin-top:0.2rem">${esc(c.title)}</h2><p class="lead2">${esc(c.sub)}</p>
        <div class="intro2"><svg viewBox="0 0 440 440" role="group" aria-label="${esc(c.title)}">${svg}</svg><div class="steps4">${list}</div></div>`;
    }
    // ── Competency iceberg: knowledge and skill above the water, the rest below; each bubble opens a popup ──
    function iceberg(ic) {
      const zh = Site.getLang() !== 'en';
      const pos = zh ? { knowledge: [262, 112], skill: [348, 112], attitude: [232, 228], values: [378, 228], traits: [232, 330], motive: [378, 330] } : { knowledge: [248, 112], skill: [356, 112], attitude: [232, 228], values: [378, 228], traits: [232, 330], motive: [378, 330] };
      let svg = `<rect x="0" y="0" width="600" height="160" fill="#13213b"/><rect x="0" y="160" width="600" height="280" fill="#0b3354"/>

          ${d.cycle4 ? myPlan(d.cycle4) : ''}
          ${d.blueprint ? blueprint(d.blueprint) : ''}
          ${head('1 · ' + T('q1'), T('h1'), 'sec-1')}<div class="lv">${lvl}</div>
          ${head('2 · ' + T('q2'), T('h2'), 'sec-2')}
          <div class="two"><div class="box chart">${radar(d)}<div class="legend"><span><i style="border-color:var(--now)"></i>${esc(T('now'))}</span><span><i style="border-color:var(--tgt);border-top-style:dashed"></i>${esc(T('target'))}</span></div></div>
            <div><table class="tbl"><thead><tr><th>${esc(T('comp'))}</th><th>${esc(T('now'))} → ${esc(T('target'))}</th><th>${esc(T('ev'))}</th></tr></thead><tbody>${rows}</tbody></table>
            <p class="note">${scale}</p></div></div>
          ${head('3 · ' + T('q3'), T('h3'), 'sec-3')}<div class="box chart">${quadrant(d)}</div><p class="note">${esc(d.selfNote)}</p>
          ${head('4 · ' + T('q4'), T('h4'), 'sec-4')}<div class="box chart">${gantt(d)}</div><div class="rm">${rm}</div>
          ${head('5 · ' + T('q5'), T('h5'), 'sec-5')}<div class="cy">${cy}</div><p class="loop">${esc(T('loop'))}</p>
          ${head('6 · ' + T('q6'), T('h6'), 'sec-6')}<div class="ms">${d.measures.map(m => `<div class="box"><b>${esc(m.name)}</b><span>${esc(m.what)}</span></div>`).join('')}</div>
          <p class="rm-k k-out">${esc(T('check'))}</p><ul class="ck">${d.checklist.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="lead2">${esc(d.review)}</p>
          <h2>${esc(T('h7'))}</h2><div class="traits">${d.traits.map(t => Array.isArray(t) ? { name: t[0], desc: t[1] } : t).map(t => `<div class="box"><b>${esc(t.name)}</b>${esc(t.desc)}</div>`).join('')}</div>
          <p class="updated">${esc(T('updated'))}：${esc(d.updated)}</p>`;
      }).catch(e => { console.error(e); document.getElementById('idp').innerHTML = `<p class="error">${esc(T('loadError'))}</p>`; });
    }
    document.getElementById('langToggle').addEventListener('click', () => { Site.toggleLang(); render(); });
    render();
  </script>
</body>
</html>
